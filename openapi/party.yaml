    - repos/eia-party-expert/src/test/java/com/eia/party/expert/PartyReferenceDataOutboxIntegrationTest.java
    - repos/eia-party-domain/src/test/java/com/eia/party/domain/PartyIdentifierControllerTest.java
    - repos/eia-party-domain/src/test/java/com/eia/party/domain/PartyAddressControllerTest.java
