  notes: >
    The Party domain translates expert 404, 409, and other 4xx failures into its
    `{code, message, details}` `ApiError` body; the expert returns `{code,
    message}`. Neither uses the canonical `Problem` media type yet (M-02,
    M-17). The identifier duplicate is enforced by the unique
    `(tenant_id, party_id, identifier_type, identifier_value)` key and is 409;
    the expert has no address uniqueness rule, so the documented
    `DUPLICATE_PARTY_ADDRESS` guard is not implemented yet (M-54). The expert
    reference-data routes require `tenantId` or `X-EIA-Tenant` and reject a
    mismatch; the public domain requires `X-EIA-Tenant` and forwards it on both.
    The expert status route instead requires the `?tenantId=` query parameter
    and does not read `X-EIA-Tenant`.

    The identifier and address PATCH operations are full replacements: every
    required member is sent again and an omitted or blank optional member clears
    the stored value. The expert replaces only the mutable columns, keeps
    `created_at`/`created_by`, and returns the unchanged row as a 200 no-op when
    no normalized field changed, so a no-op writes no version bump and no event.
    A real replacement bumps the Party row version and writes
    `party.party.identifier-updated` or `party.party.address-updated` with the
    ordered `changedFields` list and the `from`/`to` snapshots. A delete
    hard-deletes the row, bumps the Party row version, and writes
    `party.party.identifier-deleted` or `party.party.address-deleted` with the
    last stored snapshot; a second delete is 404. The canonical
    `PARTY_IDENTIFIER_IN_USE`/`PARTY_ADDRESS_IN_USE` delete guards and the
    address duplicate guard are not implemented, and neither the public nor the
    expert child maintenance route sets an `ETag` or reads `If-Match` or
    `Idempotency-Key` (M-58).

    The status command normalizes the status to upper case and checks membership
    against the eight-value `PartyStatus` set; it has no transition graph, so
    every status is accepted from every current status. A same-status request
    returns the current row without a version bump or event. An accepted change
    increments `version` once and inserts one `party.party.updated` outbox row in
    the same transaction; the payload carries `changedFields: [status]`,
    `version`, `from`, `to`, and the trimmed reason when non-blank. The reason
    has no column and no history, so it exists only in the event. The domain
    forwards optional `If-Match` and `Idempotency-Key` headers, but the expert
    status route does not declare or compare them, so neither concurrency nor a
    replay is enforced and there is no 409 (M-06, M-07, M-55). The public 200
    sets `ETag: "<version>"`; the expert 200 does not set an ETag.
