x-compatibility:
  contractVersion: 1.4.0
  previousContractVersion: 1.3.0
  breaking: []
  compatible:
    - Adds PATCH and DELETE /api/v1/parties/{partyId}/identifiers/{identifierId} and the matching /internal/v1 expert operations.
    - Adds PATCH and DELETE /api/v1/parties/{partyId}/addresses/{addressId} and the matching /internal/v1 expert operations.
    - Adds the UpdatePartyIdentifierRequest and UpdatePartyAddressRequest full-replacement commands.
    - Documents the 200 replacement projection, the 204 delete, the 400/404/409 responses, the no-op replacement, and the identifier/address updated and deleted facts.
  note: >
    The identifier and address maintenance slice is additive over 1.3.0: two
    new public child paths, their two expert mirrors, eight new operations, two
    new request schemas, and four new event names. No existing path, request
    field, response field, or event name is removed or changes meaning. The
    existing projections and list/create operations are unchanged; a client
    that only lists or adds children is unaffected. The delete 409 in-use codes
    and the address duplicate guard are canonical targets that the expert does
    not enforce yet, and a replacement with no normalized change is a 200 no-op
    (M-58).
