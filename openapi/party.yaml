openapi: 3.1.0
info:
  title: EIA Party API
  version: 1.4.0
  summary: Party identity, reference data, and the Party expert API.
  description: >
    Party is shared identity data across both books. This document describes the
    implemented public domain API served by eia-party-domain and the internal
    expert API served by eia-party-expert. The authoritative requirement is
    SPEC 11.1 and SPEC 12; the implemented surface is the first vertical slice
    plus the party identifier and address reference data.

    The public routes are `/api/v1/parties` and are routed by eia-platform
    gateway. The internal routes are `/internal/v1/parties` and are reachable
    only inside the platform network.

    Party identifiers and addresses are child reference data of the Party
    aggregate. The same eight operations are implemented on the public path and
    on the expert path: list, add, replace, and delete for each child kind. The
    domain forwards the tenant and the caller's body to the expert. Adding,
    replacing, or deleting one bumps the Party row version and writes its fact
    to the transactional outbox in the same transaction as the child write:
    `party.party.identifier-added`, `party.party.identifier-updated`,
    `party.party.identifier-deleted`, `party.party.address-added`,
    `party.party.address-updated`, or `party.party.address-deleted`.

    `PATCH .../{identifierId}` and `PATCH .../{addressId}` are full
    replacements of the mutable child fields: every required member must be
    supplied on every request, and an omitted or blank optional member clears
    the stored value. A replacement whose normalized values equal the stored
    values is a 200 no-op with no version bump and no event; otherwise the row
    is replaced, the Party row version is bumped, and the matching
    `-updated` fact is written with `changedFields`, the `from` snapshot, and
    the `to` snapshot. `DELETE` hard-deletes the child, bumps the Party row
    version, writes the matching `-deleted` fact with the last stored snapshot,
    and returns 204 with no body; a repeated delete is 404.

    The lifecycle status is changed by `PATCH /api/v1/parties/{partyId}/status`
    with `{status, reason}`. The status is trimmed and upper-cased and must be a
    member of the closed `PartyStatus` enum (`PROSPECT`, `ACTIVE`, `INACTIVE`,
    `DECEASED`, `DISSOLVED`, `MERGED`, `RESTRICTED`, `BLOCKED`); an accepted
    change bumps the Party row version and writes `party.party.updated` with
    `changedFields: [status]`, `from`, `to`, and the optional reason in the same
    transaction. Repeating the current status is a 200 no-op with no version
    bump and no event. The reason is carried in the event only; it is not
    persisted on the Party row and the Party projection never returns it. The
    public operation returns the updated Party with an `ETag` derived from its
    row version. Every status is accepted from every current status: there is no
    transition graph. A status change is published as `party.party.updated`, not
    the SPEC 11.1.9 `party.party.status-changed` name, which remains planned
    (M-22, M-55). Optional `If-Match` and `Idempotency-Key` headers are accepted
    and forwarded by the domain, but the expert does not compare or replay them
    in this slice (M-06, M-07, M-55).

    Deviations from this document are recorded in MISMATCHES.md. The Party
    domain translates expert 404, 409, and other 4xx failures into its
    `{code, message, details}` `ApiError` body rather than the canonical
    `application/problem+json` `Problem`, and the expert returns `{code,
    message}`; M-02 and M-17 record the envelope gap, M-54 records the
    reference-data slice, M-55 records the status-transition slice, and M-58
    records the identifier and address maintenance slice.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://party-domain:8082
    description: Party domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Party
    description: Public domain API used by the Party web remote and other domain services.
  - name: Party internal
    description: Internal expert API. Not exposed through the gateway; called only by the Party domain service.
paths:
  /api/v1/parties:
    get:
      operationId: listParties
      tags:
        - Party
      summary: List parties for the caller's tenant.
      description: >
        Returns all parties of the tenant as a bare JSON array. Free-text search
        is served by `GET /api/v1/parties/search`; cursor pagination and
        filtering from SPEC 7.6 remain planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Parties of the tenant, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createParty
      tags:
        - Party
      summary: Create a party.
      description: >
        Creates a party in status PROSPECT with sanctionsStatus NOT_SCREENED and
        confidentiality INTERNAL. The party number is generated by the expert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
      responses:
        '201':
          description: Party created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/search:
    get:
      operationId: searchParties
      tags:
        - Party
      summary: Search parties for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the party pickers.
        Matching is a case-insensitive contains over `partyNumber`,
        `displayName`, and `legalName`; an absent or blank `q` returns the most
        recently updated parties. The response is the shared `SearchResponse`
        envelope. A missing or malformed `X-EIA-Tenant` or a `limit` outside
        1-25 is a 400 `application/problem+json` Problem.
      x-search-type: PARTY
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching parties, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}:
    get:
      operationId: getParty
      tags:
        - Party
      summary: Get a party.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/status:
    patch:
      operationId: updatePartyStatus
      tags:
        - Party
      summary: Change a party's lifecycle status.
      description: >
        Applies one lifecycle status transition and returns the updated Party
        with an `ETag` derived from its row version. The body is
        `UpdatePartyStatusRequest`: `status` is required and `reason` is
        optional.

        `status` is trimmed and upper-cased before the membership check and
        must be one of `PROSPECT`, `ACTIVE`, `INACTIVE`, `DECEASED`,
        `DISSOLVED`, `MERGED`, `RESTRICTED`, or `BLOCKED`; any other value is
        400 `VALIDATION_ERROR`. A missing or blank `status` is 400 `VALIDATION`
        from the domain's request validation. `reason` is trimmed and capped at
        500 characters; a longer value is 400 `VALIDATION` at the domain and
        400 `VALIDATION_ERROR` at the expert, and a blank value is treated as
        absent. A missing or malformed tenant is 400 `TENANT_REQUIRED` or
        `TENANT_INVALID`.

        There is no transition graph: every listed status is accepted from
        every current status, including a same-status request. A same-status
        request returns 200 with the current Party and its current `ETag`
        without a version bump and without an event. An accepted change
        increments the Party row version and writes `party.party.updated` with
        `changedFields: [status]`, `version`, `from`, `to`, and the trimmed
        `reason` when one was supplied, in the same transaction as the row
        update. The envelope `aggregateVersion` is the new row version plus one
        because Party rows start at version 0. The reason is not persisted on
        the Party row and is not returned in the Party projection; there is no
        status history.

        An unknown party and another tenant's party are both 404 `NOT_FOUND`, so
        the response cannot confirm that a foreign party exists. The public
        route requires `X-EIA-Tenant`. Optional `If-Match` and
        `Idempotency-Key` headers are accepted and forwarded to the expert, but
        the expert does not compare the entity tag or replay the key in this
        slice, so there is no 409 and a repeated non-no-op request applies again
        (M-06, M-07, M-55). A status change is published as
        `party.party.updated`; SPEC 11.1.9's `party.party.status-changed` name
        remains planned (M-22, M-55).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose lifecycle status is changed.
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: >
            Optional entity tag from the last read, conventionally the strong
            `"<version>"` form (for example `"3"`), or `*`. The domain forwards
            the raw value when it is present and non-blank; the expert does not
            compare it, so a stale or non-standard tag does not produce a 409
            (M-06, M-55).
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional idempotency key. The domain forwards it to the expert,
            which neither validates nor replays it in this slice; a retry
            applies the transition again unless it is a same-status no-op
            (M-07, M-55).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyStatusRequest'
      responses:
        '200':
          description: >
            Party after the transition, or the unchanged Party for a same-status
            no-op.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/identifiers:
    get:
      operationId: listPartyIdentifiers
      tags:
        - Party
      summary: List a party's identifiers.
      description: >
        Returns the party's identifiers as a bare JSON array ordered by
        `createdAt`, then `id` (oldest first). The party must exist in the
        caller's tenant; an unknown party and another tenant's party are both
        404 `NOT_FOUND`, so the response cannot confirm that a foreign party
        exists. The domain forwards `X-EIA-Tenant` and the party id to the
        expert's internal route and returns the expert projection.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose identifiers are listed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Identifiers of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: addPartyIdentifier
      tags:
        - Party
      summary: Add an identifier to a party.
      description: >
        Appends one identifier to the party and returns it with 201. The type is
        trimmed and upper-cased and must be a member of `PartyIdentifierType`;
        `identifierValue` is trimmed and must be 1-128 characters. The unique
        key is the normalized `(tenantId, partyId, identifierType,
        identifierValue)`, so a duplicate is 409. The insert, the Party version
        bump, and the `party.party.identifier-added` outbox row commit in one
        transaction, so a rejected duplicate leaves no row, no version bump, and
        no event.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that receives the identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyIdentifierRequest'
      responses:
        '201':
          description: Identifier stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The normalized identifier already exists for this party. The
            canonical code is `DUPLICATE_PARTY_IDENTIFIER`. The expert currently
            returns the generic `CONFLICT` code in its `{code, message}` body
            and the domain preserves that status and code (MISMATCHES.md M-54).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/identifiers/{identifierId}:
    patch:
      operationId: updatePartyIdentifier
      tags:
        - Party
      summary: Replace a party's identifier.
      description: >
        Fully replaces the mutable fields of one identifier and returns the
        stored projection with 200. This is a replacement, not a partial
        update: `identifierType` and `identifierValue` are required on every
        request, and `issuingAuthority` and `effectiveDate` are optional on
        every request, so omitting either clears the stored value.

        The type is trimmed and upper-cased and must be a member of
        `PartyIdentifierType`; `identifierValue` is trimmed and must be 1-128
        characters; `issuingAuthority` is trimmed, capped at 128 characters,
        and a blank value is stored as null. A missing or malformed tenant is
        400 `TENANT_REQUIRED` or `TENANT_INVALID`, and a rejected body is 400
        `VALIDATION` at the domain or `VALIDATION_ERROR` at the expert.

        The child is looked up by tenant, party, and identifier id, so an
        unknown identifier, an identifier of another party, and another
        tenant's identifier are all 404 `NOT_FOUND`, and an unknown party is
        also 404. A change that would duplicate the normalized
        `(tenantId, partyId, identifierType, identifierValue)` key of another
        row is 409 `DUPLICATE_PARTY_IDENTIFIER`; the expert currently returns
        the generic `CONFLICT` code and the domain preserves it (MISMATCHES.md
        M-54, M-58). Replacing the stored values with the same normalized
        values is a 200 no-op: the unchanged projection is returned with no
        version bump and no event. A real change replaces the row, preserves
        `createdAt`/`createdBy`, bumps the Party row version, and writes
        `party.party.identifier-updated` with `changedFields`, `version`,
        `from`, and `to` in the same transaction (MISMATCHES.md M-58).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that owns the identifier.
          schema:
            type: string
            format: uuid
        - name: identifierId
          in: path
          required: true
          description: Identifier to replace.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyIdentifierRequest'
      responses:
        '200':
          description: >
            Identifier after the replacement, or the unchanged identifier for a
            no-op.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The replacement would duplicate another identifier of this party.
            The canonical code is `DUPLICATE_PARTY_IDENTIFIER`. The expert
            currently returns the generic `CONFLICT` code in its `{code,
            message}` body and the domain preserves that status and code
            (MISMATCHES.md M-54, M-58).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    delete:
      operationId: deletePartyIdentifier
      tags:
        - Party
      summary: Delete a party's identifier.
      description: >
        Hard-deletes one identifier and returns 204 with no body. The child is
        looked up by tenant, party, and identifier id, so an unknown
        identifier, an identifier of another party, another tenant's
        identifier, and an unknown party are all 404 `NOT_FOUND`. Repeating a
        delete is a 404, not a 204.

        The canonical contract documents a 409 `PARTY_IDENTIFIER_IN_USE` guard
        when the identifier is still referenced by another aggregate; the
        implemented expert has no reference check and always deletes, so that
        status is the agreed guard rather than current behaviour (MISMATCHES.md
        M-58). An accepted delete bumps the Party row version and writes
        `party.party.identifier-deleted` with the last stored snapshot and the
        new `version` in the same transaction as the row delete.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that owns the identifier.
          schema:
            type: string
            format: uuid
        - name: identifierId
          in: path
          required: true
          description: Identifier to delete.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Identifier deleted.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The identifier is still referenced and cannot be deleted. The
            canonical code is `PARTY_IDENTIFIER_IN_USE`; the implemented expert
            has no reference check and hard-deletes any found identifier, so
            this status is the agreed guard rather than current behaviour
            (MISMATCHES.md M-58).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/addresses:
    get:
      operationId: listPartyAddresses
      tags:
        - Party
      summary: List a party's addresses.
      description: >
        Returns the party's addresses as a bare JSON array ordered by
        `createdAt`, then `id` (oldest first). A party may hold any number of
        addresses of the same type; there is no address uniqueness rule. The
        party must exist in the caller's tenant; an unknown party and another
        tenant's party are both 404 `NOT_FOUND`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose addresses are listed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Addresses of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: addPartyAddress
      tags:
        - Party
      summary: Add an address to a party.
      description: >
        Appends one address to the party and returns it with 201. The type is
        trimmed and upper-cased and must be a member of `PartyAddressType`;
        every text field is trimmed, and `country` is upper-cased and must be a
        two-letter ISO 3166-1 alpha-2 code. The insert, the Party version bump,
        and the `party.party.address-added` outbox row commit in one
        transaction. A party may hold several addresses of the same type, and
        the expert implements no address uniqueness rule yet: the canonical
        duplicate guard is documented as 409 `DUPLICATE_PARTY_ADDRESS` for a
        repeat of the same normalized address, but the running expert currently
        stores the repeat (MISMATCHES.md M-54).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that receives the address.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyAddressRequest'
      responses:
        '201':
          description: Address stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            A duplicate address for this party. The canonical code is
            `DUPLICATE_PARTY_ADDRESS` for a repeat of the same normalized
            address; the implemented expert has no address uniqueness rule and
            currently accepts the repeat, so this status is the agreed guard
            rather than current behaviour (MISMATCHES.md M-54). The identifier
            duplicate rule, by contrast, is enforced today.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/addresses/{addressId}:
    patch:
      operationId: updatePartyAddress
      tags:
        - Party
      summary: Replace a party's address.
      description: >
        Fully replaces the mutable fields of one address and returns the stored
        projection with 200. This is a replacement, not a partial update:
        `addressType`, `line1`, `city`, `postalCode`, and `country` are
        required on every request, and `line2`, `stateRegion`, and
        `effectiveDate` are optional on every request, so omitting one clears
        the stored value.

        The type is trimmed and upper-cased and must be a member of
        `PartyAddressType`; every text field is trimmed, and `country` accepts
        either case and is stored as two upper-case ISO 3166-1 alpha-2 letters.
        A missing or malformed tenant is 400 `TENANT_REQUIRED` or
        `TENANT_INVALID`, and a rejected body is 400 `VALIDATION` at the domain
        or `VALIDATION_ERROR` at the expert.

        The child is looked up by tenant, party, and address id, so an unknown
        address, an address of another party, and another tenant's address are
        all 404 `NOT_FOUND`, and an unknown party is also 404. Addresses have
        no implemented uniqueness rule, so a replacement normally succeeds;
        the canonical contract documents a 409 `DUPLICATE_PARTY_ADDRESS` guard
        for a replacement that repeats another address of the same party, and
        that guard is not enforced yet (MISMATCHES.md M-54, M-58). Replacing
        the stored values with the same normalized values is a 200 no-op with
        no version bump and no event. A real change replaces the row, preserves
        `createdAt`/`createdBy`, bumps the Party row version, and writes
        `party.party.address-updated` with `changedFields`, `version`, `from`,
        and `to` in the same transaction (MISMATCHES.md M-58).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that owns the address.
          schema:
            type: string
            format: uuid
        - name: addressId
          in: path
          required: true
          description: Address to replace.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyAddressRequest'
      responses:
        '200':
          description: >
            Address after the replacement, or the unchanged address for a
            no-op.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The replacement would duplicate another address of this party. The
            canonical code is `DUPLICATE_PARTY_ADDRESS`; the implemented expert
            has no address uniqueness rule and currently accepts the
            replacement, so this status is the agreed guard rather than current
            behaviour (MISMATCHES.md M-54, M-58).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    delete:
      operationId: deletePartyAddress
      tags:
        - Party
      summary: Delete a party's address.
      description: >
        Hard-deletes one address and returns 204 with no body. The child is
        looked up by tenant, party, and address id, so an unknown address, an
        address of another party, another tenant's address, and an unknown
        party are all 404 `NOT_FOUND`. Repeating a delete is a 404, not a 204.

        The canonical contract documents a 409 `PARTY_ADDRESS_IN_USE` guard
        when the address is still referenced by another aggregate; the
        implemented expert has no reference check and always deletes, so that
        status is the agreed guard rather than current behaviour (MISMATCHES.md
        M-58). An accepted delete bumps the Party row version and writes
        `party.party.address-deleted` with the last stored snapshot and the new
        `version` in the same transaction as the row delete.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that owns the address.
          schema:
            type: string
            format: uuid
        - name: addressId
          in: path
          required: true
          description: Address to delete.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Address deleted.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The address is still referenced and cannot be deleted. The
            canonical code is `PARTY_ADDRESS_IN_USE`; the implemented expert
            has no reference check and hard-deletes any found address, so this
            status is the agreed guard rather than current behaviour
            (MISMATCHES.md M-58).
