x-compatibility:
  contractVersion: 1.3.0
  previousContractVersion: 1.2.0
  breaking: []
  compatible:
    - Adds PATCH /api/v1/parties/{partyId}/status and the matching /internal/v1 expert operation.
    - Adds the UpdatePartyStatusRequest command and the closed PartyStatus enum (8 values).
    - Constrains Party.status to PartyStatus; every value the API writes is already a member.
    - Documents the 200 Party with ETag, the 400 and 404 responses, the same-status no-op, and the party.party.updated status fact.
  note: >
    The status-transition slice is additive over 1.2.0: no path, request field,
    response field, or event name is removed or changes meaning. Party.status
    was previously documented as a free-form string; it is now the closed
    eight-value enum the service enforces on every write, so no response value
    that the service can produce is excluded. The reason is accepted on the
    command but is not persisted or returned, and If-Match and Idempotency-Key
    are forwarded but not enforced (M-55).
