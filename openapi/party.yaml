openapi: 3.1.0
info:
  title: EIA Party API
  version: 1.3.0
  summary: Party identity, reference data, and the Party expert API.
  description: >
    Party is shared identity data across both books. This document describes the
    implemented public domain API served by eia-party-domain and the internal
    expert API served by eia-party-expert. The authoritative requirement is
    SPEC 11.1 and SPEC 12; the implemented surface is the first vertical slice
    plus the party identifier and address reference data.

    The public routes are `/api/v1/parties` and are routed by eia-platform
    gateway. The internal routes are `/internal/v1/parties` and are reachable
    only inside the platform network.

    Party identifiers and addresses are append-only child facts of the Party
    aggregate. The same four operations are implemented on the public path and
    on the expert path; the domain forwards the tenant and the caller's body to
    the expert. Adding one bumps the Party row version and writes its fact to
    the transactional outbox in the same transaction as the child insert:
    `party.party.identifier-added` or `party.party.address-added`.

    The lifecycle status is changed by `PATCH /api/v1/parties/{partyId}/status`
    with `{status, reason}`. The status is trimmed and upper-cased and must be a
    member of the closed `PartyStatus` enum (`PROSPECT`, `ACTIVE`, `INACTIVE`,
    `DECEASED`, `DISSOLVED`, `MERGED`, `RESTRICTED`, `BLOCKED`); an accepted
    change bumps the Party row version and writes `party.party.updated` with
    `changedFields: [status]`, `from`, `to`, and the optional reason in the same
    transaction. Repeating the current status is a 200 no-op with no version
    bump and no event. The reason is carried in the event only; it is not
    persisted on the Party row and the Party projection never returns it. The
    public operation returns the updated Party with an `ETag` derived from its
    row version. Every status is accepted from every current status: there is no
    transition graph. A status change is published as `party.party.updated`, not
    the SPEC 11.1.9 `party.party.status-changed` name, which remains planned
    (M-22, M-55). Optional `If-Match` and `Idempotency-Key` headers are accepted
    and forwarded by the domain, but the expert does not compare or replay them
    in this slice (M-06, M-07, M-55).

    Deviations from this document are recorded in MISMATCHES.md. The Party
    domain translates expert 404, 409, and other 4xx failures into its
    `{code, message, details}` `ApiError` body rather than the canonical
    `application/problem+json` `Problem`, and the expert returns `{code,
    message}`; M-02 and M-17 record the envelope gap, M-54 records the
    reference-data slice, and M-55 records the status-transition slice.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://party-domain:8082
    description: Party domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Party
    description: Public domain API used by the Party web remote and other domain services.
  - name: Party internal
    description: Internal expert API. Not exposed through the gateway; called only by the Party domain service.
paths:
  /api/v1/parties:
    get:
      operationId: listParties
      tags:
        - Party
      summary: List parties for the caller's tenant.
      description: >
        Returns all parties of the tenant as a bare JSON array. Free-text search
        is served by `GET /api/v1/parties/search`; cursor pagination and
        filtering from SPEC 7.6 remain planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Parties of the tenant, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createParty
      tags:
        - Party
      summary: Create a party.
      description: >
        Creates a party in status PROSPECT with sanctionsStatus NOT_SCREENED and
        confidentiality INTERNAL. The party number is generated by the expert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
      responses:
        '201':
          description: Party created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/search:
    get:
      operationId: searchParties
      tags:
        - Party
      summary: Search parties for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the party pickers.
        Matching is a case-insensitive contains over `partyNumber`,
        `displayName`, and `legalName`; an absent or blank `q` returns the most
        recently updated parties. The response is the shared `SearchResponse`
        envelope. A missing or malformed `X-EIA-Tenant` or a `limit` outside
        1-25 is a 400 `application/problem+json` Problem.
      x-search-type: PARTY
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching parties, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}:
    get:
      operationId: getParty
      tags:
        - Party
      summary: Get a party.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/status:
    patch:
      operationId: updatePartyStatus
      tags:
        - Party
      summary: Change a party's lifecycle status.
      description: >
        Applies one lifecycle status transition and returns the updated Party
        with an `ETag` derived from its row version. The body is
        `UpdatePartyStatusRequest`: `status` is required and `reason` is
        optional.

        `status` is trimmed and upper-cased before the membership check and
        must be one of `PROSPECT`, `ACTIVE`, `INACTIVE`, `DECEASED`,
        `DISSOLVED`, `MERGED`, `RESTRICTED`, or `BLOCKED`; any other value is
        400 `VALIDATION_ERROR`. A missing or blank `status` is 400 `VALIDATION`
        from the domain's request validation. `reason` is trimmed and capped at
        500 characters; a longer value is 400 `VALIDATION` at the domain and
        400 `VALIDATION_ERROR` at the expert, and a blank value is treated as
        absent. A missing or malformed tenant is 400 `TENANT_REQUIRED` or
        `TENANT_INVALID`.

        There is no transition graph: every listed status is accepted from
        every current status, including a same-status request. A same-status
        request returns 200 with the current Party and its current `ETag`
        without a version bump and without an event. An accepted change
        increments the Party row version and writes `party.party.updated` with
        `changedFields: [status]`, `version`, `from`, `to`, and the trimmed
        `reason` when one was supplied, in the same transaction as the row
        update. The envelope `aggregateVersion` is the new row version plus one
        because Party rows start at version 0. The reason is not persisted on
        the Party row and is not returned in the Party projection; there is no
        status history.

        An unknown party and another tenant's party are both 404 `NOT_FOUND`, so
        the response cannot confirm that a foreign party exists. The public
        route requires `X-EIA-Tenant`. Optional `If-Match` and
        `Idempotency-Key` headers are accepted and forwarded to the expert, but
        the expert does not compare the entity tag or replay the key in this
        slice, so there is no 409 and a repeated non-no-op request applies again
        (M-06, M-07, M-55). A status change is published as
        `party.party.updated`; SPEC 11.1.9's `party.party.status-changed` name
        remains planned (M-22, M-55).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose lifecycle status is changed.
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          description: >
            Optional entity tag from the last read, conventionally the strong
            `"<version>"` form (for example `"3"`), or `*`. The domain forwards
            the raw value when it is present and non-blank; the expert does not
            compare it, so a stale or non-standard tag does not produce a 409
            (M-06, M-55).
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Optional idempotency key. The domain forwards it to the expert,
            which neither validates nor replays it in this slice; a retry
            applies the transition again unless it is a same-status no-op
            (M-07, M-55).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyStatusRequest'
      responses:
        '200':
          description: >
            Party after the transition, or the unchanged Party for a same-status
            no-op.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/identifiers:
    get:
      operationId: listPartyIdentifiers
      tags:
        - Party
      summary: List a party's identifiers.
      description: >
        Returns the party's identifiers as a bare JSON array ordered by
        `createdAt`, then `id` (oldest first). The party must exist in the
        caller's tenant; an unknown party and another tenant's party are both
        404 `NOT_FOUND`, so the response cannot confirm that a foreign party
        exists. The domain forwards `X-EIA-Tenant` and the party id to the
        expert's internal route and returns the expert projection.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose identifiers are listed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Identifiers of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: addPartyIdentifier
      tags:
        - Party
      summary: Add an identifier to a party.
      description: >
        Appends one identifier to the party and returns it with 201. The type is
        trimmed and upper-cased and must be a member of `PartyIdentifierType`;
        `identifierValue` is trimmed and must be 1-128 characters. The unique
        key is the normalized `(tenantId, partyId, identifierType,
        identifierValue)`, so a duplicate is 409. The insert, the Party version
        bump, and the `party.party.identifier-added` outbox row commit in one
        transaction, so a rejected duplicate leaves no row, no version bump, and
        no event.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that receives the identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyIdentifierRequest'
      responses:
        '201':
          description: Identifier stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The normalized identifier already exists for this party. The
            canonical code is `DUPLICATE_PARTY_IDENTIFIER`. The expert currently
            returns the generic `CONFLICT` code in its `{code, message}` body
            and the domain preserves that status and code (MISMATCHES.md M-54).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}/addresses:
    get:
      operationId: listPartyAddresses
      tags:
        - Party
      summary: List a party's addresses.
      description: >
        Returns the party's addresses as a bare JSON array ordered by
        `createdAt`, then `id` (oldest first). A party may hold any number of
        addresses of the same type; there is no address uniqueness rule. The
        party must exist in the caller's tenant; an unknown party and another
        tenant's party are both 404 `NOT_FOUND`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party whose addresses are listed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Addresses of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: addPartyAddress
      tags:
        - Party
      summary: Add an address to a party.
      description: >
        Appends one address to the party and returns it with 201. The type is
        trimmed and upper-cased and must be a member of `PartyAddressType`;
        every text field is trimmed, and `country` is upper-cased and must be a
        two-letter ISO 3166-1 alpha-2 code. The insert, the Party version bump,
        and the `party.party.address-added` outbox row commit in one
        transaction. A party may hold several addresses of the same type, and
        the expert implements no address uniqueness rule yet: the canonical
        duplicate guard is documented as 409 `DUPLICATE_PARTY_ADDRESS` for a
        repeat of the same normalized address, but the running expert currently
        stores the repeat (MISMATCHES.md M-54).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          description: Party that receives the address.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyAddressRequest'
      responses:
        '201':
          description: Address stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            A duplicate address for this party. The canonical code is
            `DUPLICATE_PARTY_ADDRESS` for a repeat of the same normalized
            address; the implemented expert has no address uniqueness rule and
            currently accepts the repeat, so this status is the agreed guard
            rather than current behaviour (MISMATCHES.md M-54). The identifier
            duplicate rule, by contrast, is enforced today.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties:
    get:
      operationId: expertListParties
      tags:
        - Party internal
      summary: List parties for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Parties of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateParty
      tags:
        - Party internal
      summary: Create a party (expert).
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequestInternal'
      responses:
        '201':
          description: Party created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties/{partyId}:
    get:
      operationId: expertGetParty
      tags:
        - Party internal
      summary: Get a party (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties/{partyId}/status:
    patch:
      operationId: expertUpdatePartyStatus
      tags:
        - Party internal
      summary: Change a party's lifecycle status (expert).
      description: >
        Expert command used by the Party domain. The tenant is the required
        `?tenantId=` query parameter; unlike the reference-data expert routes,
        this operation does not read `X-EIA-Tenant`. A missing or malformed
        `tenantId` is a 400 from Spring's request-parameter binding rather than a
        structured `ApiError`.

        The expert owns the status vocabulary and the transition rules
        documented on the public operation: the status is trimmed and
        upper-cased and must be a member of `PartyStatus`; there is no
        transition graph, so every value is accepted from every current status;
        a same-status request returns the
        current Party with 200, no version bump, and no event; an accepted
        change bumps the row version and writes `party.party.updated` with
        `changedFields: [status]`, `version`, `from`, `to`, and the optional
        trimmed reason in the same transaction. The expert route does not set
        an `ETag`; the domain derives it from the returned `version`. An unknown
        party and another tenant's party are both 404 `NOT_FOUND`. `If-Match`
        and `Idempotency-Key` are not read on this route (M-55).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          description: Party whose lifecycle status is changed.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePartyStatusRequest'
      responses:
        '200':
          description: >
            Party after the transition, or the unchanged Party for a same-status
            no-op.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties/{partyId}/identifiers:
    get:
      operationId: expertListPartyIdentifiers
      tags:
        - Party internal
      summary: List a party's identifiers (expert).
      description: >
        Expert read used by the Party domain. The tenant is taken from
        `?tenantId=` or from `X-EIA-Tenant`; supplying both with different
        values is 400 `VALIDATION_ERROR`, and supplying neither is 400. An
        unknown party and another tenant's party are both 404 `NOT_FOUND`.
        Identifiers are returned oldest first.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Identifiers of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertAddPartyIdentifier
      tags:
        - Party internal
      summary: Add an identifier to a party (expert).
      description: >
        Expert command used by the Party domain. The identifier rules, the
        duplicate guard, the Party version bump, and the
        `party.party.identifier-added` outbox row are owned here. The body is
        validated against `CreatePartyIdentifierRequest`; a duplicate of the
        normalized unique key is 409.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyIdentifierRequest'
      responses:
        '201':
          description: Identifier stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyIdentifier'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The normalized identifier already exists for this party. The expert
            currently returns `{code: CONFLICT, message}`; the canonical code is
            `DUPLICATE_PARTY_IDENTIFIER` (MISMATCHES.md M-54).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties/{partyId}/addresses:
    get:
      operationId: expertListPartyAddresses
      tags:
        - Party internal
      summary: List a party's addresses (expert).
      description: >
        Expert read used by the Party domain. The tenant comes from `?tenantId=`
        or `X-EIA-Tenant` and a mismatch is 400 `VALIDATION_ERROR`; neither is
        400. An unknown party and another tenant's party are both 404
        `NOT_FOUND`. Addresses are returned oldest first.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Addresses of the party, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertAddPartyAddress
      tags:
        - Party internal
      summary: Add an address to a party (expert).
      description: >
        Expert command used by the Party domain. The address rules, the Party
        version bump, and the `party.party.address-added` outbox row are owned
        here. `addressType` is normalized and every text field is trimmed;
        `country` is normalized to two upper-case letters. There is no address
        uniqueness rule in this slice (MISMATCHES.md M-54).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyAddressRequest'
      responses:
        '201':
          description: Address stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyAddress'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            A duplicate address for this party. The canonical code is
            `DUPLICATE_PARTY_ADDRESS`; the implemented expert has no address
            uniqueness rule and currently accepts a repeat (MISMATCHES.md
            M-54).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Party:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Party projection. `status` is the closed `PartyStatus` enum. partyType,
        sanctionsStatus, and confidentiality are still free-form strings; their
        SPEC 11.1.5 enumerations are not enforced yet.
      required:
        - id
        - tenantId
        - partyNumber
        - partyType
        - displayName
        - legalName
        - status
        - sanctionsStatus
        - confidentiality
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        partyNumber:
          type: string
          description: Generated business key, format PTY-000000001.
          examples:
            - PTY-000000001
        partyType:
          type: string
          description: Party type, for example PERSON or ORGANIZATION. Not yet constrained by an enum.
        displayName:
          type: string
        legalName:
          type: string
        status:
          $ref: '#/components/schemas/PartyStatus'
        sanctionsStatus:
          type: string
          description: Screening state. Created as NOT_SCREENED; not yet constrained by an enum.
        confidentiality:
          type: string
          description: Data classification. Created as INTERNAL; not yet constrained by an enum.
    PartyStatus:
      type: string
      description: >
        Closed party lifecycle vocabulary from SPEC 11.1.5. A party is created as
        `PROSPECT`. A status transition is trimmed and upper-cased before the
        membership check, and every value is accepted from every current status;
        there is no transition graph (M-55).
      enum:
        - PROSPECT
        - ACTIVE
        - INACTIVE
        - DECEASED
        - DISSOLVED
        - MERGED
        - RESTRICTED
        - BLOCKED
    UpdatePartyStatusRequest:
      type: object
      description: >
        Party lifecycle transition command. `status` is required; `reason` is
        optional. The status is trimmed and upper-cased and must be a member of
        `PartyStatus`. The reason is trimmed, a blank value is treated as absent,
        and the value is carried only in the `party.party.updated` event: it is
        not persisted on the Party row and is not returned in the Party
        projection (M-55).
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PartyStatus'
        reason:
          type: string
          maxLength: 500
          description: >
            Optional rationale. Trimmed; a blank value is treated as absent.
            Supplied on a same-status no-op request, the reason is ignored
            because no transition and no event occurs.
    CreatePartyRequest:
      type: object
      description: Public create command. The tenant comes from X-EIA-Tenant, never from the body.
      required:
        - partyType
        - displayName
        - legalName
      properties:
        partyType:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
    CreatePartyRequestInternal:
      type: object
      description: Internal create command accepted by the Party expert.
      required:
        - tenantId
        - partyType
        - displayName
        - legalName
      properties:
        tenantId:
          type: string
          format: uuid
        partyType:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
    PartyIdentifierType:
      type: string
      description: >
        Identifier vocabulary enforced by the Party expert. A request value is
        trimmed and upper-cased before the membership check. The set is the
        SPEC 11.1.4 technical and identity identifier list plus the implemented
        `TAX_ID`, `REGISTRATION`, `LICENSE`, and `OTHER` values; SPEC does not
        enumerate those four (MISMATCHES.md M-54).
      enum:
        - TAX_ID
        - REGISTRATION
        - LICENSE
        - TIN
        - EIN
        - SSN
        - ITIN
        - DUNS
        - LEI
        - PASSPORT
        - DRIVER_LICENSE
        - STATE_ID
        - MEDICARE_ID
        - MEDICAID_ID
        - NPI
        - BAR_NUMBER
        - ACORD_PARTY_ID
        - ISO_PARTY_ID
        - TRUST_CLAIM_NUMBER
        - BANKRUPTCY_CASE_NUMBER
        - OTHER
    PartyAddressType:
      type: string
      description: >
        Address vocabulary enforced by the Party expert. A request value is
        trimmed and upper-cased before the membership check. The set is the
        SPEC 11.1.4 address list plus the implemented `PRIMARY` value; SPEC
        does not enumerate `PRIMARY` (MISMATCHES.md M-54).
      enum:
        - PRIMARY
        - LEGAL
        - PHYSICAL
        - MAILING
        - BILLING
        - CLAIM_SITE
        - EXPOSURE_SITE
        - EMPLOYER
        - PROVIDER
        - BANK
        - OTHER
    PartyIdentifier:
      type: object
      description: >
        One append-only identifier of a party. `issuingAuthority` and
        `effectiveDate` are optional: the public domain omits a null member and
        the expert serializes it, so a client must accept both the absence and
        a null value. `createdBy` is the stored actor and is `system` in the
        current slice.
      required:
        - id
        - tenantId
        - partyId
        - identifierType
        - identifierValue
        - createdAt
        - createdBy
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        identifierType:
          $ref: '#/components/schemas/PartyIdentifierType'
        identifierValue:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Trimmed value as supplied. The column is plaintext, not the
            SPEC 11.1.4 `identifier_value_encrypted` bytea; M-54 records the
            encryption and last-four projection gap.
        issuingAuthority:
          type: [string, 'null']
          maxLength: 128
          description: Optional issuing authority; null or absent when not supplied.
        effectiveDate:
          type: [string, 'null']
          format: date
          description: Optional date from which the identifier is effective.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          maxLength: 128
    PartyAddress:
      type: object
      description: >
        One append-only address of a party. `line2`, `stateRegion`, and
        `effectiveDate` are optional: the public domain omits a null member and
        the expert serializes it. `stateRegion` keeps the caller's case after
        trimming; `country` is normalized to two upper-case letters.
      required:
        - id
        - tenantId
        - partyId
        - addressType
        - line1
        - city
        - postalCode
        - country
        - createdAt
        - createdBy
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        addressType:
          $ref: '#/components/schemas/PartyAddressType'
        line1:
          type: string
          minLength: 1
          maxLength: 128
        line2:
          type: [string, 'null']
          maxLength: 128
          description: Optional second line; null or absent when not supplied.
        city:
          type: string
          minLength: 1
          maxLength: 64
        stateRegion:
          type: [string, 'null']
          maxLength: 64
          description: >
            Optional state, province, or region. Trimmed but not upper-cased.
        postalCode:
          type: string
          minLength: 1
          maxLength: 16
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: >
            ISO 3166-1 alpha-2 country code, stored and returned upper-case.
            SPEC 11.1.4 uses a three-letter alpha-3 country; M-54 records the
            narrower implemented code.
        effectiveDate:
          type: [string, 'null']
          format: date
          description: Optional date from which the address is effective.
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          maxLength: 128
    CreatePartyIdentifierRequest:
      type: object
      description: >
        Add-identifier command. `identifierType` and `identifierValue` are
        required; `issuingAuthority` and `effectiveDate` are optional, and a
        blank `issuingAuthority` is stored as null. The type is upper-cased and
        trimmed and the value is trimmed before the duplicate check.
      required:
        - identifierType
        - identifierValue
      properties:
        identifierType:
          $ref: '#/components/schemas/PartyIdentifierType'
        identifierValue:
          type: string
          minLength: 1
          maxLength: 128
        issuingAuthority:
          type: string
          maxLength: 128
        effectiveDate:
          type: string
          format: date
    CreatePartyAddressRequest:
      type: object
      description: >
        Add-address command. `addressType`, `line1`, `city`, `postalCode`, and
        `country` are required; `line2`, `stateRegion`, and `effectiveDate` are
        optional. Every text field is trimmed, the type is upper-cased, and the
        country accepts either case and is stored upper-case.
      required:
        - addressType
        - line1
        - city
        - postalCode
        - country
      properties:
        addressType:
          $ref: '#/components/schemas/PartyAddressType'
        line1:
          type: string
          minLength: 1
          maxLength: 128
        line2:
          type: string
          maxLength: 128
        city:
          type: string
          minLength: 1
          maxLength: 64
        stateRegion:
          type: string
          maxLength: 64
        postalCode:
          type: string
          minLength: 1
          maxLength: 16
        country:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: >
            Two-letter country code. Accepted in either case and normalized to
            upper-case; a value that is not exactly two letters is 400.
        effectiveDate:
          type: string
          format: date
