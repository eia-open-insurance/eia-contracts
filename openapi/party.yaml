openapi: 3.1.0
info:
  title: EIA Party API
  version: 1.0.0
  summary: Party identity, reference data, and the Party expert API.
  description: >
    Party is shared identity data across both books. This document describes the
    implemented public domain API served by eia-party-domain and the internal
    expert API served by eia-party-expert. The authoritative requirement is
    SPEC 11.1 and SPEC 12; the implemented surface is the first vertical slice.

    The public routes are `/api/v1/parties` and are routed by eia-platform
    gateway. The internal routes are `/internal/v1/parties` and are reachable
    only inside the platform network.

    Deviations from this document are recorded in MISMATCHES.md. In particular
    the Party domain service has no exception handler yet, so a missing party
    currently surfaces as an unhandled 500 rather than the canonical 404.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://party-domain:8082
    description: Party domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Party
    description: Public domain API used by the Party web remote and other domain services.
  - name: Party internal
    description: Internal expert API. Not exposed through the gateway; called only by the Party domain service.
paths:
  /api/v1/parties:
    get:
      operationId: listParties
      tags:
        - Party
      summary: List parties for the caller's tenant.
      description: >
        Returns all parties of the tenant as a bare JSON array. Cursor
        pagination and filtering from SPEC 7.6 are planned and not implemented.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Parties of the tenant, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createParty
      tags:
        - Party
      summary: Create a party.
      description: >
        Creates a party in status PROSPECT with sanctionsStatus NOT_SCREENED and
        confidentiality INTERNAL. The party number is generated by the expert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequest'
      responses:
        '201':
          description: Party created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/parties/{partyId}:
    get:
      operationId: getParty
      tags:
        - Party
      summary: Get a party.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties:
    get:
      operationId: expertListParties
      tags:
        - Party internal
      summary: List parties for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Parties of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateParty
      tags:
        - Party internal
      summary: Create a party (expert).
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartyRequestInternal'
      responses:
        '201':
          description: Party created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/parties/{partyId}:
    get:
      operationId: expertGetParty
      tags:
        - Party internal
      summary: Get a party (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: partyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Party'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Party:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Party projection. partyType, status, sanctionsStatus, and
        confidentiality are free-form strings today; the SPEC 11.1.5
        enumerations are not enforced yet.
      required:
        - id
        - tenantId
        - partyNumber
        - partyType
        - displayName
        - legalName
        - status
        - sanctionsStatus
        - confidentiality
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        partyNumber:
          type: string
          description: Generated business key, format PTY-000000001.
          examples:
            - PTY-000000001
        partyType:
          type: string
          description: Party type, for example PERSON or ORGANIZATION. Not yet constrained by an enum.
        displayName:
          type: string
        legalName:
          type: string
        status:
          type: string
          description: Lifecycle status. Created as PROSPECT; not yet constrained by an enum.
        sanctionsStatus:
          type: string
          description: Screening state. Created as NOT_SCREENED; not yet constrained by an enum.
        confidentiality:
          type: string
          description: Data classification. Created as INTERNAL; not yet constrained by an enum.
    CreatePartyRequest:
      type: object
      description: Public create command. The tenant comes from X-EIA-Tenant, never from the body.
      required:
        - partyType
        - displayName
        - legalName
      properties:
        partyType:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
    CreatePartyRequestInternal:
      type: object
      description: Internal create command accepted by the Party expert.
      required:
        - tenantId
        - partyType
        - displayName
        - legalName
      properties:
        tenantId:
          type: string
          format: uuid
        partyType:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        legalName:
          type: string
          minLength: 1
x-vertical: party
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-party-domain/src/main/java/com/eia/party/domain/PartyController.java
    - repos/eia-party-domain/src/main/java/com/eia/party/domain/PartyClient.java
    - repos/eia-party-expert/src/main/java/com/eia/party/expert/PartyController.java
    - repos/eia-party-expert/src/main/java/com/eia/party/expert/ApiExceptionHandler.java
  notes: >
    The Party domain service has no ApiExceptionHandler, so downstream 404 and
    expert failures are not translated into the canonical envelope. The Party
    expert returns `{code, message}` for NOT_FOUND only.
