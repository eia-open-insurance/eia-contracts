components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Claim:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Direct claim projection. `reserveAmount` is the reserve seeded at
        registration; `currentReserveAmount` is derived from the current rows of
        the reserve history and is never written back over the seed. Money is a
        decimal string on every field.
      required:
        - id
        - tenantId
        - businessBook
        - claimNumber
        - policyId
        - claimantPartyId
        - claimType
        - status
        - lossDate
        - reportDate
        - reserveAmount
        - reserveCurrency
        - litigationFlag
        - currentReserveAmount
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - DIRECT
        claimNumber:
          type: string
          examples:
            - CLM-2026-0000001
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        claimType:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
          description: On or after lossDate.
        causeCode:
          type: [string, 'null']
          maxLength: 24
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        settlementAuthorityAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        settlementAuthorityCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        litigationFlag:
          type: boolean
        assignedAdjuster:
          type: [string, 'null']
          maxLength: 128
          description: >
            Current assigned adjuster, or null when the claim has never been
            assigned. Set by the assignment command, not by claim registration.
        assignedTeam:
          type: [string, 'null']
          maxLength: 64
          description: Optional team of the current assignment; null when unset.
        assignedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Instant of the last real assignment change. A same-assignment no-op
            keeps the previous value; null when the claim has never been
            assigned.
        currentReserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
    ClaimType:
      type: string
      description: Direct claim type from SPEC 11.4.
      enum:
        - BODILY_INJURY
        - PROPERTY_DAMAGE
        - PRODUCT_LIABILITY
        - MASS_TORT
        - ENVIRONMENTAL
        - POLLUTION
        - CONSTRUCTION_DEFECT
        - AUTO_LIABILITY
        - TRUCKING
        - WORKERS_COMPENSATION
        - EMPLOYERS_LIABILITY
        - MEDICAL_MALPRACTICE
        - PROFESSIONAL_LIABILITY
        - DIRECTORS_AND_OFFICERS
        - EMPLOYMENT_PRACTICES
        - CLASS_ACTION
        - MULTI_DISTRICT_LITIGATION
        - SUBROGATION
        - OTHER
    ClaimStatus:
      type: string
      description: Direct claim lifecycle status from SPEC 11.4.6.
      enum:
        - DRAFT
        - REGISTERED
        - OPEN
        - COVERAGE_REVIEW
        - RESERVED
        - IN_LITIGATION
        - IN_SETTLEMENT
        - SETTLED
        - PAYMENT_PENDING
        - PAID
        - CLOSED
        - DENIED
        - WITHDRAWN
        - DISMISSED
        - TRANSFERRED
        - BANKRUPTCY_TRUST
        - ON_APPEAL
        - REOPENED
    Injury:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - claimantPartyId
        - injuryType
        - severity
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        injuryType:
          type: string
          maxLength: 32
        bodyPart:
          type: [string, 'null']
          maxLength: 64
        diagnosisCodes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 16
        description:
          type: [string, 'null']
          maxLength: 2000
        severity:
          type: string
          enum:
            - MILD
            - MODERATE
            - SEVERE
            - CATASTROPHIC
            - FATAL
        diagnosisDate:
          type: [string, 'null']
          format: date
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Exposure:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - claimantPartyId
        - exposureType
        - jurisdiction
        - exposureFrom
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        exposureType:
          type: string
          enum:
            - PRODUCT
            - SUBSTANCE
            - SITE
            - OCCUPATION
            - ENVIRONMENT
            - MEDICAL_DEVICE
            - IMPLANT
            - RADIATION
        productName:
          type: [string, 'null']
          maxLength: 200
        substanceName:
          type: [string, 'null']
          maxLength: 200
        siteName:
          type: [string, 'null']
          maxLength: 200
        employerPartyId:
          type: [string, 'null']
          format: uuid
        jobTitle:
