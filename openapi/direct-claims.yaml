          format: date-time
    Lien:
      type: object
      description: >
        A claim lien. Resolution is recorded before a claim can close (DIR-11).
      required:
        - id
        - tenantId
        - claimId
        - lienType
        - lienholder
        - amount
        - currency
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        lienType:
          type: string
          enum:
            - MEDICARE
            - MEDICAID
            - WORKERS_COMPENSATION
            - HOSPITAL
            - PHYSICIAN
            - ERISA
            - CHILD_SUPPORT
            - TAX
            - VETERANS
            - OTHER
        lienholder:
          type: string
          maxLength: 200
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - IDENTIFIED
            - VERIFIED
            - NEGOTIATING
            - RESOLVED
            - WAIVED
            - DISPUTED
            - PAID
        resolutionType:
          type: [string, 'null']
          enum:
            - PAID
            - NEGOTIATED
            - WAIVED
            - DEFERRED
        resolvedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateClaimRequest:
      type: object
      description: Public FNOL command. The tenant comes from X-EIA-Tenant.
      required:
        - policyId
        - claimantPartyId
        - lossDate
        - reportDate
      properties:
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
        causeCode:
          type: string
          maxLength: 24
        claimType:
          $ref: '#/components/schemas/ClaimType'
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        settlementAuthorityAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        settlementAuthorityCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreateClaimRequestInternal:
      type: object
      description: Internal create command accepted by the Direct Claims expert.
      required:
        - tenantId
        - policyId
        - claimantPartyId
        - lossDate
        - reportDate
      properties:
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
        causeCode:
          type: string
          maxLength: 24
        claimType:
          $ref: '#/components/schemas/ClaimType'
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        settlementAuthorityAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        settlementAuthorityCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - DRAFT
            - REGISTERED
          description: Optional initial status. Defaults to REGISTERED.
    ChangeClaimStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
    ChangeClaimStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Direct Claims expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional. When omitted the expert compares against the current version.
    CloseClaimRequest:
      type: object
      description: Optional optimistic-concurrency guard on claim closure.
      properties:
        expectedVersion:
          type: integer
          minimum: 0
    InjuryRequest:
      type: object
      description: >
        Record or update an injury. `expectedVersion` is required by PATCH and
        ignored by create.
      required:
        - injuryType
        - severity
      properties:
        claimantPartyId:
          type: string
          format: uuid
        injuryType:
          type: string
          maxLength: 32
        bodyPart:
          type: string
          maxLength: 64
        diagnosisCodes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 16
        description:
          type: string
          maxLength: 2000
        severity:
          type: string
          enum:
            - MILD
            - MODERATE
            - SEVERE
            - CATASTROPHIC
            - FATAL
        diagnosisDate:
          type: string
          format: date
        expectedVersion:
          type: integer
          minimum: 0
    ExposureRequest:
      type: object
      description: >
        Record or update an exposure. `expectedVersion` is required by PATCH and
        ignored by create.
      required:
        - exposureType
        - jurisdiction
        - exposureFrom
      properties:
        claimantPartyId:
          type: string
          format: uuid
        exposureType:
          type: string
          enum:
            - PRODUCT
            - SUBSTANCE
            - SITE
            - OCCUPATION
            - ENVIRONMENT
            - MEDICAL_DEVICE
            - IMPLANT
            - RADIATION
        productName:
          type: string
          maxLength: 200
        substanceName:
          type: string
          maxLength: 200
        siteName:
          type: string
          maxLength: 200
        employerPartyId:
          type: string
          format: uuid
        jobTitle:
          type: string
          maxLength: 120
        jurisdiction:
          type: string
          maxLength: 16
        exposureFrom:
          type: string
          format: date
        exposureTo:
          type: string
          format: date
        intensity:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - EXTREME
            - UNKNOWN
        expectedVersion:
          type: integer
          minimum: 0
    ReserveChangeRequest:
      type: object
      description: >
        Establish or change one reserve component. `expectedVersion` is
        required so a stale change cannot close the wrong current row.
      required:
        - component
        - amount
        - reasonCode
        - expectedVersion
      properties:
        component:
          $ref: '#/components/schemas/ReserveComponent'
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        effectiveDate:
          type: string
          format: date
        reasonCode:
          $ref: '#/components/schemas/ReserveReason'
        reasonText:
          type: string
          maxLength: 400
        authority:
          type: string
          maxLength: 32
        expectedVersion:
          type: integer
          minimum: 0
    CoverageDecisionRequest:
      type: object
      description: >
        Record a final coverage decision. Recording a decision supersedes the
        previous final position for the claim.
      required:
        - position
        - basis
        - decisionDate
        - reviewerPartyId
      properties:
        position:
          $ref: '#/components/schemas/CoveragePosition'
        basis:
          type: string
          maxLength: 4000
        policyProvisions:
          type: string
          maxLength: 2000
        allocationMethod:
          type: string
          enum:
            - ALL_SUMS
            - PRO_RATA_TIME
            - PRO_RATA_PREMIUM
            - EQUAL
            - CUSTOM
        allocationPct:
          $ref: './components.yaml#/components/schemas/Percent'
        decisionDate:
          type: string
          format: date
        reviewerPartyId:
          type: string
          format: uuid
    LitigationRequest:
      type: object
      description: Record or update a litigation matter.
      required:
        - matterType
        - jurisdiction
        - counselPartyId
        - filingDate
        - status
      properties:
        matterType:
          type: string
          enum:
            - DEFENSE
            - COVERAGE
            - APPEAL
            - BANKRUPTCY
            - REGULATORY
            - TRANSACTIONAL
        jurisdiction:
          type: string
          maxLength: 16
        counselPartyId:
          type: string
          format: uuid
        filingDate:
          type: string
          format: date
        trialDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - STAYED
            - DISMISSED
            - SETTLED
            - JUDGMENT
            - ON_APPEAL
            - CLOSED
        caseNumber:
          type: string
          maxLength: 64
        expectedVersion:
          type: integer
          minimum: 0
    SettlementRequest:
      type: object
      description: Propose a settlement. Amount is a decimal string in JSON.
      required:
        - amount
        - structure
      properties:
        amount:
          type: string
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        structure:
          type: string
          enum:
            - LUMP_SUM
            - STRUCTURED
            - ANNUITY
            - MATRIX
        releaseScope:
          type: string
          enum:
            - FULL
            - PARTIAL
            - CLAIMANT_SPECIFIC
            - POLICY_YEAR
        paymentInstructions:
          type: string
          maxLength: 4000
    SettlementApprovalRequest:
      type: object
      description: >
        Authorize a settlement. `approvalAuthority` names the authority that
        approved the amount and is required.
      required:
        - approvalAuthority
        - authorizedBy
        - expectedVersion
      properties:
        approvalAuthority:
          type: string
          maxLength: 120
        authorizedBy:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 0
    SettlementExecutionRequest:
      type: object
      description: >
        Execute a settlement. A release document is required; payment
        instructions may be supplied here or inherited from the proposal.
      required:
        - releaseDocumentId
        - expectedVersion
      properties:
        releaseDocumentId:
          type: string
          format: uuid
        paymentInstructions:
          type: string
          maxLength: 4000
        expectedVersion:
          type: integer
          minimum: 0
    RecoveryRequest:
      type: object
      description: >
        Record a recovery, or advance an existing recovery's status.
        `expectedVersion` is required by PATCH.
      required:
        - recoveryType
        - amount
        - source
        - status
      properties:
        recoveryType:
          type: string
          enum:
            - SUBROGATION
            - SALVAGE
            - CONTRIBUTION
            - ASSUMED
            - OTHER_INSURANCE
            - INDEMNITY
            - TRUST
            - GOVERNMENT
            - OTHER
        amount:
          type: string
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        source:
          type: string
          maxLength: 200
        status:
          type: string
          enum:
            - IDENTIFIED
            - PURSUING
            - AGREED
            - RECEIVED
            - DENIED
            - ABANDONED
        recoveryDate:
          type: string
          format: date
        expectedVersion:
          type: integer
          minimum: 0
    LienRequest:
      type: object
      description: Record a lien, or update its status and resolution.
      required:
        - lienType
        - lienholder
        - amount
        - status
      properties:
        lienType:
          type: string
          enum:
            - MEDICARE
            - MEDICAID
            - WORKERS_COMPENSATION
            - HOSPITAL
            - PHYSICIAN
            - ERISA
            - CHILD_SUPPORT
            - TAX
            - VETERANS
            - OTHER
        lienholder:
          type: string
          maxLength: 200
        amount:
          type: string
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - IDENTIFIED
            - VERIFIED
            - NEGOTIATING
            - RESOLVED
            - WAIVED
            - DISPUTED
            - PAID
        resolutionType:
          type: string
          enum:
            - PAID
            - NEGOTIATED
            - WAIVED
            - DEFERRED
        expectedVersion:
          type: integer
          minimum: 0
