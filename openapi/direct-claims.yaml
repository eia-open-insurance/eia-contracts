components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Claim:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Direct claim projection. `reserveAmount` is the reserve seeded at
        registration; `currentReserveAmount` is derived from the current rows of
        the reserve history and is never written back over the seed. Money is a
        decimal string on every field.
      required:
        - id
        - tenantId
        - businessBook
        - claimNumber
        - policyId
        - claimantPartyId
        - claimType
        - status
        - lossDate
        - reportDate
        - reserveAmount
        - reserveCurrency
        - litigationFlag
        - currentReserveAmount
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - DIRECT
        claimNumber:
          type: string
          examples:
            - CLM-2026-0000001
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        claimType:
          $ref: '#/components/schemas/ClaimType'
        status:
          $ref: '#/components/schemas/ClaimStatus'
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
          description: On or after lossDate.
        causeCode:
          type: [string, 'null']
          maxLength: 24
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        settlementAuthorityAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        settlementAuthorityCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        litigationFlag:
          type: boolean
        currentReserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
    ClaimType:
      type: string
      description: Direct claim type from SPEC 11.4.
      enum:
        - BODILY_INJURY
        - PROPERTY_DAMAGE
        - PRODUCT_LIABILITY
        - MASS_TORT
        - ENVIRONMENTAL
        - POLLUTION
        - CONSTRUCTION_DEFECT
        - AUTO_LIABILITY
        - TRUCKING
        - WORKERS_COMPENSATION
        - EMPLOYERS_LIABILITY
        - MEDICAL_MALPRACTICE
        - PROFESSIONAL_LIABILITY
        - DIRECTORS_AND_OFFICERS
        - EMPLOYMENT_PRACTICES
        - CLASS_ACTION
        - MULTI_DISTRICT_LITIGATION
        - SUBROGATION
        - OTHER
    ClaimStatus:
      type: string
      description: Direct claim lifecycle status from SPEC 11.4.6.
      enum:
        - DRAFT
        - REGISTERED
        - OPEN
        - COVERAGE_REVIEW
        - RESERVED
        - IN_LITIGATION
        - IN_SETTLEMENT
        - SETTLED
        - PAYMENT_PENDING
        - PAID
        - CLOSED
        - DENIED
        - WITHDRAWN
        - DISMISSED
        - TRANSFERRED
        - BANKRUPTCY_TRUST
        - ON_APPEAL
        - REOPENED
    Injury:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - claimantPartyId
        - injuryType
        - severity
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        injuryType:
          type: string
          maxLength: 32
        bodyPart:
          type: [string, 'null']
          maxLength: 64
        diagnosisCodes:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 16
        description:
          type: [string, 'null']
          maxLength: 2000
        severity:
          type: string
          enum:
            - MILD
            - MODERATE
            - SEVERE
            - CATASTROPHIC
            - FATAL
        diagnosisDate:
          type: [string, 'null']
          format: date
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Exposure:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - claimantPartyId
        - exposureType
        - jurisdiction
        - exposureFrom
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        exposureType:
          type: string
          enum:
            - PRODUCT
            - SUBSTANCE
            - SITE
            - OCCUPATION
            - ENVIRONMENT
            - MEDICAL_DEVICE
            - IMPLANT
            - RADIATION
        productName:
          type: [string, 'null']
          maxLength: 200
        substanceName:
          type: [string, 'null']
          maxLength: 200
        siteName:
          type: [string, 'null']
          maxLength: 200
        employerPartyId:
          type: [string, 'null']
          format: uuid
        jobTitle:
          type: [string, 'null']
          maxLength: 120
        jurisdiction:
          type: string
          maxLength: 16
        exposureFrom:
          type: string
          format: date
        exposureTo:
          type: [string, 'null']
          format: date
        intensity:
          type: [string, 'null']
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - EXTREME
            - UNKNOWN
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReserveHistoryEntry:
      type: object
      description: >
        Append-only reserve movement. `current` marks the one live row per
        claim/component; the claim's current reserve is the sum of the current
        rows, never an overwritten claim field.
      required:
        - id
        - tenantId
        - claimId
        - component
        - amount
        - currency
        - effectiveDate
        - reasonCode
        - sequence
        - current
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        component:
          $ref: '#/components/schemas/ReserveComponent'
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        effectiveDate:
          type: string
          format: date
        reasonCode:
          $ref: '#/components/schemas/ReserveReason'
        reasonText:
          type: [string, 'null']
          maxLength: 400
        authority:
          type: [string, 'null']
          maxLength: 32
        sequence:
          type: integer
          minimum: 1
        current:
          type: boolean
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ReserveComponent:
      type: string
      enum:
        - INDEMNITY
        - DEFENSE
        - ALAE
        - ULAE
        - EXPENSE
        - MEDICAL
        - SUBROGATION
        - RECOVERY
        - IBNR
        - IBNER
    ReserveReason:
      type: string
      enum:
        - INITIAL
        - DEVELOPMENT
        - NEW_INFORMATION
        - SETTLEMENT_NEGOTIATION
        - COVERAGE_CHANGE
        - PAYMENT_APPLIED
        - RECOVERY_APPLIED
        - REVIEW
        - CORRECTION
        - CLOSE
    ReserveComponentBalance:
      type: object
      required:
        - component
        - currentAmount
        - currency
      properties:
        component:
          $ref: '#/components/schemas/ReserveComponent'
        currentAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    ReserveSummary:
      type: object
      required:
        - claimId
        - currency
        - totalCurrentAmount
        - components
        - history
      properties:
        claimId:
          type: string
          format: uuid
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        totalCurrentAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        components:
          type: array
          items:
            $ref: '#/components/schemas/ReserveComponentBalance'
        history:
          type: array
          items:
            $ref: '#/components/schemas/ReserveHistoryEntry'
    CoverageDecision:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - position
        - basis
        - decisionDate
        - reviewerPartyId
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        position:
          $ref: '#/components/schemas/CoveragePosition'
        basis:
          type: string
          maxLength: 4000
        policyProvisions:
          type: [string, 'null']
          maxLength: 2000
        allocationMethod:
          type: [string, 'null']
          enum:
            - ALL_SUMS
            - PRO_RATA_TIME
            - PRO_RATA_PREMIUM
            - EQUAL
            - CUSTOM
        allocationPct:
          $ref: './components.yaml#/components/schemas/Percent'
        decisionDate:
          type: string
          format: date
        reviewerPartyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - FINAL
            - SUPERSEDED
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CoveragePosition:
      type: string
      enum:
        - COVERED
        - DENIED
        - DEFENSE_ONLY
    Litigation:
      type: object
      required:
        - id
        - tenantId
        - claimId
        - matterType
        - jurisdiction
        - counselPartyId
        - filingDate
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        matterType:
          type: string
          enum:
            - DEFENSE
            - COVERAGE
            - APPEAL
            - BANKRUPTCY
            - REGULATORY
            - TRANSACTIONAL
        jurisdiction:
          type: string
          maxLength: 16
        counselPartyId:
          type: string
          format: uuid
        filingDate:
          type: string
          format: date
        trialDate:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - STAYED
            - DISMISSED
            - SETTLED
            - JUDGMENT
            - ON_APPEAL
            - CLOSED
        caseNumber:
          type: [string, 'null']
          maxLength: 64
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Settlement:
      type: object
      description: >
        A settlement is PROPOSED, then AUTHORIZED against the claim's
        settlement authority, then EXECUTED once the release and payment
        instructions are recorded.
      required:
        - id
        - tenantId
        - claimId
        - settlementNumber
        - amount
        - currency
        - structure
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        settlementNumber:
          type: string
          maxLength: 32
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        structure:
          type: string
          enum:
            - LUMP_SUM
            - STRUCTURED
            - ANNUITY
            - MATRIX
        releaseScope:
          type: [string, 'null']
          enum:
            - FULL
            - PARTIAL
            - CLAIMANT_SPECIFIC
            - POLICY_YEAR
        approvalAuthority:
          type: [string, 'null']
          maxLength: 120
        paymentInstructions:
          type: [string, 'null']
          maxLength: 4000
        releaseDocumentId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum:
            - PROPOSED
            - AUTHORIZED
            - EXECUTED
            - REJECTED
        authorizedBy:
          type: [string, 'null']
          format: uuid
        authorizedAt:
          type: [string, 'null']
          format: date-time
        executedAt:
          type: [string, 'null']
          format: date-time
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Recovery:
      type: object
      description: >
        A claim recovery. Received recoveries are capped by the claim's paid
        loss.
      required:
        - id
        - tenantId
        - claimId
        - recoveryType
        - amount
        - currency
        - source
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        claimId:
