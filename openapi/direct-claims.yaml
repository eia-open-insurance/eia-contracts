        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. Reusing the same `Idempotency-Key` for a different task body is
            `EIA-DIR-4091` with category `IDEMPOTENCY_KEY_REUSED` and
            `retryable: false`; use a new key for a new command. A concurrent
            change to the parent claim is the generic `CONFLICT`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/tasks/{taskId}:
    patch:
      operationId: changeClaimTaskStatus
      tags:
        - Direct Claims
      summary: Change the status of a diary task.
      description: >
        `status` is one of OPEN, COMPLETE, or CANCELLED and `version` is the
        task version the caller observed. OPEN may move to COMPLETE or
        CANCELLED, and COMPLETE or CANCELLED may move back to OPEN. A stale
        version is 409 and an illegal transition is 400. A command that repeats
        the current status is a no-op that returns the task without writing an
        event. A transition to COMPLETE emits `direct.claim.task-completed`; a
        cancellation or reopen emits `direct.claim.task-updated`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
