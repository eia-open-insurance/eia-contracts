  /internal/v1/claims/{claimId}/tasks:
    get:
      operationId: expertListClaimTasks
      tags:
        - Direct Claims internal
      summary: List claim tasks (expert).
      description: >
        The expert also accepts X-EIA-Tenant; the Direct Claims domain client
        sends the tenant as a header on this route. Tasks are ordered like the
        public list: OPEN by due date, then CANCELLED, then COMPLETE newest
        first.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tasks of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateClaimTask
      tags:
        - Direct Claims internal
      summary: Open a diary task (expert).
      description: >
        Expert create used by the Direct Claims domain. It accepts the same
        optional `Idempotency-Key` as the public route: 1-64 printable ASCII
        characters without spaces, scoped to the tenant plus the task-create
        command. A same-key retry with an identical body replays the stored 201
        task with `Idempotent-Replay: true`; a different body under the same key
        is 409 `EIA-DIR-4091` with category `IDEMPOTENCY_KEY_REUSED`. A key
        longer than 64 characters or containing a non-printable character or a space is
        400 `VALIDATION_ERROR`; a blank key is treated as absent.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/ClaimIdempotencyKey'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task opened, or the stored task replayed.
          headers:
            Idempotent-Replay:
              $ref: './components.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. Same `Idempotency-Key` with a different task body:
            `EIA-DIR-4091` with category `IDEMPOTENCY_KEY_REUSED`. A concurrent
            change to the parent claim is the generic `CONFLICT`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
