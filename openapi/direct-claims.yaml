    AssignClaimRequest:
      type: object
      description: >
        Command to assign or reassign a claim at the observed claim version.
        `assignedAdjuster` is required and trimmed; `assignedTeam` is optional
        and trimmed. A stale `expectedVersion` is 409; repeating the current
        assignment at the current version is a no-op.
      required:
        - assignedAdjuster
        - expectedVersion
      properties:
        assignedAdjuster:
          type: string
          minLength: 1
          maxLength: 128
          description: Adjuster reference that receives the claim.
        assignedTeam:
          type: [string, 'null']
          maxLength: 64
          description: Optional team reference for the assignment.
        expectedVersion:
          type: integer
          minimum: 0
          description: >
            Claim version the caller last observed. A value that does not match
            the current version is 409 CONFLICT.
