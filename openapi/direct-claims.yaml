openapi: 3.1.0
info:
  title: EIA Direct Claims API
  version: 1.1.0
  summary: Direct-book claim administration and the Direct Claims expert API.
  description: >
    This document describes the implemented public Direct Claims domain API and
    the internal Direct Claims expert API. The authoritative requirement is
    SPEC 11.4 and SPEC 12.

    Direct Claims is fixed to the DIRECT book. The public API and the expert
    read/write routes treat a missing or different X-EIA-Book value as a 404,
    never a 403, so the response cannot confirm existence in the other book
    (SPEC 3.6.2, WALL-06).

    Round 5 adds the second slice: injuries, exposures, append-only reserve
    history, coverage decisions, litigation, settlements, recoveries, liens,
    and claim closure. The public status transition carries `status` only; the
    domain reads the current version and forwards it. The internal transition
    carries an optional `expectedVersion`. Only the expert mutates a child
    record's version; the public PATCH commands carry `expectedVersion` and the
    domain requires it for every child update.

    The public close transaction has no body requirement; an optional
    `expectedVersion` may be supplied. The expert close applies the closure
    preconditions (no unresolved lien, no open reserve, and a legal CLOSED
    transition).
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://direct-claims-domain:8088
    description: Direct Claims domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Direct Claims
    description: Public domain API used by the Direct Claims web remote.
  - name: Direct Claims internal
    description: Internal expert API. Not exposed through the gateway; called only by the Direct Claims domain service.
paths:
  /api/v1/claims:
    get:
      operationId: listClaims
      tags:
        - Direct Claims
      summary: List direct claims for the caller's tenant and book.
      description: Returns a bare JSON array, optionally filtered by status.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/DirectClaimStatusFilter'
      responses:
        '200':
          description: Claims of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaim
      tags:
        - Direct Claims
      summary: Register an FNOL claim.
      description: >
        The claim is created in REGISTERED (or DRAFT when the internal API asks
        for it). The claim number is generated by the expert as
        CLM-{report year}-{7 digits}. reserveAmount defaults to zero and
        reserveCurrency defaults to USD.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Claim registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}:
    get:
      operationId: getClaim
      tags:
        - Direct Claims
      summary: Get a direct claim.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/status:
    patch:
      operationId: changeClaimStatus
      tags:
        - Direct Claims
      summary: Advance a direct claim through its lifecycle.
      description: >
        Applies one transition from SPEC 11.4.6. The domain service reads the
        current version and forwards it to the expert; the caller cannot supply
        an expected version on the public route. Moving to OPEN requires a
        final coverage decision that is not DENIED; moving to CLOSED requires
        no unresolved lien and no open reserve.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeClaimStatusRequest'
      responses:
        '200':
          description: Claim after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/close:
    post:
      operationId: closeClaim
      tags:
        - Direct Claims
      summary: Close a direct claim.
      description: >
        Closure is a transaction, not a status write. The expert rejects it
        while a lien is unresolved, while the current reserve is positive, or
        when the current status cannot transition to CLOSED. The optional body
        carries `expectedVersion`; a stale value is 409 CONFLICT.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseClaimRequest'
      responses:
        '200':
          description: Claim closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/injuries:
    get:
      operationId: listClaimInjuries
      tags:
        - Direct Claims
      summary: List injury allegations.
      description: Returns a bare array ordered by creation time.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Injuries of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimInjury
      tags:
        - Direct Claims
      summary: Record an injury.
      description: >
        `claimantPartyId`, `injuryType`, and `severity` are required. Diagnosis
        codes are ICD-10-style strings (`[A-Z0-9.-]{1,16}`, at most 20). The
        expert normalizes the enums and returns the new row with `version: 1`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryRequest'
      responses:
        '201':
          description: Injury recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/injuries/{injuryId}:
    patch:
      operationId: updateClaimInjury
      tags:
        - Direct Claims
      summary: Update an injury.
      description: >
        `expectedVersion` is required. A stale version is 409 CONFLICT at the
        public surface; an unknown injury is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: injuryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryRequest'
      responses:
        '200':
          description: Injury after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/exposures:
    get:
      operationId: listClaimExposures
      tags:
        - Direct Claims
      summary: List exposure allegations.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exposures of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimExposure
      tags:
        - Direct Claims
      summary: Record an exposure.
      description: >
        `claimantPartyId`, `exposureType`, `jurisdiction`, and `exposureFrom`
        are required. Exposure dates may not be after the claim report date and
        `exposureTo` may not precede `exposureFrom`; a violation is 400.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
      responses:
        '201':
          description: Exposure recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/exposures/{exposureId}:
    patch:
      operationId: updateClaimExposure
      tags:
        - Direct Claims
      summary: Update an exposure.
      description: >
        `expectedVersion` is required. When `exposureFrom` or `exposureTo` is
        supplied, the domain re-reads the claim and validates the dates against
        its report date before forwarding.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exposureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
      responses:
        '200':
          description: Exposure after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/reserves:
    get:
      operationId: getClaimReserves
      tags:
        - Direct Claims
      summary: Get the reserve position and history.
      description: >
        `components` carries one current balance per reserve component;
        `totalCurrentAmount` is their sum and equals the claim's derived current
        reserve. `history` is the full append-only history with `current`
        marking the live row per component.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserve summary and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: changeClaimReserve
      tags:
        - Direct Claims
      summary: Establish or change one reserve component.
      description: >
        The reserve history is append-only. `component`, `amount`,
        `reasonCode`, and `expectedVersion` are required; `amount` is zero or
        greater. The new row supersedes the current row for the same component
        and increments its version. A stale `expectedVersion` is 409 at the
        public surface.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveChangeRequest'
      responses:
        '201':
          description: Reserve movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveHistoryEntry'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/coverage:
    get:
      operationId: getClaimCoverage
      tags:
        - Direct Claims
      summary: Get the final coverage decision.
      description: >
        Returns 404 until a decision is recorded, so the workbench can show an
        empty tab. Only one row per claim is FINAL; recording a new decision
        supersedes the previous one.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Final coverage decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDecision'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: decideClaimCoverage
      tags:
        - Direct Claims
      summary: Record a final coverage decision.
      description: >
        `position` is COVERED, DENIED, or DEFENSE_ONLY; `basis`, `decisionDate`,
        and `reviewerPartyId` are required. `allocationPct` is a fraction
        between 0 and 1 and `allocationMethod` is one of the SPEC 11.4
        methods. The previous FINAL row is superseded in the same transaction.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageDecisionRequest'
      responses:
        '201':
          description: Coverage decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDecision'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/litigation:
    get:
      operationId: listClaimLitigation
      tags:
        - Direct Claims
      summary: List litigation matters.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Litigation matters of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Litigation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimLitigation
      tags:
        - Direct Claims
      summary: Record a litigation matter.
      description: >
        `matterType`, `jurisdiction`, `counselPartyId`, `filingDate`, and
        `status` are required; `trialDate` may not precede `filingDate`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LitigationRequest'
      responses:
        '201':
          description: Litigation matter recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Litigation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/litigation/{litigationId}:
    patch:
      operationId: updateClaimLitigation
      tags:
        - Direct Claims
      summary: Update a litigation matter.
      description: >
        `expectedVersion` is required; a stale value is 409 at the public
        surface.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: litigationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LitigationRequest'
      responses:
        '200':
          description: Litigation matter after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Litigation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/settlements:
    get:
      operationId: listClaimSettlements
      tags:
        - Direct Claims
      summary: List settlements.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Settlements of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: proposeClaimSettlement
      tags:
        - Direct Claims
      summary: Propose a settlement.
      description: >
        A final coverage decision is required and a DENIED position blocks a
        settlement (400). `amount` must be greater than zero and `structure` is
        LUMP_SUM, STRUCTURED, ANNUITY, or MATRIX. The settlement number is
        generated as SET-{year}-{7 digits} and the status starts at PROPOSED.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementRequest'
      responses:
        '201':
          description: Settlement proposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/settlements/{settlementId}/approve:
    post:
      operationId: approveClaimSettlement
      tags:
        - Direct Claims
      summary: Authorize a proposed settlement.
      description: >
        Only a PROPOSED settlement can be authorized. `approvalAuthority` and
        `authorizedBy` are required and `expectedVersion` must match. DIR-08
        caps the authorized amount at the claim settlement authority minus
        amounts already committed by other authorized or executed settlements;
        an excess is 400, a stale version is 409.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementApprovalRequest'
      responses:
        '200':
          description: Settlement authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/settlements/{settlementId}/execute:
    post:
      operationId: executeClaimSettlement
      tags:
        - Direct Claims
      summary: Execute an authorized settlement.
      description: >
        Only an AUTHORIZED settlement can be executed. `releaseDocumentId` is
        required and payment instructions must be present (from the proposal or
        this command). `expectedVersion` must match; a stale value is 409.
      parameters:
