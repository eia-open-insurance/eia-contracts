openapi: 3.1.0
info:
  title: EIA Direct Claims API
  version: 1.9.0
  summary: Direct-book claim administration and the Direct Claims expert API.
  description: >
    This document describes the implemented public Direct Claims domain API and
    the internal Direct Claims expert API. The authoritative requirement is
    SPEC 11.4 and SPEC 12.

    Direct Claims is fixed to the DIRECT book. The public API and the expert
    read/write routes treat a missing or different X-EIA-Book value as a 404,
    never a 403, so the response cannot confirm existence in the other book
    (SPEC 3.6.2, WALL-06).

    Round 5 adds the second slice: injuries, exposures, append-only reserve
    history, coverage decisions, litigation, settlements, recoveries, liens,
    and claim closure. The public status transition carries `status` only; the
    domain reads the current version and forwards it. The internal transition
    carries an optional `expectedVersion`. Only the expert mutates a child
    record's version; the public PATCH commands carry `expectedVersion` and the
    domain requires it for every child update.

    The public close transaction has no body requirement; an optional
    `expectedVersion` may be supplied. The expert close applies the closure
    preconditions (no unresolved lien, no open reserve, and a legal CLOSED
    transition).

    The task and note routes complete the Direct Claims second slice. Tasks are
    diary items with a task version used by PATCH for optimistic concurrency;
    notes are append-only and have no update or delete route. Both POSTs accept
    an optional `Idempotency-Key` (1-64 characters): a retry with the same key
    and an identical canonical body replays the original 201 task or note with
    `Idempotent-Replay: true` and writes no second row or event, while reusing
    the key with a different body is 409 `EIA-DIR-4091`
    (`IDEMPOTENCY_KEY_REUSED`). Clients SHOULD send a UUID key per create. The
    header is optional for backward compatibility; see MISMATCHES.md M-07 for
    the reservation race and the `Idempotent-Replay` spelling difference.

    Assignment (`PATCH /api/v1/claims/{claimId}/assignment`) replaces the
    claim's current ownership. `assignedAdjuster` is required and trimmed,
    `assignedTeam` is optional, and `expectedVersion` is the claim version the
    caller observed: a stale value is 409 and never overwrites a concurrent
    change. The expert fixes `assignedAt` at the change instant, records the
    optional `X-EIA-Actor` identity as `assignedBy` and in the audit trail, and
    defaults the actor to the assigned adjuster when the header is absent.
    Repeating the current assignment at the current version is a no-op (no
    version bump, no audit entry, no event). A real change bumps the claim
    version and emits `direct.claim.assigned` in the same transaction. The
    `Claim` projection exposes `assignedAdjuster`, `assignedTeam`, and
    `assignedAt` as nullable fields; a claim that has never been assigned
    returns null for all three.

    Allocations split a claim across a policy year and layer. GET returns the
    claim's allocations oldest first plus `totalPct` and `totalAmount`; POST
    appends one split. `policyId` must be the claim's own policy and a mismatch
    is 400 `POLICY_MISMATCH`; `policyYear` is 1900-2200, `layer` is trimmed to
    at most 32 characters, `allocationPct` is a fraction greater than 0 and at
    most 1, and `allocatedAmount` is zero or greater. A COMPLETE policy
    mass-tort profile with both coverage-block dates bounds `policyYear` to the
    inclusive start/end years; a year outside the block is 400
    `MASS_TORT_YEAR_OUTSIDE_BLOCK`. A DRAFT profile, a policy without a profile,
    and an unavailable Policy profile all allow the allocation. The percentages
    already recorded for the claim plus the new one may not exceed 1; an excess
    is 409 `ALLOCATION_EXCEEDS_100` and nothing is written. A create bumps the
    claim version and emits `direct.claim.allocation-created` in the same
    transaction. A missing or non-DIRECT book is hidden as 404 (SPEC 3.6.2,
    WALL-06).

    Allocation erosion records the policy-limit posting outcome. An allocation
    may link the policy limit it erodes through the optional `limitId` and
    carries `erosionStatus` (`NOT_POSTED` until a posting is recorded, then
    `POSTED` or `FAILED`), the optional `erosionMessage`, and
    `erosionPostedAt`, which is stamped only for `POSTED`. A create that
    supplies `limitId` attempts the policy posting and returns the resulting
    `POSTED` or `FAILED` state; an allocation without a limit stays
    `NOT_POSTED`. The public erosion retry is
    `POST /api/v1/claims/{claimId}/allocations/{allocationId}/erosion` with no
    request body: it loads the allocation, requires its stored `limitId`,
    reposts the limit to the Policy domain, and records the resulting `POSTED`
    or `FAILED` state. A Policy rejection or an unavailable Policy service is
    recorded as `FAILED` and still returns 200. An allocation without a stored
    limit is 400, an unknown or foreign allocation is 404, and a retry that
    would change an already-`POSTED` allocation is 409 `CONFLICT`. A missing or
    non-DIRECT book is hidden as 404 (SPEC 3.6.2, WALL-06).

    The claim list accepts the optional `status` and `claimantPartyId` filters
    on both the public and expert surfaces. The filters are independent:
    supplying either narrows the list, supplying both combines them as an AND,
    and omitting both returns every claim for the tenant. `claimantPartyId` is
    matched exactly against the claim's stored claimant party UUID; an unknown
    party returns an empty array rather than a 404. The public list requires
    `X-EIA-Tenant` and `X-EIA-Book: DIRECT`, hides a missing or different book
    as 404, and returns the bare `Claim` array (not the search envelope).
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://direct-claims-domain:8088
    description: Direct Claims domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Direct Claims
    description: Public domain API used by the Direct Claims web remote.
  - name: Direct Claims internal
    description: Internal expert API. Not exposed through the gateway; called only by the Direct Claims domain service.
paths:
  /api/v1/claims:
    get:
      operationId: listClaims
      tags:
        - Direct Claims
      summary: List direct claims for the caller's tenant and book.
      description: >
        Returns a bare JSON array of the caller's DIRECT claims, newest first.
        `status` and `claimantPartyId` are optional and independent filters:
        supplying either narrows the list, supplying both applies an AND, and
        omitting both returns every claim for the tenant. `claimantPartyId` is
        matched exactly against the claim's stored claimant party UUID, so an
        unknown party returns an empty array rather than a 404.

        `X-EIA-Tenant` is required and `X-EIA-Book` is required and must be
        DIRECT; a missing or different book is hidden as 404
        `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2, WALL-06). This operation returns
        the bare `Claim` array; free-text search is served by
        `GET /api/v1/claims/search`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/DirectClaimStatusFilter'
        - name: claimantPartyId
          in: query
          required: false
          description: >
            Restrict the list to claims whose claimant is this party. The value
            is matched exactly against the stored claimant party UUID; a
            malformed UUID is a 400, and a well-formed UUID that matches no
            claim returns an empty array. Combine with `status` to narrow both
            dimensions.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claims of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaim
      tags:
        - Direct Claims
      summary: Register an FNOL claim.
      description: >
        The claim is created in REGISTERED (or DRAFT when the internal API asks
        for it). The claim number is generated by the expert as
        CLM-{report year}-{7 digits}. reserveAmount defaults to zero and
        reserveCurrency defaults to USD.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Claim registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/search:
    get:
      operationId: searchClaims
      tags:
        - Direct Claims
      summary: Search direct claims for the caller's tenant and DIRECT book.
      description: >
        Global-search projection used by the shell and by the claim pickers.
        Matching is a case-insensitive contains over `claimNumber`, `claimType`,
        `causeCode`, and `policyId`; an absent or blank `q` returns the most
        recently updated claims. The response is the shared `SearchResponse`
        envelope. `X-EIA-Book` is required and must be DIRECT; a missing or
        different book is hidden as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2,
        WALL-06). A missing tenant or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: DIRECT_CLAIM
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching direct claims, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}:
    get:
      operationId: getClaim
      tags:
        - Direct Claims
      summary: Get a direct claim.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/assignment:
    patch:
      operationId: assignClaim
      tags:
        - Direct Claims
      summary: Assign or reassign a direct claim.
      description: >
        Replaces the claim's current adjuster and team. `assignedAdjuster` is
        required (1-128 characters after trimming) and `assignedTeam` is
        optional (at most 64 characters). `expectedVersion` is the claim version
        the caller observed and is required; a stale value is 409 CONFLICT and
        nothing is written. Repeating the current assignment at the current
        version is a no-op that returns the current claim without a version
        bump, audit entry, or event. A real change fixes `assignedAt`, bumps the
        claim version, records the optional `X-EIA-Actor` identity as
        `assignedBy` (defaulting to the assigned adjuster), appends the
        assignment audit entry, and emits `direct.claim.assigned` in the same
        transaction. A missing or non-DIRECT book is hidden as 404 (SPEC 3.6.2,
        WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/ActorHeader'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignClaimRequest'
      responses:
        '200':
          description: Claim after the assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/status:
    patch:
      operationId: changeClaimStatus
      tags:
        - Direct Claims
      summary: Advance a direct claim through its lifecycle.
      description: >
        Applies one transition from SPEC 11.4.6. The domain service reads the
        current version and forwards it to the expert; the caller cannot supply
        an expected version on the public route. Moving to OPEN requires a
        final coverage decision that is not DENIED; moving to CLOSED requires
        no unresolved lien and no open reserve.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeClaimStatusRequest'
      responses:
        '200':
          description: Claim after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/close:
    post:
      operationId: closeClaim
      tags:
        - Direct Claims
      summary: Close a direct claim.
      description: >
        Closure is a transaction, not a status write. The expert rejects it
        while a lien is unresolved, while the current reserve is positive, or
        when the current status cannot transition to CLOSED. The optional body
        carries `expectedVersion`; a stale value is 409 CONFLICT.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseClaimRequest'
      responses:
        '200':
          description: Claim closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/injuries:
    get:
      operationId: listClaimInjuries
      tags:
        - Direct Claims
      summary: List injury allegations.
      description: Returns a bare array ordered by creation time.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Injuries of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimInjury
      tags:
        - Direct Claims
      summary: Record an injury.
      description: >
        `claimantPartyId`, `injuryType`, and `severity` are required. Diagnosis
        codes are ICD-10-style strings (`[A-Z0-9.-]{1,16}`, at most 20). The
        expert normalizes the enums and returns the new row with `version: 1`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryRequest'
      responses:
        '201':
          description: Injury recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/injuries/{injuryId}:
    patch:
      operationId: updateClaimInjury
      tags:
        - Direct Claims
      summary: Update an injury.
      description: >
        `expectedVersion` is required. A stale version is 409 CONFLICT at the
        public surface; an unknown injury is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: injuryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjuryRequest'
      responses:
        '200':
          description: Injury after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Injury'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/exposures:
    get:
      operationId: listClaimExposures
      tags:
        - Direct Claims
      summary: List exposure allegations.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exposures of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimExposure
      tags:
        - Direct Claims
      summary: Record an exposure.
      description: >
        `claimantPartyId`, `exposureType`, `jurisdiction`, and `exposureFrom`
        are required. Exposure dates may not be after the claim report date and
        `exposureTo` may not precede `exposureFrom`; a violation is 400.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
      responses:
        '201':
          description: Exposure recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/exposures/{exposureId}:
    patch:
      operationId: updateClaimExposure
      tags:
        - Direct Claims
      summary: Update an exposure.
      description: >
        `expectedVersion` is required. When `exposureFrom` or `exposureTo` is
        supplied, the domain re-reads the claim and validates the dates against
        its report date before forwarding.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: exposureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
      responses:
        '200':
          description: Exposure after the update.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exposure'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/reserves:
    get:
      operationId: getClaimReserves
      tags:
        - Direct Claims
      summary: Get the reserve position and history.
      description: >
        `components` carries one current balance per reserve component;
        `totalCurrentAmount` is their sum and equals the claim's derived current
        reserve. `history` is the full append-only history with `current`
        marking the live row per component.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserve summary and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: changeClaimReserve
      tags:
        - Direct Claims
      summary: Establish or change one reserve component.
      description: >
        The reserve history is append-only. `component`, `amount`,
        `reasonCode`, and `expectedVersion` are required; `amount` is zero or
        greater. The new row supersedes the current row for the same component
        and increments its version. A stale `expectedVersion` is 409 at the
        public surface.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveChangeRequest'
      responses:
        '201':
          description: Reserve movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveHistoryEntry'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/coverage:
    get:
      operationId: getClaimCoverage
      tags:
        - Direct Claims
      summary: Get the final coverage decision.
      description: >
        Returns 404 until a decision is recorded, so the workbench can show an
        empty tab. Only one row per claim is FINAL; recording a new decision
        supersedes the previous one.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Final coverage decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDecision'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: decideClaimCoverage
      tags:
        - Direct Claims
      summary: Record a final coverage decision.
      description: >
        `position` is COVERED, DENIED, or DEFENSE_ONLY; `basis`, `decisionDate`,
        and `reviewerPartyId` are required. `allocationPct` is a fraction
        between 0 and 1 and `allocationMethod` is one of the SPEC 11.4
        methods. The previous FINAL row is superseded in the same transaction.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverageDecisionRequest'
      responses:
        '201':
          description: Coverage decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageDecision'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/allocations:
    get:
      operationId: listClaimAllocations
      tags:
        - Direct Claims
      summary: List a claim's policy-year allocations.
      description: >
        Returns the claim's allocations oldest first, with `totalPct` and
        `totalAmount` summing the rows. The tenant is taken from
        `X-EIA-Tenant`; `X-EIA-Book` is required and must be DIRECT. A missing
        or different book is hidden as 404 (SPEC 3.6.2, WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allocation summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaimAllocation
      tags:
        - Direct Claims
      summary: Allocate part of a claim to a policy year and layer.
      description: >
        Appends one allocation. `policyId` must be the claim's own policy
        (400 `POLICY_MISMATCH`); `policyYear` must be 1900-2200; `layer` is
        trimmed and limited to 32 characters; `allocationPct` must be greater
        than 0 and at most 1; and `allocatedAmount` must be zero or greater.
        When the policy's mass-tort profile is COMPLETE and carries both
        coverage-block dates, `policyYear` must fall within the inclusive
        start/end years of the block (the start year through the end year); a
        year outside the block is 400 `MASS_TORT_YEAR_OUTSIDE_BLOCK` and
        writes nothing. A DRAFT profile, a policy without a profile, and a
        profile the Policy service cannot answer for all allow the allocation:
        the profile read is not an availability dependency (MISMATCHES.md M-31,
        M-32). The allocation percentages already recorded for the claim plus
        the new one may not exceed 1; an excess is 409 `ALLOCATION_EXCEEDS_100`
        and writes nothing. The create bumps the claim version and emits
        `direct.claim.allocation-created` in the same transaction. A missing or
        non-DIRECT book is hidden as 404 (SPEC 3.6.2, WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimAllocationRequest'
      responses:
        '201':
          description: Allocation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        '400':
          description: >
            400. A malformed or out-of-range body is a problem+json
            `VALIDATION_ERROR`. A `policyId` that is not the claim's own policy
            is `POLICY_MISMATCH`; retrying with the claim's policy succeeds. A
            `policyYear` outside the coverage block of a COMPLETE Policy
            mass-tort profile is `MASS_TORT_YEAR_OUTSIDE_BLOCK`; retrying with
            a year inside the block start/end years succeeds. A DRAFT profile,
            a policy without a profile, and an unavailable Policy profile do
            not restrict the year.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The allocation percentages already recorded for the claim plus
            the requested `allocationPct` would exceed 1. The code is
            `ALLOCATION_EXCEEDS_100`; nothing is written. Reduce the percentage
            or use a different policy year or layer and retry.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/allocations/{allocationId}/erosion:
    post:
      operationId: retryClaimAllocationErosion
      tags:
        - Direct Claims
      summary: Retry the policy-erosion posting of an allocation.
      description: >
        Retries the policy-erosion posting for one allocation. The command has
        no request body: it loads the tenant-scoped allocation, requires its
        stored `limitId`, posts the limit to the Policy domain, and records the
        resulting `POSTED` or `FAILED` state on the allocation. A Policy
        rejection or an unavailable Policy service is recorded as `FAILED` and
        returned with 200, not as a 5xx. An allocation without a stored
        `limitId` is 400 `VALIDATION_ERROR`. The state is terminal once
        `POSTED`: a retry that computes the same `POSTED` state is an idempotent
        200 no-op, while a retry that would record a different state is 409
        `CONFLICT`. The route is scoped to the claim and the allocation within
        the caller's tenant; a missing or non-DIRECT book is hidden as 404
        (SPEC 3.6.2, WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: allocationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retry attempted; the allocation is returned with its erosion state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allocation'
        '400':
          description: >
            400. The allocation has no stored `limitId` to repost, or the path
            UUID, tenant, or book header is malformed. The code is
            `VALIDATION_ERROR`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The allocation is already `POSTED` and the retry would record a
            different outcome. The code is `CONFLICT`; the posted state is
            terminal. A retry that computes the same `POSTED` state is a 200
            no-op, not a conflict.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
