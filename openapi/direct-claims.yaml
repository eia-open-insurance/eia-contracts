        must be 1-64 printable ASCII characters without spaces; a longer or
        non-printable or space-bearing value is 400 `VALIDATION_ERROR`, and a blank value is
        treated as absent. The key is scoped to the tenant plus the note-create
        command. A retry with the same key and an identical canonical body
        returns the original 201 note with `Idempotent-Replay: true` and writes
        no second note or event; a fresh append with the key returns 201 with
        `Idempotent-Replay: false`. Reusing the key with a different body is 409
        `EIA-DIR-4091` with category `IDEMPOTENCY_KEY_REUSED`; use a new key for
        a new command. A concurrent change to the parent claim is also 409. See
