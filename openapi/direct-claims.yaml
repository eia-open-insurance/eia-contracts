    CreateClaimAllocationRequest:
      type: object
      description: >
        Command to allocate part of a claim to a policy year and layer.
        `policyId` must be the claim's own policy; `allocationPct` is a fraction
        greater than 0 and at most 1; `allocatedAmount` is zero or greater; and
        the percentages already allocated to the claim plus the new one may not
        exceed 1. When the policy's mass-tort profile is COMPLETE with both
        coverage-block dates, `policyYear` must fall within the block's
        inclusive start/end years. `limitId` optionally names the policy limit
        the allocation erodes.
      required:
        - policyId
        - policyYear
        - layer
        - allocationPct
        - allocatedAmount
      properties:
        policyId:
          type: string
          format: uuid
        policyYear:
          type: integer
          minimum: 1900
          maximum: 2200
          description: >
            Policy year of the allocation. When the policy's mass-tort profile
            is COMPLETE with a coverage block, it must fall within the block's
            inclusive start/end years or the create is 400
            `MASS_TORT_YEAR_OUTSIDE_BLOCK`. A DRAFT profile, an absent profile,
            and an unavailable Policy profile do not restrict the year.
        layer:
          type: string
          maxLength: 32
        allocationPct:
          type: number
          description: Fraction of the claim, greater than 0 and at most 1.
          exclusiveMinimum: 0
          maximum: 1
        allocatedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitId:
          type: string
          format: uuid
          description: >
            Optional policy limit this allocation erodes. When supplied, the
            allocation is linked to the limit and the create attempts the
            policy posting; the returned allocation carries the resulting
            `POSTED` or `FAILED` state. Omit it for an allocation that is not
            linked to a limit, which stays `NOT_POSTED`.
