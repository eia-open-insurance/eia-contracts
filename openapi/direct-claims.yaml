    post:
      operationId: createClaimTask
      tags:
        - Direct Claims
      summary: Open a diary task.
      description: >
        `title`, `dueDate`, and `priority` are required; `priority` is one of
        LOW, NORMAL, HIGH, or URGENT. The expert assigns the task number
        `TSK-{year}-{7 digits}` and the initial OPEN status.

        `Idempotency-Key` is optional but recommended. The value is trimmed and
        must be 1-64 printable ASCII characters without spaces; a longer or
        non-printable or space-bearing value is 400 `VALIDATION_ERROR`, and a blank value is
        treated as absent. The key is scoped to the tenant plus the task-create
        command. A retry with the same key and an identical canonical body
        returns the original 201 task with `Idempotent-Replay: true` and writes
        no second task or event; a fresh create with the key returns 201 with
        `Idempotent-Replay: false`. Reusing the key with a different body is 409
        `EIA-DIR-4091` with category `IDEMPOTENCY_KEY_REUSED`; use a new key for
        a new command. A concurrent change to the parent claim is also 409. See
        MISMATCHES.md M-07 for the concurrent reservation race.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/ClaimIdempotencyKey'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task opened, or the stored task replayed.
          headers:
            Idempotent-Replay:
              $ref: './components.yaml#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
