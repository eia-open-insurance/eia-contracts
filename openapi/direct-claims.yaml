    Allocation:
      type: object
      description: >
        One policy-year and layer split of a claim. `allocationPct` is a
        fraction in (0, 1] serialized as a decimal string and
        `allocatedAmount` is a booking amount in the claim currency; neither is
        capped by the current reserve. `limitId` optionally links the policy
        limit the allocation erodes. `erosionStatus` is the policy-erosion
        posting state: `NOT_POSTED` until a posting is recorded, then `POSTED`
        or `FAILED`. A create that supplies `limitId` attempts the posting and
        returns the resulting state. A `POSTED` posting stamps
        `erosionPostedAt`; an unposted or `FAILED` allocation leaves it null,
        and `erosionMessage` carries the Policy failure reason.
        The public projection omits the tenant implied by the request context.
      required:
        - allocationId
        - claimId
        - policyId
        - policyYear
        - layer
        - allocationPct
        - allocatedAmount
        - erosionStatus
        - createdAt
      properties:
        allocationId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        limitId:
          type: [string, 'null']
          format: uuid
          description: >
            Policy limit this allocation erodes, or null when the allocation is
            not linked to a limit.
        policyYear:
          type: integer
          minimum: 1900
          maximum: 2200
        layer:
          type: string
          maxLength: 32
        allocationPct:
          $ref: './components.yaml#/components/schemas/Percent'
        allocatedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        erosionStatus:
          $ref: '#/components/schemas/AllocationErosionStatus'
        erosionMessage:
          type: [string, 'null']
          maxLength: 4000
          description: >
            Policy failure reason recorded when the posting is `FAILED`; null
            after a successful `POSTED` posting and null while `NOT_POSTED`.
        erosionPostedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Instant the policy posting succeeded; null while `NOT_POSTED` or
            after a `FAILED` posting.
        createdAt:
          type: string
          format: date-time
    AllocationErosionStatus:
      type: string
      description: >
        Policy-erosion posting state. `NOT_POSTED` is the initial state;
        `POSTED` and `FAILED` are the outcomes recorded by the create or the
        erosion retry.
      enum:
        - NOT_POSTED
        - POSTED
        - FAILED
    AllocationSummary:
      type: object
      description: >
        A claim's allocations oldest first plus the sums of the percentages and
        allocated amounts across those rows.
      required:
