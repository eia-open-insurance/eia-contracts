        - Direct Claims
      summary: Append a claim note.
      description: >
        `noteType` is one of DIARY, COVERAGE, RESERVE, LITIGATION, SETTLEMENT,
        or GENERAL; `body` and `author` are required. The expert assigns the
        note number `NTE-{year}-{7 digits}`. There is no update or delete route.

