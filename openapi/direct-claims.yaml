  notes: >
    The public and expert claim lists accept the optional `status` and
    `claimantPartyId` filters; the expert applies both to the same
    tenant-scoped, newest-first query, and the domain forwards them unchanged.
    The internal transition route takes the tenant from X-EIA-Tenant while the
    other internal GET routes take ?tenantId=; create and close take
    X-EIA-Tenant. Every internal route requires X-EIA-Book: DIRECT and hides a
    missing or different book as 404. The public transition has no
    expectedVersion; every public child PATCH requires it. Task and note routes
    are implemented on both surfaces; the task PATCH is version-checked. The
    task and note POSTs accept an optional `Idempotency-Key`: a same-key retry
    of an identical body replays the stored 201 response with
    `Idempotent-Replay: true`, and a different body under the same key is 409
    `EIA-DIR-4091` category `IDEMPOTENCY_KEY_REUSED`. A blank key is treated as
    absent, and Direct Claims restricts the key to printable ASCII without
    spaces. The Direct Claims expert reserves the key with a find-then-insert
    rather than an atomic upsert, so two truly concurrent first attempts can
    race; see MISMATCHES.md M-07. Assignment is implemented on the public route
    and the internal expert alias. The expert accepts `X-EIA-Actor` and the
    canonical `X-EIA-User` alias (the latter wins when both are present); the
    contract documents the shared `X-EIA-Actor` header. `assignedBy` is persisted
    and audited but is not part of the public `Claim` projection. The assignment
    event name has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22); the
    implementation gaps are recorded in M-25. Allocation is implemented on the
    public route and on the expert's public and `/internal/v1` aliases; the
    domain calls the internal alias and remaps the expert's `id`/`tenantId`
    projection to the public `allocationId` without a tenant. The expert owns
    the policy match and the percentage total, and the domain validates the
    caller-fixable bounds first. The expert codes are 400 `POLICY_MISMATCH` and
    409 `ALLOCATION_EXCEEDS_100`; the domain currently remaps them to 400
    `VALIDATION_ERROR` and 409 `CONFLICT` while preserving the detail
    (MISMATCHES.md M-31). The domain's own coverage-block guard is 400
    `MASS_TORT_YEAR_OUTSIDE_BLOCK`, preserved end to end. The allocation event
    name has no SPEC 11.4.9 equivalent and the SPEC `direct.claim.allocated`
    name remains planned
    (MISMATCHES.md M-22). Allocation erosion is implemented on the expert as
    `PATCH /internal/v1/claims/{claimId}/allocations/{allocationId}/erosion`
    with `{status, message?}`; the canonical public command is a bodyless
    `POST` orchestration retry on the same sub-resource. The retry loads the
    allocation, requires its stored `limitId`, posts the limit to the Policy
    domain, and records the computed `POSTED` or `FAILED` outcome through the
    expert `PATCH`. The public domain currently catches the expert's 409
    `CONFLICT` for a terminal `POSTED` allocation and returns the pre-update
    allocation with 200, and it also returns the pre-update allocation when the
    expert record call itself fails; MISMATCHES.md M-36 records both
    differences.
x-compatibility:
  contractVersion: 1.9.0
  previousContractVersion: 1.8.0
  breaking: []
  compatible:
    - Adds the optional claimantPartyId UUID query parameter to GET /api/v1/claims and GET /internal/v1/claims, alongside the existing status filter.
    - Documents the exact-match claimant filter, the tenant and DIRECT book scope, the bare Claim array response, and the newest-first order.
    - Adds GET/POST /api/v1/claims/{claimId}/allocations.
    - Adds the AllocationSummary, Allocation, and CreateClaimAllocationRequest schemas.
    - Documents 200/201/400/404/409, the 400 POLICY_MISMATCH policy guard, and the 409 ALLOCATION_EXCEEDS_100 percentage guard.
    - Documents the direct.claim.allocation-created event published in the same transaction as an allocation create.
    - Adds the optional limitId field to CreateClaimAllocationRequest and the nullable limitId, erosionMessage, and erosionPostedAt fields plus the required erosionStatus field to Allocation.
    - Adds the AllocationErosionStatus enum (NOT_POSTED, POSTED, FAILED).
    - Adds the bodyless POST /api/v1/claims/{claimId}/allocations/{allocationId}/erosion orchestration retry with the 200/400/404/409 responses and the 409 CONFLICT terminal guard.
    - Adds PATCH /api/v1/claims/{claimId}/assignment and the /internal/v1/claims/{claimId}/assignment expert route.
    - Adds the AssignClaimRequest schema (assignedAdjuster required, max 128; assignedTeam optional, max 64; expectedVersion required, integer zero or greater).
    - Adds the optional X-EIA-Actor request header to the assignment operations.
    - Adds the nullable assignedAdjuster, assignedTeam, and assignedAt fields to the Claim projection.
    - Documents 200/400/404/409 problem responses, the stale-version 409, and the same-assignment no-op.
    - Documents the direct.claim.assigned event published in the same transaction as a real assignment change.
    - Adds the optional ClaimIdempotencyKey parameter (Idempotency-Key, 1-64 characters) to POST /api/v1/claims/{claimId}/tasks, POST /api/v1/claims/{claimId}/notes, and their internal expert equivalents.
    - Documents the 201 Idempotent-Replay header, true for a stored-response replay and false for a fresh create.
    - Documents 400 VALIDATION_ERROR for an invalid Idempotency-Key and 409 EIA-DIR-4091 IDEMPOTENCY_KEY_REUSED for the same key with a different body.
    - Adds GET/POST /api/v1/claims/{claimId}/tasks, PATCH /api/v1/claims/{claimId}/tasks/{taskId}, and GET/POST /api/v1/claims/{claimId}/notes (and the internal expert equivalents).
    - Adds the Task, TaskCreate, TaskStatusChange, Note, and NoteCreate schemas.
    - Adds GET /api/v1/claims/search returning the shared SearchResponse envelope.
    - Adds the injury, exposure, reserve, coverage, litigation, settlement, recovery, lien, and close routes.
    - Adds claimType, settlementAuthorityAmount, settlementAuthorityCurrency, litigationFlag, and currentReserveAmount to the claim projection.
    - Corrects the claim money fields to decimal strings; the services already serialize them as strings.
    - Documents the retention of the domain's 400 MASS_TORT_YEAR_OUTSIDE_BLOCK coverage-block guard on the allocation create, alongside the remapped expert codes.
  note: >
    Idempotency on the task and note POSTs is additive over 1.3.0: the header is
    optional, no existing path, request body field, or response body field
    changed, and a caller that omits the key keeps the previous behaviour. The
    header spelling `Idempotent-Replay` and the Direct Claims reservation race
    are recorded in MISMATCHES.md M-07.

    Assignment is additive over 1.4.0: the new path and fields are optional in
    the sense that a claim that is never assigned keeps null assignment fields
    and no emitted assignment event, and no existing request or response field
    changed. The optional actor header is ignored by clients that do not send
    it. The X-EIA-User alias accepted by the Direct Claims expert and the
    negative-version handling difference are recorded in MISMATCHES.md M-25.

    Allocation is additive over 1.5.0: the two public operations and the three
    schemas are new, no existing path or request or response field changed, and
    a claim without allocations returns an empty `items` array with zero totals
    from the new read. The allocation-created event name is new and has no SPEC
    11.4.9 equivalent; the SPEC `direct.claim.allocated` channel remains
    planned. The domain's public error-code remap is recorded in MISMATCHES.md
    M-31.

    Claimant filtering is additive over 1.6.0: both list parameters are
    optional, no existing path, request body field, response body field, or
    event changed, and a caller that omits the filter keeps the unfiltered
    tenant list. The filter is an implementation extension already present in
    both claim controllers; it does not resolve the party, so an unknown UUID
    returns an empty array (MISMATCHES.md M-33).

    Allocation erosion is additive over 1.7.0: `limitId`, `erosionMessage`, and
    `erosionPostedAt` are nullable and optional, `erosionStatus` is always
    present and starts at `NOT_POSTED`, the create `limitId` is optional, and
    the erosion retry is a new bodyless operation. A client that never links a
    limit or retries an erosion sees the previous allocation shape with a null
    `limitId` and `NOT_POSTED`; a create that supplies `limitId` may return
    `POSTED` or `FAILED` because it attempts the policy posting. The public
    retry reposts the stored limit to Policy and records the computed outcome;
    a missing stored limit is 400 `VALIDATION_ERROR` and a retry that would
    change an already-`POSTED` allocation is 409 `CONFLICT`. The public domain
    currently swallows the expert 409 and the record-write failure and returns
    the pre-update allocation with 200; MISMATCHES.md M-36 records that
    divergence.

    The mass-tort coverage-block guard is additive over 1.8.0: it adds one
    documented 400 code to the existing allocation create and changes no path,
    request body field, response body field, or event. A COMPLETE profile with
    both block dates bounds `policyYear` to the inclusive start/end years; a
    DRAFT profile, an absent profile, and an unreadable or unavailable Policy
    profile still allow the allocation, so the profile read is never an
    availability dependency. MISMATCHES.md M-31 records the stable code and M-32
    the profile it consumes.
