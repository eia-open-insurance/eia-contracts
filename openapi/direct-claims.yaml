openapi: 3.1.0
info:
  title: EIA Direct Claims API
  version: 1.0.0
  summary: Direct-book claim administration and the Direct Claims expert API.
  description: >
    This document describes the implemented public Direct Claims domain API and
    the internal Direct Claims expert API. The authoritative requirement is
    SPEC 11.4 and SPEC 12; the implemented surface is the first vertical slice.

    Direct Claims is fixed to the DIRECT book. The public API and the expert
    read/write routes treat a missing or different X-EIA-Book value as a 404,
    never a 403, so the response cannot confirm existence in the other book
    (SPEC 3.6.2, WALL-06).

    The status transition on the public API carries `status` only; the domain
    reads the current version and forwards it. The internal transition carries
    `expectedVersion`. Neither route uses ETag/If-Match yet; see MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://direct-claims-domain:8088
    description: Direct Claims domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Direct Claims
    description: Public domain API used by the Direct Claims web remote.
  - name: Direct Claims internal
    description: Internal expert API. Not exposed through the gateway; called only by the Direct Claims domain service.
paths:
  /api/v1/claims:
    get:
      operationId: listClaims
      tags:
        - Direct Claims
      summary: List direct claims for the caller's tenant and book.
      description: Returns a bare JSON array, optionally filtered by status.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/DirectClaimStatusFilter'
      responses:
        '200':
          description: Claims of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createClaim
      tags:
        - Direct Claims
      summary: Register an FNOL claim.
      description: >
        The claim is created in REGISTERED (or DRAFT when the internal API asks
        for it). The claim number is generated by the expert as
        CLM-{report year}-{7 digits}. reserveAmount defaults to zero and
        reserveCurrency defaults to USD.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequest'
      responses:
        '201':
          description: Claim registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}:
    get:
      operationId: getClaim
      tags:
        - Direct Claims
      summary: Get a direct claim.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/claims/{claimId}/status:
    patch:
      operationId: changeClaimStatus
      tags:
        - Direct Claims
      summary: Advance a direct claim through its lifecycle.
      description: >
        Applies one transition from SPEC 11.4.6. The domain service reads the
        current version and forwards it to the expert; the caller cannot supply
        an expected version on the public route.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeClaimStatusRequest'
      responses:
        '200':
          description: Claim after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/claims:
    get:
      operationId: expertListClaims
      tags:
        - Direct Claims internal
      summary: List direct claims for a tenant and book (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/DirectClaimStatusFilter'
      responses:
        '200':
          description: Claims of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateClaim
      tags:
        - Direct Claims internal
      summary: Register a claim (expert).
      description: >
        The expert accepts an optional `status`; the only initial values are
        DRAFT and REGISTERED, with REGISTERED as the default.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClaimRequestInternal'
      responses:
        '201':
          description: Claim registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/claims/{claimId}:
    get:
      operationId: expertGetClaim
      tags:
        - Direct Claims internal
      summary: Get a direct claim (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Claim detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/claims/{claimId}/status:
    patch:
      operationId: expertChangeClaimStatus
      tags:
        - Direct Claims internal
      summary: Advance a direct claim through its lifecycle (expert).
      description: >
        The tenant is taken from the X-EIA-Tenant header on this route, not from
        the query string, because the domain client sends it as a header.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: claimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeClaimStatusRequestInternal'
      responses:
        '200':
          description: Claim after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Claim:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Direct claim projection. The implemented slice carries causeCode and a
        single reserve figure; the SPEC 11.4.4 claim detail (claimType,
        tortCode, injury, exposure, reserves[], financials, _links) is planned.
        reserveAmount is currently serialized by the expert as a JSON number.
      required:
        - id
        - tenantId
        - businessBook
        - claimNumber
        - policyId
        - claimantPartyId
        - status
        - lossDate
        - reportDate
        - causeCode
        - reserveAmount
        - reserveCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - DIRECT
        claimNumber:
          type: string
          examples:
            - CLM-2026-0000001
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ClaimStatus'
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
          description: On or after lossDate.
        causeCode:
          type: [string, 'null']
          maxLength: 24
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    ClaimStatus:
      type: string
      description: Direct claim lifecycle status from SPEC 11.4.6.
      enum:
        - DRAFT
        - REGISTERED
        - OPEN
        - COVERAGE_REVIEW
        - RESERVED
        - IN_LITIGATION
        - IN_SETTLEMENT
        - SETTLED
        - PAYMENT_PENDING
        - PAID
        - CLOSED
        - DENIED
        - WITHDRAWN
        - DISMISSED
        - TRANSFERRED
        - BANKRUPTCY_TRUST
        - ON_APPEAL
        - REOPENED
    CreateClaimRequest:
      type: object
      description: Public FNOL command. The tenant comes from X-EIA-Tenant.
      required:
        - policyId
        - claimantPartyId
        - lossDate
        - reportDate
      properties:
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
        causeCode:
          type: string
          maxLength: 24
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreateClaimRequestInternal:
      type: object
      description: Internal create command accepted by the Direct Claims expert.
      required:
        - tenantId
        - policyId
        - claimantPartyId
        - lossDate
        - reportDate
      properties:
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        claimantPartyId:
          type: string
          format: uuid
        lossDate:
          type: string
          format: date
        reportDate:
          type: string
          format: date
        causeCode:
          type: string
          maxLength: 24
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - DRAFT
            - REGISTERED
          description: Optional initial status. Defaults to REGISTERED.
    ChangeClaimStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
    ChangeClaimStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Direct Claims expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional. When omitted the expert compares against the current version.
x-vertical: direct-claims
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-direct-claims-domain/src/main/java/com/eia/directclaims/domain/ClaimController.java
    - repos/eia-direct-claims-domain/src/main/java/com/eia/directclaims/domain/ClaimClient.java
    - repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimController.java
    - repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ApiExceptionHandler.java
  errorEnvelope: >
    Vertical-specific ApiError {timestamp, status, code, message, path,
    details[{field, message}]}. Not the canonical Problem envelope yet.
  notes: >
    The internal transition route takes the tenant from X-EIA-Tenant while the
    other internal routes take ?tenantId=. The public transition has no
    expectedVersion.
