openapi: 3.1.0
info:
  title: EIA Retrocession API
  version: 1.1.0
  summary: Assumed-book retrocession case administration, the FS-RI hand-off, and the Retrocession expert API.
  description: >
    This document describes the implemented public Retrocession domain API and
    the internal Retrocession expert API. The authoritative requirement is SPEC
    11.10, SPEC 7.18, and SPEC 12; the implemented surface is the first vertical
    slice, extended in Round 2 with the SAP FS-RI hand-off.

    Retrocession is fixed to the ASSUMED book. A missing X-EIA-Book returns 400
    BOOK_REQUIRED; a different book is hidden as 404 BOOK_SCOPE_VIOLATION per
    SPEC 3.6.2.

    Round 2 hand-off: a public transition to `HANDOFF_PENDING` is not a local
    status write. The domain service calls the FS-RI retro hand-off endpoint
    synchronously; a 2xx acknowledgement is persisted in one optimistic write
    as `HANDED_OFF`, together with `fsriHandoffId`, `fsriStatus`, and
    `fsriHandedOffAt`, and that is the status and body the caller receives. A
    failed hand-off leaves the lifecycle status unchanged (the case remains
    retryable), records a truncated `fsriLastError`, and returns the mapped
    FS-RI error. The mapping from the upstream FS-RI status to the public
    status is documented by the document-level `x-fsri-error-mapping`.

    The public transition body carries `targetStatus` and an optional
    `fsriContractNumber`; the domain service reads the current version and
    sends it to the expert. The expert route is PUT with `{status, version}`.
    The expert also exposes the acknowledgement and failure persistence
    endpoints used by the domain; they are not reachable through the gateway.

    Error bodies are still the vertical `ApiError` shape in the implemented
    services, while these responses document the canonical Problem target; see
    MISMATCHES.md M-02 and M-17.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://retrocession-domain:8094
    description: Retrocession domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Retrocession
    description: Public domain API used by the Retrocession web remote.
  - name: Retrocession internal
    description: Internal expert API. Not exposed through the gateway; called only by the Retrocession domain service.
paths:
  /api/v1/retrocessions:
    get:
      operationId: listRetrocessions
      tags:
        - Retrocession
      summary: List retrocession cases for the caller's tenant and book.
      description: >
        Returns a bare JSON array. Cursor pagination from SPEC 7.6 is planned
        for this vertical; see MISMATCHES.md M-04.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      responses:
        '200':
          description: Retrocession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createRetrocession
      tags:
        - Retrocession
      summary: Create a retrocession case.
      description: >
        Creates a retrocession case in OPEN. The retrocession number is
        generated by the expert as RET-{9 digits}. Amounts must be zero or
        greater. A new case has no FS-RI hand-off fields yet; they are
        populated when the case is handed off.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetrocessionRequest'
      responses:
        '201':
          description: Retrocession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/retrocessions/{retrocessionId}:
    get:
      operationId: getRetrocession
      tags:
        - Retrocession
      summary: Get a retrocession case.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retrocession case detail, including the FS-RI hand-off fields when present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/retrocessions/{retrocessionId}/transition:
    post:
      operationId: transitionRetrocession
      tags:
        - Retrocession
      summary: Advance a retrocession case through its lifecycle.
      description: >
        Applies one transition from the SPEC 11.10.3 state machine. An illegal
        edge returns 400 `INVALID_STATUS_TRANSITION` (this vertical still uses
        400 rather than the canonical 409; see MISMATCHES.md M-11).

        `HANDOFF_PENDING` is special: the domain service calls FS-RI with the
        SPEC 7.23.2 envelope, an idempotency key derived from tenant +
        retrocession id + transition version, and an expected amount (ceded
        loss when positive, otherwise ceded premium). On a 2xx acknowledgement
        the case is persisted as `HANDED_OFF` with `fsriHandoffId`,
        `fsriStatus`, and `fsriHandedOffAt` in the same optimistic write, and
        that record is returned with 200. On failure the status is unchanged,
        `fsriLastError` is recorded, and the mapped error is returned.

        `fsriContractNumber` optionally names the FS-RI contract master that
        FS-RI already knows; it must match `[A-Z0-9][A-Z0-9-]{3,31}`. When it
        is omitted the retrocession number is used. A direct transition to
        `HANDED_OFF` is rejected with 400 `HANDOFF_REQUIRED`; `HANDED_OFF` is
        reached only through the hand-off acknowledgement.

        Error mapping: local validation, FS-RI 400, and FS-RI 422 are 400;
        FS-RI 409 is 409 `FSRI_CONFLICT`; FS-RI 403, 404, and other 4xx are
        502; FS-RI 5xx, 429, a timeout, or an unreachable endpoint is 503. A
        hand-off that FS-RI accepted but that could not be persisted locally is
        502 `FSRI_HANDOFF_NOT_RECORDED`. See `x-fsri-error-mapping`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRetrocessionRequest'
      responses:
        '200':
          description: >
            Retrocession case after the transition. A successful hand-off
            returns status HANDED_OFF with the FS-RI hand-off fields populated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          description: >
            400. Local validation (`VALIDATION`), an illegal edge
            (`INVALID_STATUS_TRANSITION`), a direct HANDED_OFF target
            (`HANDOFF_REQUIRED`), or an FS-RI 400/422 (`FSRI_VALIDATION` /
            `FSRI_REJECTED`).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. FS-RI rejected the hand-off as an idempotency or state
            conflict (`FSRI_CONFLICT`); `meta`/details may carry the existing
            FS-RI reference.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '502':
          description: >
            502. FS-RI returned an unusable response: 403 (`FSRI_BOOK_WALL`),
            404 (`FSRI_CONTRACT_NOT_FOUND`), another unmapped 4xx
            (`FSRI_REJECTED`), a 2xx without an FS-RI id
            (`FSRI_INVALID_RESPONSE`), or an acknowledgement that could not be
            persisted (`FSRI_HANDOFF_NOT_RECORDED`).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '503':
          description: >
            503. FS-RI is unavailable (`FSRI_UNAVAILABLE`), throttled
            (`FSRI_THROTTLED`), timed out, or the hand-off is not configured.
            The case remains retryable.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions:
    get:
      operationId: expertListRetrocessions
      tags:
        - Retrocession internal
      summary: List retrocession cases for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Retrocession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateRetrocession
      tags:
        - Retrocession internal
      summary: Create a retrocession case (expert).
      description: The expert requires businessBook to be ASSUMED.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetrocessionRequestInternal'
      responses:
        '201':
          description: Retrocession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}:
    get:
      operationId: expertGetRetrocession
      tags:
        - Retrocession internal
      summary: Get a retrocession case (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retrocession case detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}/status:
    put:
      operationId: expertUpdateRetrocessionStatus
      tags:
        - Retrocession internal
      summary: Advance a retrocession case through its lifecycle (expert).
      description: >
        Applies a plain lifecycle transition with an expected version. The
        expert rejects `HANDOFF_PENDING` and `HANDED_OFF` here with 400
        `HANDOFF_REQUIRED`; those states are written only by the hand-off
        persistence endpoints.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetrocessionStatusRequestInternal'
      responses:
        '200':
          description: Retrocession case after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}/handoff:
    post:
      operationId: expertRecordRetrocessionHandoff
      tags:
        - Retrocession internal
      summary: Persist an FS-RI acknowledgement and move the case to HANDED_OFF (expert).
      description: >
        Called by the Retrocession domain after FS-RI returns a 2xx
        acknowledgement. The expert checks the expected version and that the
        case is RULE_APPLIED or REJECTED, then writes `fsriHandoffId`,
        `fsriStatus`, `fsriHandedOffAt`, and status `HANDED_OFF` in one
        optimistic UPDATE. A concurrent writer is 409, an illegal source status
        is 400 `INVALID_STATUS_TRANSITION`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRetroHandoffRequest'
      responses:
        '200':
          description: Retrocession case persisted as HANDED_OFF with the FS-RI acknowledgement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}/handoff-failure:
    post:
      operationId: expertRecordRetrocessionHandoffFailure
      tags:
        - Retrocession internal
      summary: Record a failed FS-RI hand-off attempt without changing the status (expert).
      description: >
        Called by the Retrocession domain when the FS-RI call fails. The expert
        checks the expected version and that the case is RULE_APPLIED or
        REJECTED, then stores `fsriLastError` without changing the lifecycle
        status or version, so a retry reuses the same transition version and
        idempotency key.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordRetroHandoffFailureRequest'
      responses:
        '200':
          description: Retrocession case with the failure recorded and the status unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Retrocession:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Retrocession case projection. `cededPremium` and `cededLoss` are
        decimal strings, not Money objects, and are always paired with
        `currency`. The FS-RI hand-off fields are absent (or null) until a
        hand-off is acknowledged. The SPEC 11.10.3 model carries retro contract
        terms, rules, confirmations, recoverables, and statements; those remain
        planned.
      required:
        - id
        - tenantId
        - businessBook
        - retrocessionNumber
        - contractId
        - retroContractId
        - status
        - cededPremium
        - cededLoss
        - currency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        retrocessionNumber:
          type: string
          examples:
            - RET-000000001
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RetrocessionStatus'
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        fsriHandoffId:
          type:
            - string
            - 'null'
          maxLength: 64
          description: >
            FS-RI retro hand-off reference returned in `fsriRetroId` by the
            FS-RI acknowledgement. Write-once; absent before the hand-off.
        fsriStatus:
          type:
            - string
            - 'null'
          maxLength: 32
          description: >
            FS-RI hand-off result, for example POSTED or PARTIAL. FS-RI remains
            authoritative for the confirmed amounts.
        fsriHandedOffAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp from the FS-RI acknowledgement.
        fsriLastError:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: >
            Truncated cause of the last failed hand-off. The lifecycle status is
            unchanged while this is set, so the case remains retryable.
    RetrocessionStatus:
      type: string
      description: Retrocession case lifecycle status from SPEC 11.10.3.
      enum:
        - OPEN
        - RULE_APPLIED
        - HANDOFF_PENDING
        - HANDED_OFF
        - CONFIRMED
        - REJECTED
        - CANCELLED
    CreateRetrocessionRequest:
      type: object
      description: Public create command. The tenant and book come from the headers.
      required:
        - contractId
        - retroContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Three-letter currency code; the expert stores it uppercase.
    CreateRetrocessionRequestInternal:
      type: object
      description: Internal create command accepted by the Retrocession expert.
      required:
        - tenantId
        - businessBook
        - contractId
        - retroContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
    TransitionRetrocessionRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - targetStatus
      properties:
        targetStatus:
          $ref: '#/components/schemas/RetrocessionStatus'
        fsriContractNumber:
          type: string
          maxLength: 32
          pattern: '^[A-Z0-9][A-Z0-9-]{3,31}$'
          description: >
            Optional FS-RI contract master reference used only for the
            HANDOFF_PENDING hand-off. When omitted the retrocession number is
            used.
    UpdateRetrocessionStatusRequestInternal:
      type: object
      description: Internal plain lifecycle transition command accepted by the Retrocession expert.
      required:
        - status
        - version
      properties:
        status:
          $ref: '#/components/schemas/RetrocessionStatus'
        version:
          type: integer
          minimum: 0
          description: Expected aggregate version. A mismatch returns 409.
    RecordRetroHandoffRequest:
      type: object
      description: >
        FS-RI acknowledgement to persist. The case moves to HANDED_OFF only when
        this write succeeds.
      required:
        - expectedVersion
        - fsriHandoffId
        - fsriStatus
        - fsriHandedOffAt
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Version the domain read before calling FS-RI.
        fsriHandoffId:
          type: string
          minLength: 1
          maxLength: 64
        fsriStatus:
          type: string
          minLength: 1
          maxLength: 32
        fsriHandedOffAt:
          type: string
          format: date-time
    RecordRetroHandoffFailureRequest:
      type: object
      description: >
        Failed FS-RI attempt metadata. Persisting it must not change the
        lifecycle status; the case stays retryable.
      required:
        - expectedVersion
        - fsriLastError
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        fsriLastError:
          type: string
          minLength: 1
          maxLength: 1000
x-vertical: retrocession
x-fsri-error-mapping:
  description: >
    Mapping applied by the Retrocession domain when the FS-RI hand-off fails.
    The upstream status is translated into the public status and the code
    carried in the canonical Problem (or the vertical ApiError today).
  upstreamMappings:
    - upstream: 400
      status: 400
      code: FSRI_VALIDATION
    - upstream: 422
      status: 400
      code: FSRI_REJECTED
    - upstream: 409
      status: 409
      code: FSRI_CONFLICT
    - upstream: 403
      status: 502
      code: FSRI_BOOK_WALL
    - upstream: 404
      status: 502
      code: FSRI_CONTRACT_NOT_FOUND
    - upstream: 429
      status: 503
      code: FSRI_THROTTLED
    - upstream: 5xx
      status: 503
      code: FSRI_UNAVAILABLE
    - upstream: timeout-or-unreachable
      status: 503
      code: FSRI_UNAVAILABLE
    - upstream: 2xx-without-fsri-id
      status: 502
      code: FSRI_INVALID_RESPONSE
    - upstream: accepted-but-not-persisted
      status: 502
      code: FSRI_HANDOFF_NOT_RECORDED
  localResponses:
    - status: 400
      code: VALIDATION
      meaning: Contract number or expected amount is invalid before the call.
    - status: 400
      code: INVALID_STATUS_TRANSITION
      meaning: The target edge is not allowed from the current status.
    - status: 400
      code: HANDOFF_REQUIRED
      meaning: HANDED_OFF cannot be requested directly.
