openapi: 3.1.0
info:
  title: EIA Retrocession API
  version: 1.0.0
  summary: Assumed-book retrocession case administration and the Retrocession expert API.
  description: >
    This document describes the implemented public Retrocession domain API and
    the internal Retrocession expert API. The authoritative requirement is SPEC
    11.10, SPEC 7.18, and SPEC 12; the implemented surface is the first vertical
    slice.

    Retrocession is fixed to the ASSUMED book. A missing or different
    X-EIA-Book value currently returns 400 BOOK_REQUIRED or 400
    BOOK_SCOPE_VIOLATION. SPEC 3.6.2 requires that a book mismatch be hidden as
    404; the deviation is recorded in MISMATCHES.md.

    The public transition body carries only `targetStatus`; the domain service
    reads the current version and sends it to the expert. The expert route is
    PUT with `{status, version}`.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://retrocession-domain:8094
    description: Retrocession domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Retrocession
    description: Public domain API used by the Retrocession web remote.
  - name: Retrocession internal
    description: Internal expert API. Not exposed through the gateway; called only by the Retrocession domain service.
paths:
  /api/v1/retrocessions:
    get:
      operationId: listRetrocessions
      tags:
        - Retrocession
      summary: List retrocession cases for the caller's tenant and book.
      description: Returns a bare JSON array.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      responses:
        '200':
          description: Retrocession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createRetrocession
      tags:
        - Retrocession
      summary: Create a retrocession case.
      description: >
        Creates a retrocession case in OPEN. The retrocession number is
        generated by the expert as RET-{9 digits}. Amounts must be zero or
        greater.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetrocessionRequest'
      responses:
        '201':
          description: Retrocession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/retrocessions/{retrocessionId}:
    get:
      operationId: getRetrocession
      tags:
        - Retrocession
      summary: Get a retrocession case.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retrocession case detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/retrocessions/{retrocessionId}/transition:
    post:
      operationId: transitionRetrocession
      tags:
        - Retrocession
      summary: Advance a retrocession case through its lifecycle.
      description: >
        Applies one transition from SPEC 11.10.3. The domain service reads the
        current version; an illegal transition returns 400
        INVALID_STATUS_TRANSITION.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRetrocessionRequest'
      responses:
        '200':
          description: Retrocession case after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions:
    get:
      operationId: expertListRetrocessions
      tags:
        - Retrocession internal
      summary: List retrocession cases for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Retrocession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateRetrocession
      tags:
        - Retrocession internal
      summary: Create a retrocession case (expert).
      description: The expert requires businessBook to be ASSUMED.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRetrocessionRequestInternal'
      responses:
        '201':
          description: Retrocession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}:
    get:
      operationId: expertGetRetrocession
      tags:
        - Retrocession internal
      summary: Get a retrocession case (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retrocession case detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/retrocessions/{retrocessionId}/status:
    put:
      operationId: expertUpdateRetrocessionStatus
      tags:
        - Retrocession internal
      summary: Advance a retrocession case through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: retrocessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRetrocessionStatusRequestInternal'
      responses:
        '200':
          description: Retrocession case after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retrocession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Retrocession:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Retrocession case projection. The SPEC 11.10.3 model carries retro
        contract terms, rules, hand-offs, confirmations, recoverables, and
        statements; those are planned. cededPremium and cededLoss are currently
        serialized as JSON numbers.
      required:
        - id
        - tenantId
        - businessBook
        - retrocessionNumber
        - contractId
        - retroContractId
        - status
        - cededPremium
        - cededLoss
        - currency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        retrocessionNumber:
          type: string
          examples:
            - RET-000000001
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RetrocessionStatus'
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    RetrocessionStatus:
      type: string
      description: Retrocession case lifecycle status from SPEC 11.10.3.
      enum:
        - OPEN
        - RULE_APPLIED
        - HANDOFF_PENDING
        - HANDED_OFF
        - CONFIRMED
        - REJECTED
        - CANCELLED
    CreateRetrocessionRequest:
      type: object
      description: Public create command. The tenant and book come from the headers.
      required:
        - contractId
        - retroContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Three-letter currency code; the expert stores it uppercase.
    CreateRetrocessionRequestInternal:
      type: object
      description: Internal create command accepted by the Retrocession expert.
      required:
        - tenantId
        - businessBook
        - contractId
        - retroContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        contractId:
          type: string
          format: uuid
        retroContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
    TransitionRetrocessionRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - targetStatus
      properties:
        targetStatus:
          $ref: '#/components/schemas/RetrocessionStatus'
    UpdateRetrocessionStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Retrocession expert.
      required:
        - status
        - version
      properties:
        status:
          $ref: '#/components/schemas/RetrocessionStatus'
        version:
          type: integer
          minimum: 0
          description: Expected aggregate version. A mismatch returns 409.
x-vertical: retrocession
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-retrocession-domain/src/main/java/com/eia/retrocession/domain/RetrocessionController.java
    - repos/eia-retrocession-domain/src/main/java/com/eia/retrocession/domain/RetrocessionClient.java
    - repos/eia-retrocession-domain/src/main/java/com/eia/retrocession/domain/RequestScope.java
    - repos/eia-retrocession-expert/src/main/java/com/eia/retrocession/expert/RetrocessionController.java
    - repos/eia-retrocession-expert/src/main/java/com/eia/retrocession/expert/ApiExceptionHandler.java
  errorEnvelope: >
    Vertical-specific ApiError {code, message, details{field: message}}. Not the
    canonical Problem envelope yet.
  notes: >
    Public transition is POST /transition with targetStatus only; the expert
    transition is PUT /status with status and version.
