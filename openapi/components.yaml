openapi: 3.1.0
info:
  title: EIA canonical shared API components
  version: 1.4.0
  summary: Shared error, money, paging, global-search, concurrency, idempotency, audit, and tenant/book components for every EIA API.
  description: >
    Shared OpenAPI 3.1 components referenced by the per-vertical contract
    documents in this directory. The components are the canonical definitions
    of the RFC 9457 Problem envelope, money, the page envelope, ETag/If-Match,
    Idempotency-Key, audit fields, and the tenant and book request headers.
    Vertical documents reference them with a relative file reference such as
    `./components.yaml#/components/schemas/Problem`.

    Round 2 (contract 1.1.0) turned the Policy page envelope, ETag/If-Match, and
    Idempotency-Key from planned components into implemented ones. Round 5
    (contract 1.2.0) adds the 422 `UnprocessableContent` and 428
    `PreconditionRequired` responses used by Policy and Assumed Claims, marks
    `Percent` implemented, and records that the page envelope now also covers
    the Policy second-slice collections. The remaining verticals still return
    bare arrays and their own error bodies; the divergence is tracked in
    MISMATCHES.md.

    The 2026-10-20 global-search contract (1.3.0) adds the shared
    `SearchResponse`, `SearchItem`, and `SearchType` schemas and the
    `SearchQuery` and `SearchLimit` parameters used by the ten public
    `GET /api/v1/{resource}/search` operations. The addition is compatible: it
    changes no existing page, response, or error component.

    The 2026-10-20 claim command idempotency contract (1.4.0) adds the
    `ClaimIdempotencyKey` request parameter and the `IdempotentReplay` response
    header used by the Direct Claims and Assumed Claims task and note create
    operations, and documents `INVALID_IDEMPOTENCY_KEY` in the shared 400
    response. The addition is compatible: it adds one optional request header
    and one response header to six POST operations and changes no request or
    response body.

    Authority is SPEC.md sections 6.11, 7.6, 7.18-7.23, 10.3, 12.2, and 12.6.
    Where an implemented service deviates from a component, the deviation is
    recorded in MISMATCHES.md rather than encoded here: a canonical contract
    states the agreed shape, not the current drift.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: >
      Public gateway. Only `/api/v1/**` routes are exposed here; the
      `/internal/v1/**` routes of the expert services are reachable only from
      inside the platform network.
tags:
  - name: Shared components
    description: Canonical reusable request parameters, responses, headers, and schemas.
paths: {}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: EIA_SESSION
      description: >
        Opaque session cookie issued and rotated by eia-platform/auth
        (SPEC 9.1). Authorization and book-role checks happen inside the
        domain services (SPEC 3.6.2), not in the gateway.
  parameters:
    TenantHeader:
      name: X-EIA-Tenant
      in: header
      required: true
      description: >
        Signed tenant context. The domain and expert services resolve the
        tenant from this header and never from the request body. A missing
        header is a 400 with the vertical's tenant-required error code.
      schema:
        type: string
        format: uuid
    BookHeaderDirect:
      name: X-EIA-Book
      in: header
      required: true
      description: >
        Book scope for a DIRECT-only vertical. A different book is hidden as
        404 `BOOK_SCOPE_VIOLATION` by Direct Claims and Cession, so the
        response cannot confirm that a record exists in the other book
        (SPEC 3.6.2, WALL-06). A missing header is still a 400 `BOOK_REQUIRED`
        in Cession; see MISMATCHES.md.
      schema:
        type: string
        enum:
          - DIRECT
    BookHeaderAssumed:
      name: X-EIA-Book
      in: header
      required: true
      description: >
        Book scope for an ASSUMED-only vertical. A different book is hidden as
        404 `BOOK_SCOPE_VIOLATION` by Assumed Claims and Retrocession
        (SPEC 3.6.2, WALL-06). A missing header is still a 400 `BOOK_REQUIRED`
        in Retrocession; see MISMATCHES.md.
      schema:
        type: string
        enum:
          - ASSUMED
    TenantIdQuery:
      name: tenantId
      in: query
      required: true
      description: >
        Tenant identity on the internal expert API. The expert is never exposed
        through the gateway and receives the tenant resolved by its domain
        service.
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      required: false
      description: >
        Zero-based page number for the offset page envelope implemented by the
        Policy list endpoints. Default 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSizeParam:
      name: size
      in: query
      required: false
      description: >
        Page size for the offset page envelope implemented by the Policy list
        endpoints. Default 20, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SearchQuery:
      name: q
      in: query
      required: false
      description: >
        Free-text term for the global-search operation. The term is trimmed and
        matched case-insensitively as a contains over the vertical's documented
        searchable fields. An absent or blank term returns the most recently
        updated records, which is the shell's empty-search landing state.
        SPEC 7.6 asks for at least two characters and result highlights; this
        contract keeps `q` optional and highlights are not implemented yet
        (MISMATCHES.md M-23).
      schema:
        type: string
        default: ''
    SearchLimit:
      name: limit
      in: query
      required: false
      description: >
        Maximum number of search items to return. Default 10; the value must be
        between 1 and 25 inclusive. A non-integer, a value below 1, or a value
        above 25 is a 400 `application/problem+json` Problem with a field error
        naming `limit`.
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 10
    DirectClaimStatusFilter:
      name: status
      in: query
      required: false
      description: Restrict the claim list to one lifecycle status.
      schema:
        $ref: '#/components/schemas/DirectClaimStatus'
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: >
        End-to-end correlation identity (SPEC 12.6). Policy accepts it and
        echoes a validated UUID as `correlationId` in the Problem body of a
        failed request; it is not echoed on success yet. The other verticals do
        not accept it yet.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Idempotency scope for a create request, implemented by the Policy
        create endpoints in Round 2. The key is optional for backward
        compatibility, but SPEC 12.6 requires it on transaction submission and
        clients SHOULD always send a UUID. The scope is the tenant plus the key;
        the maximum length is 255 characters. A retry with the same key and an
        identical request replays the original resource with 200 and
        `Idempotent-Replayed: true`; reusing the key with a different request is
        409 `IDEMPOTENCY_CONFLICT`.
      x-status: implemented
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ClaimIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Optional idempotency key for a Direct Claims or Assumed Claims task or
        note create request. The key is trimmed and must be 1-64 characters; a
        value outside those bounds is 400 (`INVALID_IDEMPOTENCY_KEY` in Assumed
        Claims). The key is scoped to the tenant plus the command type, so the
        same key may be used once for a task and once for a note. A retry with
        the same key and an identical canonical request replays the original
        201 task or note with `Idempotent-Replay: true` and writes no second row
        or event; a new create returns 201 with `Idempotent-Replay: false`.
        Reusing the key with a different request is 409 `EIA-DIR-4091` (Direct
        Claims) or `EIA-RNS-4091` (Assumed Claims) with the stable marker
        `IDEMPOTENCY_KEY_REUSED`. The header is optional for backward
        compatibility, but clients SHOULD send a UUID per create; see
        MISMATCHES.md M-07 for the remaining coverage and Direct Claims race
        caveats.
      x-status: implemented
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >
        Optimistic concurrency for a Policy mutation: the strong entity tag
        from a prior read, formatted as `"<version>"` (for example `"3"`), or
        `*`. Implemented by Policy in Round 2. When present it takes precedence
        over the compatibility `expectedVersion` body field. A malformed value
        is 400 `INVALID_IF_MATCH`; a stale value is 409
        `CONCURRENT_MODIFICATION` with `meta.currentVersion` and
        `meta.expectedVersion`. SPEC 7.6 requires the header on PUT/PATCH;
        Policy keeps it optional for backward compatibility.
      x-status: implemented
      schema:
        type: string
  headers:
    ETag:
      description: >
        Strong entity tag of the current representation, derived from the
        aggregate version and formatted as a quoted decimal string
        (for example `"3"`). Send it back in `If-Match` on the next mutation.
        Emitted by the Policy detail, create, and status responses.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    IdempotentReplayed:
      description: >
        `true` when the response replays an earlier request that carried the
        same `Idempotency-Key`, `false` when a new resource was created.
        Emitted by the Policy create responses.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    IdempotentReplay:
      description: >
        `true` when the 201 response replays the stored response of an earlier
        request that carried the same `Idempotency-Key`, `false` when a new
        task or note was created. Direct Claims emits the header only when the
        request supplied a non-blank key; Assumed Claims emits `false` on every
        fresh 201 and `true` on a replay. The spelling is `Idempotent-Replay`,
        not the Policy and SPEC 12.6 `Idempotent-Replayed`; the difference is
        recorded in MISMATCHES.md M-07.
      x-status: implemented
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
  schemas:
    Problem:
      $ref: '../schemas/error-envelope.schema.json'
    ProblemFieldError:
      type: object
      description: One field-level problem inside the canonical error envelope.
      additionalProperties: false
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON field name or request parameter name.
        code:
          type: string
          description: Stable machine-readable field error code, for example INVALID_STATUS_TRANSITION.
        message:
          type: string
          description: Human-readable explanation. Never contains PHI or stack traces.
    Money:
      $ref: '../schemas/money.schema.json'
    MoneyAmount:
      $ref: '../schemas/money.schema.json#/$defs/MoneyAmount'
    CurrencyCode:
      $ref: '../schemas/money.schema.json#/$defs/CurrencyCode'
    Percent:
      type: string
      description: >
        Decimal fraction with up to six fraction digits, for example
        `0.150000` for fifteen percent (SPEC 10.3). Never a JSON number.
        Implemented by the Policy second slice (`coinsurancePct`, `proRataPct`,
        `erodedPct`) and by the Contract second slice (`sharePct`,
        `signedLinePct`, `cessionPct`), where the values are percentages of
        100 rather than fractions.
      x-status: implemented
      pattern: '^[0-9]{1,3}(?:\.[0-9]{1,6})?$'
      examples:
        - '0.150000'
    AuditFields:
      type: object
      description: >
        Audit and optimistic-concurrency fields carried by every persisted
        resource projection (SPEC 7.10). The implemented services emit
        `createdAt`, `updatedAt`, and `version`. Actor fields such as
        `createdBy` and `updatedBy` are planned but are not returned yet, so
        they are deliberately omitted from this schema.
      required:
        - createdAt
        - updatedAt
        - version
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: >
            Aggregate version, incremented on every accepted write. Policy
            exposes it as the strong ETag `"<version>"` and accepts it in
            `If-Match`; the other verticals take it in the request body as
            `expectedVersion` or `version`.
    Page:
      type: object
      description: >
        Offset-paged collection envelope used by the Policy list endpoints and
        by every Policy second-slice collection (versions, coverages, limits,
        aggregate state, endorsements, insureds, locations, cancellations, and
        reinstatements): `items`, `page`, `size`, `total`, and `_links`. A
        vertical or schema document narrows `items` to its resource type.
        SPEC 7.6 and 12.2 describe a cursor envelope (`data`, `page.size`,
        `hasMore`, `nextCursor`); the implemented offset form and the remaining
        cursor divergence are recorded in MISMATCHES.md.
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required:
            - items
            - _links
          properties:
            items:
              type: array
              description: The resources on this page, in the service's stable order.
              items: {}
            _links:
              $ref: '#/components/schemas/PageLinks'
    PageMeta:
      type: object
      description: >
        The pagination members repeated at the top level of a page envelope.
        `page` is zero-based; `size` is the requested page size; `total` is the
        tenant-wide count. `Page` composes this object with `items` and
        `_links`; additional members are therefore allowed here.
      required:
        - page
        - size
        - total
      properties:
        page:
          type: integer
          minimum: 0
          description: Zero-based page number.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Page size requested by the client. Default 20, maximum 100.
        total:
          type: integer
          minimum: 0
          description: Tenant-wide total number of matching resources.
    PageLinks:
      type: object
      description: >
        The `_links` object of a page envelope. `self` is always present;
        `next` is omitted on the last page and `prev` is omitted on the first
        page. Hrefs are relative so they work behind the gateway.
      additionalProperties: false
      required:
        - self
      properties:
        self:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
    Link:
      type: object
      description: >
        One hypermedia link. Page links carry only `href`; a typed record link
        may also carry the resource `type` and `vertical`.
      additionalProperties: false
      required:
        - href
      properties:
        href:
          type: string
          minLength: 1
        type:
          type: string
          description: Resource type, for example policy or claim.
        vertical:
          type: string
          description: Vertical identifier, for example policy or direct.
    Links:
      type: object
      description: >
        Hypermedia links on a detail or collection response (SPEC 7.6). Planned
        for detail resources: Policy list responses use `PageLinks`, and no
        implemented detail projection carries `_links` yet.
      x-status: planned
      additionalProperties:
        $ref: '#/components/schemas/Link'
    SearchResponse:
      type: object
      description: >
        Shared global-search envelope returned by `GET /api/v1/{resource}/search`
        on every search-enabled vertical. `query` echoes the trimmed term and
        `limit` echoes the effective limit after defaulting. `items` is already
        tenant- and book-scoped by the service and is ordered most recently
        updated first.
      additionalProperties: false
      required:
        - query
        - limit
        - items
      properties:
        query:
          type: string
          description: Trimmed search term; empty when the caller omitted `q`.
        limit:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
          description: Effective page size after defaulting; never above 25.
        items:
          type: array
          maxItems: 25
          description: Matching records, most recently updated first.
          items:
            $ref: '#/components/schemas/SearchItem'
    SearchItem:
      type: object
      description: >
        One projection row of the shared global-search envelope. The payload is
        intentionally projection-only, so a search never leaks the full
        aggregate. `href` is the relative shell route that opens the record.
      additionalProperties: false
      required:
        - id
        - type
        - label
        - secondary
        - status
        - href
      properties:
        id:
          type: string
          format: uuid
          description: Record identity, used as the stable merge and dedupe key.
        type:
          $ref: '#/components/schemas/SearchType'
        label:
          type: string
          description: >
            Primary human-readable business key, for example POL-2026-0000001.
        secondary:
          type: string
          description: >
            Secondary descriptor, for example product code and status joined by
            a middle dot.
        status:
          type: string
          description: Current lifecycle status of the record.
        href:
          type: string
          pattern: '^/'
          description: Relative shell route, for example /policy?record=<uuid>.
    SearchType:
      type: string
      description: >
        Resource type of a search item. It is the uppercase form of the vertical
        aggregate and is stable across the ten search-enabled verticals.
      enum:
        - PARTY
        - POLICY
        - CONTRACT
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - CESSION
        - RETROCESSION
        - DOCUMENT
        - PAYMENT
        - NOTIFICATION
    EntityRef:
      type: object
      description: Cross-vertical reference (SPEC 12.2).
      additionalProperties: false
      required:
        - tenantId
        - book
        - vertical
        - type
        - id
      properties:
        tenantId:
          type: string
          format: uuid
        book:
          type: string
          enum:
            - DIRECT
            - ASSUMED
        vertical:
          $ref: '#/components/schemas/VerticalId'
        type:
          type: string
          description: Allowlisted resource type within the vertical, for example claim.
        id:
          type: string
          format: uuid
          description: UUIDv7 resource identity.
        businessKey:
          type: [string, 'null']
          maxLength: 64
        display:
          type: [string, 'null']
          maxLength: 300
        status:
          type: [string, 'null']
          maxLength: 32
        version:
          type: [integer, 'null']
          minimum: 0
        classification:
          type: [string, 'null']
        href:
          type: [string, 'null']
          maxLength: 512
    VerticalId:
      type: string
      description: >
        Vertical identity used in references and in the event envelope. The
        HTTP path segment differs for the claim verticals (`direct-claims`,
        `assumed-claims`); the identifier here is the event and reference form
        used by SPEC 12.4.
      enum:
        - party
        - policy
        - contract
        - direct
        - assumed
        - document
        - payment
        - notifications
        - cession
        - retrocession
    DirectClaimStatus:
      type: string
      description: Direct claim lifecycle status (SPEC 11.4.6).
      enum:
        - DRAFT
        - REGISTERED
        - OPEN
        - COVERAGE_REVIEW
        - RESERVED
        - IN_LITIGATION
        - IN_SETTLEMENT
        - SETTLED
        - PAYMENT_PENDING
        - PAID
        - CLOSED
        - DENIED
        - WITHDRAWN
        - DISMISSED
        - TRANSFERRED
        - BANKRUPTCY_TRUST
        - ON_APPEAL
        - REOPENED
  responses:
    BadRequest:
      description: >
        400. The request is malformed or violates a validation rule. Policy
        second-slice codes include VALIDATION_ERROR, INVALID_STATUS,
        INVALID_INITIAL_STATUS, INVALID_IF_MATCH, INVALID_IDEMPOTENCY_KEY,
        INVALID_OCCURRENCE_BASIS, INVALID_COVERAGE_IMPACT,
        INVALID_ENDORSEMENT_TYPE, INVALID_COVERAGE_CHANGE,
        INVALID_INSURED_ROLE, INVALID_CANCELLATION_TYPE, INVALID_CHANGE_TYPE,
        and INVALID_PARAMETER. Other verticals add MISSING_TENANT_HEADER,
        INVALID_TENANT_HEADER, FSRI_VALIDATION, and FSRI_REJECTED. The ten
        global-search operations use this response for a missing or malformed
        tenant, a missing or invalid book header, and an out-of-range `limit`;
        the field error names `limit`. The Direct Claims and Assumed Claims task
        and note creates use it for an `Idempotency-Key` outside 1-64
        characters (and, in Direct Claims, a key with a non-printable or space
        character); Assumed Claims names the field `Idempotency-Key` with code
        `INVALID_IDEMPOTENCY_KEY`, while Direct Claims reports
        `VALIDATION_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >
        404. The resource does not exist, is not visible in the caller's tenant
        or book scope, or the request used a book that the vertical hides as
        404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2). Policy second-slice not-found
        codes are POLICY_NOT_FOUND, POLICY_VERSION_NOT_FOUND,
        ENDORSEMENT_NOT_FOUND, LIMIT_NOT_FOUND, and LIMIT_STATE_NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >
        409. A state or version conflict: `CONCURRENT_MODIFICATION` (stale
        ETag or expected version), `IDEMPOTENCY_CONFLICT` (the key was reused
        with a different request), a duplicate business key such as
        `DUPLICATE_POLICY_NUMBER`, `DUPLICATE_COVERAGE_CODE`,
        `DUPLICATE_ENDORSEMENT_NUMBER`, `DUPLICATE_INSURED`, or
        `DUPLICATE_LOCATION_CODE`, `INVALID_STATUS_TRANSITION` (illegal
        lifecycle edge), `POLICY_NOT_ISSUED`, `POLICY_NOT_CANCELLED`,
        `CANCELLATION_NOT_ALLOWED`, `VERSION_RANGE_OVERLAP`,
        `VERSION_ALREADY_ISSUED`, `VERSION_HASH_MISMATCH`, or
        `EROSION_STALE_VERSION`. Contract adds `BIND_REQUIRES_COMMAND`,
        `BIND_PRECONDITION_FAILED`, `CONTRACT_LOCKED`,
        `CONTRACT_NOT_INCEPTED`, `LAYER_OVERLAP`, `SHARES_EXCEED_100`,
        `CESSION_EXCEEDS_CONTRACT_LIMIT`, `COLLATERAL_EXCEEDS_OBLIGATION`,
        `COMMUTATION_NOT_APPROVED`, and `COMMUTATION_NOT_PERMITTED`. FS-RI adds
        `FSRI_CONFLICT`. Claim task and note creates add `EIA-DIR-4091` and
        `EIA-RNS-4091` (`IDEMPOTENCY_KEY_REUSED`) for a key reused with a
        different request; Direct Claims uses that marker as the category and
        Assumed Claims carries it in `errors[0].code`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: >
        422. The request is well formed but a domain policy rejects it. Policy
        emits it with category BUSINESS_RULE for coverage and limit rules
        (`INVALID_COVERAGE_RANGE`, `COVERAGE_OUTSIDE_POLICY_TERM`,
        `INVALID_PER_OCCURRENCE_LIMIT`, `INVALID_AGGREGATE_LIMIT`,
        `LIMIT_EXCEEDS_AGGREGATE`, `INVALID_DEDUCTIBLE`,
        `DEDUCTIBLE_EXCEEDS_LIMIT`, `INVALID_SUBLIMIT`,
        `SUBLIMIT_EXCEEDS_LIMIT`, `INVALID_COINSURANCE`, `INVALID_EROSION_BASIS`,
        `INVALID_AGGREGATE_BASIS`, `LIMIT_EXCEEDED`, `CURRENCY_MISMATCH`),
        endorsement rules (`ENDORSEMENT_OUTSIDE_POLICY_TERM`,
        `BACKDATE_REASON_REQUIRED`, `VERSION_REGRESSION`,
        `VERSION_OUTSIDE_POLICY_TERM`, `VERSION_BACKDATE_REASON_REQUIRED`),
        party rules (`INSURED_OUTSIDE_POLICY_TERM`, `NAMED_INSURED_REQUIRED`,
        `LOCATION_OUTSIDE_POLICY_TERM`), cancellation rules
        (`CANCELLATION_OUTSIDE_POLICY_TERM`, `INVALID_CANCELLATION_NOTICE`,
        `INSUFFICIENT_CANCELLATION_NOTICE`), and reinstatement rules
        (`REINSTATEMENT_OUTSIDE_POLICY_TERM`,
        `REINSTATEMENT_BEFORE_CANCELLATION`, `PREMIUM_EVIDENCE_REQUIRED`).
        Assumed Claims emits it with category BUSINESS_RULE for
        `EIA-RNS-7102`, `EIA-RNS-7204`, `EIA-RNS-7301`, `EIA-RNS-7401`,
        `EIA-RNS-7502`, `EIA-RNS-7603`, and `EIA-RNS-7701`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: >
        428. A mandatory approval or precondition is missing; the request is
        otherwise valid. The response uses category APPROVAL_REQUIRED and names
        the missing evidence in `errors[]`. Policy emits `APPROVAL_REQUIRED`
        for a backdated endorsement, a backdated cancellation, and a
        reinstatement without `approvedBy`/`approvalRef`. Assumed Claims emits
        `EIA-RNS-7203` (reserve approval), `EIA-RNS-7302` (cash-call approval),
        and `EIA-RNS-7501` (commutation approval).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: >
        502. An upstream expert or integration returned an unusable response.
        FS-RI mappings include `FSRI_CONTRACT_NOT_FOUND`, `FSRI_BOOK_WALL`,
        `FSRI_INVALID_RESPONSE`, and `FSRI_HANDOFF_NOT_RECORDED`; expert
        mappings include `EXPERT_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >
        503. A dependency is unavailable; retry after backoff. Codes include
        `FSRI_UNAVAILABLE`, `FSRI_THROTTLED`, and `EXPERT_UNAVAILABLE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Canonical error response (RFC 9457 `application/problem+json`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
