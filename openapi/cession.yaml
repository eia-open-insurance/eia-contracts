openapi: 3.1.0
info:
  title: EIA Cession API
  version: 1.0.0
  summary: Direct-book cession case administration and the Cession expert API.
  description: >
    This document describes the implemented public Cession domain API and the
    internal Cession expert API. The authoritative requirement is SPEC 11.9,
    SPEC 7.18, and SPEC 12; the implemented surface is the first vertical slice.

    Cession is fixed to the DIRECT book. A missing or different X-EIA-Book value
    currently returns 400 BOOK_REQUIRED or 400 BOOK_SCOPE_VIOLATION. SPEC 3.6.2
    requires that a book mismatch be hidden as 404; the deviation is recorded
    in MISMATCHES.md.

    The public transition body carries only `targetStatus`; the domain service
    reads the current version and sends it to the expert. The expert route is
    PUT with `{status, version}`.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://cession-domain:8092
    description: Cession domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Cession
    description: Public domain API used by the Cession web remote.
  - name: Cession internal
    description: Internal expert API. Not exposed through the gateway; called only by the Cession domain service.
paths:
  /api/v1/cessions:
    get:
      operationId: listCessions
      tags:
        - Cession
      summary: List cession cases for the caller's tenant and book.
      description: Returns a bare JSON array.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      responses:
        '200':
          description: Cession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createCession
      tags:
        - Cession
      summary: Create a cession case.
      description: >
        Creates a cession case in OPEN. The cession number is generated by the
        expert as CES-{9 digits}. Amounts must be zero or greater.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCessionRequest'
      responses:
        '201':
          description: Cession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/cessions/{cessionId}:
    get:
      operationId: getCession
      tags:
        - Cession
      summary: Get a cession case.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: cessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cession case detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/cessions/{cessionId}/transition:
    post:
      operationId: transitionCession
      tags:
        - Cession
      summary: Advance a cession case through its lifecycle.
      description: >
        Applies one transition from SPEC 11.9.3. The domain service reads the
        current version; an illegal transition returns 400
        INVALID_STATUS_TRANSITION.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: cessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionCessionRequest'
      responses:
        '200':
          description: Cession case after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/cessions:
    get:
      operationId: expertListCessions
      tags:
        - Cession internal
      summary: List cession cases for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Cession cases of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateCession
      tags:
        - Cession internal
      summary: Create a cession case (expert).
      description: The expert requires businessBook to be DIRECT.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCessionRequestInternal'
      responses:
        '201':
          description: Cession case created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/cessions/{cessionId}:
    get:
      operationId: expertGetCession
      tags:
        - Cession internal
      summary: Get a cession case (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: cessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cession case detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/cessions/{cessionId}/status:
    put:
      operationId: expertUpdateCessionStatus
      tags:
        - Cession internal
      summary: Advance a cession case through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: cessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCessionStatusRequestInternal'
      responses:
        '200':
          description: Cession case after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Cession:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Cession case projection. The SPEC 11.9.3 model carries contract terms,
        rules, hand-offs, confirmations, recoverables, and statements; those are
        planned. cededPremium and cededLoss are currently serialized as JSON
        numbers.
      required:
        - id
        - tenantId
        - businessBook
        - cessionNumber
        - policyId
        - cessionContractId
        - status
        - cededPremium
        - cededLoss
        - currency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - DIRECT
        cessionNumber:
          type: string
          examples:
            - CES-000000001
        policyId:
          type: string
          format: uuid
        cessionContractId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CessionStatus'
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CessionStatus:
      type: string
      description: Cession case lifecycle status from SPEC 11.9.3.
      enum:
        - OPEN
        - RULE_APPLIED
        - HANDOFF_PENDING
        - HANDED_OFF
        - CONFIRMED
        - REJECTED
        - CANCELLED
    CreateCessionRequest:
      type: object
      description: Public create command. The tenant and book come from the headers.
      required:
        - policyId
        - cessionContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        policyId:
          type: string
          format: uuid
        cessionContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          description: Three-letter currency code; the expert stores it uppercase.
    CreateCessionRequestInternal:
      type: object
      description: Internal create command accepted by the Cession expert.
      required:
        - tenantId
        - businessBook
        - policyId
        - cessionContractId
        - cededPremium
        - cededLoss
        - currency
      properties:
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - DIRECT
        policyId:
          type: string
          format: uuid
        cessionContractId:
          type: string
          format: uuid
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLoss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
    TransitionCessionRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - targetStatus
      properties:
        targetStatus:
          $ref: '#/components/schemas/CessionStatus'
    UpdateCessionStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Cession expert.
      required:
        - status
        - version
      properties:
        status:
          $ref: '#/components/schemas/CessionStatus'
        version:
          type: integer
          minimum: 0
          description: Expected aggregate version. A mismatch returns 409.
x-vertical: cession
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-cession-domain/src/main/java/com/eia/cession/domain/CessionController.java
    - repos/eia-cession-domain/src/main/java/com/eia/cession/domain/CessionClient.java
    - repos/eia-cession-domain/src/main/java/com/eia/cession/domain/RequestScope.java
    - repos/eia-cession-expert/src/main/java/com/eia/cession/expert/CessionController.java
    - repos/eia-cession-expert/src/main/java/com/eia/cession/expert/ApiExceptionHandler.java
  errorEnvelope: >
    Vertical-specific ApiError {code, message, details{field: message}}. Not the
    canonical Problem envelope yet.
  notes: >
    Public transition is POST /transition with targetStatus only; the expert
    transition is PUT /status with status and version.
