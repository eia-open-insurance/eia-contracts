    - repos/eia-cession-expert/src/main/java/com/eia/cession/expert/RecordHandoffFailureRequest.java
    - repos/eia-cession-domain/src/test/java/com/eia/cession/domain/CessionControllerTest.java
    - repos/eia-cession-domain/src/test/java/com/eia/cession/domain/CessionServiceTest.java
    - repos/eia-cession-domain/src/test/java/com/eia/cession/domain/FsriCessionClientTest.java
    - repos/eia-cession-expert/src/test/java/com/eia/cession/expert/CessionControllerTest.java
    - repos/eia-cession-expert/src/test/java/com/eia/cession/expert/CessionHandoffPersistenceTest.java
  errorEnvelope: >
    Vertical-specific ApiError {code, message, details{field: message}} with
    application/json, not the canonical Problem envelope yet.
  notes: >
    Public transition is POST /transition with targetStatus and the optional
    fsriContractNumber; the expert transition is PUT /status with status and
