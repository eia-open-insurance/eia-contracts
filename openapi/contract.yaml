    CessionType:
      type: string
      enum:
        - QUOTA_SHARE
        - SURPLUS
        - FACULTATIVE
        - EXCESS_OF_LOSS
        - AGGREGATE
        - RETROCESSION
    CessionStatus:
      type: string
      enum:
        - RECORDED
        - CONFIRMED
        - REVERSED
        - DISPUTED
    Bordereau:
      type: object
      description: >
        Public projection of a period bordereau: the cedent's financial schedule
        for one contract period. The expert generates `bordereauNumber` as
        `BRD-{year}-{sequence}` and the row starts in RECEIVED. Money fields are
        decimal strings (SPEC 10.3). `notes` is null until a note is supplied,
        and `technicalAccountId` is null until the bordereau is PROCESSED and
        linked to the technical account created or reused for the period.
      required:
        - bordereauId
        - bordereauNumber
        - contractId
        - periodStart
        - periodEnd
        - receivedDate
        - currency
        - premiumAmount
        - lossAmount
        - commissionAmount
        - otherChargesAmount
        - lineCount
        - notes
        - status
        - technicalAccountId
        - createdAt
      properties:
        bordereauId:
          type: string
          format: uuid
        bordereauNumber:
          type: string
          maxLength: 32
        contractId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        receivedDate:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        lossAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        commissionAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        otherChargesAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        lineCount:
          type: integer
          minimum: 0
          maximum: 10000000
        notes:
          type: [string, 'null']
          maxLength: 4000
        status:
          $ref: '#/components/schemas/BordereauStatus'
        technicalAccountId:
          type: [string, 'null']
          format: uuid
          description: Set when the bordereau is processed and linked to its account.
        createdAt:
          type: string
          format: date-time
    BordereauStatus:
      type: string
      description: >
        Period-bordereau lifecycle. RECEIVED is the creation state; PROCESSED
        and FAILED are terminal and immutable.
      enum:
        - RECEIVED
        - PROCESSED
        - FAILED
    BordereauHeader:
      type: object
      description: >
        Internal legacy source-document ingest header (SPEC 11.3.4
        `contract_bordereau`). It shares the table with the period bordereau
