        `INVALID_STATUS_TRANSITION`. Each accepted transition appends
        `contract.cash-call.issued`, `.settled`, or `.cancelled` to the outbox
        in the same transaction as the row update.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
