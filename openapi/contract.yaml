  /internal/v1/contracts/{contractId}/commutations:
    get:
      operationId: expertListContractCommutations
      tags:
        - Contract internal
      summary: List commutations (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
