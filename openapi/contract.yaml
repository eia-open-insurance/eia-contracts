        - lineCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        bordereauNumber:
          type: string
          maxLength: 32
        bordereauType:
          $ref: '#/components/schemas/BordereauType'
        periodFrom:
          type: string
          format: date
        periodTo:
          type: string
          format: date
        receivedAt:
          type: [string, 'null']
          format: date-time
        sourceDocumentId:
          type: [string, 'null']
          format: uuid
        sourceFormat:
          $ref: '#/components/schemas/SourceFormat'
        sourceReference:
          type: [string, 'null']
          maxLength: 128
        status:
          $ref: '#/components/schemas/BordereauHeaderStatus'
        lineCount:
          type: integer
          minimum: 0
        validLineCount:
          type: [integer, 'null']
          minimum: 0
        exceptionCount:
          type: [integer, 'null']
          minimum: 0
        totalAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        checksum:
          type: [string, 'null']
          maxLength: 64
        processedAt:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
          maxLength: 400
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BordereauType:
      type: string
      enum:
        - PREMIUM
        - CLAIMS
        - CESSION
        - ACCOUNTING
        - LOSS_DEVELOPMENT
        - SECURITY
        - CASH_LOSS
    SourceFormat:
      type: string
      enum:
        - CSV
        - XLSX
        - XML
        - JSON
        - MANUAL
    BordereauHeaderStatus:
      type: string
      description: Legacy ingest-header status vocabulary (internal only).
      enum:
        - RECEIVED
        - PARSING
        - VALIDATED
        - PARTIALLY_POSTED
        - POSTED
        - REJECTED
        - SUPERSEDED
    Commutation:
      type: object
      description: >
        A proposed, approved, or executed commutation. `agreedAmount` is the
        negotiated consideration; `savingsAmount` is the estimated economic
        benefit.
      required:
        - id
        - tenantId
        - contractId
        - commutationNumber
        - effectiveDate
        - agreedAmount
        - currency
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        commutationNumber:
          type: string
          maxLength: 32
        commutationType:
          type: [string, 'null']
          enum:
            - FULL
            - PARTIAL
            - LOSS_PORTFOLIO
            - BUYOUT
            - NOVATION
        effectiveDate:
          type: string
          format: date
        valuationDate:
          type: [string, 'null']
          format: date
        agreedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        basis:
          type: [string, 'null']
          enum:
            - NEGOTIATED
            - CONTRACTUAL
            - INDUCED
            - REGULATORY
            - INSOLVENCY
        status:
          type: string
          enum:
            - PROPOSED
            - APPROVED
            - EXECUTED
            - REJECTED
        releaseDocumentId:
          type: [string, 'null']
          format: uuid
        releaseDate:
          type: [string, 'null']
          format: date
        paymentId:
          type: [string, 'null']
          format: uuid
        savingsAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        approvedBy:
          type: [string, 'null']
          format: uuid
        approvedAt:
          type: [string, 'null']
          format: date-time
        executedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TechnicalAccount:
      type: object
      description: >
        Public projection of a contract technical account (SPEC 11.3.4
        `technical_account`). The expert generates the account number and
        derives the balance as
        `cededPremium - commission - cededLosses + otherCharges`; a positive
        balance is due from the cedent to the reinsurer and a negative balance
        is due from the reinsurer to the cedent. Money fields are decimal
        strings (SPEC 10.3). The account header is the reconciled view: the
        SPEC 11.3.4 `technical_account_line` detail is read from
        `.../{accountId}/lines` and is not embedded here. An account with lines
        can be issued only when every bucket total equals its matching header
        component (M-42).
      required:
        - accountId
        - accountNumber
        - contractId
        - periodStart
        - periodEnd
        - currency
        - cededPremium
        - cededLosses
        - commission
        - otherCharges
        - balance
        - status
        - createdAt
      properties:
        accountId:
          type: string
          format: uuid
        accountNumber:
          type: string
          maxLength: 32
          description: Generated as `TA-{year}-{sequence}` and unique per tenant.
        contractId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLosses:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        commission:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        otherCharges:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        balance:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        status:
          $ref: '#/components/schemas/TechnicalAccountStatus'
        createdAt:
          type: string
          format: date-time
    TechnicalAccountStatus:
      type: string
      description: >
        Technical-account lifecycle status. This slice implements only the
        linear path DRAFT -> ISSUED -> SETTLED; the SPEC 11.3.4 AGREED,
        DISPUTED, and SUPERSEDED values are planned (M-29).
      enum:
        - DRAFT
        - ISSUED
        - SETTLED
    CreateTechnicalAccountRequest:
      type: object
      description: >
        Produces one technical-account period. The tenant comes from
        `X-EIA-Tenant` and the contract from the path; `accountNumber`,
        `balance`, and the initial DRAFT status are server-derived. Every
        amount is required and non-negative; `periodStart` must be before
        `periodEnd`.
      required:
        - periodStart
        - periodEnd
        - currency
        - cededPremium
        - cededLosses
        - commission
        - otherCharges
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        cededPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        cededLosses:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        commission:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        otherCharges:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
    UpdateTechnicalAccountStatusRequest:
      type: object
      description: >
        Lifecycle command for one technical account. Only `ISSUED` and
        `SETTLED` are accepted; `DRAFT` is the creation state and is rejected
        with 400 `INVALID_STATUS`. Skipping ISSUED or repeating a terminal
        status is 409 `INVALID_STATUS_TRANSITION`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ISSUED
            - SETTLED
    TechnicalAccountLine:
      type: object
      description: >
        One financial line of a technical account (SPEC 11.3.4
        `technical_account_line`). A line belongs to exactly one account and
        names one of the 13 detail types. Every type rolls into exactly one of
        the four reconciliation buckets: `PREMIUM` -> `premium`; `PAID_LOSS`,
        `OUTSTANDING_LOSS`, `IBNR`, `ALAE`, `REINSTATEMENT`, and `CASH_CALL` ->
        `loss`; `COMMISSION` and `BROKERAGE` -> `commission`; and
        `FUNDS_WITHHELD`, `TAX`, `ADJUSTMENT`, and `OTHER` -> `other`. The
        bucket totals must equal the matching header components on issue.
        `reference` and `description` are optional audit text and are null when
        absent. `amount` is strictly positive and is a decimal string
        (SPEC 10.3). Lines are add-only and remove-only in the DRAFT account;
        an ISSUED account is immutable.
      required:
        - lineId
        - accountId
        - lineType
        - reference
        - description
        - amount
        - createdAt
      properties:
        lineId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        lineType:
          $ref: '#/components/schemas/TechnicalAccountLineType'
        reference:
          type: [string, 'null']
          maxLength: 64
          description: Optional source reference, trimmed; null when absent.
        description:
          type: [string, 'null']
          maxLength: 255
          description: Optional free-text description, trimmed; null when absent.
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        createdAt:
          type: string
          format: date-time
    TechnicalAccountLineType:
      type: string
      description: >
        The detail type of a technical-account line (SPEC 11.3.4
        `technical_account_line`). Each type rolls into exactly one of the four
        reconciliation buckets: `PREMIUM` -> `premium`; `PAID_LOSS`,
        `OUTSTANDING_LOSS`, `IBNR`, `ALAE`, `REINSTATEMENT`, and `CASH_CALL` ->
        `loss`; `COMMISSION` and `BROKERAGE` -> `commission`; and
        `FUNDS_WITHHELD`, `TAX`, `ADJUSTMENT`, and `OTHER` -> `other`. The
        retired aggregate `LOSS` type is not accepted.
      enum:
        - PREMIUM
        - COMMISSION
        - BROKERAGE
        - PAID_LOSS
        - OUTSTANDING_LOSS
        - IBNR
        - ALAE
        - REINSTATEMENT
        - CASH_CALL
        - FUNDS_WITHHELD
        - TAX
        - ADJUSTMENT
        - OTHER
    TechnicalAccountLineTotals:
      type: object
      description: >
        Summed line amounts for the issue reconciliation. The four bucket
        members `premium`, `loss`, `commission`, and `other` are always
        present; a bucket with no line is `0.0000`. `details` is an optional
        map from each present line type to its summed amount and is omitted
        when there is no line detail. The bucket members are the
        reconciliation view and map to the account header as `premium` ->
        `cededPremium`, `loss` -> `cededLosses`, `commission` -> `commission`,
        and `other` -> `otherCharges`; on DRAFT -> ISSUED each must equal its
        header component. The expert's authoritative `bucketTotals` map uses
        exactly these four keys and is normalized into these members. The
        detail mapping is `PREMIUM` -> `premium`; `PAID_LOSS`,
        `OUTSTANDING_LOSS`, `IBNR`, `ALAE`, `REINSTATEMENT`, and `CASH_CALL` ->
        `loss`; `COMMISSION` and `BROKERAGE` -> `commission`; and
        `FUNDS_WITHHELD`, `TAX`, `ADJUSTMENT`, and `OTHER` -> `other`. Money is
        a decimal string (SPEC 10.3).
      required:
        - premium
        - loss
        - commission
        - other
      properties:
        premium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        loss:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        commission:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        other:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        details:
          type: object
          description: >
            Optional per-line-type totals. Only types with at least one line
            appear; the map is omitted when it would be empty. Every key is one
            of the 13 `TechnicalAccountLineType` values and every value is a
            decimal money string.
          additionalProperties:
            $ref: './components.yaml#/components/schemas/MoneyAmount'
          propertyNames:
            enum:
              - PREMIUM
              - COMMISSION
              - BROKERAGE
              - PAID_LOSS
              - OUTSTANDING_LOSS
              - IBNR
              - ALAE
              - REINSTATEMENT
              - CASH_CALL
              - FUNDS_WITHHELD
              - TAX
              - ADJUSTMENT
              - OTHER
    LineSummary:
      type: object
      description: >
        The line detail of one technical account plus its totals (SPEC 11.3.4
        `technical_account_line`). `items` is in insertion order; `totals`
        carries the four reconciliation buckets and the optional per-line-type
        detail map. The account header is not repeated here.
      required:
        - items
        - totals
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalAccountLine'
        totals:
          $ref: '#/components/schemas/TechnicalAccountLineTotals'
    CreateTechnicalAccountLineRequest:
      type: object
      description: >
        Adds one line to a DRAFT technical account. The tenant comes from
        `X-EIA-Tenant`, the contract and account from the path, and the line id
        and `createdAt` are server-derived, so none of them is accepted in the
        body. `lineType` is trimmed and case-insensitive; `amount` is required
        and must be greater than zero; `reference` and `description` are
        optional and trimmed, with the same bounds as the projection.
      required:
        - lineType
        - amount
      properties:
        lineType:
          $ref: '#/components/schemas/TechnicalAccountLineType'
        reference:
          type: [string, 'null']
          maxLength: 64
        description:
          type: [string, 'null']
          maxLength: 255
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
    CashCall:
      type: object
      description: >
        Public projection of a contract cash call: an interim funding request
        on one contract period (SPEC 11.3.4 `ISSUE_CASH_CALL`, SPEC 11.3.11).
        The expert generates `callNumber` as `CC-{year}-{sequence}` and creates
        the row in REQUESTED. `amount` is a decimal string (SPEC 10.3) and must
        be greater than zero. `notes` is null until a note is supplied. The
        status lifecycle is REQUESTED -> ISSUED -> SETTLED or
        REQUESTED -> CANCELLED, with both terminal states immutable.
      required:
        - cashCallId
        - callNumber
        - contractId
        - periodStart
        - periodEnd
        - amount
        - currency
        - dueDate
        - status
        - notes
        - createdAt
      properties:
        cashCallId:
          type: string
          format: uuid
        callNumber:
          type: string
          maxLength: 32
          description: Generated as `CC-{year}-{sequence}` and unique per tenant and contract.
        contractId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        dueDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CashCallStatus'
        notes:
          type: [string, 'null']
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
    CashCallStatus:
      type: string
      description: >
        Cash-call lifecycle. REQUESTED is the creation state; ISSUED and
        CANCELLED are the alternatives at version 2, and SETTLED is the
        version-3 terminal state after ISSUED.
      enum:
        - REQUESTED
        - ISSUED
        - SETTLED
        - CANCELLED
    CreateCashCallRequest:
      type: object
      description: >
        Requests an interim cash call for one contract period. The tenant comes
        from `X-EIA-Tenant`, the contract from the path, and the book is always
        ASSUMED. The call number and the initial REQUESTED status are
        server-derived. `periodStart` must be before `periodEnd`, `amount` must
        be greater than zero, `currency` must be an uppercase ISO 4217 code,
        and `dueDate` is required.
      required:
        - periodStart
        - periodEnd
        - amount
        - currency
        - dueDate
      properties:
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        dueDate:
          type: string
          format: date
        notes:
          type: [string, 'null']
          maxLength: 4000
    UpdateCashCallStatusRequest:
      type: object
      description: >
        Lifecycle command for one cash call. Only `ISSUED`, `SETTLED`, and
        `CANCELLED` are accepted; `REQUESTED` is the creation state and is
        rejected with 400 `INVALID_STATUS`. A skipped or repeated edge is 409
        `INVALID_STATUS_TRANSITION`.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ISSUED
            - SETTLED
            - CANCELLED
    TowerSummary:
      type: object
      required:
        - contractId
        - layerCount
        - capacity
        - gaps
      properties:
        contractId:
          type: string
          format: uuid
        layerCount:
          type: integer
          minimum: 0
        capacity:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        gaps:
          type: array
          items:
            type: string
    TermRequirements:
      type: object
      required:
        - contractType
        - required
        - missing
      properties:
        contractType:
          $ref: '#/components/schemas/ContractType'
        required:
          type: array
          items:
            $ref: '#/components/schemas/TermCode'
        missing:
          type: array
          items:
            $ref: '#/components/schemas/TermCode'
    BindCheck:
      type: object
      required:
        - code
        - passed
        - detail
      properties:
        code:
          type: string
          enum:
            - CONTRACT_PLACED
            - LAYERS_COHERENT
            - SHARES_BALANCED
            - REQUIRED_TERMS_PRESENT
            - SECURITY_NOT_BREACHED
        passed:
          type: boolean
        detail:
          type: string
    BindEligibility:
      type: object
      required:
        - contractId
        - contractNumber
        - status
        - bindable
        - checks
      properties:
        contractId:
          type: string
          format: uuid
        contractNumber:
          type: string
        status:
          $ref: '#/components/schemas/ContractStatus'
        bindable:
          type: boolean
          description: True only when every check passed.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/BindCheck'
    BindResult:
      type: object
      required:
        - contract
        - eligibility
      properties:
        contract:
          $ref: '#/components/schemas/Contract'
        eligibility:
          $ref: '#/components/schemas/BindEligibility'
    BindResultExpert:
      type: object
      required:
        - contract
        - eligibility
      properties:
        contract:
          $ref: '#/components/schemas/ContractExpert'
        eligibility:
          $ref: '#/components/schemas/BindEligibility'
    CommutationExecution:
      type: object
      required:
        - commutation
        - contract
        - releasedSecurities
        - contractClosed
      properties:
        commutation:
          $ref: '#/components/schemas/Commutation'
        contract:
          $ref: '#/components/schemas/Contract'
        releasedSecurities:
          type: integer
          minimum: 0
        contractClosed:
          type: boolean
    CreateLayerRequest:
      type: object
      description: Record a layer. Strings are normalized to upper case.
      required:
        - layerNumber
        - layerType
        - attachmentAmount
        - limitAmount
        - limitBasis
      properties:
        layerNumber:
          type: integer
          minimum: 1
          maximum: 999
        layerType:
          $ref: '#/components/schemas/LayerType'
        attachmentAmount:
          type: string
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        limitAmount:
          type: string
