        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/contracts/{contractId}/commutations/{commutationId}:
    get:
      operationId: expertGetContractCommutation
      tags:
        - Contract internal
      summary: Get one commutation (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commutationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Commutation detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/contracts/{contractId}/commutations/{commutationId}/approve:
    post:
      operationId: expertApproveContractCommutation
      tags:
        - Contract internal
      summary: Approve a commutation (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commutationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCommutationRequest'
      responses:
        '200':
          description: Commutation approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/contracts/{contractId}/commutations/{commutationId}/execute:
    post:
      operationId: expertExecuteContractCommutation
      tags:
        - Contract internal
      summary: Execute a commutation (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commutationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCommutationRequest'
      responses:
        '200':
          description: Commutation executed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommutationExecution'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/contracts/{contractId}/bind-eligibility:
    get:
      operationId: expertGetContractBindEligibility
      tags:
        - Contract internal
      summary: Evaluate the bind preconditions (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bind readiness and the individual checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindEligibility'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/contracts/{contractId}/bind:
    post:
      operationId: expertBindContract
      tags:
        - Contract internal
      summary: Bind the contract (expert).
      description: >
        The expert locks the contract, evaluates every check, requires
        `approvedBy`, and writes BOUND with `boundAt` and `boundBy` in one
        transaction. A missing approver is 400 `BIND_APPROVAL_REQUIRED`; failed
        checks are 409 `BIND_PRECONDITION_FAILED`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindRequest'
      responses:
        '200':
          description: Contract bound plus the eligibility snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BindResultExpert'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Contract:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Contract projection returned by the public API. The SPEC 11.3.4
        aggregate calls the start date inceptionDate and carries treatyNumber,
        accounts, and mass-tort fields; those are planned.
      required:
        - id
        - tenantId
        - contractNumber
        - contractType
        - cedentPartyId
        - reinsurerPartyId
        - status
        - effectiveDate
        - expirationDate
        - currency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractNumber:
          type: string
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{1,31}$'
        contractType:
          $ref: '#/components/schemas/ContractType'
        cedentPartyId:
          type: string
          format: uuid
        reinsurerPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ContractStatus'
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    ContractExpert:
      allOf:
        - $ref: '#/components/schemas/Contract'
        - type: object
          description: >
            Expert projection adds the durable bind and commutation timestamps
            that the public ContractDto does not expose.
          properties:
            boundAt:
              type: [string, 'null']
              format: date-time
            boundBy:
              type: [string, 'null']
              format: uuid
            commutedAt:
              type: [string, 'null']
              format: date-time
            closedAt:
              type: [string, 'null']
              format: date-time
    ContractType:
      type: string
      description: Contract type from SPEC 11.3.5.
      enum:
        - QUOTA_SHARE
        - SURPLUS
        - FACULTATIVE
        - FACULTATIVE_OBLIGATORY
        - EXCESS_OF_LOSS
        - AGGREGATE_EXCESS_OF_LOSS
        - STOP_LOSS
        - CATASTROPHE_EXCESS_OF_LOSS
        - CLASH
        - ADVERSE_DEVELOPMENT_COVER
        - LOSS_PORTFOLIO_TRANSFER
        - RETROCESSION
        - FRONTING
        - FINITE
        - PROPORTIONAL_TREATY
        - NON_PROPORTIONAL_TREATY
    ContractStatus:
      type: string
      description: >
        Contract lifecycle status from SPEC 11.3.6. BOUND is reachable only
        through the bind command.
      enum:
        - DRAFT
        - QUOTED
        - PLACED
        - BOUND
        - SIGNED
        - IN_FORCE
        - ENDORSED
        - EXPIRED
        - CANCELLED
        - COMMUTED
        - RUNOFF
        - CLOSED
        - VOID
    CreateContractRequest:
      type: object
      description: Public create command. The tenant comes from X-EIA-Tenant.
      required:
        - contractNumber
        - contractType
        - cedentPartyId
        - reinsurerPartyId
        - effectiveDate
        - expirationDate
        - currency
      properties:
        contractNumber:
          type: string
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{1,31}$'
        contractType:
          $ref: '#/components/schemas/ContractType'
        cedentPartyId:
          type: string
          format: uuid
        reinsurerPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreateContractRequestInternal:
      type: object
      description: Internal create command accepted by the Contract expert.
      required:
        - tenantId
        - contractNumber
        - contractType
        - cedentPartyId
        - reinsurerPartyId
        - effectiveDate
        - expirationDate
        - currency
      properties:
        tenantId:
          type: string
          format: uuid
        contractNumber:
          type: string
          maxLength: 32
          pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{1,31}$'
        contractType:
          $ref: '#/components/schemas/ContractType'
        cedentPartyId:
          type: string
          format: uuid
        reinsurerPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - DRAFT
            - QUOTED
          description: Optional initial status. Defaults to DRAFT.
    UpdateContractStatusRequest:
      type: object
      description: >
        Lifecycle transition command used by the public and expert APIs.
        `status: BOUND` is rejected with `BIND_REQUIRES_COMMAND`.
      required:
        - status
        - expectedVersion
      properties:
        status:
          $ref: '#/components/schemas/ContractStatus'
        expectedVersion:
          type: integer
          minimum: 0
    Layer:
      type: object
      description: One layer of the assumed reinsurance tower.
      required:
        - id
        - tenantId
        - contractId
        - layerNumber
        - layerType
        - attachmentAmount
        - limitAmount
        - currency
        - limitBasis
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        sectionId:
          type: [string, 'null']
          format: uuid
        layerNumber:
          type: integer
          minimum: 1
          maximum: 999
        layerType:
          $ref: '#/components/schemas/LayerType'
        attachmentAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitBasis:
          $ref: '#/components/schemas/LimitBasis'
        aggregateLimitAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        reinstatementCount:
          type: [integer, 'null']
          minimum: 0
          maximum: 99
        reinstatementType:
          type: [string, 'null']
          enum:
            - NONE
            - FREE
            - PAID_PRO_RATA
            - PAID_FULL_RATE
            - PER_LOSS
        note:
          type: [string, 'null']
          maxLength: 400
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/LayerStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LayerType:
      type: string
      enum:
        - PROPORTIONAL
        - EXCESS_OF_LOSS
        - AGGREGATE_EXCESS
        - STOP_LOSS
        - CATASTROPHE
        - CLASH
        - FACULTATIVE
        - TOP_AND_DROP
    LimitBasis:
      type: string
      enum:
        - PER_OCCURRENCE
        - PER_RISK
        - PER_EVENT
        - ANNUAL_AGGREGATE
        - POLICY_YEAR
        - PER_LOSS
    LayerStatus:
      type: string
      enum:
        - QUOTED
        - BOUND
        - IN_FORCE
        - EXHAUSTED
        - EXPIRED
        - CANCELLED
    Participant:
      type: object
      description: >
        One participation in a layer or in the contract. `sharePct` and
        `signedLinePct` are percentages of 100 with six decimal places.
      required:
        - id
        - tenantId
        - contractId
        - partyId
        - participantRole
        - sharePct
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        layerId:
          type: [string, 'null']
          format: uuid
        partyId:
          type: string
          format: uuid
        participantRole:
          $ref: '#/components/schemas/ParticipantRole'
        sharePct:
          $ref: './components.yaml#/components/schemas/Percent'
        signedLinePct:
          type: [string, 'null']
          pattern: '^[0-9]{1,3}(?:\.[0-9]{1,6})?$'
        orderNumber:
          type: [integer, 'null']
          minimum: 1
          maximum: 999
        leadFlag:
          type: boolean
        capacityAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        securityRating:
          type: [string, 'null']
          maxLength: 8
        collateralRequired:
          type: boolean
        signatureStatus:
          $ref: '#/components/schemas/SignatureStatus'
        signedAt:
          type: [string, 'null']
          format: date-time
        authorizationRef:
          type: [string, 'null']
          maxLength: 64
        effectiveFrom:
          type: [string, 'null']
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - ENDED
            - REPLACED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ParticipantRole:
      type: string
      enum:
        - REINSURER
        - CEDENT
        - LEAD
        - FOLLOW
        - FRONTING
        - RETROCESSIONAIRE
        - BROKER
    SignatureStatus:
      type: string
      enum:
        - PENDING
        - SIGNED
        - DECLINED
        - WITHDRAWN
    Term:
      type: object
      description: >
        One key/value contract term. `valueType` is derived from `termCode`
        (MONEY, PERCENT, TEXT, DATE, INTEGER, BOOLEAN).
      required:
        - id
        - tenantId
        - contractId
        - termCode
        - termValue
        - valueType
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        termCode:
          $ref: '#/components/schemas/TermCode'
        termValue:
          type: string
          maxLength: 400
        valueType:
          type: string
          enum:
            - MONEY
            - PERCENT
            - TEXT
            - DATE
            - INTEGER
            - BOOLEAN
        effectiveFrom:
          type: [string, 'null']
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        sourceClause:
          type: [string, 'null']
          maxLength: 48
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TermCode:
      type: string
      description: Canonical contract term codes from SPEC 11.3.4.
      enum:
        - CEDING_COMMISSION_PCT
        - BROKERAGE_PCT
        - PROFIT_COMMISSION_PCT
        - FUNDS_WITHHELD_PCT
        - LOSS_CORRIDOR_FROM_PCT
        - LOSS_CORRIDOR_TO_PCT
        - EXPERIENCE_ACCOUNT_RATE_PCT
        - LOSS_RATIO_CAP_PCT
        - DEPOSIT_PREMIUM_AMOUNT
        - MINIMUM_PREMIUM_AMOUNT
        - CASH_CALL_LIMIT_AMOUNT
        - INCEPTION_BALANCE_AMOUNT
        - GOVERNING_LAW
        - SETTLEMENT_BASIS
        - REINSTATEMENT_PROVISION
        - ULTIMATE_NET_LOSS
        - PORTFOLIO_SCHEDULE_REF
        - ACTUARIAL_ASSUMPTIONS_REF
        - DEVELOPMENT_PATTERN_REF
        - CURRENCY_CLAUSE
        - TAX_RESPONSIBILITY
        - PROFIT_COMMISSION_BASIS
        - SUNSET_DATE
        - COMMUTATION_WINDOW_MONTHS
        - PAYMENT_TERMS_DAYS
        - OFFSET_ALLOWED
        - CASH_CALL_ALLOWED
        - AUDIT_RIGHTS
        - EXPERIENCE_ACCOUNT_FLAG
    Security:
      type: object
      description: Security or collateral held against the contract.
      required:
        - id
        - tenantId
        - contractId
        - securityType
        - requiredAmount
        - currency
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
          format: uuid
        securityType:
          $ref: '#/components/schemas/SecurityType'
        requiredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        heldAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        providerPartyId:
          type: [string, 'null']
          format: uuid
        beneficiaryPartyId:
          type: [string, 'null']
          format: uuid
        effectiveFrom:
          type: [string, 'null']
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        expiryDate:
          type: [string, 'null']
          format: date
        status:
          $ref: '#/components/schemas/SecurityStatus'
        collateralQuality:
          type: [string, 'null']
          enum:
            - CASH
            - GOVERNMENT_SECURITIES
            - BANK_GUARANTEE
            - CORPORATE_GUARANTEE
            - OTHER
        documentId:
          type: [string, 'null']
          format: uuid
        releaseConditions:
          type: [string, 'null']
          maxLength: 400
        approvalRef:
          type: [string, 'null']
          maxLength: 64
        approvedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SecurityRecord:
      type: object
      description: >
        Public projection of a contract security/collateral record. The
        projection is deliberately narrower than the internal expert row: the
        tenant, contract, beneficiary, effective dates, collateral quality,
        document, release conditions, and audit columns stay internal.
        `requiredAmount` is the secured obligation and `heldAmount` the
        collateral actually held; both are non-negative decimal strings
        (SPEC 10.3).
        `providerPartyId`, `expiryDate`, and `approvalRef` are nullable.
      required:
        - id
        - securityType
        - requiredAmount
        - heldAmount
        - currency
        - providerPartyId
        - expiryDate
        - approvalRef
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        securityType:
          $ref: '#/components/schemas/SecurityType'
        requiredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        heldAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        providerPartyId:
          type: [string, 'null']
          format: uuid
        expiryDate:
          type: [string, 'null']
          format: date
        approvalRef:
          type: [string, 'null']
          maxLength: 64
        status:
          $ref: '#/components/schemas/SecurityStatus'
        createdAt:
          type: string
          format: date-time
    SecurityType:
      type: string
      enum:
        - LETTER_OF_CREDIT
        - TRUST_FUND
        - FUNDS_WITHHELD
        - CASH_ADVANCE
        - PARENT_GUARANTEE
        - BANK_GUARANTEE
        - SECURITIES
    SecurityStatus:
      type: string
      description: >
        Security lifecycle. The public create derives `ACTIVE`, or `EXPIRED`
        when `expiryDate` is already past, and accepts no caller status. The
        list covers every row on the contract, including rows recorded through
        the internal expert surface, so the bind-slice values `REQUIRED`,
        `OUTSTANDING`, `PARTIAL`, `RELEASED`, and `BREACH` can appear.
        `OUTSTANDING` exists in the implemented internal lifecycle and the
        `contract_security` status check even though the public create never
        derives it (M-37).
      enum:
        - ACTIVE
        - REQUIRED
        - OUTSTANDING
        - PARTIAL
        - RELEASED
        - EXPIRED
        - BREACH
    Cession:
      type: object
      description: >
        A cession recorded on the contract. `sourceVertical` is fixed to
        ASSUMED; `policyRef` and `claimRef` are business references, not UUIDs.
      required:
        - id
        - tenantId
        - contractId
        - cessionNumber
        - sourceType
        - cessionType
        - status
        - recordedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        contractId:
          type: string
