  notes: >
    Bind is a command; PATCH /status to BOUND is 409 BIND_REQUIRES_COMMAND.
    Concurrency is body-based expectedVersion: there is no ETag and no
    Idempotency-Key. effectiveDate is the implemented name for the SPEC
    inception date. Cession source references are business strings, not UUIDs.
    Percentages are points of 100, not decimal fractions. Technical accounts
    are projected with accountId (the expert row id) and exclude tenantId; the
    expert generates accountNumber and the balance, and the only statuses are
    DRAFT, ISSUED, and SETTLED. Technical-account lines are projected with
    lineId (the expert row id is remapped by the domain) and accountId and
    exclude tenantId; lineType is the 13-value SPEC 11.3.4 detail enum (the
    retired aggregate LOSS is rejected on create), amount is strictly
    positive, and the list normalizes the expert `lines` array plus its
    per-line-type `totals` map and its authoritative four-bucket
    `bucketTotals` map into the public `items`, the four `totals` buckets, and
    the optional `totals.details` map. Lines are editable
    only in DRAFT (409 ACCOUNT_NOT_EDITABLE), and issuing a DRAFT account with
    lines reconciles each bucket total to the header (409
    ACCOUNT_LINES_DO_NOT_RECONCILE); the domain validates description at 300
    characters but the expert caps it at 255 (M-42). Period bordereaux are
    projected with
    bordereauId (the expert row id is remapped by the domain) and exclude
    tenantId; the expert generates bordereauNumber, the lifecycle is RECEIVED ->
    PROCESSED|FAILED, and PROCESSED links or creates the technical account for
    the period. Cash calls are projected with cashCallId (the expert row id is
    remapped by the domain) and exclude tenantId; the expert generates
    callNumber, the lifecycle is REQUESTED -> ISSUED -> SETTLED or
    REQUESTED -> CANCELLED, and both terminal states are immutable. The domain
    accepts an absent X-EIA-Book on the bordereau, technical-account, and
    cash-call routes even though the canonical contract requires ASSUMED (M-29,
    M-30, M-34). Security/collateral is the public `SecurityRecord` projection
    (id, securityType, requiredAmount, heldAmount, currency, providerPartyId,
    expiryDate, approvalRef, status, createdAt). The public create derives
    ACTIVE or EXPIRED and never accepts a caller status; the list can also
    return the internal bind-slice statuses, including OUTSTANDING. A status
    action moves ACTIVE, OUTSTANDING, PARTIAL, or REQUIRED to RELEASED or
    EXPIRED, and EXPIRED to RELEASED; RELEASED is terminal, BREACH is rejected,
    and the action writes contract.security.status-changed. The wide `Security`
    row and `CreateSecurityRequest` remain the internal expert contract. The
    domain accepts an absent X-EIA-Book on the security routes even though the
    canonical contract requires ASSUMED (M-37).
