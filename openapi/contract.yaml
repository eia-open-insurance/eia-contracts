        `callNumber` descending. A cash call is an interim funding request on
        one contract period and is not a Payment (SPEC 11.3.11). The tenant
        comes from `X-EIA-Tenant`. The Contract vertical is ASSUMED-only, so
        `X-EIA-Book` must be ASSUMED; another book is hidden as 404
        `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2). A missing tenant is 400; an
        unknown contract or another tenant's contract is 404.
