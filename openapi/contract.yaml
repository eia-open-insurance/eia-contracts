openapi: 3.1.0
info:
  title: EIA Contract API
  version: 4.3.0
  summary: Assumed-book reinsurance contract administration and the Contract expert API.
  description: >
    This document describes the implemented public Contract domain API and the
    internal Contract expert API. The authoritative requirement is SPEC 11.3
    and SPEC 12.

    The Contract vertical is ASSUMED book only. Round 5 adds the second slice:
    layers, participants, terms, security, cessions, commutations, and the bind
    command; the period-bordereau, technical-account, and cash-call slices
    follow. The contract header, dates, currency, lifecycle, layers,
    participants, terms, security, cessions, period bordereaux, commutations,
    technical accounts, and cash calls are implemented; endorsement, renewal,
    reinstatement, loss-aggregate, and lineage remain planned.

    Security/collateral is the public ten-field `SecurityRecord` projection.
    The create accepts `securityType`, `requiredAmount`, optional `heldAmount`,
    `currency`, optional `providerPartyId`, `expiryDate`, `approvalRef`, and
    `approvedAt`, derives `ACTIVE` or `EXPIRED`, and writes
    `contract.security.recorded` in the same transaction. A recorded item is
    then released or expired through
    `PATCH /api/v1/contracts/{contractId}/security/{securityId}/status`: a live
    record in `ACTIVE`, `OUTSTANDING`, `PARTIAL`, or `REQUIRED` can move to
    `RELEASED` or `EXPIRED`, an `EXPIRED` record can still be released, and
    `RELEASED` is terminal. The action writes
    `contract.security.status-changed` in the same transaction. The wider
    `Security` row and its bind-slice status vocabulary remain internal-only
    (M-37).

    A period bordereau is the cedent's financial schedule for one contract
    period. It is created in RECEIVED with the declared premium, loss,
    commission, and other-charge totals, and is then either PROCESSED (which
    creates or reuses the technical account for the same period and links it)
    or FAILED. Both terminal states are immutable. The legacy source-document
    ingest header remains an internal expert surface on the same table.

    A technical account is the periodic financial statement of the treaty. The
    expert generates `accountNumber` as `TA-{year}-{sequence}`, derives
    `balance = cededPremium - commission - cededLosses + otherCharges`, and
    exposes every money field as a decimal string (SPEC 10.3). A positive
    balance is due from the cedent to the reinsurer. The account is created in
    DRAFT and moves DRAFT -> ISSUED -> SETTLED. The SPEC 11.3.4
    `technical_account_line` detail is implemented under
    `.../{accountId}/lines`: a line names one of the 13 SPEC detail types and
    is editable only while the account is DRAFT. Every type rolls into one of
    four reconciliation buckets (premium, loss, commission, other), and issuing
    an account that has lines requires each bucket total to equal the matching
    header amount (`ACCOUNT_LINES_DO_NOT_RECONCILE`, M-42). The SPEC 11.3.10
    `/accounts` route is exposed as `/technical-accounts` (M-29).

    A cash call is an interim funding request on one contract period. The expert
    generates `callNumber` as `CC-{year}-{sequence}`, creates the row in
    REQUESTED, and moves it REQUESTED -> ISSUED -> SETTLED or
    REQUESTED -> CANCELLED; both terminal states are immutable. A cash call is
    not a Payment: Payment and FS-RI own execution (SPEC 11.3.11). SPEC 11.3.10
    defines no cash-call route and SPEC 11.3.9 publishes only
    `contract.cash-call.issued`, so the implemented route and the three other
    child facts are recorded in M-34.

    Bind is a command, not a status transition. `PATCH /status` to `BOUND` is
    rejected with 409 `BIND_REQUIRES_COMMAND`; `POST /bind` enforces the tower,
    share, term, security, and approval preconditions and is the only way to
    reach `BOUND`. The eligibility snapshot is available from
    `GET /bind-eligibility`.

    The implemented Contract services emit a compact `ApiError` body of
    `{code, message, details[]}` rather than the canonical Problem envelope;
    see MISMATCHES.md. Money and percentages are decimal strings (SPEC 10.3).
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://contract-domain:8086
    description: Contract domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Contract
    description: Public domain API used by the Contract web remote.
  - name: Contract internal
    description: Internal expert API. Not exposed through the gateway; called only by the Contract domain service.
paths:
  /api/v1/contracts:
    get:
      operationId: listContracts
      tags:
        - Contract
      summary: List contracts for the caller's tenant.
      description: >
        Returns a bare JSON array. Free-text search is served by
        `GET /api/v1/contracts/search`; filtering and cursor pagination from
        SPEC 11.3.10 and SPEC 7.6 remain planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Contracts of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContract
      tags:
        - Contract
      summary: Create a contract draft.
      description: >
        Creates a contract in DRAFT. The contract number is supplied by the
        caller and must be unique per tenant. `contractType` must be one of the
        SPEC 11.3.5 types.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Contract created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/search:
    get:
      operationId: searchContracts
      tags:
        - Contract
      summary: Search contracts for the caller's tenant and ASSUMED book.
      description: >
        Global-search projection used by the shell and by the contract pickers.
        Matching is a case-insensitive contains over `contractNumber` and
        `contractType`; an absent or blank `q` returns the most recently updated
        contracts. The response is the shared `SearchResponse` envelope. The
        Contract vertical is ASSUMED-only, so `X-EIA-Book` is required and must
        be ASSUMED; another book is hidden as 404 `BOOK_SCOPE_VIOLATION`
        (SPEC 3.6.2). A missing tenant or book or a `limit` outside 1-25 is a
        400 `application/problem+json` Problem.
      x-search-type: CONTRACT
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching contracts, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}:
    get:
      operationId: getContract
      tags:
        - Contract
      summary: Get a contract.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contract detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/status:
    patch:
      operationId: updateContractStatus
      tags:
        - Contract
      summary: Advance a contract through its lifecycle.
      description: >
        Applies one transition from SPEC 11.3.6. `expectedVersion` is required
        and a mismatch returns 409 CONCURRENT_MODIFICATION.

        `BOUND` is not reachable here. A request with `status: BOUND` is
        rejected with 409 `BIND_REQUIRES_COMMAND`; use `POST /bind` so the
        tower, share, term, security, and approval preconditions are enforced.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContractStatusRequest'
      responses:
        '200':
          description: Contract after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/layers:
    get:
      operationId: listContractLayers
      tags:
        - Contract
      summary: List the layer tower.
      description: >
        Returns a bare array ordered by `layerNumber`. CTR-02 rejects an
        overlapping tower and CTR-03 requires the aggregate limit to be at
        least the layer limit.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Layers of the contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Layer'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractLayer
      tags:
        - Contract
      summary: Record a layer.
      description: >
        `layerType`, `limitBasis`, `reinstatementType`, and `status` are closed
        enumerations. The layer dates must fall inside the contract term and
        `currency` must equal the contract currency; `attachmentAmount` is the
        layer attachment and `limitAmount` must be greater than zero. A gap
        between layers is accepted only when `note` explains it (CTR-02). An
        overlap is 409 `LAYER_OVERLAP`; an unknown enumeration or a malformed
        date range is 400.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLayerRequest'
      responses:
        '201':
          description: Layer recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/layers/summary:
    get:
      operationId: getContractLayerSummary
      tags:
        - Contract
      summary: Get the tower summary.
      description: >
        `layerCount` counts live layers, `capacity` is their summed limit, and
        `gaps` lists the documented gaps between consecutive layers.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tower summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TowerSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/participants:
    get:
      operationId: listContractParticipants
      tags:
        - Contract
      summary: List participations.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Participations of the contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractParticipant
      tags:
        - Contract
      summary: Record a participation.
      description: >
        `sharePct` is a percentage of 100 (six decimal places). CTR-01 requires
        the active shares of a contract or of each layer to total 100 +/- 0.0001
        before bind, and a share may not push the band above 100
        (`SHARES_EXCEED_100`). `signedLinePct` may not exceed `sharePct`; a
        LEAD participant requires `leadFlag`. A missing `partyId` or a share
        outside 0..100 is 400.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipantRequest'
      responses:
        '201':
          description: Participation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/terms:
    get:
      operationId: listContractTerms
      tags:
        - Contract
      summary: List contract terms.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Terms of the contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Term'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractTerm
      tags:
        - Contract
      summary: Record a contract term.
      description: >
        `termCode` is one of the closed SPEC 11.3.4 financial-term codes and the
        stored `termValue` is normalized to the code's value type (MONEY,
        PERCENT, TEXT, DATE, INTEGER, BOOLEAN). The expert records one live term
        per code; the required set depends on `contractType` and is reported by
        `/terms/requirements`. An unknown code is 400.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTermRequest'
      responses:
        '201':
          description: Term recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Term'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/terms/requirements:
    get:
      operationId: getContractTermRequirements
      tags:
        - Contract
      summary: Get the required terms for the contract type.
      description: >
        Returns the full required set and the subset still missing. Bind fails
        with `REQUIRED_TERMS_PRESENT` while `missing` is non-empty.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Required and missing term codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TermRequirements'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/security:
    get:
      operationId: listContractSecurity
      tags:
        - Contract
      summary: List security and collateral records.
      description: >
        Returns a bare JSON array of the contract's security records, newest
        first (`created_at` descending, then `id` descending). The tenant comes
        from
        `X-EIA-Tenant`; an unknown contract or another tenant's contract is
        404 `NOT_FOUND`. The canonical book is ASSUMED: another book is hidden
        as 404 `BOOK_SCOPE_VIOLATION`. The domain currently accepts an absent
        `X-EIA-Book` for compatibility with the other Contract proxy routes
        (M-37). The list covers every row on the contract, including rows
        recorded through the internal expert surface, so a legacy or internal
        row can carry the bind-slice statuses (`REQUIRED`, `OUTSTANDING`,
        `PARTIAL`, `RELEASED`, `BREACH`); the public create itself derives
        `ACTIVE` or `EXPIRED`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Security records of the contract, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecurityRecord'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractSecurity
      tags:
        - Contract
      summary: Record security or collateral.
      description: >
        Records one collateral item against the ASSUMED contract and returns
        the ten-field `SecurityRecord` with 201. The expert derives `status`:
        `EXPIRED` when `expiryDate` is before today, otherwise `ACTIVE`;
        `status` is not a request field. `heldAmount` defaults to `0.0000`.
        `currency` is required and must equal the contract currency, otherwise
        the create is 409 `SECURITY_CURRENCY_MISMATCH`. When `heldAmount`
        exceeds `requiredAmount`, both `approvalRef` and `approvedAt` are
        required: a missing reference is 409 `COLLATERAL_EXCEEDS_OBLIGATION`
        and a missing timestamp is 409 `COLLATERAL_APPROVAL_INCOMPLETE`.
        `requiredAmount` must be greater than zero; malformed values are 400
        `INVALID_SECURITY_TYPE`, `INVALID_REQUIRED_AMOUNT`,
        `INVALID_HELD_AMOUNT`, `INVALID_CURRENCY`, or `INVALID_APPROVAL_REF`.
        The contract must be DRAFT, QUOTED, PLACED, or BOUND; another lifecycle
        state is 409 `CONTRACT_LOCKED`. A missing or malformed tenant is 400
        `MISSING_TENANT`. An unknown or other-tenant contract is
        404 `NOT_FOUND`, and a supplied non-ASSUMED book is 404
        `BOOK_SCOPE_VIOLATION`. The record and `contract.security.recorded`
        are written in one transaction, so a rollback leaves neither behind.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContractSecurityRequest'
      responses:
        '201':
          description: Security record created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityRecord'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/security/{securityId}/status:
    patch:
      operationId: updateContractSecurityStatus
      tags:
        - Contract
      summary: Release or expire a security record.
      description: >
        Applies one terminal action to a security/collateral record. A live
        record in `ACTIVE`, `OUTSTANDING`, `PARTIAL`, or `REQUIRED` can move to
        `RELEASED` or `EXPIRED`, and an `EXPIRED` record can still move to
        `RELEASED`. `RELEASED` is terminal, so a repeated release and every
        action on an already released record are 409
        `INVALID_STATUS_TRANSITION`. `BREACH` is the collateral-breach state
        recorded by the checks, not a lifecycle action: a breached record cannot
        be released or expired (409 `INVALID_STATUS_TRANSITION`), and `BREACH`
        is not an accepted target (400 `INVALID_STATUS`).

        `status` is required; the value is trimmed and upper-cased. Any target
        outside `RELEASED` and `EXPIRED` is 400 `INVALID_STATUS`. The record is
        tenant- and contract-scoped, so an unknown contract, an unknown
        security, another tenant's record, and a security id under another
        contract are 404 `NOT_FOUND`. A compare-and-set that loses a concurrent
        status change is 409 `INVALID_STATUS_TRANSITION`. The `status` and
        `updated_at` row update and the `contract.security.status-changed`
        outbox fact share one transaction, so a rejected action writes neither.
        The action is not blocked by the contract lifecycle and is available in
        every contract state, unlike the create.

        `X-EIA-Tenant` is required. The canonical book is ASSUMED: another book
        is hidden as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2), and the domain
        currently accepts an absent header for compatibility with the other
        Contract proxy routes (M-37).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: securityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContractSecurityStatusRequest'
      responses:
        '200':
          description: Security record after the status action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityRecord'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/cessions:
    get:
      operationId: listContractCessions
      tags:
        - Contract
      summary: List cessions recorded on the contract.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cessions of the contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractCession
      tags:
        - Contract
      summary: Record a cession.
      description: >
        `sourceVertical` must be ASSUMED (the book wall; a DIRECT value is 400
        `BOOK_WALL_VIOLATION`). `sourceType` is POLICY, CLAIM, or LOSS_ADVICE;
        a CLAIM cession requires `claimRef` and a POLICY cession requires
        `policyRef`. At least one of `cededPremiumAmount` and `cededLossAmount`
        is required (`CES_AMOUNT_REQUIRED`). CTR-04 rejects a ceded loss above
        the available contract or layer limit with
        `CESSION_EXCEEDS_CONTRACT_LIMIT`; CTR-05 rejects active cessions above
        100% per source with `CESSION_EXCEEDS_SOURCE_SHARE`. A cession requires
        a BOUND or later contract (`CONTRACT_NOT_INCEPTED`) and no security in
        breach.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCessionRequest'
      responses:
        '201':
          description: Cession recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cession'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/bordereaux:
    get:
      operationId: listContractBordereaux
      tags:
        - Contract
      summary: List the period bordereaux of a contract.
      description: >
        Returns a bare array ordered by `periodStart` descending, then
        `periodEnd` and `createdAt` descending. Only period bordereaux are
        returned; the legacy source-document ingest header is internal. The
        tenant comes from `X-EIA-Tenant`. The Contract vertical is ASSUMED-only,
        so `X-EIA-Book` must be ASSUMED; another book is hidden as 404
        `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2). A missing tenant is 400; an unknown
        contract, another tenant's contract, or a contract in another book is
        404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Period bordereaux of the contract, newest period first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bordereau'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractBordereau
      tags:
        - Contract
      summary: Record a received period bordereau.
      description: >
        Creates the bordereau in RECEIVED. `periodStart` must be before
        `periodEnd`, `receivedDate` and `currency` are required (uppercase ISO
        4217), and the four declared amounts plus `lineCount` are required and
        non-negative. `bordereauNumber` is generated as
        `BRD-{year}-{sequence}` and `status` starts at RECEIVED; neither is
        accepted from the caller. The exact `(tenant, contract, periodStart,
        periodEnd)` period is unique, so a duplicate is 409
        `DUPLICATE_BORDEREAU_PERIOD`. The write and its
        `contract.bordereau.received` outbox event share one transaction.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBordereauRequest'
      responses:
        '201':
          description: Bordereau recorded in RECEIVED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bordereau'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `DUPLICATE_BORDEREAU_PERIOD` when a period bordereau already
            exists for the exact tenant, contract, and period.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/bordereaux/{bordereauId}/status:
    patch:
      operationId: updateContractBordereauStatus
      tags:
        - Contract
      summary: Record the terminal outcome of a period bordereau.
      description: >
        Applies only RECEIVED -> PROCESSED or RECEIVED -> FAILED. The request
        accepts `PROCESSED` or `FAILED`; `RECEIVED` is the creation state and is
        400 `INVALID_STATUS`. Processing creates or reuses the DRAFT technical
        account for the same contract period and links it through
        `technicalAccountId`; failing records that the bordereau could not be
        processed and creates no account. Both terminal states are immutable,
        so a skipped or repeated edge is 409 `INVALID_STATUS_TRANSITION`. The
        row update, the technical-account write when one is needed, and the
        `contract.bordereau.processed` or `contract.bordereau.failed` outbox
        event share one transaction.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bordereauId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBordereauStatusRequest'
      responses:
        '200':
          description: Bordereau after the terminal transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bordereau'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `INVALID_STATUS_TRANSITION` when the bordereau is already
            terminal, when the requested edge is not RECEIVED -> PROCESSED or
            RECEIVED -> FAILED, or when a concurrent change won the update.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/commutations:
    get:
      operationId: listContractCommutations
      tags:
        - Contract
      summary: List commutations.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Commutations of the contract.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractCommutation
      tags:
        - Contract
      summary: Propose a commutation.
      description: >
        `valuationDate` may not be after `effectiveDate`. A commutation can be
        proposed from BOUND, SIGNED, IN_FORCE, ENDORSED, EXPIRED, or RUNOFF
        (409 `COMMUTATION_NOT_PERMITTED` otherwise). `commutationType` and
        `basis` are closed enumerations.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommutationRequest'
      responses:
        '201':
          description: Commutation proposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/commutations/{commutationId}/approve:
    post:
      operationId: approveContractCommutation
      tags:
        - Contract
      summary: Approve a proposed commutation.
      description: >
        `approvedBy` is required. Only a PROPOSED commutation can be approved;
        any other status is 409 `COMMUTATION_NOT_PROPOSED`. COM-01 requires the
        approval before execution.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commutationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCommutationRequest'
      responses:
        '200':
          description: Commutation approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/commutations/{commutationId}/execute:
    post:
      operationId: executeContractCommutation
      tags:
        - Contract
      summary: Execute an approved commutation and close the contract.
      description: >
        Only an APPROVED commutation can be executed (409
        `COMMUTATION_NOT_APPROVED`). CTR-12 requires a signed release: a
        `releaseDocumentId` must be recorded, either on the commutation or in
        the execute command. Execution releases the outstanding security,
        records `releasedSecurities`, moves a FULL commutation through COMMUTED
        to CLOSED, and sets `contractClosed`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commutationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCommutationRequest'
      responses:
        '200':
          description: Commutation executed and the contract closed when applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommutationExecution'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/technical-accounts:
    get:
      operationId: listContractTechnicalAccounts
      tags:
        - Contract
      summary: List the contract's technical accounts.
      description: >
        Returns a bare array ordered by `periodStart` descending, then
        `periodEnd` and `createdAt` descending. The tenant comes from
        `X-EIA-Tenant`. The Contract vertical is ASSUMED-only, so `X-EIA-Book`
        must be ASSUMED; another book is hidden as 404 `BOOK_SCOPE_VIOLATION`
        (SPEC 3.6.2). An absent book header is accepted by the domain for
        compatibility with the other Contract proxy routes (M-29).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Technical accounts of the contract, newest period first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TechnicalAccount'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createContractTechnicalAccount
      tags:
        - Contract
      summary: Produce a technical account for one period.
      description: >
        Creates the account in DRAFT. `accountNumber` is generated as
        `TA-{year}-{sequence}` and `balance` is derived as
        `cededPremium - commission - cededLosses + otherCharges`; neither is
        accepted from the caller. `periodStart` must be before `periodEnd`,
        `currency` must be an uppercase ISO 4217 code, and all four amounts are
        required and non-negative. The account is unique per tenant, contract,
        and exact period; a duplicate period is 409
        `DUPLICATE_TECHNICAL_ACCOUNT_PERIOD`. The write and its
        `contract.technical-account.created` outbox event are one transaction.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTechnicalAccountRequest'
      responses:
        '201':
          description: Technical account produced and opened in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAccount'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `DUPLICATE_TECHNICAL_ACCOUNT_PERIOD` when an account already
            exists for the exact tenant, contract, and period.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/technical-accounts/{accountId}/status:
    patch:
      operationId: updateContractTechnicalAccountStatus
      tags:
        - Contract
      summary: Advance a technical account through its lifecycle.
      description: >
        Applies one transition: DRAFT -> ISSUED or ISSUED -> SETTLED. The
        request only accepts `ISSUED` or `SETTLED`; `DRAFT` is the creation
        state and is 400 `INVALID_STATUS`. Skipping a step, repeating a terminal
        status, or a concurrent change is 409 `INVALID_STATUS_TRANSITION`.

        Issuing also reconciles the line detail (SPEC 11.3.4
        `technical_account_line`). When at least one line exists, the lines are
        summed into four buckets and each bucket total must equal its matching
        header component: `premium` = `cededPremium`, `loss` = `cededLosses`,
        `commission` = `commission`, and `other` = `otherCharges`. The bucket
        mapping is fixed: `PREMIUM` -> `premium`; `PAID_LOSS`,
        `OUTSTANDING_LOSS`, `IBNR`, `ALAE`, `REINSTATEMENT`, and `CASH_CALL` ->
        `loss`; `COMMISSION` and `BROKERAGE` -> `commission`; and
        `FUNDS_WITHHELD`, `TAX`, `ADJUSTMENT`, and `OTHER` -> `other`. Any
        mismatch rejects the transition with 409
        `ACCOUNT_LINES_DO_NOT_RECONCILE`, carrying one `details[]` entry per
        offending bucket (field `PREMIUM`, `LOSS`, `COMMISSION`, or `OTHER`)
        whose message names the contributing line types; the account stays
        DRAFT and no event is written. An account with no lines (a header-only
        account, including one linked by a processed period bordereau) remains
        issuable.

        A successful transition appends `contract.technical-account.issued` or
        `contract.technical-account.settled` to the outbox in the same
        transaction as the row update. The account lock makes the reconciliation
        and the status write atomic with respect to concurrent line changes;
        after ISSUED the line detail is immutable and every add or delete is
        409 `ACCOUNT_NOT_EDITABLE`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTechnicalAccountStatusRequest'
      responses:
        '200':
          description: Technical account after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAccount'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `INVALID_STATUS_TRANSITION` when the requested edge is not
            DRAFT -> ISSUED or ISSUED -> SETTLED, including a concurrent change.
            `ACCOUNT_LINES_DO_NOT_RECONCILE` when issuing an account that has
            lines and at least one bucket total differs from the matching
            header component; `details[]` names each offending bucket and the
            line types that roll into it.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/technical-accounts/{accountId}/lines:
    get:
      operationId: listContractTechnicalAccountLines
      tags:
        - Contract
      summary: List the line detail and bucket totals of a technical account.
      description: >
        Returns the account's lines plus the four bucket totals used by the
        issue reconciliation and the optional per-line-type detail. `items` is
        in insertion order (`createdAt`, then line id); `totals` always carries
        the buckets `premium`, `loss`, `commission`, and `other`, with a zero
        amount for a bucket that has no line. `totals.details` is an optional
        map from each present line type to its summed amount and is omitted
        when the account has no line detail. Each line type maps to exactly one
        bucket: `PREMIUM` -> `premium`; `PAID_LOSS`, `OUTSTANDING_LOSS`,
        `IBNR`, `ALAE`, `REINSTATEMENT`, and `CASH_CALL` -> `loss`;
        `COMMISSION` and `BROKERAGE` -> `commission`; and `FUNDS_WITHHELD`,
        `TAX`, `ADJUSTMENT`, and `OTHER` -> `other`. Money is a decimal string
        (SPEC 10.3). The account header does not embed the lines; this
        operation is the detail read.

        The four buckets are the reconciliation view and map to the account
        header as `premium` -> `cededPremium`, `loss` -> `cededLosses`,
        `commission` -> `commission`, and `other` -> `otherCharges`. The
        expert returns an authoritative `bucketTotals` map with those four
        keys; the domain normalizes it into the public `totals` buckets (and,
        when it is absent, derives them from the detailed totals or the line
        rows). `totals.details` keeps the expert's per-line-type `totals`
        breakdown. A legacy aggregate `LOSS` total from an older projection is
        folded into `loss`.

        `X-EIA-Tenant` is required and `X-EIA-Book` must be ASSUMED; another
        book is hidden as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2, WALL-06). The
        query is scoped by tenant, contract, and account, so an unknown
        contract, an unknown account, an account under another contract, and
        another tenant's account are all 404. The read is available in every
        account status; editing is not.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lines and bucket totals of the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: addContractTechnicalAccountLine
      tags:
        - Contract
      summary: Add a line to a DRAFT technical account.
      description: >
        Records one financial line on the account and returns it with 201.
        `lineType` is required and is one of the 13 SPEC 11.3.4 detail types:
        `PREMIUM`, `COMMISSION`, `BROKERAGE`, `PAID_LOSS`, `OUTSTANDING_LOSS`,
        `IBNR`, `ALAE`, `REINSTATEMENT`, `CASH_CALL`, `FUNDS_WITHHELD`, `TAX`,
        `ADJUSTMENT`, or `OTHER` (trimmed and case-insensitive). The retired
        aggregate `LOSS` is rejected with 400 `INVALID_LINE_TYPE`; post
        `PAID_LOSS` instead. `amount` is required and must be strictly
        positive. `reference` and `description` are optional, trimmed, and
        treated as absent when blank; `reference` is at most 64 characters and
        `description` at most 255. The tenant comes from
        `X-EIA-Tenant`, the contract and account from the path, and the line id
        and `createdAt` are server-derived, so none of them is accepted in the
        body.

        Lines can be added only while the account is DRAFT; an ISSUED or
        SETTLED account is 409 `ACCOUNT_NOT_EDITABLE`. An unknown contract,
        account, or an account under another contract is 404. The write and its
        `contract.technical-account.line-added` outbox fact share one
        transaction, so a rejected request leaves neither behind. The account
        header amounts are not changed by a line; they are reconciled at issue
        (409 `ACCOUNT_LINES_DO_NOT_RECONCILE`).

        `X-EIA-Tenant` is required and `X-EIA-Book` must be ASSUMED; another
        book is hidden as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2, WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTechnicalAccountLineRequest'
      responses:
        '201':
          description: Line added to the DRAFT account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalAccountLine'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `ACCOUNT_NOT_EDITABLE` when the account is ISSUED or SETTLED;
            lines can only be added while it is DRAFT.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/contracts/{contractId}/technical-accounts/{accountId}/lines/{lineId}:
    delete:
      operationId: removeContractTechnicalAccountLine
      tags:
        - Contract
      summary: Remove a line from a DRAFT technical account.
      description: >
        Deletes one line and returns 204 with no body. The line is scoped by
        tenant, contract, and account, so an unknown contract, unknown account,
        unknown line, a line under another account, and another tenant's record
        are all 404. Lines can be removed only while the account is DRAFT; an
        ISSUED or SETTLED account is 409 `ACCOUNT_NOT_EDITABLE`. The delete and
        its `contract.technical-account.line-removed` outbox fact share one
        transaction, so a rejected request leaves neither behind.

        `X-EIA-Tenant` is required and `X-EIA-Book` must be ASSUMED; another
        book is hidden as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2, WALL-06).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: contractId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lineId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Line removed.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
