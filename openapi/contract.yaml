      summary: Advance a cash call through its lifecycle.
      description: >
        Applies only REQUESTED -> ISSUED, REQUESTED -> CANCELLED, or
        ISSUED -> SETTLED. The request accepts `ISSUED`, `SETTLED`, or
        `CANCELLED`; `REQUESTED` is the creation state and is 400
