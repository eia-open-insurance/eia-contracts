  breaking:
    - The public GET/POST /api/v1/contracts/{contractId}/security operations now use the ten-field SecurityRecord response and the CreateContractSecurityRequest body. The wide Security and CreateSecurityRequest schemas are internal-expert only; a generated client of the old public Security shape must move to SecurityRecord.
    - PATCH /api/v1/contracts/{contractId}/status no longer accepts BOUND (since 2.0.0); it returns 409 BIND_REQUIRES_COMMAND and bind must use POST /bind.
    - The public GET/POST /api/v1/contracts/{contractId}/bordereaux operations now use the period-bordereau Bordereau projection. The legacy source-document ingest header moved to the internal-only BordereauHeader schema and /internal/v1 routes; a client generated from the old public BordereauHeader shape must move to the period-bordereau fields.
  compatible:
    - Adds GET /api/v1/contracts/search returning the shared SearchResponse envelope.
    - Adds the layers, participants, terms, security, cessions, commutations, bind-eligibility, and bind routes.
    - Adds the expert routes that mirror the public second slice.
    - Adds PATCH /api/v1/contracts/{contractId}/bordereaux/{bordereauId}/status with the UpdateBordereauStatusRequest schema and the BordereauStatus lifecycle.
    - Adds GET/POST /api/v1/contracts/{contractId}/technical-accounts and PATCH /api/v1/contracts/{contractId}/technical-accounts/{accountId}/status with the TechnicalAccount, CreateTechnicalAccountRequest, UpdateTechnicalAccountStatusRequest, and TechnicalAccountStatus schemas.
    - Adds GET/POST /api/v1/contracts/{contractId}/cash-calls and PATCH /api/v1/contracts/{contractId}/cash-calls/{cashCallId}/status with the CashCall, CashCallStatus, CreateCashCallRequest, and UpdateCashCallStatusRequest schemas.
    - Documents the implemented derived ACTIVE/EXPIRED security status, the OUTSTANDING bind-slice value, and the contract.security.recorded event; the HTTP security paths are unchanged.
    - Adds PATCH /api/v1/contracts/{contractId}/security/{securityId}/status with the UpdateContractSecurityStatusRequest schema and the RELEASED/EXPIRED security lifecycle.
    - Adds GET/POST /api/v1/contracts/{contractId}/technical-accounts/{accountId}/lines and DELETE .../lines/{lineId} with the TechnicalAccountLine, TechnicalAccountLineType, LineSummary, TechnicalAccountLineTotals, and CreateTechnicalAccountLineRequest schemas. The technical-account status description now documents issue-time line reconciliation.
    - Expands TechnicalAccountLineType to the 13 SPEC 11.3.4 detail types, adds the optional LineSummary totals.details per-line-type map, and documents that the expert's authoritative four-key bucketTotals map is normalized into the public premium/loss/commission/other buckets. The issue reconciliation now compares bucket sums with the header components. The retired aggregate LOSS is removed from the create enum: a client that posted LOSS must post PAID_LOSS, while a legacy LOSS total is still read into the loss bucket.
  note: >
    Search, technical accounts, and cash calls are additive. The
    period-bordereau slice replaces the previously documented public bordereau
    header with the financial period projection, so the contract takes a major
    version even though the HTTP path is unchanged; the legacy ingest header
    stays available on the internal expert surface. The bind guard is a
    deliberate breaking change introduced in 2.0.0 for a client that used the
    status endpoint to bind without approvals; it is the SPEC 11.3.8 command
    contract. The security/public projection correction in 4.0.0 removes the
    internal-only row fields from the public response and request, so a
    generated client of the old public shape must move to SecurityRecord and
    CreateContractSecurityRequest. The security status action in 4.1.0 is
    additive: it adds one path and one request schema and changes no response
    field. Technical-account lines in 4.2.0 are additive: they add two paths
    and five schemas and change no existing request or response field; the one
    behavioural addition is the issue-time reconciliation, which rejects an
    issue that the header alone would have accepted when the account has line
    detail. The 4.3.0 line expansion keeps both paths and four bucket members
    unchanged: it widens the detail enum, adds the optional details map, and
    rebuilds the reconciliation on the four buckets. The aggregate LOSS create
    value introduced in 4.2.0 is retired in this release, so a client that
    posted LOSS must move to PAID_LOSS; a legacy LOSS total from an older
    projection is still read into loss. The HTTP base path stays
    /api/v1/contracts.
