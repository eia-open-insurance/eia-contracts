components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Document:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Document metadata projection. The SPEC 11.6.4 model calls the type
        docType and the classification confidentiality, and carries content,
        versions, associations, hashes, page counts, OCR status, and tags; the
        implemented field names are documentType and classification. The hold
        and disposition members are null unless the document is on hold or has
        been disposed; a release clears the three hold members and a hold
        snapshots the prior status in statusBeforeHold.
      required:
        - id
        - tenantId
        - documentNumber
        - title
        - documentType
        - classification
        - status
        - retentionUntil
        - holdReason
        - heldAt
        - statusBeforeHold
        - disposedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        documentNumber:
          type: string
          examples:
            - DOC-2026-0000001
        title:
          type: string
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retentionUntil:
          type: [string, 'null']
          format: date
          description: Retention end date. Required before a document becomes ACTIVE.
        holdReason:
          type: [string, 'null']
          maxLength: 500
          description: >
            Reason recorded by the most recent accepted legal hold. Null when
            the document has never been held or the hold has been released.
        heldAt:
          type: [string, 'null']
          format: date-time
          description: >
            Instant at which the current legal hold was placed. Null when the
            document is not on hold.
        statusBeforeHold:
          description: >
            Status the document had immediately before the current legal hold,
            restored by a release. Null when the document is not on hold and
            after a release. An absent or unrecognised snapshot is restored as
            ARCHIVED.
          oneOf:
            - $ref: '#/components/schemas/DocumentStatus'
            - type: 'null'
        disposedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Instant at which the document was disposed. Null until disposition;
            the tombstoned metadata remains readable afterwards. A disposition
            also tombstones live stored content in the same transaction.
    DocumentContent:
      type: object
      description: >
        Metadata of the bytes currently stored for a document. The bytes are
        not part of the projection; use `GET
        /api/v1/documents/{documentId}/content` to stream them. The digest is
        computed over the exact stored bytes and is repeated in the download's
        `X-Content-SHA256` header, so a caller can verify the transfer.
        `currentVersion` names the newest retained revision, which is the
        revision returned by the current download. `deletedAt` is null while the
        content is downloadable and carries the tombstone instant after
        `DELETE .../content` or a disposition; `deleted` is its derived boolean
        form. A tombstoned document keeps the filename, MIME type, size, digest,
        upload instant, and revision number, so this projection remains readable
        after the bytes are gone.
      required:
        - documentId
        - fileName
        - contentType
        - sizeBytes
        - sha256
        - uploadedAt
        - currentVersion
        - deletedAt
        - deleted
      properties:
        documentId:
          type: string
          format: uuid
          description: Owning document, within the caller's tenant.
        fileName:
          type: string
          maxLength: 255
          description: >
            Stored display filename. Any directory component supplied on
            upload is removed before the name is stored.
          examples:
            - policy schedule.pdf
        contentType:
          type: string
          maxLength: 128
          description: >
            Stored file MIME type without parameters, for example
            `application/pdf`. Defaults to `application/octet-stream` when the
            upload omits `Content-Type`.
          examples:
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10485760
          description: Exact size of the stored content in bytes. The maximum is 10 MiB.
          examples:
            - 27
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase hexadecimal SHA-256 digest of the stored bytes.
          examples:
            - 9f2c5d0f8f0d1c9a5f0f0f3a6b8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f607182
        uploadedAt:
          type: string
          format: date-time
          description: Instant of the most recent accepted upload.
          examples:
            - '2026-10-20T09:30:00Z'
        currentVersion:
          type: integer
          format: int64
          minimum: 1
          description: >
            Revision number of the stored bytes, starting at 1 for the first
            upload and increasing by one per accepted upload. It is the newest
            entry in the retained history and the value carried by the current
            download's `X-Content-Version` header.
          examples:
            - 2
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: >
            Instant at which the content was tombstoned by a standalone `DELETE
            .../content` or by a disposition, or null while the bytes are
            downloadable. The tombstone clears the bytes of the current pointer
            and of every not-yet-deleted revision but keeps the metadata. A
            later upload clears this pointer value and appends a fresh,
            non-deleted revision; earlier revisions keep their own deletion
            timestamps.
          examples:
            - '2026-10-22T10:15:00Z'
        deleted:
          type: boolean
          description: >
            Derived flag, true exactly when `deletedAt` is non-null. It lets a
            consumer test one field without a null check; it is never supplied
            by the caller and is not stored.
          examples:
            - false
    DocumentContentVersion:
      type: object
      description: >
        Metadata of one immutable content revision retained for a document. The
        bytes are not part of the projection; use `GET
        /api/v1/documents/{documentId}/content/versions/{version}` to stream
        them. `version` is also the aggregate version of the
        `document.content.uploaded` fact written with the revision.
      required:
        - documentId
        - version
        - fileName
        - contentType
        - sizeBytes
        - sha256
        - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
          description: Owning document, within the caller's tenant.
        version:
          type: integer
          format: int64
          minimum: 1
          description: >
            Revision number, starting at 1 for the first upload and increasing
            by one per accepted upload.
          examples:
            - 1
        fileName:
          type: string
          maxLength: 255
          description: >
            Display filename stored with this revision. Any directory component
            supplied on upload was removed before the name was stored.
          examples:
            - policy schedule.pdf
        contentType:
          type: string
          maxLength: 128
          description: >
            Stored file MIME type without parameters, for example
            `application/pdf`.
          examples:
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10485760
          description: Exact size of the revision in bytes. The maximum is 10 MiB.
          examples:
            - 27
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase hexadecimal SHA-256 digest of the revision bytes.
          examples:
            - 9f2c5d0f8f0d1c9a5f0f0f3a6b8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f607182
        uploadedAt:
          type: string
          format: date-time
          description: Instant at which this revision was accepted.
          examples:
            - '2026-10-20T09:30:00Z'
