openapi: 3.1.0
info:
  title: EIA Document API
  version: 1.7.0
  summary: Document metadata, lifecycle, association-link, content, content-tombstone, legal-hold, and disposition administration and the Document expert API.
  description: >
    This document describes the implemented public Document domain API and the
    internal Document expert API. The authoritative requirement is SPEC 11.6
    and SPEC 12; the implemented surface is the first vertical slice.

    The slice carries metadata, lifecycle, association links, the current
    content bytes, the retained content-revision history, legal holds, and
    retention disposition. Renditions, OCR text, packages, requests,
    signatures, the SPEC hold collection, and the approved disposition
    workflow from SPEC 11.6 are planned and listed under x-planned-operations.

    The 2026-10-20 content slice adds the raw `PUT|GET
    /api/v1/documents/{documentId}/content` routes, `GET
    /api/v1/documents/{documentId}/content/metadata`, the `DocumentContent`
    projection, the `X-File-Name` upload header, and the
    `document.content.uploaded` event. The upload replaced the stored bytes (an
    upsert) in that slice, is capped at 10 MiB, rejects an empty body, and
    returns the metadata projection; the download streams the bytes with
    `Content-Type`, `Content-Disposition`, `X-Content-SHA256`, and
    `X-Content-Version`. Both public routes require `X-EIA-Tenant`; the expert also accepts `tenantId` as
    a fallback. The SPEC 11.6.10 presigned download and the renditions remain
    planned.

    The 2026-10-21 version slice appends every accepted upload as an immutable
    content revision. `GET /api/v1/documents/{documentId}/content/versions`
    lists the revisions newest first and `GET
    /api/v1/documents/{documentId}/content/versions/{version}` streams one
    revision with the same representation headers as the current download. The
    `DocumentContent` projection and the upload response carry `currentVersion`;
    the `document.content.uploaded` payload carries the revision as `version`
    while the event keeps `eventVersion` 1. No event name is added. The SPEC
    11.6.10 version routes are `/versions` (GET and POST); the implemented
    history is nested under `/content/versions` and the version-creating
    command is the content upload (MISMATCHES.md M-40).

    The 2026-10-21 hold/disposition slice adds `POST
    /api/v1/documents/{documentId}/hold` with a required `{reason}`, `POST
    /api/v1/documents/{documentId}/hold/release`, and `POST
    /api/v1/documents/{documentId}/dispose`, and adds `holdReason`, `heldAt`,
    `statusBeforeHold`, and `disposedAt` to the `Document` projection. A hold
    may be placed from ACTIVE, ARCHIVED, CLASSIFIED, or SUPERSEDED; a second
    hold is 409 `DOCUMENT_ALREADY_ON_HOLD` and any other status is 409
    `HOLD_STATUS_NOT_ALLOWED`. Release restores the snapshotted status (ARCHIVED
    when the snapshot is absent) and is 409 `DOCUMENT_NOT_ON_HOLD` otherwise.
    Disposition is synchronous and requires an expired retention date and no
    active hold: 409 `DOCUMENT_ON_LEGAL_HOLD`, `DISPOSAL_STATUS_NOT_ALLOWED`,
    `RETENTION_DATE_REQUIRED`, or `RETENTION_NOT_EXPIRED`. The SPEC 11.6.10 hold
    collection and approval steps and the disposition job and certificate are
    not implemented; the implemented hold is per-document. The 2026-10-22
    disposition-content slice couples content deletion to that disposition
    (MISMATCHES.md M-44, M-47).

    The 2026-10-22 content-tombstone slice adds `DELETE
    /api/v1/documents/{documentId}/content`. The command tombstones the stored
    content instead of deleting the rows: it clears the bytes of the current
    pointer and every not-yet-tombstoned revision and records `deletedAt`, while
    the filename, MIME type, size, digest, upload instant, and revision number
    stay readable. Success is 204 with no body. A document with no stored
    content is 404 `CONTENT_NOT_FOUND`; a document under legal hold is 409
    `DOCUMENT_ON_LEGAL_HOLD` and is left untouched (SPEC DOC-06); repeating the
    delete is 409 `CONTENT_ALREADY_DELETED` and writes no second event. The
    accepted write appends `document.content.deleted` to the transactional
    outbox in the same transaction. The `DocumentContent` projection adds the
    nullable `deletedAt` and the derived boolean `deleted`; downloading the
    current or a revision of tombstoned content is 410 `CONTENT_DELETED`. A
    later upload clears the tombstone on the current pointer and appends a
    fresh downloadable revision, while the earlier revisions keep their
    deletion timestamps. The standalone command carries no approval or
    certificate (MISMATCHES.md M-47).

    The 2026-10-22 disposition-content slice makes `POST
    /api/v1/documents/{documentId}/dispose` apply the same content tombstone
    automatically. When the document still has live stored content, the
    disposition transaction clears the bytes of the current pointer and of
    every not-yet-tombstoned revision, records `deletedAt`, and appends
    `document.content.deleted` with the same payload as an explicit content
    delete, in addition to `document.document.disposed`. A document with no
    stored content, or whose content is already tombstoned, is disposed with
    only `document.document.disposed`; disposition never answers 404
    `CONTENT_NOT_FOUND` or 409 `CONTENT_ALREADY_DELETED`. The standalone
    `DELETE /api/v1/documents/{documentId}/content` remains available. SPEC
    11.6.8 still requires an approval and a disposition certificate that this
    slice does not implement (MISMATCHES.md M-44, M-47).

    The 2026-10-20 link slice adds `GET|POST
    /api/v1/documents/{documentId}/links` and `DELETE
    /api/v1/documents/{documentId}/links/{linkId}`, the same three operations on
    the expert's `/internal/v1` base, the `DocumentLink` projection, the
    `CreateDocumentLinkRequest` command, and the optional `linkedType` +
    `linkedId` filter on the document list. Search `q` also matches any link's
    `linkedReference`. The link is tenant-scoped and flat: the SPEC 11.6.10
    `/associations` route, the subject triple and role, the association book,
    and the DOC-09 synchronous target check are not implemented (MISMATCHES.md
    M-26).

    The implemented Document services emit a compact `ApiError` body of
    `{code, message, details[]}` rather than the canonical Problem envelope;
    see MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://document-domain:8096
    description: Document domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Document
    description: Public domain API used by the Document web remote and other domain services.
  - name: Document internal
    description: Internal expert API. Not exposed through the gateway; called only by the Document domain service.
paths:
  /api/v1/documents:
    get:
      operationId: listDocuments
      tags:
        - Document
      summary: List documents for the caller's tenant.
      description: >
        Returns a bare JSON array. The optional `linkedType` + `linkedId` pair
        restricts the list to documents linked to that subject: the two
        parameters are a pair, so supplying one without the other is 400
        `INVALID_LINK_FILTER`, and an unknown `linkedType` is 400
        `INVALID_LINKED_TYPE`. Free-text search over metadata and link
        references is served by `GET /api/v1/documents/search`; cursor
        pagination remains planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: linkedType
          in: query
          required: false
          description: >
            Optional association filter. Must be supplied with `linkedId`; see
            `DocumentLinkedType` for the closed set. The expert rejects a
            partial pair with 400 `INVALID_LINK_FILTER` and an unknown value
            with 400 `INVALID_LINKED_TYPE`.
          schema:
            $ref: '#/components/schemas/DocumentLinkedType'
        - name: linkedId
          in: query
          required: false
          description: >
            Optional target UUID of the association filter. Must be supplied
            with `linkedType`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: registerDocument
      tags:
        - Document
      summary: Register a document.
      description: >
        Registers metadata for a document. The document number is generated by
        the expert. `documentType` and `classification` are validated against
        the SPEC 11.6.5 closed sets. A retention date, when supplied, must not
        be before the creation date.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Document
      summary: Search document metadata for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the document pickers.
        Matching is a case-insensitive contains over `documentNumber`, `title`,
        `documentType`, and any association link's `linkedReference`; an absent
        or blank `q` returns the most recently updated documents. The response
        is the shared `SearchResponse` envelope. A missing or malformed
        `X-EIA-Tenant` or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: DOCUMENT
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching documents, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - Document
      summary: Get document metadata.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content:
    put:
      operationId: uploadDocumentContent
      tags:
        - Document
      summary: Replace the current content bytes of a document.
      description: >
        Raw-byte upload. `Content-Type` is the file MIME type and defaults to
        `application/octet-stream` when omitted; `X-File-Name` is required and
        carries the URL-encoded filename. Every accepted body is appended as an
        immutable content revision and becomes the document's current content;
        the 200 response is the `DocumentContent` metadata, including the
        revision as `currentVersion` and the lowercase SHA-256 digest of the
        exact stored bytes. An empty body is 400 `EMPTY_CONTENT`; a body above
        10 MiB (10,485,760 bytes) is 413 `FILE_TOO_LARGE`. A blank or malformed
        `X-File-Name` (400 `FILE_NAME_REQUIRED`/`INVALID_FILE_NAME`), a decoded
        name longer than 255 characters (400 `FILE_NAME_TOO_LONG`), and a
        non-concrete or invalid `Content-Type` (400 `INVALID_CONTENT_TYPE`) are
        rejected before the bytes are stored. A document outside the caller's
        tenant is 404. Each accepted write appends `document.content.uploaded`
        to the outbox in the same transaction, with the new revision as the
        payload `version` and the aggregate version.
      x-raw-body: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Content-Type
          in: header
          required: false
          description: >
            File MIME type, for example `application/pdf`. The stored type is
            the bare type/subtype (parameters such as `charset` are dropped);
            an absent header defaults to `application/octet-stream`. A
            wildcard, a malformed value, or a type longer than 128 characters
            is 400 `INVALID_CONTENT_TYPE`/`CONTENT_TYPE_TOO_LONG`.
          schema:
            type: string
            maxLength: 128
            default: application/octet-stream
        - name: X-File-Name
          in: header
          required: true
          description: >
            URL-encoded display filename. The value is decoded as UTF-8, any
            directory component is removed, and a name longer than 255
            characters or one containing control characters is rejected. The
            name is stored as display metadata and is returned in the download
            `Content-Disposition`.
          schema:
            type: string
      requestBody:
        required: true
        description: >
          The raw file bytes. The body is not JSON and is stored unchanged.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: >
            Content revision stored; the metadata projection of the current
            bytes and their revision number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '400':
          description: >
            400. `EMPTY_CONTENT` for a zero-byte body, `FILE_NAME_REQUIRED` or
            `INVALID_FILE_NAME`/`FILE_NAME_TOO_LONG` for the `X-File-Name`
            header, `INVALID_CONTENT_TYPE`/`CONTENT_TYPE_TOO_LONG` for the
            `Content-Type` header, `VALIDATION_ERROR` for a malformed request,
            and `TENANT_REQUIRED` for a missing tenant. An expert rejection is
            returned as `application/problem+json`; the compact vertical
            `ApiError` remains for the tenant check (MISMATCHES.md M-02).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '413':
          description: >
            413. `FILE_TOO_LARGE`: the upload body is above the 10 MiB
            (10,485,760 bytes) limit. The body is rejected before it reaches
            the expert or object storage, and no content row or event is
            written. A body of exactly 10 MiB is accepted.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    get:
      operationId: downloadDocumentContent
      tags:
        - Document
      summary: Stream the current content bytes of a document.
      description: >
        Returns the stored bytes unchanged. The response is binary: the stored
        file MIME type is the `Content-Type`, `Content-Disposition` is an
        attachment built from the stored filename (with the RFC 5987
        `filename*` parameter for a non-ASCII name), `X-Content-SHA256`
        carries the lowercase digest of the bytes, and `X-Content-Version`
        carries the revision number naming the newest retained revision. A
        document outside the caller's tenant is 404; a document with no stored
        content is 404 `CONTENT_NOT_FOUND`; content tombstoned by `DELETE
        .../content` or by a disposition is 410 `CONTENT_DELETED`. There is no
        presigned URL, no `Range` support, and the response must not be parsed
        as JSON.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current content bytes.
          headers:
            Content-Type:
              description: >
                The stored file MIME type, for example `application/pdf`.
                Falls back to `application/octet-stream` when the stored type
                cannot be parsed.
              schema:
                type: string
            Content-Disposition:
              description: >
                Attachment disposition with the stored filename, for example
                `attachment; filename="policy schedule.pdf"`. A non-ASCII name
                also carries `filename*=UTF-8''...`.
              schema:
                type: string
            X-Content-SHA256:
              description: >
                Lowercase hexadecimal SHA-256 of the returned bytes. A caller
                can verify the download without trusting the transport. Absent
                only if the expert omitted the header.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            X-Content-Version:
              description: >
                Revision number of the returned bytes, the same value as
                `currentVersion` in the metadata projection.
              schema:
                type: integer
                minimum: 1
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '410':
          description: >
            410. `CONTENT_DELETED`: the content of the document was tombstoned
            by `DELETE .../content` or by a disposition, so the bytes are no
            longer downloadable. The content metadata route remains readable and
            reports `deleted: true` with `deletedAt`. The body is
            `application/problem+json`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    delete:
      operationId: deleteDocumentContent
      tags:
        - Document
      summary: Tombstone the stored content of a document.
      description: >
        Tombstones the stored content instead of deleting the rows. The bytes of
        the current content pointer and of every not-yet-tombstoned revision are
        cleared and `deletedAt` is recorded, while the filename, MIME type, exact
        size, SHA-256 digest, upload instant, and current revision number stay
        readable on `GET .../content/metadata`. The command has no request body;
        success is 204 with no body. A document with no stored content is 404
        `CONTENT_NOT_FOUND`; a missing document or one outside the caller's
        tenant is 404 `NOT_FOUND`. A document under an active legal hold is 409
        `DOCUMENT_ON_LEGAL_HOLD` and is left untouched (SPEC DOC-06); repeating
        a delete is 409 `CONTENT_ALREADY_DELETED`, checked from the stored
        `deletedAt`, and writes no second event. Downloads of the current bytes
        and of any revision are then 410 `CONTENT_DELETED`. The accepted write
        appends `document.content.deleted` to the transactional outbox in the
        same transaction, with the tombstoned revision as the aggregate version;
        a rejected command writes no row change and no event. A later upload
        clears the tombstone on the current pointer and appends a fresh
        downloadable revision, while the earlier revisions keep their deletion
        timestamps. Disposition applies the same tombstone to a document with
        live content in its own transaction, but treats absent or
        already-tombstoned content as a no-op instead of answering
        `CONTENT_NOT_FOUND` or `CONTENT_ALREADY_DELETED`. SPEC 11.6.8 deletes
        content as a step of the approved disposition job; the implemented
        disposition now performs that deletion but carries no approval or
        certificate (MISMATCHES.md M-47).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: >
            Content tombstoned. No body is returned. The document metadata and
            the content metadata row remain readable, and a later upload may
            create a new current revision.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          description: >
            404. `CONTENT_NOT_FOUND` when the document exists but has no stored
            content; a missing document or one outside the caller's tenant is
            `NOT_FOUND`, indistinguishable from a missing document. The body is
            `application/problem+json`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '409':
          description: >
            409. `DOCUMENT_ON_LEGAL_HOLD` when the document is ON_HOLD: a legal
            hold freezes the record, so the bytes, `deletedAt`, and outbox are
            left untouched. `CONTENT_ALREADY_DELETED` when the current content
            was already tombstoned; that check is made before the hold check, so
            a repeated delete is reported as already deleted. No row change or
            event is written on either conflict. The body is
            `application/problem+json`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/metadata:
    get:
      operationId: getDocumentContentMetadata
      tags:
        - Document
      summary: Get the metadata of the current content.
      description: >
        Returns the `DocumentContent` projection without the bytes. The
        projection carries the owning document, the stored display filename,
        the stored MIME type, the exact size in bytes, the lowercase SHA-256
        digest, the upload instant, the current revision number, the nullable
        `deletedAt`, and the derived boolean `deleted`. The metadata stays
        readable after a `DELETE .../content` tombstone or a disposition; only
        the bytes and their download availability are gone. A document outside
        the caller's tenant is 404, indistinguishable from a missing document;
        a document with no stored content is 404 `CONTENT_NOT_FOUND`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metadata of the current content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/versions:
    get:
      operationId: listDocumentContentVersions
      tags:
        - Document
      summary: List the retained content revisions of a document.
      description: >
        Returns the document's immutable content revisions as a bare JSON array
        ordered newest first (`version` descending). Each entry carries the
        owning document, the revision number, the stored display filename, the
        stored MIME type, the exact size in bytes, the lowercase SHA-256 digest,
        and the upload instant. A document with no stored content has no
        revisions and returns an empty array. A document outside the caller's
        tenant is 404, indistinguishable from a missing document. The SPEC
        11.6.10 history route is `/versions`; the implemented history is nested
        under `/content/versions` (MISMATCHES.md M-40).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retained content revisions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentContentVersion'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/versions/{version}:
    get:
      operationId: downloadDocumentContentVersion
      tags:
        - Document
      summary: Stream one retained content revision of a document.
      description: >
        Returns the stored bytes of one retained revision unchanged. The
        response is binary: the stored file MIME type is the `Content-Type`,
        `Content-Disposition` is an attachment built from the revision's
        filename, `X-Content-SHA256` carries the lowercase digest of the bytes,
        and `X-Content-Version` repeats the requested revision. Revisions start
        at 1 and increase by one per accepted upload. A document outside the
        caller's tenant is 404, indistinguishable from a missing document; a
        revision that does not exist, including a number below 1, is 404
        `CONTENT_VERSION_NOT_FOUND`. A non-numeric `version` is 400
        `INVALID_PARAMETER`. A revision whose bytes were tombstoned by `DELETE
        .../content` or by a disposition is 410 `CONTENT_DELETED`, including a
        revision that was current when the tombstone was written. There is no
        presigned URL and no `Range` support.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          description: >
            Revision number from `GET .../content/versions`, starting at 1.
            A non-numeric value is 400 `INVALID_PARAMETER`; an unknown or
            non-positive revision is 404 `CONTENT_VERSION_NOT_FOUND`.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The bytes of the requested content revision.
          headers:
            Content-Type:
              description: >
                The stored file MIME type of the revision, for example
                `application/pdf`. Falls back to `application/octet-stream`
                when the stored type cannot be parsed.
              schema:
                type: string
            Content-Disposition:
              description: >
                Attachment disposition with the revision's stored filename, for
                example `attachment; filename="policy schedule v1.pdf"`. A
                non-ASCII name also carries `filename*=UTF-8''...`.
              schema:
                type: string
            X-Content-SHA256:
              description: >
                Lowercase hexadecimal SHA-256 of the returned revision bytes.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            X-Content-Version:
              description: Revision number of the returned bytes.
              schema:
                type: integer
                minimum: 1
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '410':
          description: >
            410. `CONTENT_DELETED`: the requested revision belongs to content
            that was tombstoned by `DELETE .../content` or by a disposition, so
            its bytes are no longer downloadable. The revision metadata still
            appears in the history and its digest and size are retained. The
            body is `application/problem+json`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/status:
    post:
      operationId: changeDocumentStatus
      tags:
        - Document
      summary: Advance a document through its lifecycle.
      description: >
        Applies one transition from SPEC 11.6.6. A document must carry a
        retention date before it becomes ACTIVE (DOC-05). The public command
        does not carry an expected version; the domain reads and forwards the
        current version.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequest'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/hold:
    post:
      operationId: placeDocumentHold
      tags:
        - Document
      summary: Place a legal hold on a document.
      description: >
        Moves the document to ON_HOLD and snapshots the current status in
        `statusBeforeHold`, with the hold reason in `holdReason` and the instant
        in `heldAt`. The reason is trimmed and must be 1-500 characters; a blank
        or over-long reason is 400 `VALIDATION_ERROR` (or 400
        `INVALID_HOLD_REASON` from the expert rule). A hold may be placed only
        from ACTIVE, ARCHIVED, CLASSIFIED, or SUPERSEDED; this command therefore
        admits CLASSIFIED and SUPERSEDED even though the generic lifecycle has
        no edge to ON_HOLD. A document already ON_HOLD is 409
        `DOCUMENT_ALREADY_ON_HOLD` and any other status is 409
        `HOLD_STATUS_NOT_ALLOWED`. The accepted write bumps the document version
        and appends `document.legal-hold.placed` to the transactional outbox in
        the same transaction; a rejected command writes no row change and no
        event. `X-EIA-Tenant` is required and another tenant's document is 404,
        indistinguishable from a missing document. SPEC 11.6.10 models a hold
        collection with scope and approval; the implemented command is
        per-document and synchronous (MISMATCHES.md M-44).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldDocumentRequest'
      responses:
        '200':
          description: Document after the hold was placed; status is ON_HOLD.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: >
            400. `VALIDATION_ERROR` for a missing, blank, or over-long `reason`,
            `INVALID_HOLD_REASON` for the expert's reason rule,
            `MALFORMED_REQUEST` for an unreadable body, and `TENANT_REQUIRED`
            or `INVALID_TENANT_HEADER` for the tenant header. The body is
            `application/problem+json`.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `DOCUMENT_ALREADY_ON_HOLD` when the document is already
            ON_HOLD, or `HOLD_STATUS_NOT_ALLOWED` when its status is not
            ACTIVE, ARCHIVED, CLASSIFIED, or SUPERSEDED. No hold, row change, or
            event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/hold/release:
    post:
      operationId: releaseDocumentHold
      tags:
        - Document
      summary: Release a legal hold and restore the prior status.
      description: >
        Clears `holdReason`, `heldAt`, and `statusBeforeHold` and restores the
        snapshotted status; an absent or unrecognised snapshot falls back to
        ARCHIVED so a release always lands in a retrievable record state. The
        command has no request body. A document that is not ON_HOLD is 409
        `DOCUMENT_NOT_ON_HOLD`. The accepted write bumps the document version and
        appends `document.legal-hold.released` in the same transaction, with the
        lifted hold reason as the payload `reason`; a rejected command writes no
        row change and no event. `X-EIA-Tenant` is required and another tenant's
        document is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document after the hold was released; status is restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `DOCUMENT_NOT_ON_HOLD`: the document has no active legal hold.
            No row change or event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/dispose:
    post:
      operationId: disposeDocument
      tags:
        - Document
      summary: Dispose of a document after its retention date has expired.
      description: >
        Tombstones the document as DISPOSED and stamps `disposedAt`; the row and
        its metadata stay readable. Disposition requires an expired retention
        date and no active legal hold. A missing `retentionUntil` is 409
        `RETENTION_DATE_REQUIRED`, a date after today is 409
        `RETENTION_NOT_EXPIRED`, ON_HOLD is 409 `DOCUMENT_ON_LEGAL_HOLD`, and a
        status outside ACTIVE, ARCHIVED, or SUPERSEDED is 409
        `DISPOSAL_STATUS_NOT_ALLOWED`; ON_HOLD is checked before the retention
        clock. When the document still has live stored content, the same
        transaction clears the bytes of the current pointer and of every
        not-yet-tombstoned revision, records `deletedAt`, and appends
        `document.content.deleted` with the same payload as an explicit content
        delete, in addition to `document.document.disposed`. A document with no
        stored content, or whose content is already tombstoned, is disposed
        normally with only `document.document.disposed`; disposition does not
        answer 404 `CONTENT_NOT_FOUND` or 409 `CONTENT_ALREADY_DELETED`. The
        public command has no request body: the expert's optional `{reason}` is
        not forwarded, so the recorded event reason is `RETENTION_EXPIRED`. The
        accepted write bumps the document version and appends
        `document.document.disposed` and, for live content,
        `document.content.deleted` atomically; a rejected command writes no row
        change and no event. There is no approval, retention-scan job, or
        disposition certificate in this slice (MISMATCHES.md M-44, M-47).
        `X-EIA-Tenant` is required and another tenant's document is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document after disposition; status is DISPOSED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `DOCUMENT_ON_LEGAL_HOLD` when a legal hold is active,
            `DISPOSAL_STATUS_NOT_ALLOWED` when the status is not ACTIVE,
            ARCHIVED, or SUPERSEDED, `RETENTION_DATE_REQUIRED` when the document
            has no retention date, or `RETENTION_NOT_EXPIRED` when the
            retention date is still in the future. No row change or event is
            written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links:
    get:
      operationId: listDocumentLinks
      tags:
        - Document
      summary: List the association links of a document.
      description: >
        Returns the document's links as a bare JSON array, ordered by creation
        time. Each link carries the typed target (`linkedType` + `linkedId`) and
        the cached `linkedReference` and `linkedLabel` used to render it without
        a cross-vertical call. A document outside the caller's tenant is a 404,
        indistinguishable from a missing document. The SPEC 11.6.10
        `/associations` shape and its subject role are not implemented
        (MISMATCHES.md M-26).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Links of the document.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createDocumentLink
      tags:
        - Document
      summary: Associate a document with another record.
      description: >
        Creates one association link and writes `document.link.added` in the
        same transaction. `linkedType` is the closed `DocumentLinkedType` set and
        `linkedId` is the target UUID; both are required. `linkedReference` is an
        optional display snapshot of at most 64 characters and is never used to
        resolve the target. The target is not checked for existence with its
        owning vertical yet (DOC-09; MISMATCHES.md M-26). A duplicate
        `(documentId, linkedType, linkedId)` for the tenant is 409
        `DUPLICATE_LINK` and writes no row or event; a document outside the
        tenant is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The document already has a link to this `(linkedType,
            linkedId)` pair. The vertical `ApiError` carries code
            `DUPLICATE_LINK`; no second row or event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links/{linkId}:
    delete:
      operationId: deleteDocumentLink
      tags:
        - Document
      summary: Remove an association link.
      description: >
        Deletes exactly one link inside the caller's tenant and document scope
        and writes `document.link.removed` in the same transaction. A link that
        is not visible under both the tenant and the document is a 404
        `LINK_NOT_FOUND`, indistinguishable from a missing link. Success is 204
        with no body.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link removed.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents:
