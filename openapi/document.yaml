x-compatibility:
  contractVersion: 1.4.0
  previousContractVersion: 1.3.0
  breaking: []
  compatible:
    - Adds GET /api/v1/documents/{documentId}/content/versions and GET /api/v1/documents/{documentId}/content/versions/{version}.
    - Adds the DocumentContentVersion schema for the retained revision metadata projection.
    - Adds currentVersion to the DocumentContent metadata projection and the X-Content-Version header to both content downloads.
    - Adds the required version member to the document.content.uploaded payload while keeping eventVersion 1.
    - Removes the implemented content history from x-planned-operations; the upload is the version-creating command.
  note: >
    The version surface is additive over 1.3.0: no existing path, request field,
    response field, or event name is removed or changes meaning. The current
    content upload now appends an immutable revision and advances the current
    pointer; a replacement still becomes the bytes served by the current
    download. The metadata projection and the upload response gain a required
    currentVersion member, and the event payload gains a required version
    member, so a strict consumer must tolerate the two new fields (EV-05). The
    SPEC 11.6.10 `/versions` route, renditions, and presigned downloads remain
    unavailable; the implemented history is nested under `/content/versions`
    (MISMATCHES.md M-40).
