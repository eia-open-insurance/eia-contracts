openapi: 3.1.0
info:
  title: EIA Document API
  version: 1.0.0
  summary: Document metadata and lifecycle administration and the Document expert API.
  description: >
    This document describes the implemented public Document domain API and the
    internal Document expert API. The authoritative requirement is SPEC 11.6
    and SPEC 12; the implemented surface is the first vertical slice.

    The slice carries metadata and lifecycle only. Content, renditions,
    versions, associations, OCR text, holds, packages, requests, signatures,
    and retention disposition from SPEC 11.6 are planned and listed under
    x-planned-operations. Only an authorized content endpoint may stream bytes;
    none is implemented yet.

    The implemented Document services emit a compact `ApiError` body of
    `{code, message, details[]}` rather than the canonical Problem envelope;
    see MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://document-domain:8096
    description: Document domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Document
    description: Public domain API used by the Document web remote and other domain services.
  - name: Document internal
    description: Internal expert API. Not exposed through the gateway; called only by the Document domain service.
paths:
  /api/v1/documents:
    get:
      operationId: listDocuments
      tags:
        - Document
      summary: List documents for the caller's tenant.
      description: Returns a bare JSON array. Search, filtering, and cursor pagination are planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: registerDocument
      tags:
        - Document
      summary: Register a document.
      description: >
        Registers metadata for a document. The document number is generated by
        the expert. `documentType` and `classification` are validated against
        the SPEC 11.6.5 closed sets. A retention date, when supplied, must not
        be before the creation date.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - Document
      summary: Get document metadata.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/status:
    post:
      operationId: changeDocumentStatus
      tags:
        - Document
      summary: Advance a document through its lifecycle.
      description: >
        Applies one transition from SPEC 11.6.6. A document must carry a
        retention date before it becomes ACTIVE (DOC-05). The public command
        does not carry an expected version; the domain reads and forwards the
        current version.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequest'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents:
    get:
      operationId: expertListDocuments
      tags:
        - Document internal
      summary: List documents for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertRegisterDocument
      tags:
        - Document internal
      summary: Register a document (expert).
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequestInternal'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}:
    get:
      operationId: expertGetDocument
      tags:
        - Document internal
      summary: Get document metadata (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}/status:
    post:
      operationId: expertChangeDocumentStatus
      tags:
        - Document internal
      summary: Advance a document through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequestInternal'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Document:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Document metadata projection. The SPEC 11.6.4 model calls the type
        docType and the classification confidentiality, and carries content,
        versions, associations, hashes, page counts, OCR status, and tags; the
        implemented field names are documentType and classification.
      required:
        - id
        - tenantId
        - documentNumber
        - title
        - documentType
        - classification
        - status
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        documentNumber:
          type: string
          examples:
            - DOC-2026-0000001
        title:
          type: string
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retentionUntil:
          type: [string, 'null']
          format: date
          description: Retention end date. Required before a document becomes ACTIVE.
    DocumentType:
      type: string
      description: Document type from SPEC 11.6.5, as enforced by the expert.
      enum:
        - POLICY
        - DECLARATIONS
        - ENDORSEMENT
        - CERTIFICATE
        - BINDER
        - QUOTE
        - SLIP
        - WORDING
        - FORM
        - EXCLUSION
        - SCHEDULE
        - ASSUMED_CONTRACT
        - TREATY_SLIP
        - BORDEREAU
        - LOSS_ADVICE
        - TECHNICAL_ACCOUNT
        - STATEMENT
        - CASH_CALL
        - SECURITY
        - COMMUTATION_AGREEMENT
        - CLAIM_FORM
        - FNOL
        - PROOF_OF_LOSS
        - PLAINTIFF_FACT_SHEET
        - MEDICAL_RECORD
        - MEDICAL_BILL
        - B_READ
        - EXPOSURE_AFFIDAVIT
        - AUTHORIZATION
        - HIPAA_RELEASE
        - DEMAND_LETTER
        - PLEADING
        - DISCOVERY
        - DEPOSITION
        - EXPERT_REPORT
        - SETTLEMENT_AGREEMENT
        - RELEASE
        - CONSENT_JUDGMENT
        - COURT_ORDER
        - LIEN
        - LIEN_WAIVER
        - MEDICARE_CONDITIONAL_PAYMENT
        - TRUST_CLAIM_FORM
        - TRUST_DISTRIBUTION
        - PAYMENT_AUTHORITY
        - PAYMENT_RECEIPT
        - REMITTANCE
        - INVOICE
        - DEFENSE_INVOICE
        - TAX_FORM
        - W9
        - KYC
        - SANCTIONS_RESULT
        - CORRESPONDENCE
        - EMAIL
        - NOTE
        - PHOTO
        - AUDIO
        - VIDEO
        - OTHER
    Confidentiality:
      type: string
      description: Confidentiality classification from SPEC 11.6.5.
      enum:
        - PUBLIC
        - INTERNAL
        - CONFIDENTIAL
        - RESTRICTED
        - PHI
        - PRIVILEGED
    DocumentStatus:
      type: string
      description: Document lifecycle status from SPEC 11.6.5 and 11.6.6.
      enum:
        - PENDING_UPLOAD
        - RECEIVED
        - SCANNING
        - PROCESSING
        - CLASSIFIED
        - ACTIVE
        - SUPERSEDED
        - ON_HOLD
        - ARCHIVED
        - DISPOSED
        - REJECTED
        - FAILED
    CreateDocumentRequest:
      type: object
      description: Public register command. The tenant comes from X-EIA-Tenant.
      required:
        - title
        - documentType
        - classification
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    CreateDocumentRequestInternal:
      type: object
      description: Internal register command accepted by the Document expert.
      required:
        - tenantId
        - title
        - documentType
        - classification
      properties:
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    ChangeDocumentStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
    ChangeDocumentStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Document expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional. When supplied, a stale version returns 409 VERSION_CONFLICT.
x-vertical: document
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-document-domain/src/main/java/com/eia/document/domain/DocumentController.java
    - repos/eia-document-domain/src/main/java/com/eia/document/domain/DocumentExpertClient.java
    - repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentController.java
    - repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentRules.java
  errorEnvelope: >
    Vertical-specific ApiError {code, message, details[{field, message}]}. Not
    the canonical Problem envelope yet.
