  errorEnvelope: >
    Vertical-specific ApiError {code, message, details[{field, message}]}. Not
    the canonical Problem envelope yet. Content uploads add a
    `application/problem+json` 413 `FILE_TOO_LARGE` before the expert call and
    preserve the expert's 400/404 problem bodies, including the version routes'
    `CONTENT_VERSION_NOT_FOUND`, the tombstone's `CONTENT_NOT_FOUND`, both 409
    conflicts, and the tombstoned downloads' 410 `CONTENT_DELETED`; a disposition
    that tombstones live content reuses that tombstone but never surfaces its
    `CONTENT_NOT_FOUND`/`CONTENT_ALREADY_DELETED` conflicts. A missing tenant on
    a content route is still the compact `TENANT_REQUIRED` ApiError.
x-compatibility:
  contractVersion: 1.7.0
  previousContractVersion: 1.6.0
  breaking: []
  compatible:
    - Couples content tombstoning to POST /api/v1/documents/{documentId}/dispose: live content is cleared and document.content.deleted is emitted in the disposition transaction.
    - Keeps the dispose 200 Document response and its 400/404/409 responses unchanged; absent or already-tombstoned content still disposes successfully.
    - Keeps the standalone DELETE /api/v1/documents/{documentId}/content command and every existing path, request field, response field, and event name.
  note: >
    The disposition-content slice is additive over 1.6.0: no path, request
    field, response field, or event name is removed or changes meaning. The
    already-published `document.content.deleted` fact now also accompanies a
    disposition that tombstones live content, so a subscriber must tolerate the
    same event name for either trigger. A disposition of a document with no stored
    content or already-tombstoned content emits only
    `document.document.disposed` and does not surface the explicit delete's
    `CONTENT_NOT_FOUND`/`CONTENT_ALREADY_DELETED` responses. The disposition
    still has no approval, retention-scan job, or certificate from SPEC 11.6.8
    (MISMATCHES.md M-44, M-47).
