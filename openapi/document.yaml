openapi: 3.1.0
info:
  title: EIA Document API
  version: 1.2.0
  summary: Document metadata, lifecycle, and association-link administration and the Document expert API.
  description: >
    This document describes the implemented public Document domain API and the
    internal Document expert API. The authoritative requirement is SPEC 11.6
    and SPEC 12; the implemented surface is the first vertical slice.

    The slice carries metadata, lifecycle, and association links. Content,
    renditions, versions, OCR text, holds, packages, requests, signatures, and
    retention disposition from SPEC 11.6 are planned and listed under
    x-planned-operations. Only an authorized content endpoint may stream bytes;
    none is implemented yet.

    The 2026-10-20 link slice adds `GET|POST
    /api/v1/documents/{documentId}/links` and `DELETE
    /api/v1/documents/{documentId}/links/{linkId}`, the same three operations on
    the expert's `/internal/v1` base, the `DocumentLink` projection, the
    `CreateDocumentLinkRequest` command, and the optional `linkedType` +
    `linkedId` filter on the document list. Search `q` also matches any link's
    `linkedReference`. The link is tenant-scoped and flat: the SPEC 11.6.10
    `/associations` route, the subject triple and role, the association book,
    and the DOC-09 synchronous target check are not implemented (MISMATCHES.md
    M-26).

    The implemented Document services emit a compact `ApiError` body of
    `{code, message, details[]}` rather than the canonical Problem envelope;
    see MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://document-domain:8096
    description: Document domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Document
    description: Public domain API used by the Document web remote and other domain services.
  - name: Document internal
    description: Internal expert API. Not exposed through the gateway; called only by the Document domain service.
paths:
  /api/v1/documents:
    get:
      operationId: listDocuments
      tags:
        - Document
      summary: List documents for the caller's tenant.
      description: >
        Returns a bare JSON array. The optional `linkedType` + `linkedId` pair
        restricts the list to documents linked to that subject: the two
        parameters are a pair, so supplying one without the other is 400
        `INVALID_LINK_FILTER`, and an unknown `linkedType` is 400
        `INVALID_LINKED_TYPE`. Free-text search over metadata and link
        references is served by `GET /api/v1/documents/search`; cursor
        pagination remains planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: linkedType
          in: query
          required: false
          description: >
            Optional association filter. Must be supplied with `linkedId`; see
            `DocumentLinkedType` for the closed set. The expert rejects a
            partial pair with 400 `INVALID_LINK_FILTER` and an unknown value
            with 400 `INVALID_LINKED_TYPE`.
          schema:
            $ref: '#/components/schemas/DocumentLinkedType'
        - name: linkedId
          in: query
          required: false
          description: >
            Optional target UUID of the association filter. Must be supplied
            with `linkedType`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: registerDocument
      tags:
        - Document
      summary: Register a document.
      description: >
        Registers metadata for a document. The document number is generated by
        the expert. `documentType` and `classification` are validated against
        the SPEC 11.6.5 closed sets. A retention date, when supplied, must not
        be before the creation date.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Document
      summary: Search document metadata for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the document pickers.
        Matching is a case-insensitive contains over `documentNumber`, `title`,
        `documentType`, and any association link's `linkedReference`; an absent
        or blank `q` returns the most recently updated documents. The response
        is the shared `SearchResponse` envelope. A missing or malformed
        `X-EIA-Tenant` or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: DOCUMENT
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching documents, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - Document
      summary: Get document metadata.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/status:
    post:
      operationId: changeDocumentStatus
      tags:
        - Document
      summary: Advance a document through its lifecycle.
      description: >
        Applies one transition from SPEC 11.6.6. A document must carry a
        retention date before it becomes ACTIVE (DOC-05). The public command
        does not carry an expected version; the domain reads and forwards the
        current version.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequest'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links:
    get:
      operationId: listDocumentLinks
      tags:
        - Document
      summary: List the association links of a document.
      description: >
        Returns the document's links as a bare JSON array, ordered by creation
        time. Each link carries the typed target (`linkedType` + `linkedId`) and
        the cached `linkedReference` and `linkedLabel` used to render it without
        a cross-vertical call. A document outside the caller's tenant is a 404,
        indistinguishable from a missing document. The SPEC 11.6.10
        `/associations` shape and its subject role are not implemented
        (MISMATCHES.md M-26).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Links of the document.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createDocumentLink
      tags:
        - Document
      summary: Associate a document with another record.
      description: >
        Creates one association link and writes `document.link.added` in the
        same transaction. `linkedType` is the closed `DocumentLinkedType` set and
        `linkedId` is the target UUID; both are required. `linkedReference` is an
        optional display snapshot of at most 64 characters and is never used to
        resolve the target. The target is not checked for existence with its
        owning vertical yet (DOC-09; MISMATCHES.md M-26). A duplicate
        `(documentId, linkedType, linkedId)` for the tenant is 409
        `DUPLICATE_LINK` and writes no row or event; a document outside the
        tenant is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The document already has a link to this `(linkedType,
            linkedId)` pair. The vertical `ApiError` carries code
            `DUPLICATE_LINK`; no second row or event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links/{linkId}:
    delete:
      operationId: deleteDocumentLink
      tags:
        - Document
      summary: Remove an association link.
      description: >
        Deletes exactly one link inside the caller's tenant and document scope
        and writes `document.link.removed` in the same transaction. A link that
        is not visible under both the tenant and the document is a 404
        `LINK_NOT_FOUND`, indistinguishable from a missing link. Success is 204
        with no body.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link removed.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents:
    get:
      operationId: expertListDocuments
      tags:
        - Document internal
      summary: List documents for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: linkedType
          in: query
          required: false
          description: >
            Optional association filter. Must be supplied with `linkedId`; an
            unknown value is 400 `INVALID_LINKED_TYPE` and a partial pair is 400
            `INVALID_LINK_FILTER`.
          schema:
            $ref: '#/components/schemas/DocumentLinkedType'
        - name: linkedId
          in: query
          required: false
          description: Optional target UUID of the association filter, paired with `linkedType`.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: >
            Optional free-text term. The expert trims it and matches
            case-insensitively as a contains over document metadata and any
            link's `linkedReference`.
          schema:
            type: string
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertRegisterDocument
      tags:
        - Document internal
      summary: Register a document (expert).
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequestInternal'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}:
    get:
      operationId: expertGetDocument
      tags:
        - Document internal
      summary: Get document metadata (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}/status:
    post:
      operationId: expertChangeDocumentStatus
      tags:
        - Document internal
      summary: Advance a document through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequestInternal'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}/links:
    get:
      operationId: expertListDocumentLinks
      tags:
        - Document internal
      summary: List the association links of a document (expert).
      security: []
      x-internal-api: true
      description: >
        Expert alias of the public list, called by the Document domain service.
        The tenant is the required `tenantId` query parameter; the domain also
        forwards the resolved `X-EIA-Tenant` header, which the expert accepts as
        a fallback. A document outside the tenant is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Links of the document.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateDocumentLink
      tags:
        - Document internal
      summary: Associate a document with another record (expert).
      security: []
      x-internal-api: true
      description: >
        Expert alias of the public create. The domain forwards the tenant as
        `?tenantId=` and the `X-EIA-Tenant` header. A duplicate
        `(documentId, linkedType, linkedId)` is 409 `DUPLICATE_LINK` with no row
        or event; a document outside the tenant is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The document already has a link to this `(linkedType,
            linkedId)` pair; the vertical `ApiError` carries code
            `DUPLICATE_LINK` and no second row or event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents/{documentId}/links/{linkId}:
    delete:
      operationId: expertDeleteDocumentLink
      tags:
        - Document internal
      summary: Remove an association link (expert).
      security: []
      x-internal-api: true
      description: >
        Expert alias of the public delete. The link must be visible under both
        the tenant and the document, so another document's or tenant's link id
        is 404 `LINK_NOT_FOUND`; success is 204 with no body.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link removed.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Document:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Document metadata projection. The SPEC 11.6.4 model calls the type
        docType and the classification confidentiality, and carries content,
        versions, associations, hashes, page counts, OCR status, and tags; the
        implemented field names are documentType and classification.
      required:
        - id
        - tenantId
        - documentNumber
        - title
        - documentType
        - classification
        - status
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        documentNumber:
          type: string
          examples:
            - DOC-2026-0000001
        title:
          type: string
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retentionUntil:
          type: [string, 'null']
          format: date
          description: Retention end date. Required before a document becomes ACTIVE.
    DocumentType:
      type: string
      description: Document type from SPEC 11.6.5, as enforced by the expert.
      enum:
        - POLICY
        - DECLARATIONS
        - ENDORSEMENT
        - CERTIFICATE
        - BINDER
        - QUOTE
        - SLIP
        - WORDING
        - FORM
        - EXCLUSION
        - SCHEDULE
        - ASSUMED_CONTRACT
        - TREATY_SLIP
        - BORDEREAU
        - LOSS_ADVICE
        - TECHNICAL_ACCOUNT
        - STATEMENT
        - CASH_CALL
        - SECURITY
        - COMMUTATION_AGREEMENT
        - CLAIM_FORM
        - FNOL
        - PROOF_OF_LOSS
        - PLAINTIFF_FACT_SHEET
        - MEDICAL_RECORD
        - MEDICAL_BILL
        - B_READ
        - EXPOSURE_AFFIDAVIT
        - AUTHORIZATION
        - HIPAA_RELEASE
        - DEMAND_LETTER
        - PLEADING
        - DISCOVERY
        - DEPOSITION
        - EXPERT_REPORT
        - SETTLEMENT_AGREEMENT
        - RELEASE
        - CONSENT_JUDGMENT
        - COURT_ORDER
        - LIEN
        - LIEN_WAIVER
        - MEDICARE_CONDITIONAL_PAYMENT
        - TRUST_CLAIM_FORM
        - TRUST_DISTRIBUTION
        - PAYMENT_AUTHORITY
        - PAYMENT_RECEIPT
        - REMITTANCE
        - INVOICE
        - DEFENSE_INVOICE
        - TAX_FORM
        - W9
        - KYC
        - SANCTIONS_RESULT
        - CORRESPONDENCE
        - EMAIL
        - NOTE
        - PHOTO
        - AUDIO
        - VIDEO
        - OTHER
    Confidentiality:
      type: string
      description: Confidentiality classification from SPEC 11.6.5.
      enum:
        - PUBLIC
        - INTERNAL
        - CONFIDENTIAL
        - RESTRICTED
        - PHI
        - PRIVILEGED
    DocumentStatus:
      type: string
      description: Document lifecycle status from SPEC 11.6.5 and 11.6.6.
      enum:
        - PENDING_UPLOAD
        - RECEIVED
        - SCANNING
        - PROCESSING
        - CLASSIFIED
        - ACTIVE
        - SUPERSEDED
        - ON_HOLD
        - ARCHIVED
        - DISPOSED
        - REJECTED
        - FAILED
    CreateDocumentRequest:
      type: object
      description: Public register command. The tenant comes from X-EIA-Tenant.
      required:
        - title
        - documentType
        - classification
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    CreateDocumentRequestInternal:
      type: object
      description: Internal register command accepted by the Document expert.
      required:
        - tenantId
        - title
        - documentType
        - classification
      properties:
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    ChangeDocumentStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
    ChangeDocumentStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Document expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional. When supplied, a stale version returns 409 VERSION_CONFLICT.
    DocumentLinkedType:
      type: string
      description: >
        Closed set of target kinds a document can be linked to. This is the
        implemented link vocabulary; the SPEC 11.6 association additionally
        carries a subject vertical, subject type, and role (MISMATCHES.md M-26).
      enum:
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - POLICY
        - CONTRACT
        - PARTY
        - PAYMENT
        - OTHER
    DocumentLink:
      type: object
      description: >
        Association link between a document and one target record. The Document
        vertical owns the link and stores a display snapshot; the target's
        owning vertical remains authoritative. `linkedLabel` is
        `linkedReference` when present, otherwise the first eight characters of
        `linkedId`.
      required:
        - id
        - documentId
        - linkedType
        - linkedId
        - linkedLabel
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        linkedType:
          $ref: '#/components/schemas/DocumentLinkedType'
        linkedId:
          type: string
          format: uuid
          description: Target record id in the vertical named by `linkedType`.
        linkedReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Optional human-readable snapshot of the target (a policy or claim
            number, for example). It is a label only and is never used to
            resolve or validate the target.
        linkedLabel:
          type: string
          description: >
            Render label: `linkedReference` when present, otherwise the first
            eight characters of `linkedId`.
        createdAt:
          type: string
          format: date-time
    CreateDocumentLinkRequest:
      type: object
      description: >
        Public create command. The tenant comes from `X-EIA-Tenant` and is never
        part of the body.
      required:
        - linkedType
        - linkedId
      properties:
        linkedType:
          $ref: '#/components/schemas/DocumentLinkedType'
        linkedId:
          type: string
          format: uuid
          description: Target record id in the vertical named by `linkedType`.
        linkedReference:
          type: string
          maxLength: 64
          description: Optional display snapshot, trimmed; it never resolves the target.
