openapi: 3.1.0
info:
  title: EIA Document API
  version: 1.4.0
  summary: Document metadata, lifecycle, association-link, and content administration and the Document expert API.
  description: >
    This document describes the implemented public Document domain API and the
    internal Document expert API. The authoritative requirement is SPEC 11.6
    and SPEC 12; the implemented surface is the first vertical slice.

    The slice carries metadata, lifecycle, association links, the current
    content bytes, and the retained content-revision history. Renditions, OCR
    text, holds, packages, requests, signatures, and retention disposition from
    SPEC 11.6 are planned and listed under x-planned-operations.

    The 2026-10-20 content slice adds the raw `PUT|GET
    /api/v1/documents/{documentId}/content` routes, `GET
    /api/v1/documents/{documentId}/content/metadata`, the `DocumentContent`
    projection, the `X-File-Name` upload header, and the
    `document.content.uploaded` event. The upload replaced the stored bytes (an
    upsert) in that slice, is capped at 10 MiB, rejects an empty body, and
    returns the metadata projection; the download streams the bytes with
    `Content-Type`, `Content-Disposition`, `X-Content-SHA256`, and
    `X-Content-Version`. Both public routes require `X-EIA-Tenant`; the expert also accepts `tenantId` as
    a fallback. The SPEC 11.6.10 presigned download and the renditions remain
    planned.

    The 2026-10-21 version slice appends every accepted upload as an immutable
    content revision. `GET /api/v1/documents/{documentId}/content/versions`
    lists the revisions newest first and `GET
    /api/v1/documents/{documentId}/content/versions/{version}` streams one
    revision with the same representation headers as the current download. The
    `DocumentContent` projection and the upload response carry `currentVersion`;
    the `document.content.uploaded` payload carries the revision as `version`
    while the event keeps `eventVersion` 1. No event name is added. The SPEC
    11.6.10 version routes are `/versions` (GET and POST); the implemented
    history is nested under `/content/versions` and the version-creating
    command is the content upload (MISMATCHES.md M-40).

    The 2026-10-20 link slice adds `GET|POST
    /api/v1/documents/{documentId}/links` and `DELETE
    /api/v1/documents/{documentId}/links/{linkId}`, the same three operations on
    the expert's `/internal/v1` base, the `DocumentLink` projection, the
    `CreateDocumentLinkRequest` command, and the optional `linkedType` +
    `linkedId` filter on the document list. Search `q` also matches any link's
    `linkedReference`. The link is tenant-scoped and flat: the SPEC 11.6.10
    `/associations` route, the subject triple and role, the association book,
    and the DOC-09 synchronous target check are not implemented (MISMATCHES.md
    M-26).

    The implemented Document services emit a compact `ApiError` body of
    `{code, message, details[]}` rather than the canonical Problem envelope;
    see MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://document-domain:8096
    description: Document domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Document
    description: Public domain API used by the Document web remote and other domain services.
  - name: Document internal
    description: Internal expert API. Not exposed through the gateway; called only by the Document domain service.
paths:
  /api/v1/documents:
    get:
      operationId: listDocuments
      tags:
        - Document
      summary: List documents for the caller's tenant.
      description: >
        Returns a bare JSON array. The optional `linkedType` + `linkedId` pair
        restricts the list to documents linked to that subject: the two
        parameters are a pair, so supplying one without the other is 400
        `INVALID_LINK_FILTER`, and an unknown `linkedType` is 400
        `INVALID_LINKED_TYPE`. Free-text search over metadata and link
        references is served by `GET /api/v1/documents/search`; cursor
        pagination remains planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: linkedType
          in: query
          required: false
          description: >
            Optional association filter. Must be supplied with `linkedId`; see
            `DocumentLinkedType` for the closed set. The expert rejects a
            partial pair with 400 `INVALID_LINK_FILTER` and an unknown value
            with 400 `INVALID_LINKED_TYPE`.
          schema:
            $ref: '#/components/schemas/DocumentLinkedType'
        - name: linkedId
          in: query
          required: false
          description: >
            Optional target UUID of the association filter. Must be supplied
            with `linkedType`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: registerDocument
      tags:
        - Document
      summary: Register a document.
      description: >
        Registers metadata for a document. The document number is generated by
        the expert. `documentType` and `classification` are validated against
        the SPEC 11.6.5 closed sets. A retention date, when supplied, must not
        be before the creation date.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Document registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/search:
    get:
      operationId: searchDocuments
      tags:
        - Document
      summary: Search document metadata for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the document pickers.
        Matching is a case-insensitive contains over `documentNumber`, `title`,
        `documentType`, and any association link's `linkedReference`; an absent
        or blank `q` returns the most recently updated documents. The response
        is the shared `SearchResponse` envelope. A missing or malformed
        `X-EIA-Tenant` or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: DOCUMENT
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching documents, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}:
    get:
      operationId: getDocument
      tags:
        - Document
      summary: Get document metadata.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content:
    put:
      operationId: uploadDocumentContent
      tags:
        - Document
      summary: Replace the current content bytes of a document.
      description: >
        Raw-byte upload. `Content-Type` is the file MIME type and defaults to
        `application/octet-stream` when omitted; `X-File-Name` is required and
        carries the URL-encoded filename. Every accepted body is appended as an
        immutable content revision and becomes the document's current content;
        the 200 response is the `DocumentContent` metadata, including the
        revision as `currentVersion` and the lowercase SHA-256 digest of the
        exact stored bytes. An empty body is 400 `EMPTY_CONTENT`; a body above
        10 MiB (10,485,760 bytes) is 413 `FILE_TOO_LARGE`. A blank or malformed
        `X-File-Name` (400 `FILE_NAME_REQUIRED`/`INVALID_FILE_NAME`), a decoded
        name longer than 255 characters (400 `FILE_NAME_TOO_LONG`), and a
        non-concrete or invalid `Content-Type` (400 `INVALID_CONTENT_TYPE`) are
        rejected before the bytes are stored. A document outside the caller's
        tenant is 404. Each accepted write appends `document.content.uploaded`
        to the outbox in the same transaction, with the new revision as the
        payload `version` and the aggregate version.
      x-raw-body: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Content-Type
          in: header
          required: false
          description: >
            File MIME type, for example `application/pdf`. The stored type is
            the bare type/subtype (parameters such as `charset` are dropped);
            an absent header defaults to `application/octet-stream`. A
            wildcard, a malformed value, or a type longer than 128 characters
            is 400 `INVALID_CONTENT_TYPE`/`CONTENT_TYPE_TOO_LONG`.
          schema:
            type: string
            maxLength: 128
            default: application/octet-stream
        - name: X-File-Name
          in: header
          required: true
          description: >
            URL-encoded display filename. The value is decoded as UTF-8, any
            directory component is removed, and a name longer than 255
            characters or one containing control characters is rejected. The
            name is stored as display metadata and is returned in the download
            `Content-Disposition`.
          schema:
            type: string
      requestBody:
        required: true
        description: >
          The raw file bytes. The body is not JSON and is stored unchanged.
        content:
          '*/*':
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: >
            Content revision stored; the metadata projection of the current
            bytes and their revision number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '400':
          description: >
            400. `EMPTY_CONTENT` for a zero-byte body, `FILE_NAME_REQUIRED` or
            `INVALID_FILE_NAME`/`FILE_NAME_TOO_LONG` for the `X-File-Name`
            header, `INVALID_CONTENT_TYPE`/`CONTENT_TYPE_TOO_LONG` for the
            `Content-Type` header, `VALIDATION_ERROR` for a malformed request,
            and `TENANT_REQUIRED` for a missing tenant. An expert rejection is
            returned as `application/problem+json`; the compact vertical
            `ApiError` remains for the tenant check (MISMATCHES.md M-02).
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '413':
          description: >
            413. `FILE_TOO_LARGE`: the upload body is above the 10 MiB
            (10,485,760 bytes) limit. The body is rejected before it reaches
            the expert or object storage, and no content row or event is
            written. A body of exactly 10 MiB is accepted.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    get:
      operationId: downloadDocumentContent
      tags:
        - Document
      summary: Stream the current content bytes of a document.
      description: >
        Returns the stored bytes unchanged. The response is binary: the stored
        file MIME type is the `Content-Type`, `Content-Disposition` is an
        attachment built from the stored filename (with the RFC 5987
        `filename*` parameter for a non-ASCII name), `X-Content-SHA256`
        carries the lowercase digest of the bytes, and `X-Content-Version`
        carries the revision number naming the newest retained revision. A
        document outside the caller's tenant is 404; a document with no stored
        content is 404 `CONTENT_NOT_FOUND`. There is no presigned URL, no
        `Range` support, and the response must not be parsed as JSON.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current content bytes.
          headers:
            Content-Type:
              description: >
                The stored file MIME type, for example `application/pdf`.
                Falls back to `application/octet-stream` when the stored type
                cannot be parsed.
              schema:
                type: string
            Content-Disposition:
              description: >
                Attachment disposition with the stored filename, for example
                `attachment; filename="policy schedule.pdf"`. A non-ASCII name
                also carries `filename*=UTF-8''...`.
              schema:
                type: string
            X-Content-SHA256:
              description: >
                Lowercase hexadecimal SHA-256 of the returned bytes. A caller
                can verify the download without trusting the transport. Absent
                only if the expert omitted the header.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            X-Content-Version:
              description: >
                Revision number of the returned bytes, the same value as
                `currentVersion` in the metadata projection.
              schema:
                type: integer
                minimum: 1
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/metadata:
    get:
      operationId: getDocumentContentMetadata
      tags:
        - Document
      summary: Get the metadata of the current content.
      description: >
        Returns the `DocumentContent` projection without the bytes. The
        projection carries the owning document, the stored display filename,
        the stored MIME type, the exact size in bytes, the lowercase SHA-256
        digest, the upload instant, and the current revision number. A document
        outside the caller's tenant is 404, indistinguishable from a missing
        document; a document with no stored content is 404
        `CONTENT_NOT_FOUND`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Metadata of the current content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/versions:
    get:
      operationId: listDocumentContentVersions
      tags:
        - Document
      summary: List the retained content revisions of a document.
      description: >
        Returns the document's immutable content revisions as a bare JSON array
        ordered newest first (`version` descending). Each entry carries the
        owning document, the revision number, the stored display filename, the
        stored MIME type, the exact size in bytes, the lowercase SHA-256 digest,
        and the upload instant. A document with no stored content has no
        revisions and returns an empty array. A document outside the caller's
        tenant is 404, indistinguishable from a missing document. The SPEC
        11.6.10 history route is `/versions`; the implemented history is nested
        under `/content/versions` (MISMATCHES.md M-40).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Retained content revisions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentContentVersion'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/content/versions/{version}:
    get:
      operationId: downloadDocumentContentVersion
      tags:
        - Document
      summary: Stream one retained content revision of a document.
      description: >
        Returns the stored bytes of one retained revision unchanged. The
        response is binary: the stored file MIME type is the `Content-Type`,
        `Content-Disposition` is an attachment built from the revision's
        filename, `X-Content-SHA256` carries the lowercase digest of the bytes,
        and `X-Content-Version` repeats the requested revision. Revisions start
        at 1 and increase by one per accepted upload. A document outside the
        caller's tenant is 404, indistinguishable from a missing document; a
        revision that does not exist, including a number below 1, is 404
        `CONTENT_VERSION_NOT_FOUND`. A non-numeric `version` is 400
        `INVALID_PARAMETER`. There is no presigned URL and no `Range` support.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          description: >
            Revision number from `GET .../content/versions`, starting at 1.
            A non-numeric value is 400 `INVALID_PARAMETER`; an unknown or
            non-positive revision is 404 `CONTENT_VERSION_NOT_FOUND`.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: The bytes of the requested content revision.
          headers:
            Content-Type:
              description: >
                The stored file MIME type of the revision, for example
                `application/pdf`. Falls back to `application/octet-stream`
                when the stored type cannot be parsed.
              schema:
                type: string
            Content-Disposition:
              description: >
                Attachment disposition with the revision's stored filename, for
                example `attachment; filename="policy schedule v1.pdf"`. A
                non-ASCII name also carries `filename*=UTF-8''...`.
              schema:
                type: string
            X-Content-SHA256:
              description: >
                Lowercase hexadecimal SHA-256 of the returned revision bytes.
              schema:
                type: string
                pattern: '^[a-f0-9]{64}$'
            X-Content-Version:
              description: Revision number of the returned bytes.
              schema:
                type: integer
                minimum: 1
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/status:
    post:
      operationId: changeDocumentStatus
      tags:
        - Document
      summary: Advance a document through its lifecycle.
      description: >
        Applies one transition from SPEC 11.6.6. A document must carry a
        retention date before it becomes ACTIVE (DOC-05). The public command
        does not carry an expected version; the domain reads and forwards the
        current version.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeDocumentStatusRequest'
      responses:
        '200':
          description: Document after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '503':
          $ref: './components.yaml#/components/responses/ServiceUnavailable'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links:
    get:
      operationId: listDocumentLinks
      tags:
        - Document
      summary: List the association links of a document.
      description: >
        Returns the document's links as a bare JSON array, ordered by creation
        time. Each link carries the typed target (`linkedType` + `linkedId`) and
        the cached `linkedReference` and `linkedLabel` used to render it without
        a cross-vertical call. A document outside the caller's tenant is a 404,
        indistinguishable from a missing document. The SPEC 11.6.10
        `/associations` shape and its subject role are not implemented
        (MISMATCHES.md M-26).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Links of the document.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createDocumentLink
      tags:
        - Document
      summary: Associate a document with another record.
      description: >
        Creates one association link and writes `document.link.added` in the
        same transaction. `linkedType` is the closed `DocumentLinkedType` set and
        `linkedId` is the target UUID; both are required. `linkedReference` is an
        optional display snapshot of at most 64 characters and is never used to
        resolve the target. The target is not checked for existence with its
        owning vertical yet (DOC-09; MISMATCHES.md M-26). A duplicate
        `(documentId, linkedType, linkedId)` for the tenant is 409
        `DUPLICATE_LINK` and writes no row or event; a document outside the
        tenant is 404.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentLinkRequest'
      responses:
        '201':
          description: Link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentLink'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. The document already has a link to this `(linkedType,
            linkedId)` pair. The vertical `ApiError` carries code
            `DUPLICATE_LINK`; no second row or event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/documents/{documentId}/links/{linkId}:
    delete:
      operationId: deleteDocumentLink
      tags:
        - Document
      summary: Remove an association link.
      description: >
        Deletes exactly one link inside the caller's tenant and document scope
        and writes `document.link.removed` in the same transaction. A link that
        is not visible under both the tenant and the document is a 404
        `LINK_NOT_FOUND`, indistinguishable from a missing link. Success is 204
        with no body.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Link removed.
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/documents:
    get:
      operationId: expertListDocuments
      tags:
        - Document internal
      summary: List documents for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: linkedType
          in: query
          required: false
          description: >
            Optional association filter. Must be supplied with `linkedId`; an
            unknown value is 400 `INVALID_LINKED_TYPE` and a partial pair is 400
            `INVALID_LINK_FILTER`.
          schema:
            $ref: '#/components/schemas/DocumentLinkedType'
        - name: linkedId
          in: query
          required: false
          description: Optional target UUID of the association filter, paired with `linkedType`.
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: >
            Optional free-text term. The expert trims it and matches
            case-insensitively as a contains over document metadata and any
            link's `linkedReference`.
          schema:
            type: string
      responses:
        '200':
          description: Documents of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertRegisterDocument
      tags:
        - Document internal
      summary: Register a document (expert).
      security: []
      x-internal-api: true
