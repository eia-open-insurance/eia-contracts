    note: Preview rendition.
  - method: GET
    path: /api/v1/documents/{documentId}/versions
    spec: SPEC 11.6.10
    note: Versions.
  - method: POST
    path: /api/v1/documents/{documentId}/versions
    spec: SPEC 11.6.10
    note: New version.
  - method: POST
    path: /api/v1/documents/{documentId}/associations
    spec: SPEC 11.6.10
