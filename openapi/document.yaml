components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Document:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Document metadata projection. The SPEC 11.6.4 model calls the type
        docType and the classification confidentiality, and carries content,
        versions, associations, hashes, page counts, OCR status, and tags; the
        implemented field names are documentType and classification.
      required:
        - id
        - tenantId
        - documentNumber
        - title
        - documentType
        - classification
        - status
        - retentionUntil
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        documentNumber:
          type: string
          examples:
            - DOC-2026-0000001
        title:
          type: string
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        retentionUntil:
          type: [string, 'null']
          format: date
          description: Retention end date. Required before a document becomes ACTIVE.
    DocumentContent:
      type: object
      description: >
        Metadata of the bytes currently stored for a document. The bytes are
        not part of the projection; use `GET
        /api/v1/documents/{documentId}/content` to stream them. The digest is
        computed over the exact stored bytes and is repeated in the download's
        `X-Content-SHA256` header, so a caller can verify the transfer.
        `currentVersion` names the newest retained revision, which is the
        revision returned by the current download.
      required:
        - documentId
        - fileName
        - contentType
        - sizeBytes
        - sha256
        - uploadedAt
        - currentVersion
      properties:
        documentId:
          type: string
          format: uuid
          description: Owning document, within the caller's tenant.
        fileName:
          type: string
          maxLength: 255
          description: >
            Stored display filename. Any directory component supplied on
            upload is removed before the name is stored.
          examples:
            - policy schedule.pdf
        contentType:
          type: string
          maxLength: 128
          description: >
            Stored file MIME type without parameters, for example
            `application/pdf`. Defaults to `application/octet-stream` when the
            upload omits `Content-Type`.
          examples:
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10485760
          description: Exact size of the stored content in bytes. The maximum is 10 MiB.
          examples:
            - 27
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase hexadecimal SHA-256 digest of the stored bytes.
          examples:
            - 9f2c5d0f8f0d1c9a5f0f0f3a6b8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f607182
        uploadedAt:
          type: string
          format: date-time
          description: Instant of the most recent accepted upload.
          examples:
            - '2026-10-20T09:30:00Z'
        currentVersion:
          type: integer
          format: int64
          minimum: 1
          description: >
            Revision number of the stored bytes, starting at 1 for the first
            upload and increasing by one per accepted upload. It is the newest
            entry in the retained history and the value carried by the current
            download's `X-Content-Version` header.
          examples:
            - 2
    DocumentContentVersion:
      type: object
      description: >
        Metadata of one immutable content revision retained for a document. The
        bytes are not part of the projection; use `GET
        /api/v1/documents/{documentId}/content/versions/{version}` to stream
        them. `version` is also the aggregate version of the
        `document.content.uploaded` fact written with the revision.
      required:
        - documentId
        - version
        - fileName
        - contentType
        - sizeBytes
        - sha256
        - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
          description: Owning document, within the caller's tenant.
        version:
          type: integer
          format: int64
          minimum: 1
          description: >
            Revision number, starting at 1 for the first upload and increasing
            by one per accepted upload.
          examples:
            - 1
        fileName:
          type: string
          maxLength: 255
          description: >
            Display filename stored with this revision. Any directory component
            supplied on upload was removed before the name was stored.
          examples:
            - policy schedule.pdf
        contentType:
          type: string
          maxLength: 128
          description: >
            Stored file MIME type without parameters, for example
            `application/pdf`.
          examples:
            - application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 10485760
          description: Exact size of the revision in bytes. The maximum is 10 MiB.
          examples:
            - 27
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Lowercase hexadecimal SHA-256 digest of the revision bytes.
          examples:
            - 9f2c5d0f8f0d1c9a5f0f0f3a6b8c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f607182
        uploadedAt:
          type: string
          format: date-time
          description: Instant at which this revision was accepted.
          examples:
            - '2026-10-20T09:30:00Z'
    DocumentType:
      type: string
      description: Document type from SPEC 11.6.5, as enforced by the expert.
      enum:
        - POLICY
        - DECLARATIONS
        - ENDORSEMENT
        - CERTIFICATE
        - BINDER
        - QUOTE
        - SLIP
        - WORDING
        - FORM
        - EXCLUSION
        - SCHEDULE
        - ASSUMED_CONTRACT
        - TREATY_SLIP
        - BORDEREAU
        - LOSS_ADVICE
        - TECHNICAL_ACCOUNT
        - STATEMENT
        - CASH_CALL
        - SECURITY
        - COMMUTATION_AGREEMENT
        - CLAIM_FORM
        - FNOL
        - PROOF_OF_LOSS
        - PLAINTIFF_FACT_SHEET
        - MEDICAL_RECORD
        - MEDICAL_BILL
        - B_READ
        - EXPOSURE_AFFIDAVIT
        - AUTHORIZATION
        - HIPAA_RELEASE
        - DEMAND_LETTER
        - PLEADING
        - DISCOVERY
        - DEPOSITION
        - EXPERT_REPORT
        - SETTLEMENT_AGREEMENT
        - RELEASE
        - CONSENT_JUDGMENT
        - COURT_ORDER
        - LIEN
        - LIEN_WAIVER
        - MEDICARE_CONDITIONAL_PAYMENT
        - TRUST_CLAIM_FORM
        - TRUST_DISTRIBUTION
        - PAYMENT_AUTHORITY
        - PAYMENT_RECEIPT
        - REMITTANCE
        - INVOICE
        - DEFENSE_INVOICE
        - TAX_FORM
        - W9
        - KYC
        - SANCTIONS_RESULT
        - CORRESPONDENCE
        - EMAIL
        - NOTE
        - PHOTO
        - AUDIO
        - VIDEO
        - OTHER
    Confidentiality:
      type: string
      description: Confidentiality classification from SPEC 11.6.5.
      enum:
        - PUBLIC
        - INTERNAL
        - CONFIDENTIAL
        - RESTRICTED
        - PHI
        - PRIVILEGED
    DocumentStatus:
      type: string
      description: Document lifecycle status from SPEC 11.6.5 and 11.6.6.
      enum:
        - PENDING_UPLOAD
        - RECEIVED
        - SCANNING
        - PROCESSING
        - CLASSIFIED
        - ACTIVE
        - SUPERSEDED
        - ON_HOLD
        - ARCHIVED
        - DISPOSED
        - REJECTED
        - FAILED
    CreateDocumentRequest:
      type: object
      description: Public register command. The tenant comes from X-EIA-Tenant.
      required:
        - title
        - documentType
        - classification
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    CreateDocumentRequestInternal:
      type: object
      description: Internal register command accepted by the Document expert.
      required:
        - tenantId
        - title
        - documentType
        - classification
      properties:
        tenantId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 300
        documentType:
          $ref: '#/components/schemas/DocumentType'
        classification:
          $ref: '#/components/schemas/Confidentiality'
        retentionUntil:
          type: string
          format: date
    ChangeDocumentStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
    ChangeDocumentStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Document expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional. When supplied, a stale version returns 409 VERSION_CONFLICT.
    DocumentLinkedType:
      type: string
      description: >
        Closed set of target kinds a document can be linked to. This is the
        implemented link vocabulary; the SPEC 11.6 association additionally
        carries a subject vertical, subject type, and role (MISMATCHES.md M-26).
      enum:
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - POLICY
        - CONTRACT
        - PARTY
        - PAYMENT
        - OTHER
    DocumentLink:
      type: object
      description: >
        Association link between a document and one target record. The Document
        vertical owns the link and stores a display snapshot; the target's
        owning vertical remains authoritative. `linkedLabel` is
        `linkedReference` when present, otherwise the first eight characters of
        `linkedId`.
      required:
        - id
        - documentId
        - linkedType
        - linkedId
        - linkedLabel
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        linkedType:
          $ref: '#/components/schemas/DocumentLinkedType'
        linkedId:
          type: string
          format: uuid
          description: Target record id in the vertical named by `linkedType`.
        linkedReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Optional human-readable snapshot of the target (a policy or claim
            number, for example). It is a label only and is never used to
            resolve or validate the target.
        linkedLabel:
          type: string
          description: >
            Render label: `linkedReference` when present, otherwise the first
            eight characters of `linkedId`.
        createdAt:
          type: string
          format: date-time
    CreateDocumentLinkRequest:
      type: object
      description: >
        Public create command. The tenant comes from `X-EIA-Tenant` and is never
        part of the body.
      required:
        - linkedType
        - linkedId
      properties:
        linkedType:
          $ref: '#/components/schemas/DocumentLinkedType'
        linkedId:
          type: string
          format: uuid
          description: Target record id in the vertical named by `linkedType`.
        linkedReference:
          type: string
          maxLength: 64
          description: Optional display snapshot, trimmed; it never resolves the target.
