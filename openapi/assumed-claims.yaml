components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    AssumedClaim:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Assumed claim projection. The book is fixed to ASSUMED for every row.
        Money is a decimal string.
      required:
        - id
        - tenantId
        - businessBook
        - assumedClaimNumber
        - contractId
        - cedentClaimNumber
        - status
        - lossDate
        - reportDate
        - reserveAmount
        - reserveCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        assumedClaimNumber:
          type: string
          examples:
            - RNS-2026-0000001
        contractId:
