openapi: 3.1.0
info:
  title: EIA Assumed Claims API
  version: 1.5.0
  summary: Assumed-book reinsurance claim administration and the Assumed Claims expert API.
  description: >
    This document describes the implemented public Assumed Claims domain API
    and the internal Assumed Claims expert API. The authoritative requirement is
    SPEC 11.5 and SPEC 12.

    Assumed Claims is fixed to the ASSUMED book. A book filter answers 404 with
    code EIA-RNS-7005 when X-EIA-Book is missing or different, so the response
    cannot confirm that a claim exists in the other book (SPEC 3.6.2, WALL-06).

    The controller is mapped to both `/api/v1/assumed-claims` and
    `/api/v1/assumed-claims/claims`. The base routes are documented under both
    path forms because the web remote calls the `/claims` form. Round 5's
    second-slice routes are documented once under the short form and carry an
    `x-path-alias` naming the equivalent `/api/v1/assumed-claims/claims`
    prefix; both forms are served by the same controller methods with identical
    requests and responses.

    Round 5 adds loss advices, bordereau ingest, append-only reserve history,
    cash calls, recoveries, commutation, disputes, the financial summary, the
    audit trail, and closure. The expert returns the canonical RFC 9457 Problem
    body with codes in the EIA-RNS-7xxx range; the domain re-emits the expert's
    status, code, category, and field errors unchanged, including 409, 422, and
    428.

    1.3.0 adds the claim task and note surface. Tasks are optimistic-concurrency
    records with an OPEN/COMPLETE/CANCELLED status; notes are append-only and
    have no update or delete route. 1.4.0 adds optional idempotent creation:
    both POSTs accept `Idempotency-Key` (1-64 characters), a same-key retry of
    an identical body replays the original 201 with `Idempotent-Replay: true`,
    and a different body under the same key is 409 `EIA-RNS-4091`
    (`IDEMPOTENCY_KEY_REUSED`). Assumed Claims always emits the
    `Idempotent-Replay` header on a 201 create response and is race-safe
    because the expert reserves the key with an atomic insert.

    Assignment (`PATCH /api/v1/assumed-claims/claims/{claimId}/assignment`,
    also served under the short `/api/v1/assumed-claims/{claimId}/assignment`
    alias) replaces the claim's current ownership. `assignedAdjuster` is
    required and trimmed, `assignedTeam` is optional, and `expectedVersion` is
    the claim version the caller observed: a stale value is 409 and never
    overwrites a concurrent change. The expert fixes `assignedAt` at the change
    instant, records the optional `X-EIA-Actor` identity as `assignedBy` and in
    the audit trail, and defaults the actor to the assigned adjuster when the
    header is absent. Repeating the current assignment at the current version is
    a no-op (no version bump, no audit entry, no event). A real change bumps the
    claim version and emits `assumed.claim.assigned` in the same transaction.
    The `AssumedClaim` projection exposes `assignedAdjuster`, `assignedTeam`,
    and `assignedAt` as nullable fields; a claim that has never been assigned
    returns null for all three.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://assumed-claims-domain:8090
    description: Assumed Claims domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Assumed Claims
    description: Public domain API used by the Assumed Claims web remote.
  - name: Assumed Claims internal
    description: Internal expert API. Not exposed through the gateway; called only by the Assumed Claims domain service.
paths:
  /api/v1/assumed-claims:
    get:
      operationId: listAssumedClaims
      tags:
        - Assumed Claims
      summary: List assumed claims for the caller's tenant and book.
      description: >
        Returns a bare JSON array. Free-text search is served by
        `GET /api/v1/assumed-claims/search`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      responses:
        '200':
          description: Assumed claims of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssumedClaim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createAssumedClaim
      tags:
        - Assumed Claims
      summary: Create an assumed claim from a notice.
      description: >
        The claim is created in NOTIFIED. The assumed claim number is generated
        by the expert as RNS-{year}-{7 digits}.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssumedClaimRequest'
      responses:
        '201':
          description: Assumed claim created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumedClaim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/search:
    get:
      operationId: searchAssumedClaims
      tags:
        - Assumed Claims
      summary: Search assumed claims for the caller's tenant and ASSUMED book.
      description: >
        Global-search projection used by the shell and by the claim pickers.
        Matching is a case-insensitive contains over `assumedClaimNumber`,
        `cedentClaimNumber`, and `contractId`; an absent or blank `q` returns
        the most recently updated claims. The response is the shared
        `SearchResponse` envelope. `X-EIA-Book` is required and must be
        ASSUMED; a missing or different book is hidden as 404
        `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2, WALL-06). A missing tenant or a
        `limit` outside 1-25 is a 400 `application/problem+json` Problem.
      x-search-type: ASSUMED_CLAIM
      x-path-alias: /api/v1/assumed-claims/claims/search
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching assumed claims, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}:
    get:
      operationId: getAssumedClaim
      tags:
        - Assumed Claims
      summary: Get an assumed claim.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assumed claim detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumedClaim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/status:
    post:
      operationId: changeAssumedClaimStatus
      tags:
        - Assumed Claims
      summary: Advance an assumed claim through its lifecycle.
      description: >
        Applies one transition from SPEC 11.5.6. The command carries the target
        status and the expected version; a stale version returns 409 with
        code EIA-RNS-7006. Moving to OPEN requires at least one accepted loss
        advice (422 `EIA-RNS-7102`); moving to RESERVED requires a positive
        current reserve (422 `EIA-RNS-7204`); COMMUTED is rejected with 409
        `EIA-RNS-7505` and must use POST /commute.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeAssumedClaimStatusRequest'
      responses:
        '200':
          description: Assumed claim after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumedClaim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/close:
    post:
      operationId: closeAssumedClaim
      tags:
        - Assumed Claims
      summary: Close an assumed claim.
      description: >
        Closure is blocked by an open dispute, a current reserve, an unresolved
        advice, or an outstanding cash call; the rejection is 422
        `EIA-RNS-7701`. Closing an already closed claim is 409
        `EIA-RNS-7702`.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/close
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Assumed claim closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssumedClaim'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/financials:
    get:
      operationId: getAssumedClaimFinancials
      tags:
        - Assumed Claims
      summary: Get the ceded financial position.
      description: >
        Every amount is a decimal string in the claim currency. `netCededAmount`
        is incurred minus recoveries; `sourceVersion` is the claim version the
        summary was derived from.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/financials
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Financial summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/audit:
    get:
      operationId: listAssumedClaimAudit
      tags:
        - Assumed Claims
      summary: List the append-only claim audit trail.
      description: >
        Events are returned in occurrence order. The audit table refuses UPDATE
        and DELETE at the database level.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/audit
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit entries of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClaimAuditEntry'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/advices:
    get:
      operationId: listAssumedClaimAdvices
      tags:
        - Assumed Claims
      summary: List loss advices.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/advices
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Loss advices of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LossAdvice'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: recordAssumedClaimAdvice
      tags:
        - Assumed Claims
      summary: Record a loss advice.
      description: >
        `adviceNumber` is unique per claim (409 `EIA-RNS-7101` on a duplicate,
        RNS-02). The advice starts in RECEIVED. `cessionPct` is a fraction
        between 0 and 1; `cededAmount` may be supplied or is derived from the
        reported amount. The claim must be open for financial change (409
        `EIA-RNS-7205`).
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/advices
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAdviceRequest'
      responses:
        '201':
          description: Loss advice recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossAdvice'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/advices/{adviceId}/accept:
    post:
      operationId: acceptAssumedClaimAdvice
      tags:
        - Assumed Claims
      summary: Accept a loss advice.
      description: >
        Only a RECEIVED advice can be accepted (409 `EIA-RNS-7103` otherwise).
        Acceptance posts the advice, records the audit entry, and makes the
        claim eligible to open. The optional body carries `acceptedBy` and
        `note`.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/advices/{adviceId}/accept
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: adviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAdviceRequest'
      responses:
        '200':
          description: Loss advice accepted and posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LossAdvice'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/bordereaux:
    get:
      operationId: listAssumedClaimBordereaux
      tags:
        - Assumed Claims
      summary: List bordereau batches.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/bordereaux
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bordereau batches of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BordereauBatch'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: ingestAssumedClaimBordereau
      tags:
        - Assumed Claims
      summary: Ingest a bordereau batch.
      description: >
        Ingest is idempotent by `bordereauReference` plus the content hash. A
        replay returns 200 with `replayed: true`; the same reference with
        different content is 409 `EIA-RNS-7104`. Each line becomes a loss advice
        with source BORDEREAU; duplicate advice numbers are reported per line as
        DUPLICATE instead of overwriting. A batch carries at most 500 lines.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/bordereaux
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestBordereauRequest'
      responses:
        '201':
          description: Bordereau ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BordereauIngestResult'
        '200':
          description: Idempotent replay of the same bordereau reference and content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BordereauIngestResult'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/reserves:
    get:
      operationId: listAssumedClaimReserves
      tags:
        - Assumed Claims
      summary: List append-only reserve movements.
      description: >
        The current reserve is derived from the latest current row per
        component; CASE and IBNR remain separate (RNS-04).
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/reserves
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reserve history of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReserveHistoryEntry'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: changeAssumedClaimReserve
      tags:
        - Assumed Claims
      summary: Record a reserve movement.
      description: >
        Reserves are append-only. A negative amount, a missing reason, or a
        stale effective date is rejected (400 `EIA-RNS-7201`, 409
        `EIA-RNS-7202`). IBNR, large movements, and an actuarial or
        underwriting authority require a named approver; otherwise the response
        is 428 `EIA-RNS-7203`.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/reserves
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveChangeRequest'
      responses:
        '201':
          description: Reserve movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReserveHistoryEntry'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/cash-calls:
    get:
      operationId: listAssumedClaimCashCalls
      tags:
        - Assumed Claims
      summary: List cash calls.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/cash-calls
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash calls of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashCall'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: requestAssumedClaimCashCall
      tags:
        - Assumed Claims
      summary: Request a cash call.
      description: >
        A cash call may not exceed the current reserve net of outstanding cash
        calls (422 `EIA-RNS-7301`). An amount above the approval threshold needs
        a named claims approver; otherwise the response is 428
        `EIA-RNS-7302`. The request number is generated by the expert.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/cash-calls
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCashCallRequest'
      responses:
        '201':
          description: Cash call requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashCall'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/assumed-claims/{assumedClaimId}/recoveries:
    get:
      operationId: listAssumedClaimRecoveries
      tags:
        - Assumed Claims
      summary: List recoveries.
      x-path-alias: /api/v1/assumed-claims/claims/{assumedClaimId}/recoveries
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recoveries of the claim.
          content:
            application/json:
              schema:
