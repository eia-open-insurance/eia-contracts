      responses:
        '201':
          description: Recovery recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recovery'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/assumed-claims/{assumedClaimId}/commutation:
    get:
      operationId: expertGetAssumedClaimCommutation
      tags:
        - Assumed Claims internal
      summary: Get the claim commutation (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Commutation of the claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/assumed-claims/{assumedClaimId}/commute:
    post:
      operationId: expertCommuteAssumedClaim
      tags:
        - Assumed Claims internal
      summary: Execute a commutation (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommuteClaimRequest'
      responses:
        '201':
          description: Commutation executed and the claim closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commutation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/assumed-claims/{assumedClaimId}/disputes:
    get:
      operationId: expertListAssumedClaimDisputes
      tags:
        - Assumed Claims internal
      summary: List disputes (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Disputes of the claim.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispute'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertRaiseAssumedClaimDispute
      tags:
        - Assumed Claims internal
      summary: Raise a dispute (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseDisputeRequest'
      responses:
        '201':
          description: Dispute raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/assumed-claims/{assumedClaimId}/disputes/{disputeId}/resolve:
    post:
      operationId: expertResolveAssumedClaimDispute
      tags:
        - Assumed Claims internal
      summary: Resolve a dispute (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderAssumed'
        - name: assumedClaimId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Dispute resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
