  notes: >
    Both public path forms are implemented by the same controller methods; the
    second-slice routes document the short form and name the `/claims` alias in
    `x-path-alias`. The task and note routes document the `/claims` form and
    name the short form in `x-path-alias`; they are also served on the internal
    expert alias. The expert create and transition bodies carry tenantId
    because the expert is not exposed publicly; the close, financials, audit,
    and all second-slice expert reads take the tenant from X-EIA-Tenant. The
    domain preserves the expert's 409, 422, and 428 statuses and EIA-RNS codes;
    task validation is 400 `EIA-RNS-7004`, an unknown task is 404
    `EIA-RNS-7801`, and a stale task version is 409 `EIA-RNS-7802`. The task and
    note POSTs accept an optional `Idempotency-Key`: the domain validates the
    1-64 character bounds before the expert call, and the expert reserves the
    key with an atomic insert, so concurrent first attempts either create once
    or replay. A same-key retry of an identical body returns the stored 201 with
    `Idempotent-Replay: true`; a different body is 409 `EIA-RNS-4091` category
    `CONFLICT` with `errors[0].code = IDEMPOTENCY_KEY_REUSED`. Assignment is
    implemented on the `/claims` route, the short alias, and the internal expert
    alias. The expert accepts `X-EIA-Actor` only; when it is absent the assigned
    adjuster is recorded as the actor. `assignedBy` is stored and audited but is
    not returned in the public `AssumedClaim` projection. The assignment event
    name has no SPEC 11.5.9 equivalent (MISMATCHES.md M-22). The domain
    `AssignClaimCommand` still requires `assignedTeam` while the expert accepts
    it as optional, so the contract's optional team is not reachable through the
    public route yet; M-25 records that gap.
x-compatibility:
  contractVersion: 1.5.0
  previousContractVersion: 1.4.0
  breaking: []
  compatible:
    - Adds PATCH /api/v1/assumed-claims/claims/{claimId}/assignment (alias /api/v1/assumed-claims/{claimId}/assignment) and the /internal/v1/assumed-claims/{claimId}/assignment expert route.
    - Adds the AssignClaimRequest schema (assignedAdjuster required, max 128; assignedTeam optional, max 64; expectedVersion required, integer zero or greater).
    - Adds the optional X-EIA-Actor request header to the assignment operations.
    - Adds the nullable assignedAdjuster, assignedTeam, and assignedAt fields to the AssumedClaim projection.
    - Documents 200/400/404/409 problem responses, the stale-version 409 EIA-RNS-7006, and the same-assignment no-op.
    - Documents the assumed.claim.assigned event published in the same transaction as a real assignment change.
    - Adds the optional ClaimIdempotencyKey parameter (Idempotency-Key, 1-64 characters) to POST /api/v1/assumed-claims/claims/{claimId}/tasks and POST /api/v1/assumed-claims/claims/{claimId}/notes.
    - Documents the 201 Idempotent-Replay header, true for a stored-response replay and false for a fresh create.
    - Documents 400 EIA-RNS-7004 INVALID_IDEMPOTENCY_KEY for an invalid key and 409 EIA-RNS-4091 IDEMPOTENCY_KEY_REUSED for the same key with a different body.
    - Adds GET/POST /api/v1/assumed-claims/claims/{claimId}/tasks, PATCH /api/v1/assumed-claims/claims/{claimId}/tasks/{taskId}, and GET/POST /api/v1/assumed-claims/claims/{claimId}/notes.
    - Adds the Task, TaskCreate, TaskStatusChange, Note, and NoteCreate schemas.
    - Adds GET /api/v1/assumed-claims/search (alias /api/v1/assumed-claims/claims/search) returning the shared SearchResponse envelope.
    - Adds advices, bordereaux, reserves, cash calls, recoveries, commutation, disputes, financials, audit, and close.
    - Adds the 422 and 428 responses to the new mutation operations.
  note: >
    Idempotency on the task and note POSTs is additive over 1.3.0: the header is
    optional, no existing path, request body field, or response body field
    changed, and a caller that omits the key keeps the previous create
    behaviour. The only observable change without a key is the always-present
    `Idempotent-Replay: false` response header.

    Assignment is additive over 1.4.0: it adds one public operation (with the
    short alias and the internal expert route), the optional actor header, and
    nullable response fields. A claim that is never assigned keeps null
    assignment fields and emits no assignment event, so existing consumers see
    no change. The optional `assignedTeam` in the contract is not yet accepted by
    the domain command; M-25 records the gap.
