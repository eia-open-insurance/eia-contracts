          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    AssumedClaim:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Assumed claim projection. The book is fixed to ASSUMED for every row.
        Money is a decimal string.
      required:
        - id
        - tenantId
        - businessBook
        - assumedClaimNumber
        - contractId
        - cedentClaimNumber
        - status
        - lossDate
        - reportDate
        - reserveAmount
        - reserveCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        businessBook:
          type: string
          enum:
            - ASSUMED
        assumedClaimNumber:
          type: string
          examples:
            - RNS-2026-0000001
        contractId:
          type: string
          format: uuid
        cedentClaimNumber:
          type: [string, 'null']
          maxLength: 64
        status:
          $ref: '#/components/schemas/AssumedClaimStatus'
        lossDate:
          type: [string, 'null']
          format: date
        reportDate:
          type: [string, 'null']
          format: date
        reserveAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reserveCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    AssumedClaimStatus:
      type: string
      description: Assumed claim lifecycle status from SPEC 11.5.6.
      enum:
        - NOTIFIED
        - OPEN
        - RESERVED
        - IN_ADJUSTMENT
        - SETTLED
        - PAYMENT_PENDING
        - PAID
        - CLOSED
        - DENIED
        - COMMUTED
        - REOPENED
        - DISPUTED
        - WITHDRAWN
    LossAdvice:
      type: object
      description: >
        Loss advice (SPEC 11.5.4). Amounts are decimal strings and the advice is
        unique per claim by `adviceNumber` (RNS-02).
      required:
        - id
        - tenantId
        - assumedClaimId
        - adviceNumber
        - adviceType
        - adviceDate
        - reportedAmount
        - currency
        - layerAttachmentMet
        - status
        - source
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        adviceNumber:
          type: string
          maxLength: 32
        cedentClaimNumber:
          type: [string, 'null']
          maxLength: 64
        adviceType:
          $ref: '#/components/schemas/AdviceType'
        adviceDate:
          type: string
          format: date
        receivedDate:
          type: [string, 'null']
          format: date
        periodFrom:
          type: [string, 'null']
          format: date
        periodTo:
          type: [string, 'null']
          format: date
        reportedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        paidAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        outstandingAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        expenseAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        reserveAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        recoveryAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        cessionPct:
          $ref: './components.yaml#/components/schemas/Percent'
        cededAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        layerAttachmentMet:
          type: boolean
        status:
          $ref: '#/components/schemas/AdviceStatus'
        rejectionReason:
          type: [string, 'null']
          maxLength: 2000
        sourceDocumentId:
          type: [string, 'null']
          format: uuid
        bordereauId:
          type: [string, 'null']
          format: uuid
        bordereauLineNumber:
          type: [integer, 'null']
          minimum: 1
        source:
          $ref: '#/components/schemas/AdviceSource'
        version:
          type: integer
          minimum: 0
        postedAt:
          type: [string, 'null']
          format: date-time
        notes:
          type: [string, 'null']
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdviceType:
      type: string
      enum:
        - INITIAL_NOTICE
        - RESERVE_CHANGE
        - PAYMENT
        - RECOVERY
        - EXPENSE
        - SALVAGE
        - SUBROGATION
        - CLOSE
        - REOPEN
        - UPDATE
        - CASH_CALL
    AdviceStatus:
      type: string
      enum:
        - RECEIVED
        - VALIDATED
        - POSTED
        - REJECTED
        - SUPERSEDED
        - DUPLICATE
    AdviceSource:
      type: string
      enum:
        - MANUAL
        - BORDEREAU
        - API
    BordereauBatch:
      type: object
      description: >
        A bordereau batch header. Lines become loss advices with source
        BORDEREAU.
      required:
        - id
        - tenantId
        - assumedClaimId
        - bordereauReference
        - adviceDate
        - currency
        - status
        - source
        - version
        - lineCount
        - acceptedCount
        - duplicateCount
        - rejectedCount
        - payloadHash
        - receivedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        bordereauReference:
          type: string
          maxLength: 64
        cedentClaimNumber:
          type: [string, 'null']
          maxLength: 64
        adviceDate:
          type: string
          format: date
        reportedAmountTotal:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - PROCESSED
            - PARTIAL
            - DUPLICATE
            - REJECTED
        source:
          $ref: '#/components/schemas/AdviceSource'
        version:
          type: integer
          minimum: 0
        lineCount:
          type: integer
          minimum: 0
        acceptedCount:
          type: integer
          minimum: 0
        duplicateCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        payloadHash:
          type: string
          maxLength: 64
        receivedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BordereauIngestResult:
      type: object
      required:
        - batch
        - lines
        - replayed
      properties:
        batch:
          $ref: '#/components/schemas/BordereauBatch'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/BordereauLineResult'
        replayed:
          type: boolean
    BordereauLineResult:
      type: object
      required:
        - lineNumber
        - adviceNumber
        - status
      properties:
        lineNumber:
          type: integer
          minimum: 1
        adviceNumber:
          type: string
          maxLength: 32
        status:
          type: string
          enum:
            - ACCEPTED
            - DUPLICATE
            - REJECTED
        reason:
          type: [string, 'null']
          maxLength: 400
        adviceId:
          type: [string, 'null']
          format: uuid
        reportedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
    ReserveHistoryEntry:
      type: object
      description: >
        One append-only reserve movement. `isCurrent` marks the live row per
        component; the current reserve is derived from the latest current row
        per component.
      required:
        - id
        - tenantId
        - assumedClaimId
        - component
        - sequence
        - amount
        - currency
        - effectiveDate
        - reasonCode
        - authority
        - authorityRequired
        - isCurrent
        - version
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        component:
          $ref: '#/components/schemas/ReserveComponent'
        sequence:
          type: integer
          minimum: 1
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        effectiveDate:
          type: string
          format: date
        reasonCode:
          $ref: '#/components/schemas/ReserveReason'
        reasonText:
          type: [string, 'null']
          maxLength: 200
        authority:
          $ref: '#/components/schemas/ReserveAuthority'
        authorityRequired:
          type: boolean
        approvedBy:
          type: [string, 'null']
          format: uuid
        approvedAt:
          type: [string, 'null']
          format: date-time
        isCurrent:
          type: boolean
        version:
          type: integer
          minimum: 0
        createdBy:
          type: [string, 'null']
          format: uuid
        createdAt:
          type: string
          format: date-time
    ReserveComponent:
      type: string
      enum:
        - CASE
        - IBNR
        - IBNER
        - OUTSTANDING
        - ALAE
        - ULAE
        - CASH_LOSS
        - SALVAGE
        - SUBROGATION
    ReserveReason:
      type: string
      enum:
        - INITIAL
        - ADVICE
        - DEVELOPMENT
        - PAYMENT_APPLIED
        - RECOVERY_APPLIED
        - REVIEW
        - COMMUTATION
        - CLOSE
    ReserveAuthority:
      type: string
      enum:
        - SYSTEM
        - ADJUSTER
        - SENIOR_ADJUSTER
        - ACTUARIAL
        - UNDERWRITER
    ApproverRole:
      type: string
      enum:
        - CLAIMS
        - UNDERWRITER
        - ACTUARIAL
        - SENIOR_ADJUSTER
    CashCall:
      type: object
      description: >
        A cash call request (SPEC 11.5.4). It may never exceed the claim's
        current reserve net of outstanding cash calls (RNS-09).
      required:
        - id
        - tenantId
        - assumedClaimId
        - requestNumber
        - requestedAmount
        - currency
        - status
        - reason
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        requestNumber:
          type: string
          maxLength: 32
        requestedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        requestedAt:
          type: [string, 'null']
          format: date
        dueDate:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - APPROVED
            - PAID
            - REJECTED
            - CANCELLED
        reason:
          type: string
          enum:
            - LARGE_LOSS
            - CASH_LOSS
            - EXPENSE
            - SECURITY
            - OTHER
        reasonText:
          type: [string, 'null']
          maxLength: 2000
        approvedBy:
          type: [string, 'null']
          format: uuid
        approverRole:
          oneOf:
            - $ref: '#/components/schemas/ApproverRole'
            - type: 'null'
        approvedAt:
          type: [string, 'null']
          format: date-time
        approvalStatus:
          type: [string, 'null']
          maxLength: 32
        paymentId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Recovery:
      type: object
      description: >
        A reinsurance recovery (SPEC 11.5.4), capped by the advised or paid
        loss (RNS-10).
      required:
        - id
        - tenantId
        - assumedClaimId
        - recoveryType
        - amount
        - currency
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        recoveryType:
          type: string
          enum:
            - RETROCESSION
            - INURING_ASSUMED
            - FACULTATIVE
            - SALVAGE
            - SUBROGATION
            - OTHER
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        receivedDate:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum:
            - IDENTIFIED
            - PURSUING
            - AGREED
            - RECEIVED
            - DENIED
            - ABANDONED
        sourcePartyId:
          type: [string, 'null']
          format: uuid
        sourceContractId:
          type: [string, 'null']
          format: uuid
        expectedAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        paymentId:
          type: [string, 'null']
          format: uuid
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Commutation:
      type: object
      description: >
        A claim commutation (SPEC 11.5.4); execution releases the reserves and
        closes the claim.
      required:
        - id
        - tenantId
        - assumedClaimId
        - commutationNumber
        - offerAmount
        - acceptedAmount
        - currency
        - effectiveDate
        - status
        - approvedBy
        - approverRole
        - releaseDocumentId
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        commutationNumber:
          type: string
          maxLength: 32
        commutationType:
          type: [string, 'null']
          enum:
            - FULL
            - PARTIAL
            - BUYOUT
        offerAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        acceptedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        effectiveDate:
          type: string
          format: date
        valuationDate:
          type: [string, 'null']
          format: date
        basis:
          type: [string, 'null']
          enum:
            - NEGOTIATED
            - CONTRACTUAL
            - INDUCED
        releaseDocumentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - PROPOSED
            - APPROVED
            - EXECUTED
            - REJECTED
        approvedBy:
          type: string
          format: uuid
        approverRole:
          $ref: '#/components/schemas/ApproverRole'
        approvedAt:
          type: [string, 'null']
          format: date-time
        executedAt:
          type: [string, 'null']
          format: date-time
        savingsAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        version:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Dispute:
      type: object
      description: >
        A claim dispute (SPEC 11.5.4). An open dispute blocks commutation and
        closure (RNS-11).
      required:
        - id
        - tenantId
        - assumedClaimId
        - disputeNumber
        - disputeType
        - reason
        - contestedAmount
        - currency
        - status
        - arbitrationFlag
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        assumedClaimId:
          type: string
          format: uuid
        disputeNumber:
          type: string
          maxLength: 32
        disputeType:
          type: string
          enum:
            - COVERAGE
            - QUANTUM
            - LATE_NOTICE
            - ALLOCATION
            - CESSION
            - BORDEREAU
            - SECURITY
            - OTHER
        reason:
          type: string
          maxLength: 2000
        contestedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - OPEN
            - UNDER_REVIEW
            - NEGOTIATING
            - RESOLVED
            - ESCALATED
            - ARBITRATION
            - CLOSED
        resolution:
          type: [string, 'null']
          maxLength: 2000
        raisedAt:
