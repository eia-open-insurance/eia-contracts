      type: object
      description: >
        A diary task on an assumed claim. The public projection omits the
        expert's `tenantId`; the tenant is implied by the request context.
        `version` is the task's optimistic concurrency token and starts at 1.
        The task identity is carried in the event payload as `taskVersion`.
      required:
