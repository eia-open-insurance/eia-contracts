    post:
      operationId: createAssumedClaimTask
      tags:
        - Assumed Claims
      summary: Open a diary task.
      description: >
        `title`, `dueDate`, and `priority` are required; `priority` is one of
        LOW, NORMAL, HIGH, or URGENT. The expert assigns the task number
        `TSK-{year}-{7 digits}`, the initial OPEN status, and task version 1.
        The parent claim version is bumped in the same transaction.

        `Idempotency-Key` is optional but recommended. The value is trimmed and
        must be 1-64 characters; an empty (after trimming) or longer value is
        400 `EIA-RNS-7004` with `errors[0].field = Idempotency-Key` and
        `errors[0].code = INVALID_IDEMPOTENCY_KEY`, before any write. The key is
        scoped to the tenant plus the task-create command. A retry with the same
        key and an identical canonical body returns the original 201 task with
        `Idempotent-Replay: true` and writes no second task or event; a fresh
        create returns 201 with `Idempotent-Replay: false`. Reusing the key with
        a different body is 409 `EIA-RNS-4091` with category `CONFLICT` and
        `errors[0].code = IDEMPOTENCY_KEY_REUSED`; use a new key for a new
        command. The header is optional for backward compatibility, but clients
        SHOULD send a UUID per create.
