  /api/v1/policies/{policyId}/renew:
    post:
      operationId: renewPolicy
      tags:
        - Policy
      summary: Renew a policy into a successor DRAFT term.
      description: >
        Creates a new DRAFT policy term and leaves the source policy unchanged
        (SPEC 11.2.4 renewal lineage, SPEC 11.2.10 renew). The source must be
        `ISSUED`, `IN_FORCE`, `ENDORSED`, or `REINSTATED`; any other status is
        409 `RENEWAL_NOT_ALLOWED` and writes nothing. The successor inherits the
        source product, insured party, coverages, limit schedules, insureds, and
        locations, and each copied limit gets a fresh zeroed erosion state.

        `effectiveDate` and `expirationDate` are required. `effectiveDate` must
        be on or after the source expiration date and `expirationDate` must be
        after `effectiveDate`; a violation is 400 `VALIDATION_ERROR`. The
        premium and limit override fields are optional and default to the source
        policy values; a supplied currency must be an ISO 4217 code and a
        supplied amount must be zero or greater with at most four fraction
        digits.

        The 201 body is the successor policy, not the source. Its
        `renewedFromPolicyId` points at the source, and the response carries the
        successor's strong `ETag`. The command writes `policy.policy.renewed` in
        the same transaction as the successor, its children, and its initial
        DRAFT version. Audit and transaction links (`If-Match`,
        `Idempotency-Key`) are not accepted in this slice; MISMATCHES.md M-06,
        M-07, and M-28 record the gap.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewPolicyRequest'
      responses:
        '201':
          description: Successor policy created in DRAFT.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The source status cannot be renewed (`RENEWAL_NOT_ALLOWED`). The
            allowed source statuses are ISSUED, IN_FORCE, ENDORSED, and
            REINSTATED; the problem carries `meta.sourcePolicyId`,
            `meta.sourceStatus`, and `meta.allowedStatuses`. A tenant or policy
            mismatch is 404, not 409.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/billing:
    get:
      operationId: getPolicyBilling
      tags:
        - Policy
      summary: Get the policy billing plan and installment schedule.
      description: >
        Returns the public flat billing projection: the plan members and the
        ordered `installments` array. The ACTIVE plan is returned when one
        exists; otherwise the most recently created closed plan is returned so
        the read remains useful after the plan lifecycle closes.

        A policy without any billing plan is 404 `BILLING_PLAN_NOT_FOUND`; an
        unknown policy or a policy in another tenant is 404 `POLICY_NOT_FOUND`.
        `X-EIA-Book` is optional for compatibility with the other Policy proxy
        routes, but a supplied value must be DIRECT; another book is hidden as
        404 `BOOK_SCOPE_VIOLATION`. Billing is a DIRECT-book business and the
        domain always forwards DIRECT to the expert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current billing plan and its ordered installments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlan'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicyBillingPlan
      tags:
        - Policy
      summary: Create the policy billing plan.
      description: >
        Creates the single ACTIVE billing plan and its installment schedule. The
        plan total is the policy premium and the plan currency is the policy
        premium currency; the caller chooses only `installmentCount` (1..24),
        `frequency`, and `firstDueDate`. The first n-1 installments are equal and
        the last one absorbs the rounding remainder, so the schedule sums exactly
        to the premium at scale 4.

        Rejections: 400 `VALIDATION_ERROR` for a malformed body,
        `INVALID_INSTALLMENT_COUNT` outside 1..24, `INVALID_BILLING_FREQUENCY`,
        or `INVALID_FIRST_DUE_DATE`; 404 `POLICY_NOT_FOUND` (or
        `BOOK_SCOPE_VIOLATION` for another book); 409
        `BILLING_PLAN_ALREADY_EXISTS` when an ACTIVE plan already exists, or
        `CONCURRENT_MODIFICATION` when the policy changed concurrently.

        The command writes `policy.billing-plan.created` in the same transaction
        as the plan and schedule. It is not idempotent and does not accept
        `Idempotency-Key` or `If-Match` in this slice (MISMATCHES.md M-06, M-07).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingPlanRequest'
      responses:
        '201':
          description: Billing plan and installment schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlan'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/billing/installments/{installmentId}:
    patch:
      operationId: updatePolicyInstallment
      tags:
        - Policy
      summary: Settle one billing installment as PAID or WAIVED.
      description: >
        Marks a DUE or OVERDUE installment terminal. `PAID` records `paidAt` and
        stores the optional `paymentId`; `WAIVED` clears payment evidence.
        Repeating the same terminal status is an idempotent no-op that returns
        the unchanged installment and writes no event. Switching a settled
        installment to the other terminal status is 409
        `INSTALLMENT_ALREADY_SETTLED`; a source status that is not DUE or OVERDUE
        is 409 `INSTALLMENT_NOT_SETTLEABLE`.

        Rejections: 400 `VALIDATION_ERROR` for a blank status or
        `INVALID_INSTALLMENT_STATUS` for a value other than PAID or WAIVED; 404
        `POLICY_NOT_FOUND`, `INSTALLMENT_NOT_FOUND` (including an installment
        under another policy or tenant), or `BOOK_SCOPE_VIOLATION`; 409 for a
        settled installment or `CONCURRENT_MODIFICATION`.

        The accepted command writes `policy.installment.paid` or
        `policy.installment.waived` in the same transaction as the row change.
        It does not accept `Idempotency-Key`; repeating the same terminal status
        is the retry-safe path (MISMATCHES.md M-07).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: installmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstallmentRequest'
      responses:
        '200':
          description: The settled installment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies:
    get:
      operationId: expertListPolicies
      tags:
        - Policy internal
      summary: List policies for a tenant (expert).
      description: >
        Returns the same page envelope as the public list. `_links` preserve
