              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/reinstatements:
    get:
      operationId: expertListPolicyReinstatements
      tags:
        - Policy internal
      summary: List reinstatements (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of reinstatements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinstatementPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/reinstate:
    post:
      operationId: expertReinstatePolicy
      tags:
        - Policy internal
      summary: Reinstate a cancelled policy (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstatePolicyRequest'
      responses:
        '201':
          description: Policy reinstated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reinstatement'
        '200':
          description: Idempotent replay of the same reinstatement command.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reinstatement'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Policy:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Policy projection. Detail, create, and mutation responses carry a strong
        ETag derived from `version`; the body itself does not carry `_links`
        yet.
      required:
        - id
        - tenantId
        - policyNumber
        - productCode
        - insuredPartyId
        - status
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          examples:
            - POL-2026-0000001
        productCode:
          type: string
          maxLength: 32
        insuredPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PolicyStatus'
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
          description: On or after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        renewedFromPolicyId:
          type: [string, 'null']
          format: uuid
          description: >
            Predecessor term for a policy created by renewal (SPEC 11.2.4
            renewal lineage). The renewal successor points at the term it
            replaced; every policy created directly carries null. The source
            policy itself is not mutated and does not point forward.
        programId:
          type: [string, 'null']
          format: uuid
          description: >
            Nullable link to the commercial program catalog (SPEC 11.2.4
            `policy.program_id`, SPEC 11.2.16). Assign or clear it with
            `PATCH /api/v1/policies/{policyId}/program`; a policy may belong to
            at most one program. The value is null (and may be omitted from the
            JSON body) when the policy is not in a program.
    PolicyStatus:
      type: string
      description: Policy lifecycle status from SPEC 11.2.6.
      enum:
        - DRAFT
        - QUOTED
        - BOUND
        - ISSUED
        - IN_FORCE
        - ENDORSED
        - RENEWED
        - CANCELLED
        - EXPIRED
        - NON_RENEWED
        - REINSTATED
        - VOID
    PolicyVersion:
      type: object
      description: >
        Immutable policy version (SPEC 11.2.4 `policy_version`). A version is
        never updated; `effectiveTo` is set when a successor supersedes it.
        `immutableHash` is the canonical SHA-256 of the version snapshot.
      required:
        - id
        - tenantId
        - policyId
        - versionNumber
        - policyVersionNumber
        - changeType
        - status
        - effectiveFrom
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        policyVersionNumber:
          type: string
          maxLength: 32
        changeType:
          $ref: '#/components/schemas/PolicyVersionChangeType'
        status:
          $ref: '#/components/schemas/PolicyVersionStatus'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        issuedAt:
          type: [string, 'null']
          format: date-time
        issuedBy:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        transactionId:
          type: [string, 'null']
          format: uuid
        premiumDeltaAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        premiumDeltaCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
          maxLength: 2000
        supersedesVersionId:
          type: [string, 'null']
          format: uuid
        immutableHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
    PolicyVersionChangeType:
      type: string
      description: Why the version was issued (SPEC 11.2.4 change types).
      enum:
        - BIND
        - ISSUE
        - ENDORSEMENT
        - RENEWAL
        - CANCELLATION
        - REINSTATEMENT
        - CORRECTION
        - PREMIUM_AUDIT
        - VOID
    PolicyVersionStatus:
      type: string
      enum:
        - DRAFT
        - ISSUED
        - VOIDED
        - SUPERSEDED
    CurrentVersion:
      type: object
      description: >
        The derived current version plus the snapshot hash verification result.
      required:
        - version
        - current
        - hashVerified
      properties:
        version:
          $ref: '#/components/schemas/PolicyVersion'
        current:
          type: boolean
          description: True when this is the single ISSUED version.
        hashVerified:
          type: boolean
          description: True when the recomputed SHA-256 matches `immutableHash`.
    Coverage:
      type: object
      description: Coverage grant projection (SPEC 11.2.4 `policy_coverage`).
      required:
        - id
        - tenantId
        - policyId
        - coverageCode
        - coverageName
        - coveragePart
        - occurrenceBasis
        - effectiveFrom
        - effectiveTo
        - status
        - sequence
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        coverageCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        coverageName:
          type: string
          maxLength: 160
        coveragePart:
          $ref: '#/components/schemas/CoveragePart'
        occurrenceBasis:
          $ref: '#/components/schemas/OccurrenceBasis'
        coinsurancePct:
          $ref: './components.yaml#/components/schemas/Percent'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CoverageStatus'
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    CoveragePart:
      type: string
      description: Coverage part code.
      enum:
        - A
        - B
        - C
        - D
    OccurrenceBasis:
      type: string
      enum:
        - OCCURRENCE
        - CLAIMS_MADE
        - CLAIMS_MADE_WITH_RETRO
        - DISCOVERY
    CoverageStatus:
      type: string
      enum:
        - ACTIVE
        - EXCLUDED
        - ENDORSED
        - EXPIRED
    Limit:
      type: object
      description: >
        Limit schedule for one coverage (SPEC 11.2.4 `policy_limit`). A null
        `aggregateAmount` means the aggregate is explicitly NONE, and the
        erosion ledger then starts from the each-occurrence amount.
      required:
        - id
        - tenantId
        - policyId
        - coverageId
        - perOccurrenceAmount
        - currency
        - effectiveFrom
        - effectiveTo
        - sequence
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        coverageId:
          type: string
          format: uuid
        perOccurrenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        aggregateAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        aggregateBasis:
          type: [string, 'null']
          enum:
            - PER_POLICY
            - PER_COVERAGE
        sublimitAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        deductibleAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        coinsurancePct:
          type: [string, 'null']
          pattern: '^0(?:\.[0-9]{1,6})?$|^1(?:\.0{1,6})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        erosionBasis:
          $ref: '#/components/schemas/ErosionBasis'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ErosionBasis:
      type: string
      enum:
        - PAID
        - INCURRED
        - PAID_PLUS_RESERVED
    LimitState:
      type: object
      description: >
        Derived aggregate erosion ledger for a limit (SPEC 11.2.4
        `policy_limit_state`). `remainingAmount = originalAmount +
        reinstatedAmount - incurredAmount + recoveredAmount`.
      required:
        - id
        - tenantId
        - policyId
        - limitId
        - originalAmount
        - paidAmount
        - reservedAmount
        - incurredAmount
        - recoveredAmount
        - remainingAmount
        - erodedPct
        - sourceVersion
        - computedAt
        - reconciliationStatus
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        limitId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        originalAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        paidAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reservedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        incurredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        recoveredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        remainingAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        erodedPct:
          $ref: './components.yaml#/components/schemas/Percent'
        reinstatedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        sourceVersion:
          type: integer
          minimum: 0
          description: Highest erosion fact `sourceVersion` applied.
        computedAt:
          type: string
          format: date-time
        reconciliationStatus:
          type: string
          enum:
            - CURRENT
            - STALE
            - DRIFT
            - MANUAL_REVIEW
        version:
          type: integer
          minimum: 0
    CoverageView:
      type: object
      description: >
        A coverage with its limit schedule and derived erosion state. `limit`
        and `state` are null only in the moment a coverage is created.
      required:
        - coverage
      properties:
        coverage:
          $ref: '#/components/schemas/Coverage'
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
        state:
          oneOf:
            - $ref: '#/components/schemas/LimitState'
            - type: 'null'
    Endorsement:
      type: object
      description: >
        Endorsement projection (SPEC 11.2.4 `policy_endorsement`). Every
        endorsement issues one policy version; a backdated endorsement records
        the reason and approval that allowed it.
      required:
        - id
        - tenantId
        - policyId
        - policyVersionId
        - endorsementType
        - effectiveDate
        - description
        - coverageImpact
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        endorsementNumber:
          type: [string, 'null']
          maxLength: 32
        sequence:
          type: integer
          minimum: 1
        formNumber:
          type: [string, 'null']
          maxLength: 32
        formEdition:
          type: [string, 'null']
          maxLength: 16
        endorsementType:
          $ref: '#/components/schemas/EndorsementType'
        effectiveDate:
          type: string
          format: date
        description:
          type: string
          maxLength: 2000
        premiumDeltaAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        premiumDeltaCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        coverageImpact:
          $ref: '#/components/schemas/CoverageImpact'
        coverageChanges:
          type: array
          items:
            $ref: '#/components/schemas/EndorsementCoverageChange'
        manuscriptFlag:
          type: boolean
        backdateReason:
          type: [string, 'null']
          maxLength: 500
        approvalRef:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/EndorsementStatus'
        issuedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    EndorsementType:
      type: string
      enum:
        - COVERAGE
        - LIMIT
        - PARTY
        - PREMIUM
        - RETENTION
        - EXCLUSION
        - TERRITORY
        - CANCELLATION
        - REINSTATEMENT
        - NON_RENEWAL
        - CORRECTION
        - MANUSCRIPT
    EndorsementStatus:
      type: string
      enum:
        - DRAFT
        - ISSUED
        - VOID
    CoverageImpact:
      type: string
      enum:
        - NONE
        - BROADEN
        - RESTRICT
        - CLARIFY
    EndorsementCoverageChange:
      type: object
      required:
        - coverageCode
        - changeType
      properties:
        coverageCode:
          type: string
          maxLength: 32
        changeType:
          type: string
          enum:
            - ADD
            - REMOVE
            - BROADEN
            - RESTRICT
            - CLARIFY
        description:
          type: [string, 'null']
          maxLength: 500
    Insured:
      type: object
      description: Insured party projection (SPEC 11.2.4 `policy_insured`).
      required:
        - id
        - tenantId
        - policyId
        - partyId
        - insuredRole
        - displayName
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        insuredRole:
          $ref: '#/components/schemas/InsuredRole'
        displayName:
          type: string
          maxLength: 300
        certificateNumber:
          type: [string, 'null']
          maxLength: 32
        scope:
          type: [string, 'null']
          maxLength: 120
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - ENDORSED_OFF
            - EXPIRED
        createdAt:
          type: string
          format: date-time
    InsuredRole:
      type: string
      enum:
        - NAMED_INSURED
        - ADDITIONAL_INSURED
        - INSURED_ORGANIZATION
        - LOSS_PAYEE
        - MORTGAGEE
        - LENDER
        - CERTIFICATE_HOLDER
    Location:
      type: object
      description: Scheduled insured location projection.
      required:
        - id
        - tenantId
        - policyId
        - locationCode
        - addressLine1
        - city
        - stateRegion
        - country
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        locationCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$'
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          maxLength: 120
        stateRegion:
          type: string
          maxLength: 6
          pattern: '^[A-Z]{2}-[A-Z0-9]{1,3}$'
        postalCode:
          type: [string, 'null']
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - ENDORSED_OFF
            - EXPIRED
        createdAt:
          type: string
          format: date-time
    Cancellation:
      type: object
      description: >
        Cancellation projection with the return premium computed at cancellation
        time. `proRataPct` is the earned fraction of the term.
      required:
        - id
        - tenantId
        - policyId
        - cancellationType
        - reason
        - effectiveDate
        - termDays
        - remainingDays
        - proRataPct
        - earnedPremiumAmount
        - returnPremiumAmount
        - premiumCurrency
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: [string, 'null']
          format: uuid
        cancellationType:
          $ref: '#/components/schemas/CancellationType'
        reason:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        noticeDays:
          type: integer
          minimum: 0
        noticedAt:
          type: [string, 'null']
          format: date-time
        termDays:
          type: integer
          minimum: 0
        remainingDays:
          type: integer
          minimum: 0
        proRataPct:
          $ref: './components.yaml#/components/schemas/Percent'
        earnedPremiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        returnPremiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        approvalRef:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - REINSTATED
            - VOID
        createdAt:
          type: string
          format: date-time
    CancellationType:
      type: string
      enum:
        - FLAT
        - PRO_RATA
        - SHORT_RATE
        - NON_PAYMENT
        - VOID
    Reinstatement:
      type: object
      description: >
        Reinstatement projection backed by approval and premium evidence.
      required:
        - id
        - tenantId
        - policyId
        - cancellationId
        - effectiveDate
        - reason
        - approvalRef
        - approvedBy
        - premiumEvidenceRef
        - premiumEvidenceAmount
        - premiumEvidenceCurrency
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        cancellationId:
          type: string
          format: uuid
        policyVersionId:
          type: [string, 'null']
          format: uuid
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
        approvalRef:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
        premiumEvidenceRef:
          type: string
          maxLength: 64
        premiumEvidenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumEvidenceCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - APPROVED
            - REVOKED
        createdAt:
          type: string
          format: date-time
    BillingPlan:
      type: object
      description: >
        Public billing plan for a policy (SPEC 11.2.13) with its ordered
        installment schedule. A policy has at most one ACTIVE plan. The total
        premium is split across the installments so their amounts sum exactly to
        `totalPremium` at scale 4. `status` is ACTIVE for a created plan; the
        COMPLETE and CANCELLED values are the closed-plan states the expert
        repository recognizes. This is the domain projection: unlike the expert
        view it is flat and names the plan identity `planId`.
      required:
        - planId
        - planNumber
        - policyId
        - totalPremium
        - currency
        - installmentCount
        - frequency
        - firstDueDate
        - status
        - installments
      properties:
        planId:
          type: string
          format: uuid
        planNumber:
          type: string
          maxLength: 32
          description: Generated plan number, for example `BP-0001`.
        policyId:
          type: string
          format: uuid
        totalPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        installmentCount:
          type: integer
          minimum: 1
          maximum: 24
        frequency:
          type: string
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
        firstDueDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - COMPLETE
            - CANCELLED
        installments:
          type: array
          description: Ordered by `installmentNumber`, ascending.
          items:
            $ref: '#/components/schemas/Installment'
    Installment:
      type: object
      description: >
        One scheduled premium installment of a billing plan. `paidAt` and
        `paymentId` are populated only for a PAID row; a WAIVED row carries no
        payment evidence.
      required:
        - installmentId
        - installmentNumber
        - dueDate
        - amount
        - status
      properties:
        installmentId:
          type: string
          format: uuid
        installmentNumber:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        status:
          type: string
          enum:
            - DUE
            - OVERDUE
            - PAID
            - WAIVED
        paidAt:
          type: [string, 'null']
          format: date-time
        paymentId:
          type: [string, 'null']
          format: uuid
    Receivable:
      type: object
      description: >
        One premium receivable on the cross-policy queue (SPEC 11.2.13
        `premium_receivable`): an unsettled billing installment enriched with
        its plan, policy, and insured-party context. `status` is the effective
        status at read time, so a stored DUE row past its due date is reported
        as OVERDUE. `daysPastDue` is zero unless the effective status is
        OVERDUE. `paidAt` and `paymentId` are null on this queue because only
        unsettled installments are returned; the members remain nullable so a
        future settled projection can populate them without a breaking change.

        `lastDunningLevel` and `lastDunningAt` summarize the most recent SENT
        dunning action for the installment and are null until one is recorded.
        CANCELLED history never contributes to either member.
      required:
        - installmentId
        - planId
        - planNumber
        - policyId
        - policyNumber
        - insuredPartyId
        - installmentNumber
        - dueDate
        - amount
        - currency
        - status
        - daysPastDue
      properties:
        installmentId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        planNumber:
          type: string
          maxLength: 32
        policyId:
          type: string
          format: uuid
        policyNumber:
          type: string
          maxLength: 32
        insuredPartyId:
          type: string
          format: uuid
        installmentNumber:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - DUE
            - OVERDUE
        daysPastDue:
          type: integer
          minimum: 0
          description: Whole days between `dueDate` and today; 0 unless OVERDUE.
        paidAt:
          type: [string, 'null']
          format: date-time
        paymentId:
          type: [string, 'null']
          format: uuid
        lastDunningLevel:
          type: [string, 'null']
          maxLength: 16
          description: >
            Level of the most recent SENT dunning action (`REMINDER`,
            `FIRST_NOTICE`, `SECOND_NOTICE`, or `COLLECTIONS`); null until the
            installment is dunned.
        lastDunningAt:
          type: [string, 'null']
          format: date-time
          description: Instant of the most recent SENT dunning action.
    ReceivableSummary:
      type: object
      description: >
        Tenant-scoped premium-receivables collection: the matching unsettled
        installments plus their totals. `totalAmount` sums every returned
        receivable; `overdueAmount` sums the ones whose effective status is
        OVERDUE; `count` is the number of returned items (`items.length`).
      required:
        - items
        - totalAmount
        - overdueAmount
        - count
      properties:
        items:
          type: array
          description: Ordered by `dueDate`, then `policyNumber` and `installmentNumber`.
          items:
            $ref: '#/components/schemas/Receivable'
        totalAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        overdueAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        count:
          type: integer
          minimum: 0
    CreateBillingPlanRequest:
      type: object
      description: >
        Create the single ACTIVE billing plan for a policy. The plan total and
        currency are taken from the policy; the caller chooses only the
        installment count, frequency, and first due date. Values are normalized
        to upper case, and an unknown frequency is 400
        `INVALID_BILLING_FREQUENCY`.
      required:
        - installmentCount
        - frequency
        - firstDueDate
      properties:
        installmentCount:
          type: integer
          minimum: 1
          maximum: 24
        frequency:
          type: string
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
        firstDueDate:
          type: string
          format: date
    UpdateInstallmentRequest:
      type: object
      description: >
        Settle one installment as PAID or WAIVED. `status` is trimmed and
        normalized to upper case; any other value is 400
        `INVALID_INSTALLMENT_STATUS`. `paymentId` is optional and is stored only
        for PAID. Repeating the same terminal status is an idempotent no-op;
        changing one terminal status to the other is 409.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PAID
            - WAIVED
        paymentId:
          type: [string, 'null']
          format: uuid
    DunningAction:
      type: object
      description: >
        One recorded dunning action for a premium installment (SPEC 11.2.13
        collections and dunning). The public projection is the domain's flat
        DTO: the identity is `dunningId` and the plan and policy are resolved
        from the installment. `status` is `SENT` for a delivered action and
        `CANCELLED` only for superseded history; the create always records
        `SENT`. The level, channel, and status values are the closed
        vocabularies the expert enforces.
      required:
        - dunningId
        - installmentId
        - planId
        - policyId
        - level
        - channel
        - status
        - sentAt
      properties:
        dunningId:
          type: string
          format: uuid
        installmentId:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        level:
          type: string
          enum:
            - REMINDER
            - FIRST_NOTICE
            - SECOND_NOTICE
            - COLLECTIONS
        channel:
          type: string
          enum:
            - EMAIL
            - LETTER
            - PORTAL
        notes:
          type: [string, 'null']
          maxLength: 2000
          description: Optional free-text note stored with the action.
        status:
          type: string
          enum:
            - SENT
            - CANCELLED
        sentAt:
          type: string
          format: date-time
    CreateDunningRequest:
      type: object
      description: >
        Record one dunning action against a collectible installment. `level` and
        `channel` are required, trimmed, and normalized to upper case; an
        unknown value is 400 `INVALID_DUNNING_LEVEL` or
        `INVALID_DUNNING_CHANNEL`. `notes` is optional, trimmed, treated as
        absent when blank, and capped at 2000 characters. The action status,
        the send instant, and the plan and policy identities are server-owned.
      required:
        - level
        - channel
      properties:
        level:
          type: string
          enum:
            - REMINDER
            - FIRST_NOTICE
            - SECOND_NOTICE
            - COLLECTIONS
        channel:
          type: string
          enum:
            - EMAIL
            - LETTER
            - PORTAL
        notes:
          type: [string, 'null']
          maxLength: 2000
    PolicyPage:
      type: object
      description: >
        One page of the policy list: `items`, `page`, `size`, `total`, and
        `_links.self/next/prev`. The shared `Page` component carries the
        envelope; this schema narrows `items` to `Policy`.
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
    PolicyVersionPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/PolicyVersion'
    CoverageViewPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CoverageView'
    LimitPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Limit'
    LimitStatePage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/LimitState'
    EndorsementPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Endorsement'
    InsuredPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Insured'
    LocationPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Location'
    CancellationPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Cancellation'
    ReinstatementPage:
      type: object
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Reinstatement'
    CreatePolicyRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Money fields
        are decimal strings with at most four fraction digits and must be zero
        or greater.
      required:
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        policyNumber:
          type: string
          maxLength: 32
          description: Optional. Generated as POL-{YEAR}-{7 digits} when omitted.
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreatePolicyRequestInternal:
      type: object
      description: Internal create command accepted by the Policy expert.
      required:
        - tenantId
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          maxLength: 32
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
          description: Optional. Only DRAFT is accepted at creation.
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    UpdatePolicyStatusRequest:
      type: object
      description: >
        Public lifecycle transition command. Send `If-Match` with the ETag from
        the last read; `expectedVersion` is a compatibility fallback for
        clients that do not send the header.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: >
            Optional optimistic version. Ignored when `If-Match` is present.
            Recommended when the header is absent.
        reason:
          type: string
          maxLength: 200
    UpdatePolicyStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Policy expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Ignored when `If-Match` is present.
        reason:
          type: string
          maxLength: 200
    CreateCoverageRequest:
      type: object
      description: >
        Add a coverage grant with its limit schedule. Dates must stay inside the
        policy term and the limit currency must match the policy currency.
      required:
        - coverageCode
        - coverageName
        - coveragePart
        - occurrenceBasis
        - effectiveFrom
        - effectiveTo
        - limit
      properties:
        coverageCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        coverageName:
          type: string
          maxLength: 160
        coveragePart:
          $ref: '#/components/schemas/CoveragePart'
        occurrenceBasis:
          $ref: '#/components/schemas/OccurrenceBasis'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        coinsurancePct:
          $ref: './components.yaml#/components/schemas/Percent'
        limit:
          $ref: '#/components/schemas/CoverageLimitRequest'
    CoverageLimitRequest:
      type: object
      description: >
        Limit schedule accepted with a coverage. `perOccurrenceAmount` is
        required and greater than zero; `aggregateAmount` is optional and means
        NONE when omitted.
      required:
        - perOccurrenceAmount
        - currency
      properties:
        perOccurrenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        aggregateAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        aggregateBasis:
          type: string
          enum:
            - PER_POLICY
            - PER_COVERAGE
        sublimitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        deductibleAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        coinsurancePct:
          $ref: './components.yaml#/components/schemas/Percent'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        erosionBasis:
          $ref: '#/components/schemas/ErosionBasis'
    ErosionRequest:
      type: object
      description: >
        One idempotent erosion fact for a limit. Facts are unique by
        `(limitId, claimId, allocationId, sourceVersion)`.
      required:
        - limitId
        - claimId
        - allocationId
        - sourceVersion
        - paidAmount
        - reservedAmount
      properties:
        limitId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        allocationId:
          type: string
          format: uuid
        sourceVersion:
          type: integer
          minimum: 1
        paidAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reservedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        recoveredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        asOf:
          type: string
          format: date-time
    CreateEndorsementRequest:
      type: object
      description: >
        Endorse a policy. A backdated endorsement (effective before policy
        inception) requires `backdateReason` and an `approvalRef`/`approvedBy`.
      required:
        - endorsementType
        - effectiveDate
        - description
      properties:
        endorsementNumber:
          type: string
          maxLength: 32
        endorsementType:
          $ref: '#/components/schemas/EndorsementType'
        effectiveDate:
          type: string
          format: date
        description:
          type: string
          maxLength: 2000
        premiumDeltaAmount:
          type: string
          pattern: '^-?[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        premiumDeltaCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        coverageImpact:
          $ref: '#/components/schemas/CoverageImpact'
        coverageChanges:
          type: array
          items:
            $ref: '#/components/schemas/EndorsementCoverageChangeRequest'
        backdateReason:
          type: string
          maxLength: 500
        approvedBy:
          type: string
          format: uuid
        approvalRef:
          type: string
          format: uuid
        formNumber:
          type: string
          maxLength: 32
        formEdition:
          type: string
          maxLength: 16
    EndorsementCoverageChangeRequest:
      type: object
      required:
        - coverageCode
        - changeType
      properties:
        coverageCode:
          type: string
          maxLength: 32
        changeType:
          type: string
          enum:
            - ADD
            - REMOVE
            - BROADEN
            - RESTRICT
            - CLARIFY
        description:
          type: string
          maxLength: 500
    CreateInsuredRequest:
      type: object
      description: Add an insured party to a policy.
      required:
        - partyId
        - insuredRole
        - displayName
        - effectiveFrom
        - effectiveTo
      properties:
        partyId:
          type: string
          format: uuid
        insuredRole:
          $ref: '#/components/schemas/InsuredRole'
        displayName:
          type: string
          maxLength: 300
        certificateNumber:
          type: string
          maxLength: 32
        scope:
          type: string
          maxLength: 120
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
    CreateLocationRequest:
      type: object
      description: Add a scheduled location to a policy.
      required:
        - locationCode
        - addressLine1
        - city
        - stateRegion
        - country
        - effectiveFrom
        - effectiveTo
      properties:
        locationCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$'
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        stateRegion:
          type: string
          pattern: '^[A-Z]{2}-[A-Z0-9]{1,3}$'
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
    CancelPolicyRequest:
      type: object
      description: >
        Cancel a policy. The cancellation type determines the return premium:
        FLAT and VOID refund the full unearned premium, PRO_RATA and
        NON_PAYMENT refund the unearned portion, and SHORT_RATE applies the
        filed short-rate factor.
      required:
        - cancellationType
        - reason
        - effectiveDate
      properties:
        cancellationType:
          $ref: '#/components/schemas/CancellationType'
        reason:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        noticeDays:
          type: integer
          minimum: 0
        approvedBy:
          type: string
          format: uuid
        approvalRef:
          type: string
          format: uuid
    ReinstatePolicyRequest:
      type: object
      description: >
        Reinstate a cancelled policy. Approval and premium evidence are
        mandatory before coverage is restored.
      required:
        - effectiveDate
        - reason
        - approvedBy
        - approvalRef
        - premiumEvidenceRef
        - premiumEvidenceAmount
        - premiumEvidenceCurrency
      properties:
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
        approvedBy:
          type: string
          format: uuid
        approvalRef:
          type: string
          format: uuid
        premiumEvidenceRef:
          type: string
          maxLength: 64
        premiumEvidenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumEvidenceCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    RenewPolicyRequest:
      type: object
      description: >
        Renew a policy into a new DRAFT successor term. The two term dates are
        required. Premium, limit, and currency overrides are optional and
        default to the source policy values when omitted, so a caller can renew
        on unchanged terms by sending only the dates. The source policy is not
        mutated; the successor records it in `renewedFromPolicyId`.
      required:
        - effectiveDate
        - expirationDate
      properties:
        effectiveDate:
          type: string
          format: date
          description: >
            Start of the successor term. Must be on or after the source policy
            expiration date.
        expirationDate:
          type: string
          format: date
          description: End of the successor term; must be after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    MassTortProfile:
      type: object
      description: >
        Public projection of the one mass tort profile of a direct policy
        (SPEC 11.2.4 `policy_mass_tort_profile`, SPEC 11.2.11). The profile
        records the tort and trigger theory, the allocation method, the
        coverage block that Direct Claims uses to allocate a long-tail claim
        across policy years, and the DRAFT/COMPLETE state. `allocationNotes`,
        `coverageBlockStart`, and `coverageBlockEnd` are null while the profile
        is DRAFT and not yet filled in; a COMPLETE profile always has all three.
        `profileId` and `policyId` are server-owned, and `updatedAt` is the
        instant of the last accepted write.
      required:
        - profileId
        - policyId
        - tortType
        - triggerType
        - allocationMethod
        - allocationNotes
        - coverageBlockStart
        - coverageBlockEnd
        - status
        - updatedAt
      properties:
        profileId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        tortType:
          $ref: '#/components/schemas/MassTortTortType'
        triggerType:
          $ref: '#/components/schemas/MassTortTriggerType'
        allocationMethod:
          $ref: '#/components/schemas/MassTortAllocationMethod'
        allocationNotes:
          type: [string, 'null']
          maxLength: 2000
          description: >
            Trimmed allocation notes. Null while a DRAFT profile has no notes;
            required for COMPLETE.
        coverageBlockStart:
          type: [string, 'null']
          format: date
          description: >
            Inclusive start of the coverage block. Null while a DRAFT profile
            has no block; required for COMPLETE.
        coverageBlockEnd:
          type: [string, 'null']
          format: date
          description: >
            Inclusive end of the coverage block. Null while a DRAFT profile has
            no block; required for COMPLETE and never before the start.
        status:
          $ref: '#/components/schemas/MassTortProfileStatus'
        updatedAt:
          type: string
          format: date-time
    MassTortTortType:
      type: string
      description: >
        Tort catalog enforced by the Policy expert. The broader SPEC Appendix E
        catalog and the SPEC `direct_tort_code` list are not implemented;
        MISMATCHES.md M-32 records the gap.
      enum:
        - ASBESTOS
        - SILICA
        - TALC
        - PFAS
        - OPIOIDS
        - PRODUCT_LIABILITY
        - ENVIRONMENTAL
        - OTHER
    MassTortTriggerType:
      type: string
      description: >
        Coverage trigger theory. The SPEC `trigger_theory` values
        `INJURY_IN_FACT`, `CONTINUOUS_TRIGGER`, `ALL_SUMS`, and `CLAIMS_MADE`
        are not implemented; MISMATCHES.md M-32 records the gap.
      enum:
        - EXPOSURE
        - MANIFESTATION
        - INJURY
        - REVISIONIST
    MassTortAllocationMethod:
      type: string
      description: >
        Method Direct Claims applies when allocating a long-tail claim. The
        names match the SPEC 11.2.11 `allocation_method` set.
      enum:
        - ALL_SUMS
        - PRO_RATA_TIME_ON_RISK
        - PRO_RATA_PREMIUM
        - EQUAL_SHARES
        - STACKED_LIMITS
        - CUSTOM_MATRIX
    MassTortProfileStatus:
      type: string
      description: >
        Profile state. DRAFT permits missing notes and coverage-block dates;
        COMPLETE requires them. The SPEC `ACTIVE`, `SUPERSEDED`, and
        `UNDER_REVIEW` values are not implemented; MISMATCHES.md M-32 records
        the gap.
      enum:
        - DRAFT
        - COMPLETE
    UpdateMassTortProfileRequest:
      type: object
      description: >
        Upsert body for a policy mass tort profile. `tortType`, `triggerType`,
        `allocationMethod`, and `status` are always required; the notes and both
        coverage-block dates are optional for DRAFT and required for COMPLETE.
        Values are trimmed and upper-cased, and an unknown vocabulary member is
        400. The public domain also accepts `trigger` as an alias for
        `triggerType`, and read-only response members sent in the body are
        ignored.
      required:
        - tortType
        - triggerType
        - allocationMethod
        - status
      properties:
        tortType:
          $ref: '#/components/schemas/MassTortTortType'
        triggerType:
          $ref: '#/components/schemas/MassTortTriggerType'
        allocationMethod:
          $ref: '#/components/schemas/MassTortAllocationMethod'
        allocationNotes:
          type: [string, 'null']
          maxLength: 2000
          description: Trimmed; a blank value is treated as absent.
        coverageBlockStart:
          type: [string, 'null']
          format: date
        coverageBlockEnd:
          type: [string, 'null']
          format: date
          description: Must not be before coverageBlockStart when both are present.
        status:
          $ref: '#/components/schemas/MassTortProfileStatus'
    Program:
      type: object
      description: >
        Public projection of a commercial program (SPEC 10.11.3 `program`,
        SPEC 11.2.16). A program groups policies into one portfolio such as a
        captive, pool, fronting arrangement, coinsurance facility, or mass tort
        program. `programId` and the per-tenant `programNumber` are
        server-owned; `status` starts at ACTIVE and CLOSED is reserved for a
        later lifecycle command. The effective range is inclusive. The
        projection does not expose `tenantId`, and it is narrower than the SPEC
        catalogue: no `code`, `description`, owner legal entity, manager
        organization unit, `program_version`, or capacity structure (M-39).
      required:
        - programId
        - programNumber
        - name
        - programType
        - effectiveFrom
        - effectiveTo
        - status
        - leadPolicyId
        - createdAt
      properties:
        programId:
          type: string
          format: uuid
        programNumber:
          type: string
          maxLength: 32
          description: >
            Server-generated per tenant as `PRG-{YEAR}-{7 digits}` from
            `policy_program_number_seq`.
          examples:
            - PRG-2026-0000001
        name:
          type: string
          maxLength: 200
        programType:
          $ref: '#/components/schemas/ProgramType'
        effectiveFrom:
          type: string
          format: date
          description: Inclusive start of the program effective range.
        effectiveTo:
          type: string
          format: date
          description: Inclusive end; never before effectiveFrom.
        status:
          $ref: '#/components/schemas/ProgramStatus'
        leadPolicyId:
          type: [string, 'null']
          format: uuid
          description: >
            Optional lead policy for the program. Null when none was supplied;
            the value is stored as given and is not resolved in this slice
            (M-39).
        createdAt:
          type: string
          format: date-time
    ProgramType:
      type: string
      description: >
        Closed program-type vocabulary enforced by the Policy expert and the
        database CHECK constraint. The SPEC 10.11.3 catalogue instead defines
        `CASUALTY`, `PROPERTY`, `COMMERCIAL`, `AUTO`, `SPECIALTY`, and `OTHER`,
        so the implemented set is a contract deviation (M-39).
      enum:
        - CAPTIVE
        - POOL
        - FRONTING
        - COINSURANCE
        - MASS_TORT
    ProgramStatus:
      type: string
      description: >
        Program lifecycle state. A program is created ACTIVE; the CLOSED state
        is reserved for a later lifecycle command and no close operation is
        implemented. The SPEC 10.11.3 catalogue instead uses ACTIVE and
        INACTIVE (M-39).
      enum:
        - ACTIVE
        - CLOSED
    CreateProgramRequest:
      type: object
      description: >
        Public create command for the program catalogue. The tenant comes from
        `X-EIA-Tenant`; `programId`, `programNumber`, `status`, and `createdAt`
        are server-owned and rejected or ignored if supplied. `name` and
        `programType` are trimmed, `programType` is upper-cased, and the
        effective range is inclusive.
      required:
        - name
        - programType
        - effectiveFrom
        - effectiveTo
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        programType:
          $ref: '#/components/schemas/ProgramType'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          description: Must be on or after effectiveFrom; the same date is valid.
        leadPolicyId:
          type: [string, 'null']
          format: uuid
          description: >
            Optional lead policy. Stored as supplied; not resolved or checked
            against the tenant in this slice (M-39).
    UpdatePolicyProgramRequest:
      type: object
      description: >
        Policy program membership command. `programId` is required but nullable:
        a UUID assigns the policy to that program and null clears the link. The
        expert applies the tenant wall, so an unknown or foreign program is 404
        `PROGRAM_NOT_FOUND`. The public domain also tolerates an absent body as
        a clear for compatibility; the canonical command requires the explicit
        null.
      required:
        - programId
      properties:
        programId:
          type: [string, 'null']
          format: uuid
          description: Program to assign; null clears the policy's program link.
