  errorEnvelope: >
    Canonical RFC 9457 Problem with content type application/problem+json, from
    both the Policy domain and the Policy expert. The vertical keeps its legacy
    code strings rather than the EIA-XXX-NNNN scheme; see MISMATCHES.md M-02.
  notes: >
    Money fields remain flat pairs on the policy header and one `currency` per
    second-slice row. ETag is derived from the aggregate version and formatted
    as a quoted decimal. Every second-slice mutation returns the policy ETag and
    accepts If-Match and Idempotency-Key, both optional for backward
    compatibility; billing is the exception in this slice and accepts neither
    (MISMATCHES.md M-06, M-07). 422 and 428 are emitted by the expert and
    re-emitted by the domain unchanged. The list envelope is offset-based
    (page/size) rather than the SPEC 7.6 cursor envelope; see MISMATCHES.md M-04.

    The billing plan and installment slice documents the domain's public flat
    projection. The domain proxies the expert's internal `{plan, installments}`
    view and renames the identity fields to `planId` and `installmentId`; the
    expert's internal route is not part of the public contract. The plan create
    and installment settlement each bump the policy row version and write their
    outbox event in the same transaction.

    The renewal operation creates a successor policy rather than mutating the
    source: the successor's `renewedFromPolicyId` is the only lineage field on
    the wire, the source stays in its current status, and the 409
    `RENEWAL_NOT_ALLOWED` is the eligibility gate. The expert's
    `/internal/v1` alias and its relaxed `effectiveDate` defaulting are an
    implementation detail; the public contract requires both dates
    (MISMATCHES.md M-28).

    The receivable queue reuses the billing installment projection but is not
    scoped to a policy, so its public path is `/api/v1/billing/installments`
    rather than a child of `/api/v1/policies`. The domain normalizes the status
    filter and the 1..200 limit and recomputes the totals only when the expert
    omits them. Only unsettled installments are eligible, so `paidAt` and
    `paymentId` are null on every returned item. `lastDunningLevel` and
    `lastDunningAt` are the latest SENT action and are null until one is
    recorded. The SPEC 11.2.13 per-policy installment route and the remaining
    billing resource gaps are recorded in MISMATCHES.md M-27.

    The dunning route addresses one installment directly, so it too sits outside
    `/api/v1/policies`. The expert owns the level, channel, and status
    vocabularies and the dunnable-state and per-level uniqueness rules; the
    domain publishes the flat `DunningAction` projection, renames the expert row
    id to `dunningId`, and preserves the expert 400/404/409 problems. The
    action, the policy version bump, and `policy.dunning.sent` are written in
    one transaction. The SPEC 11.2.13 route, level vocabulary, and event name
    differences are recorded in MISMATCHES.md M-38.

    The mass tort profile is a one-per-policy child resource. The domain proxies
    the expert's `/internal/v1` alias with the tenant and DIRECT book; the
    expert owns the vocabularies, the 2000-character notes cap, the inclusive
    coverage-block order, and the COMPLETE gate. The expert returns 201 on
    create and 200 on replace; the public domain controller currently returns
    200 for both, which MISMATCHES.md M-32 records. The profile id is preserved
    on every update. The event payload deliberately omits the profile id and the
    allocation notes; the policy is the event aggregate. The narrow profile
    against SPEC 11.2.11 is recorded in M-32.

    The program catalog is a tenant-scoped DIRECT-book resource with a
    server-generated per-tenant number. The domain proxies the expert's
    `/internal/v1` alias with the tenant and DIRECT book; the expert owns the
    number, the ACTIVE default, and the CAPTIVE/POOL/FRONTING/COINSURANCE/
    MASS_TORT vocabulary. The public create returns 201 with a `Location`, and
    the accepted create writes `policy.program.created` against the Program
    aggregate at version 1 in the same transaction. The assignment command
    bumps the policy row version and writes `policy.policy.program-assigned`
    with `programId`, `previousProgramId`, and `changedFields`; the public
    `Policy` carries the nullable `programId` and may omit it when null. The
    expert's `/internal/v1` program alias is an implementation detail. The
    narrower catalogue, the different type/status vocabularies, and the
    SPEC-less create and assignment commands are recorded in M-01, M-22, and
    M-39.
x-compatibility:
  contractVersion: 2.8.0
  previousContractVersion: 2.7.0
  breaking: []
  compatible:
    - Adds GET /api/v1/programs.
    - Adds POST /api/v1/programs.
    - Adds GET /api/v1/programs/{programId}.
    - Adds PATCH /api/v1/policies/{policyId}/program.
    - Adds the Program, ProgramType, ProgramStatus, CreateProgramRequest, and UpdatePolicyProgramRequest schemas.
    - Adds the nullable Policy.programId member.
    - Adds no required request field to an existing operation, changes no existing path, and removes no response field.
  note: >
    The program catalog and membership surface is additive over 2.7.0: four new
    operations and five new schemas, plus the nullable `Policy.programId`
    member, which defaults to null for every policy created before this release.
    No existing path, request field, response field, or event changed. The
    routes are siblings under `/api/v1`, so the HTTP API version stays
    `/api/v1`. The implemented events join the asyncapi/policy.yaml channels as
    the new names `policy.program.created` and
    `policy.policy.program-assigned`; the catalog published and implemented
    counts each grow by two.
