openapi: 3.1.0
info:
  title: EIA Policy API
  version: 1.0.0
  summary: Direct-book policy administration and the Policy expert API.
  description: >
    This document describes the implemented public Policy domain API and the
    internal Policy expert API. The authoritative requirement is SPEC 11.2 and
    SPEC 12; the implemented surface is the first vertical slice.

    Money is a flat pair today: `premiumAmount`/`premiumCurrency` and
    `limitAmount`/`limitCurrency`. The canonical Money object is defined in
    schemas/money.schema.json; migration of the flat pairs is tracked in
    MISMATCHES.md. The Policy domain service emits the `ApiError` body of its
    own package rather than the canonical Problem envelope; see MISMATCHES.md.

    Lifecycle is enforced on both sides. A policy is created as DRAFT only and
    advances through the SPEC 11.2.6 state machine with POST/PATCH actions on
    this slice.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://policy-domain:8084
    description: Policy domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Policy
    description: Public domain API used by the Policy web remote.
  - name: Policy internal
    description: Internal expert API. Not exposed through the gateway; called only by the Policy domain service.
paths:
  /api/v1/policies:
    get:
      operationId: listPolicies
      tags:
        - Policy
      summary: List policies for the caller's tenant.
      description: >
        Returns a bare JSON array. Search, filtering, and cursor pagination from
        SPEC 11.2.10 and SPEC 7.6 are planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      responses:
        '200':
          description: Policies of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicy
      tags:
        - Policy
      summary: Create a policy draft.
      description: >
        The policy is always created in DRAFT. The policy number is generated by
        the expert when it is omitted. Premium and limit must be zero or greater
        with at most four fraction digits.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created in DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}:
    get:
      operationId: getPolicy
      tags:
        - Policy
      summary: Get a policy.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/status:
    patch:
      operationId: updatePolicyStatus
      tags:
        - Policy
      summary: Advance a policy through its lifecycle.
      description: >
        Applies one transition from the SPEC 11.2.6 table. When `expectedVersion`
        is omitted the domain service reads the current version and echoes it,
        which does not protect against a concurrent writer; supplying the
        version the caller observed is strongly recommended.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyStatusRequest'
      responses:
        '200':
          description: Policy after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies:
    get:
      operationId: expertListPolicies
      tags:
        - Policy internal
      summary: List policies for a tenant (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
      responses:
        '200':
          description: Policies of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreatePolicy
      tags:
        - Policy internal
      summary: Create a policy (expert).
      description: >
        `status` is optional and defaults to DRAFT. Any initial status other
        than DRAFT is rejected with INVALID_INITIAL_STATUS.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequestInternal'
      responses:
        '201':
          description: Policy created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}:
    get:
      operationId: expertGetPolicy
      tags:
        - Policy internal
      summary: Get a policy (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/status:
    patch:
      operationId: expertUpdatePolicyStatus
      tags:
        - Policy internal
      summary: Advance a policy through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyStatusRequestInternal'
      responses:
        '200':
          description: Policy after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Policy:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: Policy projection.
      required:
        - id
        - tenantId
        - policyNumber
        - productCode
        - insuredPartyId
        - status
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          examples:
            - POL-2026-0000001
        productCode:
          type: string
          maxLength: 32
        insuredPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PolicyStatus'
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
          description: On or after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    PolicyStatus:
      type: string
      description: Policy lifecycle status from SPEC 11.2.6.
      enum:
        - DRAFT
        - QUOTED
        - BOUND
        - ISSUED
        - IN_FORCE
        - ENDORSED
        - RENEWED
        - CANCELLED
        - EXPIRED
        - NON_RENEWED
        - REINSTATED
        - VOID
    CreatePolicyRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Money fields
        are decimal strings with at most four fraction digits and must be zero
        or greater.
      required:
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        policyNumber:
          type: string
          maxLength: 32
          description: Optional. Generated as POL-{YEAR}-{7 digits} when omitted.
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreatePolicyRequestInternal:
      type: object
      description: Internal create command accepted by the Policy expert.
      required:
        - tenantId
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          maxLength: 32
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
          description: Optional. Only DRAFT is accepted at creation.
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    UpdatePolicyStatusRequest:
      type: object
      description: Public lifecycle transition command.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Optional optimistic version. Recommended; see the operation description.
        reason:
          type: string
          maxLength: 200
    UpdatePolicyStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Policy expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 200
x-vertical: policy
x-implementation:
  status: implemented
  verifiedAt: '2026-10-19'
  verifiedAgainst:
    - repos/eia-policy-domain/src/main/java/com/eia/policy/domain/PolicyController.java
    - repos/eia-policy-domain/src/main/java/com/eia/policy/domain/PolicyClient.java
    - repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyController.java
    - repos/eia-policy-expert/src/main/java/com/eia/policy/expert/ApiExceptionHandler.java
  errorEnvelope: >
    Vertical-specific ApiError {timestamp, status, code, message, path,
    details[]}. Not the canonical Problem envelope yet.
  notes: >
    Verbatim money fields are serialized as decimal strings by
    @JsonFormat(shape = STRING). The expert is authoritative for the initial
    status and the transition table.
