          maxLength: 200
        addressLine2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        stateRegion:
          type: string
          pattern: '^[A-Z]{2}-[A-Z0-9]{1,3}$'
        postalCode:
          type: string
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
    CancelPolicyRequest:
      type: object
      description: >
        Cancel a policy. The cancellation type determines the return premium:
        FLAT and VOID refund the full unearned premium, PRO_RATA and
        NON_PAYMENT refund the unearned portion, and SHORT_RATE applies the
        filed short-rate factor.
      required:
        - cancellationType
        - reason
        - effectiveDate
      properties:
        cancellationType:
          $ref: '#/components/schemas/CancellationType'
        reason:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        noticeDays:
          type: integer
          minimum: 0
        approvedBy:
          type: string
          format: uuid
        approvalRef:
          type: string
          format: uuid
    ReinstatePolicyRequest:
      type: object
      description: >
        Reinstate a cancelled policy. Approval and premium evidence are
        mandatory before coverage is restored.
      required:
        - effectiveDate
        - reason
        - approvedBy
        - approvalRef
        - premiumEvidenceRef
        - premiumEvidenceAmount
        - premiumEvidenceCurrency
      properties:
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
        approvedBy:
          type: string
          format: uuid
        approvalRef:
          type: string
          format: uuid
        premiumEvidenceRef:
          type: string
          maxLength: 64
        premiumEvidenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumEvidenceCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    RenewPolicyRequest:
      type: object
      description: >
        Renew a policy into a new DRAFT successor term. The two term dates are
        required. Premium, limit, and currency overrides are optional and
        default to the source policy values when omitted, so a caller can renew
        on unchanged terms by sending only the dates. The source policy is not
        mutated; the successor records it in `renewedFromPolicyId`.
      required:
        - effectiveDate
        - expirationDate
      properties:
        effectiveDate:
          type: string
          format: date
          description: >
            Start of the successor term. Must be on or after the source policy
            expiration date.
        expirationDate:
          type: string
          format: date
          description: End of the successor term; must be after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
