          application/json:
            schema:
              $ref: '#/components/schemas/CancelPolicyRequest'
      responses:
        '201':
          description: Policy cancelled; computed return premium returned.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '200':
          description: Idempotent replay of the same cancellation command.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/reinstatements:
    get:
      operationId: expertListPolicyReinstatements
      tags:
        - Policy internal
      summary: List reinstatements (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of reinstatements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReinstatementPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/reinstate:
    post:
      operationId: expertReinstatePolicy
      tags:
        - Policy internal
      summary: Reinstate a cancelled policy (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstatePolicyRequest'
      responses:
        '201':
          description: Policy reinstated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reinstatement'
        '200':
          description: Idempotent replay of the same reinstatement command.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reinstatement'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Policy:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Policy projection. Detail, create, and mutation responses carry a strong
        ETag derived from `version`; the body itself does not carry `_links`
        yet.
      required:
        - id
        - tenantId
        - policyNumber
        - productCode
        - insuredPartyId
        - status
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          examples:
            - POL-2026-0000001
        productCode:
          type: string
          maxLength: 32
        insuredPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PolicyStatus'
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
          description: On or after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        renewedFromPolicyId:
          type: [string, 'null']
          format: uuid
          description: >
            Predecessor term for a policy created by renewal (SPEC 11.2.4
            renewal lineage). The renewal successor points at the term it
            replaced; every policy created directly carries null. The source
            policy itself is not mutated and does not point forward.
    PolicyStatus:
      type: string
      description: Policy lifecycle status from SPEC 11.2.6.
      enum:
        - DRAFT
        - QUOTED
        - BOUND
        - ISSUED
        - IN_FORCE
        - ENDORSED
        - RENEWED
        - CANCELLED
        - EXPIRED
        - NON_RENEWED
        - REINSTATED
        - VOID
    PolicyVersion:
      type: object
      description: >
        Immutable policy version (SPEC 11.2.4 `policy_version`). A version is
        never updated; `effectiveTo` is set when a successor supersedes it.
        `immutableHash` is the canonical SHA-256 of the version snapshot.
      required:
        - id
        - tenantId
        - policyId
        - versionNumber
        - policyVersionNumber
        - changeType
        - status
        - effectiveFrom
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        policyVersionNumber:
          type: string
          maxLength: 32
        changeType:
          $ref: '#/components/schemas/PolicyVersionChangeType'
        status:
          $ref: '#/components/schemas/PolicyVersionStatus'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        issuedAt:
          type: [string, 'null']
          format: date-time
        issuedBy:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        transactionId:
          type: [string, 'null']
          format: uuid
        premiumDeltaAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        premiumDeltaCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        description:
          type: [string, 'null']
          maxLength: 2000
        supersedesVersionId:
          type: [string, 'null']
          format: uuid
        immutableHash:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
        createdAt:
          type: string
          format: date-time
    PolicyVersionChangeType:
      type: string
      description: Why the version was issued (SPEC 11.2.4 change types).
      enum:
        - BIND
        - ISSUE
        - ENDORSEMENT
        - RENEWAL
        - CANCELLATION
        - REINSTATEMENT
        - CORRECTION
        - PREMIUM_AUDIT
        - VOID
    PolicyVersionStatus:
      type: string
      enum:
        - DRAFT
        - ISSUED
        - VOIDED
        - SUPERSEDED
    CurrentVersion:
      type: object
      description: >
        The derived current version plus the snapshot hash verification result.
      required:
        - version
        - current
        - hashVerified
      properties:
        version:
          $ref: '#/components/schemas/PolicyVersion'
        current:
          type: boolean
          description: True when this is the single ISSUED version.
        hashVerified:
          type: boolean
          description: True when the recomputed SHA-256 matches `immutableHash`.
    Coverage:
      type: object
      description: Coverage grant projection (SPEC 11.2.4 `policy_coverage`).
      required:
        - id
        - tenantId
        - policyId
        - coverageCode
        - coverageName
        - coveragePart
        - occurrenceBasis
        - effectiveFrom
        - effectiveTo
        - status
        - sequence
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        coverageCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
        coverageName:
          type: string
          maxLength: 160
        coveragePart:
          $ref: '#/components/schemas/CoveragePart'
        occurrenceBasis:
          $ref: '#/components/schemas/OccurrenceBasis'
        coinsurancePct:
          $ref: './components.yaml#/components/schemas/Percent'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/CoverageStatus'
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    CoveragePart:
      type: string
      description: Coverage part code.
      enum:
        - A
        - B
        - C
        - D
    OccurrenceBasis:
      type: string
      enum:
        - OCCURRENCE
        - CLAIMS_MADE
        - CLAIMS_MADE_WITH_RETRO
        - DISCOVERY
    CoverageStatus:
      type: string
      enum:
        - ACTIVE
        - EXCLUDED
        - ENDORSED
        - EXPIRED
    Limit:
      type: object
      description: >
        Limit schedule for one coverage (SPEC 11.2.4 `policy_limit`). A null
        `aggregateAmount` means the aggregate is explicitly NONE, and the
        erosion ledger then starts from the each-occurrence amount.
      required:
        - id
        - tenantId
        - policyId
        - coverageId
        - perOccurrenceAmount
        - currency
        - effectiveFrom
        - effectiveTo
        - sequence
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        coverageId:
          type: string
          format: uuid
        perOccurrenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        aggregateAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        aggregateBasis:
          type: [string, 'null']
          enum:
            - PER_POLICY
            - PER_COVERAGE
        sublimitAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        deductibleAmount:
          type: [string, 'null']
          pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        coinsurancePct:
          type: [string, 'null']
          pattern: '^0(?:\.[0-9]{1,6})?$|^1(?:\.0{1,6})?$'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        erosionBasis:
          $ref: '#/components/schemas/ErosionBasis'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    ErosionBasis:
      type: string
      enum:
        - PAID
        - INCURRED
        - PAID_PLUS_RESERVED
    LimitState:
      type: object
      description: >
        Derived aggregate erosion ledger for a limit (SPEC 11.2.4
        `policy_limit_state`). `remainingAmount = originalAmount +
        reinstatedAmount - incurredAmount + recoveredAmount`.
      required:
        - id
        - tenantId
        - policyId
        - limitId
        - originalAmount
        - paidAmount
        - reservedAmount
        - incurredAmount
        - recoveredAmount
        - remainingAmount
        - erodedPct
        - sourceVersion
        - computedAt
        - reconciliationStatus
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        limitId:
          type: string
          format: uuid
        asOf:
          type: string
          format: date-time
        originalAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        paidAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        reservedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        incurredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        recoveredAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        remainingAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        erodedPct:
          $ref: './components.yaml#/components/schemas/Percent'
        reinstatedAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        sourceVersion:
          type: integer
          minimum: 0
          description: Highest erosion fact `sourceVersion` applied.
        computedAt:
          type: string
          format: date-time
        reconciliationStatus:
          type: string
          enum:
            - CURRENT
            - STALE
            - DRIFT
            - MANUAL_REVIEW
        version:
          type: integer
          minimum: 0
    CoverageView:
      type: object
      description: >
        A coverage with its limit schedule and derived erosion state. `limit`
        and `state` are null only in the moment a coverage is created.
      required:
        - coverage
      properties:
        coverage:
          $ref: '#/components/schemas/Coverage'
        limit:
          oneOf:
            - $ref: '#/components/schemas/Limit'
            - type: 'null'
        state:
          oneOf:
            - $ref: '#/components/schemas/LimitState'
            - type: 'null'
    Endorsement:
      type: object
      description: >
        Endorsement projection (SPEC 11.2.4 `policy_endorsement`). Every
        endorsement issues one policy version; a backdated endorsement records
        the reason and approval that allowed it.
      required:
        - id
        - tenantId
        - policyId
        - policyVersionId
        - endorsementType
        - effectiveDate
        - description
        - coverageImpact
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: string
          format: uuid
        endorsementNumber:
          type: [string, 'null']
          maxLength: 32
        sequence:
          type: integer
          minimum: 1
        formNumber:
          type: [string, 'null']
          maxLength: 32
        formEdition:
          type: [string, 'null']
          maxLength: 16
        endorsementType:
          $ref: '#/components/schemas/EndorsementType'
        effectiveDate:
          type: string
          format: date
        description:
          type: string
          maxLength: 2000
        premiumDeltaAmount:
          type: [string, 'null']
          pattern: '^-?[0-9]{1,15}(?:\.[0-9]{1,4})?$'
        premiumDeltaCurrency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        coverageImpact:
          $ref: '#/components/schemas/CoverageImpact'
        coverageChanges:
          type: array
          items:
            $ref: '#/components/schemas/EndorsementCoverageChange'
        manuscriptFlag:
          type: boolean
        backdateReason:
          type: [string, 'null']
          maxLength: 500
        approvalRef:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/EndorsementStatus'
        issuedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
    EndorsementType:
      type: string
      enum:
        - COVERAGE
        - LIMIT
        - PARTY
        - PREMIUM
        - RETENTION
        - EXCLUSION
        - TERRITORY
        - CANCELLATION
        - REINSTATEMENT
        - NON_RENEWAL
        - CORRECTION
        - MANUSCRIPT
    EndorsementStatus:
      type: string
      enum:
        - DRAFT
        - ISSUED
        - VOID
    CoverageImpact:
      type: string
      enum:
        - NONE
        - BROADEN
        - RESTRICT
        - CLARIFY
    EndorsementCoverageChange:
      type: object
      required:
        - coverageCode
        - changeType
      properties:
        coverageCode:
          type: string
          maxLength: 32
        changeType:
          type: string
          enum:
            - ADD
            - REMOVE
            - BROADEN
            - RESTRICT
            - CLARIFY
        description:
          type: [string, 'null']
          maxLength: 500
    Insured:
      type: object
      description: Insured party projection (SPEC 11.2.4 `policy_insured`).
      required:
        - id
        - tenantId
        - policyId
        - partyId
        - insuredRole
        - displayName
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        insuredRole:
          $ref: '#/components/schemas/InsuredRole'
        displayName:
          type: string
          maxLength: 300
        certificateNumber:
          type: [string, 'null']
          maxLength: 32
        scope:
          type: [string, 'null']
          maxLength: 120
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - ENDORSED_OFF
            - EXPIRED
        createdAt:
          type: string
          format: date-time
    InsuredRole:
      type: string
      enum:
        - NAMED_INSURED
        - ADDITIONAL_INSURED
        - INSURED_ORGANIZATION
        - LOSS_PAYEE
        - MORTGAGEE
        - LENDER
        - CERTIFICATE_HOLDER
    Location:
      type: object
      description: Scheduled insured location projection.
      required:
        - id
        - tenantId
        - policyId
        - locationCode
        - addressLine1
        - city
        - stateRegion
        - country
        - effectiveFrom
        - effectiveTo
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        locationCode:
          type: string
          maxLength: 32
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,31}$'
        addressLine1:
          type: string
          maxLength: 200
        addressLine2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          maxLength: 120
        stateRegion:
          type: string
          maxLength: 6
          pattern: '^[A-Z]{2}-[A-Z0-9]{1,3}$'
        postalCode:
          type: [string, 'null']
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{3}$'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - ENDORSED_OFF
            - EXPIRED
        createdAt:
          type: string
          format: date-time
    Cancellation:
      type: object
      description: >
        Cancellation projection with the return premium computed at cancellation
        time. `proRataPct` is the earned fraction of the term.
      required:
        - id
        - tenantId
        - policyId
        - cancellationType
        - reason
        - effectiveDate
        - termDays
        - remainingDays
        - proRataPct
        - earnedPremiumAmount
        - returnPremiumAmount
        - premiumCurrency
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        policyVersionId:
          type: [string, 'null']
          format: uuid
        cancellationType:
          $ref: '#/components/schemas/CancellationType'
        reason:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        noticeDays:
          type: integer
          minimum: 0
        noticedAt:
          type: [string, 'null']
          format: date-time
        termDays:
          type: integer
          minimum: 0
        remainingDays:
          type: integer
          minimum: 0
        proRataPct:
          $ref: './components.yaml#/components/schemas/Percent'
        earnedPremiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        returnPremiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        approvalRef:
          type: [string, 'null']
          format: uuid
        approvedBy:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - REINSTATED
            - VOID
        createdAt:
          type: string
          format: date-time
    CancellationType:
      type: string
      enum:
        - FLAT
        - PRO_RATA
        - SHORT_RATE
        - NON_PAYMENT
        - VOID
    Reinstatement:
      type: object
      description: >
        Reinstatement projection backed by approval and premium evidence.
      required:
        - id
        - tenantId
        - policyId
        - cancellationId
        - effectiveDate
        - reason
        - approvalRef
        - approvedBy
        - premiumEvidenceRef
        - premiumEvidenceAmount
        - premiumEvidenceCurrency
        - status
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        cancellationId:
          type: string
          format: uuid
        policyVersionId:
          type: [string, 'null']
          format: uuid
        effectiveDate:
          type: string
          format: date
        reason:
          type: string
          maxLength: 500
        approvalRef:
          type: string
          format: uuid
        approvedBy:
          type: string
          format: uuid
        premiumEvidenceRef:
          type: string
          maxLength: 64
        premiumEvidenceAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumEvidenceCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        status:
          type: string
          enum:
            - APPROVED
            - REVOKED
        createdAt:
          type: string
          format: date-time
    BillingPlan:
      type: object
      description: >
        Public billing plan for a policy (SPEC 11.2.13) with its ordered
        installment schedule. A policy has at most one ACTIVE plan. The total
        premium is split across the installments so their amounts sum exactly to
        `totalPremium` at scale 4. `status` is ACTIVE for a created plan; the
        COMPLETE and CANCELLED values are the closed-plan states the expert
        repository recognizes. This is the domain projection: unlike the expert
        view it is flat and names the plan identity `planId`.
      required:
        - planId
        - planNumber
        - policyId
        - totalPremium
        - currency
        - installmentCount
        - frequency
        - firstDueDate
        - status
        - installments
      properties:
        planId:
          type: string
          format: uuid
        planNumber:
          type: string
          maxLength: 32
          description: Generated plan number, for example `BP-0001`.
        policyId:
          type: string
          format: uuid
        totalPremium:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        installmentCount:
          type: integer
          minimum: 1
          maximum: 24
        frequency:
          type: string
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
        firstDueDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - ACTIVE
            - COMPLETE
            - CANCELLED
        installments:
          type: array
          description: Ordered by `installmentNumber`, ascending.
          items:
            $ref: '#/components/schemas/Installment'
    Installment:
      type: object
      description: >
        One scheduled premium installment of a billing plan. `paidAt` and
        `paymentId` are populated only for a PAID row; a WAIVED row carries no
        payment evidence.
      required:
        - installmentId
        - installmentNumber
        - dueDate
        - amount
        - status
      properties:
        installmentId:
          type: string
          format: uuid
        installmentNumber:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        status:
          type: string
          enum:
            - DUE
            - OVERDUE
            - PAID
            - WAIVED
        paidAt:
          type: [string, 'null']
          format: date-time
        paymentId:
          type: [string, 'null']
          format: uuid
    CreateBillingPlanRequest:
      type: object
      description: >
        Create the single ACTIVE billing plan for a policy. The plan total and
        currency are taken from the policy; the caller chooses only the
        installment count, frequency, and first due date. Values are normalized
        to upper case, and an unknown frequency is 400
        `INVALID_BILLING_FREQUENCY`.
      required:
        - installmentCount
        - frequency
        - firstDueDate
      properties:
        installmentCount:
          type: integer
          minimum: 1
          maximum: 24
        frequency:
          type: string
          enum:
            - MONTHLY
            - QUARTERLY
            - SEMI_ANNUAL
            - ANNUAL
        firstDueDate:
          type: string
          format: date
    UpdateInstallmentRequest:
      type: object
      description: >
        Settle one installment as PAID or WAIVED. `status` is trimmed and
        normalized to upper case; any other value is 400
        `INVALID_INSTALLMENT_STATUS`. `paymentId` is optional and is stored only
        for PAID. Repeating the same terminal status is an idempotent no-op;
        changing one terminal status to the other is 409.
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PAID
            - WAIVED
        paymentId:
          type: [string, 'null']
          format: uuid
    PolicyPage:
      type: object
      description: >
        One page of the policy list: `items`, `page`, `size`, `total`, and
