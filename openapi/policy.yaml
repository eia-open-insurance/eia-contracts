        `CANCELLATION_NOT_ALLOWED` otherwise). The effective date must fall
        inside the policy term and a NON_PAYMENT cancellation needs at least ten
        days of notice. Cancellation issues a CANCELLATION version and moves the
        policy to CANCELLED.

        Rejections: 400 for an unknown cancellation type; 409 for a
        non-cancellable status or a stale ETag; 422 for
        `CANCELLATION_OUTSIDE_POLICY_TERM`, `INVALID_CANCELLATION_NOTICE`, or
        `INSUFFICIENT_CANCELLATION_NOTICE`; 428 `APPROVAL_REQUIRED` when a
        backdated cancellation has no approval.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
