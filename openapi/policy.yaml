        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        '428':
          $ref: './components.yaml#/components/responses/PreconditionRequired'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/renew:
    post:
      operationId: renewPolicy
      tags:
        - Policy
      summary: Renew a policy into a successor DRAFT term.
      description: >
        Creates a new DRAFT policy term and leaves the source policy unchanged
        (SPEC 11.2.4 renewal lineage, SPEC 11.2.10 renew). The source must be
        `ISSUED`, `IN_FORCE`, `ENDORSED`, or `REINSTATED`; any other status is
        409 `RENEWAL_NOT_ALLOWED` and writes nothing. The successor inherits the
        source product, insured party, coverages, limit schedules, insureds, and
        locations, and each copied limit gets a fresh zeroed erosion state.

        `effectiveDate` and `expirationDate` are required. `effectiveDate` must
        be on or after the source expiration date and `expirationDate` must be
        after `effectiveDate`; a violation is 400 `VALIDATION_ERROR`. The
        premium and limit override fields are optional and default to the source
        policy values; a supplied currency must be an ISO 4217 code and a
        supplied amount must be zero or greater with at most four fraction
        digits.

        The 201 body is the successor policy, not the source. Its
        `renewedFromPolicyId` points at the source, and the response carries the
        successor's strong `ETag`. The command writes `policy.policy.renewed` in
        the same transaction as the successor, its children, and its initial
        DRAFT version. Audit and transaction links (`If-Match`,
        `Idempotency-Key`) are not accepted in this slice; MISMATCHES.md M-06,
        M-07, and M-28 record the gap.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewPolicyRequest'
      responses:
        '201':
          description: Successor policy created in DRAFT.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            The source status cannot be renewed (`RENEWAL_NOT_ALLOWED`). The
            allowed source statuses are ISSUED, IN_FORCE, ENDORSED, and
            REINSTATED; the problem carries `meta.sourcePolicyId`,
            `meta.sourceStatus`, and `meta.allowedStatuses`. A tenant or policy
            mismatch is 404, not 409.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/billing:
    get:
      operationId: getPolicyBilling
      tags:
        - Policy
      summary: Get the policy billing plan and installment schedule.
      description: >
        Returns the public flat billing projection: the plan members and the
        ordered `installments` array. The ACTIVE plan is returned when one
        exists; otherwise the most recently created closed plan is returned so
        the read remains useful after the plan lifecycle closes.

        A policy without any billing plan is 404 `BILLING_PLAN_NOT_FOUND`; an
        unknown policy or a policy in another tenant is 404 `POLICY_NOT_FOUND`.
        `X-EIA-Book` is optional for compatibility with the other Policy proxy
        routes, but a supplied value must be DIRECT; another book is hidden as
        404 `BOOK_SCOPE_VIOLATION`. Billing is a DIRECT-book business and the
        domain always forwards DIRECT to the expert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The current billing plan and its ordered installments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlan'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicyBillingPlan
      tags:
        - Policy
      summary: Create the policy billing plan.
      description: >
        Creates the single ACTIVE billing plan and its installment schedule. The
        plan total is the policy premium and the plan currency is the policy
        premium currency; the caller chooses only `installmentCount` (1..24),
        `frequency`, and `firstDueDate`. The first n-1 installments are equal and
        the last one absorbs the rounding remainder, so the schedule sums exactly
        to the premium at scale 4.

        Rejections: 400 `VALIDATION_ERROR` for a malformed body,
        `INVALID_INSTALLMENT_COUNT` outside 1..24, `INVALID_BILLING_FREQUENCY`,
        or `INVALID_FIRST_DUE_DATE`; 404 `POLICY_NOT_FOUND` (or
        `BOOK_SCOPE_VIOLATION` for another book); 409
        `BILLING_PLAN_ALREADY_EXISTS` when an ACTIVE plan already exists, or
        `CONCURRENT_MODIFICATION` when the policy changed concurrently.

        The command writes `policy.billing-plan.created` in the same transaction
        as the plan and schedule. It is not idempotent and does not accept
        `Idempotency-Key` or `If-Match` in this slice (MISMATCHES.md M-06, M-07).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingPlanRequest'
      responses:
        '201':
          description: Billing plan and installment schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlan'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/billing/installments/{installmentId}:
    patch:
      operationId: updatePolicyInstallment
      tags:
        - Policy
      summary: Settle one billing installment as PAID or WAIVED.
      description: >
        Marks a DUE or OVERDUE installment terminal. `PAID` records `paidAt` and
        stores the optional `paymentId`; `WAIVED` clears payment evidence.
        Repeating the same terminal status is an idempotent no-op that returns
        the unchanged installment and writes no event. Switching a settled
        installment to the other terminal status is 409
        `INSTALLMENT_ALREADY_SETTLED`; a source status that is not DUE or OVERDUE
        is 409 `INSTALLMENT_NOT_SETTLEABLE`.

        Rejections: 400 `VALIDATION_ERROR` for a blank status or
        `INVALID_INSTALLMENT_STATUS` for a value other than PAID or WAIVED; 404
        `POLICY_NOT_FOUND`, `INSTALLMENT_NOT_FOUND` (including an installment
        under another policy or tenant), or `BOOK_SCOPE_VIOLATION`; 409 for a
        settled installment or `CONCURRENT_MODIFICATION`.

        The accepted command writes `policy.installment.paid` or
        `policy.installment.waived` in the same transaction as the row change.
        It does not accept `Idempotency-Key`; repeating the same terminal status
        is the retry-safe path (MISMATCHES.md M-07).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: installmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstallmentRequest'
      responses:
        '200':
          description: The settled installment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Installment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/billing/installments:
    get:
      operationId: listReceivables
      tags:
        - Policy
      summary: List the tenant's premium receivables queue.
      description: >
        Cross-policy premium-receivables queue (SPEC 11.2.13
        `premium_receivable`). The route is outside `/api/v1/policies` because it
        is not scoped to one policy: it joins every billing plan in the tenant
        with its installments, policy, and insured party, and returns the
        `ReceivableSummary` projection.

        Only unsettled installments are returned. `status` optionally narrows the
        effective status to DUE or OVERDUE; a stored DUE row past its due date is
        reported as OVERDUE and is selected by the OVERDUE filter without the
        read rewriting the stored row. `dueBefore` is an inclusive due-date
        cutoff. Items are ordered by `dueDate` ascending, then `policyNumber`,
        `installmentNumber`, and `installmentId`.

        `limit` defaults to 20 and must be between 1 and 200. An integer outside
        that window is 400 `VALIDATION_ERROR` with field `limit`; a non-integer
        is 400 `INVALID_PARAMETER`. A status other than DUE or OVERDUE is 400
        `INVALID_INSTALLMENT_STATUS`; a malformed `dueBefore` is also 400
        `INVALID_PARAMETER`; and a missing or malformed tenant is 400
        `MISSING_TENANT_HEADER` or `INVALID_PARAMETER`.

        `X-EIA-Book` is optional for compatibility with the other Policy proxy
        routes, but a supplied value must be DIRECT; another book is hidden as
        404 `BOOK_SCOPE_VIOLATION`. The domain always forwards DIRECT to the
        expert. `totalAmount` sums every returned receivable, `overdueAmount`
        sums the effective OVERDUE subset, and `count` is the number returned.
        `paidAt` and `paymentId` are null in this queue because only unsettled
        installments are returned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: status
          in: query
          required: false
          description: >
            Optional effective-status filter. The value is trimmed and
            upper-cased, so `overdue` selects OVERDUE; a blank value means no
            status filter.
          schema:
            type: string
            enum:
              - DUE
              - OVERDUE
        - name: dueBefore
          in: query
          required: false
          description: Inclusive due-date cutoff (`dueDate <= dueBefore`).
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          description: Maximum number of receivables to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
      responses:
        '200':
          description: The tenant's premium receivables and their totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivableSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/billing/installments/{installmentId}/dunning:
    get:
      operationId: listInstallmentDunning
      tags:
        - Policy
      summary: List the dunning history of one billing installment.
      description: >
        Returns the actions recorded against one premium installment (SPEC
        11.2.13 collections and dunning), newest first by `sentAt`, then
        record time, with `dunningId` breaking a tie. The route is not
        policy-scoped because the collections workbench addresses an
        installment directly; the installment resolves its plan and policy and
        the tenant wall is applied to all three tables.

        An installment with no action returns an empty array. An unknown
        installment, an installment under another tenant, and a non-DIRECT
        `X-EIA-Book` are all 404 (`INSTALLMENT_NOT_FOUND` or
        `BOOK_SCOPE_VIOLATION`), so the response cannot confirm another
        tenant's record; the domain currently accepts an absent book header for
        compatibility with the other Policy proxy routes (MISMATCHES.md M-38).
        A malformed tenant header or `installmentId` is 400
        `INVALID_PARAMETER`; a missing tenant is 400 `MISSING_TENANT_HEADER`.

        `status` is the action state: `SENT` for a delivered action, or
        `CANCELLED` for superseded history. This read writes no event.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: installmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The installment's dunning actions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DunningAction'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: recordInstallmentDunning
      tags:
        - Policy
      summary: Record a dunning action for one billing installment.
      description: >
        Records one escalation action against a collectible premium
        installment and returns the created row with 201. `level` is trimmed
        and upper-cased against `REMINDER`, `FIRST_NOTICE`, `SECOND_NOTICE`,
        or `COLLECTIONS`; `channel` is trimmed and upper-cased against
        `EMAIL`, `LETTER`, or `PORTAL`. An unknown value is 400
        `INVALID_DUNNING_LEVEL` or `INVALID_DUNNING_CHANNEL`; a malformed body
        is 400 `VALIDATION_ERROR`. `notes` is optional, trimmed, treated as
        absent when blank, and capped at 2000 characters (400
        `INVALID_DUNNING_NOTES`).

        Only an installment whose effective status is DUE or OVERDUE is
        collectible: a stored DUE row past its due date is effectively
        OVERDUE and remains dunnable, while a PAID or WAIVED installment is
        409 `INSTALLMENT_NOT_DUNNABLE` with `meta.currentStatus`. Each
        escalation level can be sent at most once per installment, so a
        repeated level is 409 `DUNNING_ALREADY_SENT` with `meta.level`; the
        unique `(tenantId, installmentId, level)` constraint is the
        concurrency arbiter. A concurrent policy change is 409
        `CONCURRENT_MODIFICATION`.

        An unknown installment, another tenant's installment, or a non-DIRECT
        `X-EIA-Book` is 404 (`INSTALLMENT_NOT_FOUND` or
        `BOOK_SCOPE_VIOLATION`); the domain currently accepts an absent book
        header for compatibility with the other Policy proxy routes (M-38). The
        accepted action bumps the policy row version and writes
        `policy.dunning.sent` in the same transaction, so a rollback leaves
        neither the row nor the event behind. The command is not idempotent and
        accepts no `Idempotency-Key` or `If-Match`; the per-level uniqueness is
        the retry guard (MISMATCHES.md M-06, M-07, M-38).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: installmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDunningRequest'
      responses:
        '201':
          description: Dunning action recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DunningAction'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/mass-tort-profile:
    get:
      operationId: getPolicyMassTortProfile
      tags:
        - Policy
      summary: Get the mass tort profile of a direct policy.
      description: >
        Returns the single mass tort profile of a direct policy (SPEC 11.2.4
        `policy_mass_tort_profile`, SPEC 11.2.11). The profile records the tort
        and trigger theory, the allocation method, the coverage block that
        Direct Claims uses to allocate a long-tail claim across policy years,
        and the DRAFT/COMPLETE state.

        A policy without a profile is 404 `MASS_TORT_PROFILE_NOT_FOUND`; an
        unknown policy or a policy in another tenant is 404 `POLICY_NOT_FOUND`.
        `X-EIA-Tenant` is required. The canonical contract requires
        `X-EIA-Book: DIRECT`; an absent header is accepted for compatibility
        with the other Policy proxy routes, a supplied value must be DIRECT, and
        another book is hidden as 404 `BOOK_SCOPE_VIOLATION`. The domain always
        forwards DIRECT to the expert, whose `/internal/v1` alias is an
        implementation detail. The short public path differs from the SPEC
        11.2.10 `/api/v1/policy/policies/...` form; MISMATCHES.md M-01 and M-32
        record the deviation.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The policy's mass tort profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassTortProfile'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    put:
      operationId: updatePolicyMassTortProfile
      tags:
        - Policy
      summary: Create or replace the mass tort profile of a direct policy.
      description: >
        Upserts the single profile. A new row returns 201; an existing row is
        rewritten in place and returns 200 with the same `profileId`. Every
        accepted write bumps the policy row version and writes
        `policy.mass-tort-profile.updated` in the same transaction. The expert
        makes the 201/200 distinction, while the public domain controller
        currently returns 200 for both outcomes; the canonical contract keeps
        the create 201 and MISMATCHES.md M-32 records the gap.

        `tortType`, `triggerType`, `allocationMethod`, and `status` are
        required. `allocationNotes` and both coverage-block dates are optional
        for a DRAFT profile and required for a COMPLETE profile; a COMPLETE body
        that omits any of them is 400 `INCOMPLETE_MASS_TORT_PROFILE`. The
        coverage block is inclusive, so the same start and end date is valid
        while an end before the start is 400 `INVALID_COVERAGE_BLOCK`.

        Values are trimmed and upper-cased. An unknown tort, trigger, or
        allocation method is 400 `INVALID_TORT_TYPE`, `INVALID_TRIGGER_TYPE`, or
        `INVALID_ALLOCATION_METHOD`; an unknown status is 400
        `INVALID_MASS_TORT_PROFILE_STATUS`; notes longer than 2000 characters
        are 400 `INVALID_ALLOCATION_NOTES`; and a blank required field is 400
        `VALIDATION_ERROR`. The public domain also accepts `trigger` as an alias
        for `triggerType` and ignores read-only response members sent in the
        body.

        A create race is 409 `MASS_TORT_PROFILE_ALREADY_EXISTS`, and a
        concurrent policy or profile change is 409 `CONCURRENT_MODIFICATION`.
        An unknown policy or a policy in another tenant is 404
        `POLICY_NOT_FOUND`; another book is 404 `BOOK_SCOPE_VIOLATION`.

        The command accepts neither `Idempotency-Key` nor `If-Match` in this
        slice; repeating the same PUT rewrites the profile and emits another
        event (MISMATCHES.md M-06, M-07, M-32).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirectOptional'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMassTortProfileRequest'
      responses:
        '200':
          description: The existing profile was replaced; its id is preserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassTortProfile'
        '201':
          description: The policy had no profile and one was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassTortProfile'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/programs:
    get:
      operationId: listPrograms
      tags:
        - Policy
      summary: List the tenant's program catalog.
      description: >
        Returns the tenant's programs newest first (`createdAt DESC`, then
        `programId ASC`) as a bare `Program` array. A program groups policies
        into one commercial portfolio; the program number is server-generated
        per tenant and the effective range is inclusive. The list is not
        paginated in this slice (M-04).

        `X-EIA-Tenant` is required and `X-EIA-Book` is required and must be
        DIRECT; a missing tenant or book is a 400 (`MISSING_TENANT_HEADER`/
        `INVALID_TENANT_HEADER` or `MISSING_HEADER`), and another book is hidden
        as 404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6, WALL-06). The SPEC 11.2.10
        catalog route is `/api/v1/policy/programs`; the implemented short path
        is recorded in M-01.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      responses:
        '200':
          description: The tenant's programs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Program'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createProgram
      tags:
        - Policy
      summary: Create a program in the DIRECT-book catalog.
      description: >
        Creates a program in the caller's tenant. The expert owns the identity:
        `programId`, the server-generated `programNumber` (`PRG-{YEAR}-{7
        digits}` from a per-tenant sequence), the initial `status` ACTIVE, and
        `createdAt`. The caller supplies `name`, `programType`, and the
        inclusive `effectiveFrom`/`effectiveTo` range; the same start and end
        date is valid.

        `name` is trimmed and capped at 200 characters. `programType` is
        trimmed, upper-cased, and must be one of CAPTIVE, POOL, FRONTING,
        COINSURANCE, or MASS_TORT; `effectiveTo` before `effectiveFrom` is
        rejected. A blank required field is 400 `VALIDATION_ERROR`; an invalid
        name, type, or date range is 400 `INVALID_PROGRAM_NAME`,
        `INVALID_PROGRAM_TYPE`, or `INVALID_PROGRAM_DATES`. The optional
        `leadPolicyId` is stored as supplied and is not resolved or checked
        against the caller's tenant in this slice (M-39).

        The accepted create writes `policy.program.created` in the same
        transaction as the row. `X-EIA-Tenant` is required and `X-EIA-Book` is
        required and must be DIRECT; a missing tenant or book is a 400
        (`MISSING_TENANT_HEADER`/`INVALID_TENANT_HEADER` or `MISSING_HEADER`),
        and another book is hidden as 404 `BOOK_SCOPE_VIOLATION`. The command
        accepts neither `Idempotency-Key` nor `If-Match`, so a retry creates a
        second program (M-06, M-07).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProgramRequest'
      responses:
        '201':
          description: Program created ACTIVE with a server-generated number.
          headers:
            Location:
              description: Canonical path of the created program.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/programs/{programId}:
    get:
      operationId: getProgram
      tags:
        - Policy
      summary: Get one program from the tenant catalog.
      description: >
        Returns the program detail. The read is tenant-scoped, so a program id
        from another tenant is indistinguishable from a missing one and is 404
        `PROGRAM_NOT_FOUND`. `X-EIA-Tenant` is required and `X-EIA-Book` is
        required and must be DIRECT; a missing tenant or book is a 400
        (`MISSING_TENANT_HEADER`/`INVALID_TENANT_HEADER` or `MISSING_HEADER`),
        and another book is hidden as 404 `BOOK_SCOPE_VIOLATION`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: programId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Program detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/program:
    patch:
      operationId: updatePolicyProgram
      tags:
        - Policy
      summary: Assign a policy to a program or clear the assignment.
      description: >
        Sets the policy's `programId` to the supplied program, or clears the
        link when `programId` is null; the request body is required and the
        property is explicitly nullable. The assignment is a policy command:
        the accepted write bumps the policy row version, returns the updated
        `Policy` with its new strong `ETag`, and writes
        `policy.policy.program-assigned` in the same transaction. The event
        carries both the new `programId` and `previousProgramId`, either of
        which is null on a first assignment or a clear. Repeating the same
        assignment still bumps the version and emits another event.

        An unknown policy or a policy in another tenant is 404
        `POLICY_NOT_FOUND`; an unknown program is 404 `PROGRAM_NOT_FOUND`; a
        missing tenant or book is a 400 (`MISSING_TENANT_HEADER`/
        `INVALID_TENANT_HEADER` or `MISSING_HEADER`) and a malformed body is
        400 `MALFORMED_REQUEST`. The program and the policy must share the
        caller's tenant. A concurrent policy change is 409
        `CONCURRENT_MODIFICATION` with `meta.currentVersion`,
        `meta.expectedVersion`, and an `errors` entry whose code is
        `STALE_VERSION`.

        `X-EIA-Tenant` is required and `X-EIA-Book` is required and must be
        DIRECT; another book is hidden as 404 `BOOK_SCOPE_VIOLATION`. The
        command accepts neither `If-Match` nor `Idempotency-Key` in this
        slice: the expert version-checks the row it read, and the version in
        the response body is the only conflict token (M-06, M-07). The
        `/internal/v1` alias the domain calls is an implementation detail.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyProgramRequest'
      responses:
        '200':
          description: Policy after the assignment or clear.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies:
    get:
      operationId: expertListPolicies
      tags:
        - Policy internal
      summary: List policies for a tenant (expert).
      description: >
        Returns the same page envelope as the public list. `_links` preserve
        the required `tenantId` query parameter and are relative to
        `/internal/v1/policies`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of policies for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreatePolicy
      tags:
        - Policy internal
      summary: Create a policy (expert).
      description: >
        `status` is optional and defaults to DRAFT. Any initial status other
        than DRAFT is rejected with 400 `INVALID_INITIAL_STATUS`.

        When `Idempotency-Key` is supplied, the expert stores
        `tenant + key + request hash` in the same transaction as the policy. A
        same-key replay returns the original policy with 200 and
        `Idempotent-Replayed: true`; a different request under the same key is
        409 `IDEMPOTENCY_CONFLICT` with `meta.existingPolicyId`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
