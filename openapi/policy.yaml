openapi: 3.1.0
info:
  title: EIA Policy API
  version: 2.4.0
  summary: Direct-book policy administration and the Policy expert API.
  description: >
    This document describes the implemented public Policy domain API and the
    internal Policy expert API. The authoritative requirement is SPEC 11.2 and
    SPEC 12; the implemented surface is the Round 2 first slice plus the Round 5
    second slice: policy versions, coverage and limits, aggregate erosion,
    endorsements, insureds, locations, cancellation, and reinstatement.

    Round 2 changes that remain on the wire:

    - Lists return the page envelope
      `{items, page, size, total, _links:{self, next, prev}}` with `?page=` and
      `?size=` (default 20, maximum 100). Every second-slice collection uses the
      same envelope.
    - Errors use the canonical RFC 9457 `Problem` body with
      `application/problem+json`, including `type`, `title`, `status`,
      `detail`, `instance`, `code`, `category`, `retryable`, `errors`, `meta`,
      and `correlationId`. The vertical keeps its existing code strings
      (`POLICY_NOT_FOUND`, `CONCURRENT_MODIFICATION`, and so on); migration to
      the `EIA-XXX-NNNN` scheme is tracked in MISMATCHES.md.
    - Detail, create, and mutation responses carry a strong `ETag`
      (`"<version>"`). Mutations accept `If-Match`; a stale value is 409
      `CONCURRENT_MODIFICATION`.
    - Creates accept an optional `Idempotency-Key`. A same-key replay returns
      200 with `Idempotent-Replayed: true`; reusing the key with a different
      request is 409 `IDEMPOTENCY_CONFLICT`.
    - Illegal lifecycle transitions and duplicate policy numbers are 409
      conflicts, not 400 validation errors.

    Round 5 adds the second slice. Documented behaviours:

    - A policy version is immutable and is issued by bind, issue, endorsement,
      cancellation, and reinstatement. `GET /versions/current` re-verifies the
      canonical SHA-256 snapshot hash and reports `hashVerified`.
    - Coverage grants carry their limit schedule, and the aggregate erosion
      ledger is derived from idempotent facts keyed by
      `(limitId, claimId, allocationId, sourceVersion)`.
    - Business-rule rejections are 422 with `category: BUSINESS_RULE` and a
      stable code; a missing approval is 428 with
      `category: APPROVAL_REQUIRED`; stale state and version conflicts are 409.
      Both new statuses are emitted by the domain unchanged from the expert.

    Money remains a flat pair on the policy header (`premiumAmount`/
    `premiumCurrency`, `limitAmount`/`limitCurrency`), while the second-slice
    projections carry one `currency` per row with decimal-string amounts. The
    canonical Money object is defined in schemas/money.schema.json; migration of
    the flat pairs is tracked in MISMATCHES.md.

    The 2026-10-20 billing slice adds the premium installment plan and its
    settlement surface on the public domain API:

    - `GET /api/v1/policies/{policyId}/billing` returns the current plan and its
      ordered installments; `POST` creates the single ACTIVE plan and splits the
      policy premium across 1..24 installments; `PATCH
      .../billing/installments/{installmentId}` settles one installment as PAID
      or WAIVED.
    - A policy has at most one ACTIVE plan. The split preserves the premium
      exactly: the first n-1 amounts are equal and the last one absorbs the
      rounding remainder.
    - `X-EIA-Tenant` is required and a supplied `X-EIA-Book` must be DIRECT.
      Billing writes `policy.billing-plan.created`, `policy.installment.paid`,
      and `policy.installment.waived` in the same transaction as the row change.
      The SPEC route and event naming differences are recorded in MISMATCHES.md
      M-27.

    The 2026-10-20 renewal slice adds the renewal command on the public domain
    API:

    - `POST /api/v1/policies/{policyId}/renew` creates a new DRAFT successor
      term and leaves the source policy unchanged. The successor records the
      predecessor in `renewedFromPolicyId` and inherits the source product,
      insured party, coverages, limit schedules, insureds, and locations.
    - Only an `ISSUED`, `IN_FORCE`, `ENDORSED`, or `REINSTATED` source can be
      renewed; any other status is 409 `RENEWAL_NOT_ALLOWED`. The 201 body is
      the successor `Policy` with its own strong `ETag`, and the command writes
      `policy.policy.renewed` in the same transaction as the new term, its
      children, and its initial version.
    - The SPEC 11.2.6 RENEWED lifecycle transition and the SPEC 11.2.10
      `/api/v1/policy/policies/{policyId}/renew` base path differ from the
      implemented successor-DRAFT lineage and short public path; MISMATCHES.md
      M-01 and M-28 record the deviation.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://policy-domain:8084
    description: Policy domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Policy
    description: Public domain API used by the Policy web remote.
  - name: Policy internal
    description: Internal expert API. Not exposed through the gateway; called only by the Policy domain service.
paths:
  /api/v1/policies:
    get:
      operationId: listPolicies
      tags:
        - Policy
      summary: List policies for the caller's tenant.
      description: >
        Returns the offset page envelope `items`, `page`, `size`, `total`, and
        `_links.self`, `_links.next`, and `_links.prev`. `page` is zero-based
        and defaults to 0; `size` defaults to 20 and must be between 1 and 100.
        `next` is omitted on the last page and `prev` on the first page.
        Filtering from SPEC 11.2.10 and cursor pagination remain planned;
        free-text search is served by `GET /api/v1/policies/search`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of policies for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicy
      tags:
        - Policy
      summary: Create a policy draft.
      description: >
        The policy is always created in DRAFT. The policy number is generated by
        the expert when it is omitted. Premium and limit must be zero or greater
        with at most four fraction digits.

        When `Idempotency-Key` is supplied, the key is scoped to the tenant and
        a retry with the same key and an identical request returns the original
        policy with 200 and `Idempotent-Replayed: true` instead of creating a
        second policy. Reusing the key with a different request is 409
        `IDEMPOTENCY_CONFLICT`. The header is optional for backward
        compatibility, but SPEC 12.6 requires it on transaction submission and
        clients SHOULD send it.

        A duplicate policy number is 409 `DUPLICATE_POLICY_NUMBER`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created in DRAFT.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '200':
          description: >
            Idempotent replay: the same Idempotency-Key and an identical request
            returned the original policy; no new policy was created.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/search:
    get:
      operationId: searchPolicies
      tags:
        - Policy
      summary: Search policies for the caller's tenant and DIRECT book.
      description: >
        Global-search projection used by the shell and by the policy pickers.
        Matching is a case-insensitive contains over `policyNumber` and
        `productCode`; an absent or blank `q` returns the most recently updated
        policies. The response is the shared `SearchResponse` envelope.
        `X-EIA-Book` is required and must be DIRECT; another book is hidden as
        404 `BOOK_SCOPE_VIOLATION` (SPEC 3.6.2). A missing tenant or book or a
        `limit` outside 1-25 is a 400 `application/problem+json` Problem.
      x-search-type: POLICY
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/BookHeaderDirect'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching policies, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}:
    get:
      operationId: getPolicy
      tags:
        - Policy
      summary: Get a policy.
      description: >
        Returns the policy detail with a strong `ETag` derived from the
        aggregate version. Send the ETag back in `If-Match` on the next
        mutation.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy detail.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/status:
    patch:
      operationId: updatePolicyStatus
      tags:
        - Policy
      summary: Advance a policy through its lifecycle.
      description: >
        Applies one transition from the SPEC 11.2.6 table. The status value is
        normalized to upper case; an unknown status is 400 `INVALID_STATUS`.

        Optimistic concurrency: send the strong ETag from the last read in
        `If-Match` (for example `"3"`, or `*`). A present `If-Match` takes
        precedence over the compatibility `expectedVersion` body field. A
        stale tag or version is 409 `CONCURRENT_MODIFICATION` with
        `meta.currentVersion`, `meta.expectedVersion`, and an `errors` entry
        whose code is `STALE_VERSION`. A malformed `If-Match` is 400
        `INVALID_IF_MATCH`. When neither `If-Match` nor `expectedVersion` is
        supplied, the domain service reads the current version and echoes it,
        which does not protect against a concurrent writer; supplying one of
        them is strongly recommended.

        An illegal lifecycle edge, including a no-op transition to the current
        status, is 409 `INVALID_STATUS_TRANSITION` (SPEC 6.11 CONFLICT), not a
        400 validation error. `ISSUED` and `IN_FORCE` are rejected with 422
        `NAMED_INSURED_REQUIRED` when the policy has no ACTIVE named insured.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyStatusRequest'
      responses:
        '200':
          description: Policy after the transition.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/versions:
    get:
      operationId: listPolicyVersions
      tags:
        - Policy
      summary: List the immutable policy versions.
      description: >
        Returns the page envelope ordered by version number. A version is issued
        by bind, issue, endorsement, cancellation, and reinstatement and is
        never updated afterwards; `effectiveTo` is set when a successor
        supersedes it.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of policy versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/versions/current:
    get:
      operationId: getCurrentPolicyVersion
      tags:
        - Policy
      summary: Get the derived current policy version.
      description: >
        Returns the single ISSUED version plus `current` and `hashVerified`.
        `hashVerified` is recomputed from the live policy snapshot on every
        read. A stored hash that no longer matches the snapshot is 409
        `VERSION_HASH_MISMATCH` (the expert's check, re-emitted by the domain
        unchanged); `hashVerified` is false only while the current row is a
        DRAFT version that has not been issued yet.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current version and hash verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentVersion'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/versions/{versionId}:
    get:
      operationId: getPolicyVersion
      tags:
        - Policy
      summary: Get one policy version.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy version snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersion'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/coverages:
    get:
      operationId: listPolicyCoverages
      tags:
        - Policy
      summary: List coverage grants with their limits and erosion state.
      description: >
        Each item is a `CoverageView`: the coverage grant, its limit schedule,
        and the derived limit state. `state` is null only while the limit is
        being created.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of coverage views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageViewPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicyCoverage
      tags:
        - Policy
      summary: Add a coverage grant and its limit schedule.
      description: >
        The coverage window must fall inside the policy term and the limit
        currency must equal the policy premium currency. Adding a coverage to an
        issued policy also issues an endorsement and a policy version. A new
        aggregate-limit row starts with the aggregate (or each-occurrence) amount
        fully available.

        Rejections: 400 for an unknown occurrence basis, coverage part, or
        impact; 409 for a duplicate coverage code, a stale `If-Match`, or a
        reused idempotency key; 422 for an invalid coverage range
        (`INVALID_COVERAGE_RANGE`, `COVERAGE_OUTSIDE_POLICY_TERM`), an invalid
        limit (`INVALID_PER_OCCURRENCE_LIMIT`, `INVALID_AGGREGATE_LIMIT`,
        `LIMIT_EXCEEDS_AGGREGATE`, `DEDUCTIBLE_EXCEEDS_LIMIT`,
        `SUBLIMIT_EXCEEDS_LIMIT`, `INVALID_COINSURANCE`,
        `INVALID_EROSION_BASIS`), or `CURRENCY_MISMATCH`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoverageRequest'
      responses:
        '201':
          description: Coverage and limit created.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageView'
        '200':
          description: Idempotent replay of the same coverage command.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageView'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/limits:
    get:
      operationId: listPolicyLimits
      tags:
        - Policy
      summary: List limit schedules.
      description: >
        Returns the page envelope ordered by coverage sequence. A null
        `aggregateAmount` means the aggregate is explicitly NONE, not missing;
        `erosionBasis` is the basis the derived state uses.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of limit schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/aggregate-state:
    get:
      operationId: listPolicyAggregateState
      tags:
        - Policy
      summary: List the derived aggregate erosion state.
      description: >
        One state row per limit. `remainingAmount = originalAmount +
        reinstatedAmount - incurredAmount + recoveredAmount` (SPEC POL-11);
        `incurredAmount = paidAmount + reservedAmount`; `sourceVersion` is the
        highest erosion fact version applied.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of limit states.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitStatePage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/erosion:
    post:
      operationId: applyPolicyErosion
      tags:
        - Policy
      summary: Apply one idempotent aggregate erosion fact.
      description: >
        Facts are unique by `(limitId, claimId, allocationId, sourceVersion)`.
        The same fact replays with 200 and `Idempotent-Replayed: true`; an older
        fact for a chain that already has a newer one is 409
        `EROSION_STALE_VERSION`; a fact that would take the aggregate negative is
        422 `LIMIT_EXCEEDED` with `meta.availableAmount` and `meta.currency`.
        The response is the newly derived limit state and the policy ETag.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErosionRequest'
      responses:
        '201':
          description: Erosion fact applied; derived state returned.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitState'
        '200':
          description: The same erosion fact or idempotency key replayed.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitState'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '422':
          $ref: './components.yaml#/components/responses/UnprocessableContent'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/endorsements:
    get:
      operationId: listPolicyEndorsements
      tags:
        - Policy
      summary: List endorsements.
      description: Returns the page envelope ordered by endorsement sequence.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: One page of endorsements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndorsementPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicyEndorsement
      tags:
        - Policy
      summary: Endorse a policy.
      description: >
        Every endorsement issues an immutable policy version. The policy must
        already be ISSUED or later (`POLICY_NOT_ISSUED` is 409). The effective
        date must fall before policy expiration; a date before policy inception
        is a backdate and requires `backdateReason` plus `approvedBy` and
        `approvalRef`. A premium delta must use the policy currency.

        Rejections: 400 for an unknown endorsement type or coverage change type;
        409 for a policy that is not issued or a stale ETag; 422 for
