    CreatePolicyRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Money fields
        are decimal strings with at most four fraction digits and must be zero
        or greater.
      required:
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        policyNumber:
          type: string
          maxLength: 32
          description: Optional. Generated as POL-{YEAR}-{7 digits} when omitted.
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreatePolicyRequestInternal:
      type: object
      description: Internal create command accepted by the Policy expert.
      required:
        - tenantId
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          maxLength: 32
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
          description: Optional. Only DRAFT is accepted at creation.
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    UpdatePolicyStatusRequest:
      type: object
      description: >
        Public lifecycle transition command. Send `If-Match` with the ETag from
        the last read; `expectedVersion` is a compatibility fallback for
        clients that do not send the header.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: >
            Optional optimistic version. Ignored when `If-Match` is present.
            Recommended when the header is absent.
        reason:
          type: string
          maxLength: 200
    UpdatePolicyStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Policy expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Ignored when `If-Match` is present.
        reason:
          type: string
          maxLength: 200
    CreateCoverageRequest:
      type: object
      description: >
        Add a coverage grant with its limit schedule. Dates must stay inside the
        policy term and the limit currency must match the policy currency.
      required:
        - coverageCode
        - coverageName
        - coveragePart
        - occurrenceBasis
        - effectiveFrom
        - effectiveTo
        - limit
