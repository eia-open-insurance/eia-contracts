openapi: 3.1.0
info:
  title: EIA Policy API
  version: 2.0.0
  summary: Direct-book policy administration and the Policy expert API.
  description: >
    This document describes the implemented public Policy domain API and the
    internal Policy expert API. The authoritative requirement is SPEC 11.2 and
    SPEC 12; the implemented surface is the first vertical slice, hardened in
    Round 2 as the platform reference.

    Round 2 changes that are visible on the wire:

    - Lists return the page envelope
      `{items, page, size, total, _links:{self, next, prev}}` with `?page=` and
      `?size=` (default 20, maximum 100).
    - Errors use the canonical RFC 9457 `Problem` body with
      `application/problem+json`, including `type`, `title`, `status`,
      `detail`, `instance`, `code`, `category`, `retryable`, `errors`, `meta`,
      and `correlationId`. The vertical keeps its existing code strings
      (`POLICY_NOT_FOUND`, `CONCURRENT_MODIFICATION`, and so on); migration to
      the `EIA-XXX-NNNN` scheme is tracked in MISMATCHES.md.
    - Detail, create, and status responses carry a strong `ETag`
      (`"<version>"`). Status changes accept `If-Match`; a stale value is 409
      `CONCURRENT_MODIFICATION`.
    - Creates accept an optional `Idempotency-Key`. A same-key replay returns
      200 with `Idempotent-Replayed: true`; reusing the key with a different
      request is 409 `IDEMPOTENCY_CONFLICT`.
    - Illegal lifecycle transitions and duplicate policy numbers are 409
      conflicts, not 400 validation errors.

    Money remains a flat pair today: `premiumAmount`/`premiumCurrency` and
    `limitAmount`/`limitCurrency`, with the amount serialized as a decimal
    string. The canonical Money object is defined in
    schemas/money.schema.json; migration of the flat pairs is tracked in
    MISMATCHES.md.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://policy-domain:8084
    description: Policy domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Policy
    description: Public domain API used by the Policy web remote.
  - name: Policy internal
    description: Internal expert API. Not exposed through the gateway; called only by the Policy domain service.
paths:
  /api/v1/policies:
    get:
      operationId: listPolicies
      tags:
        - Policy
      summary: List policies for the caller's tenant.
      description: >
        Returns the offset page envelope `items`, `page`, `size`, `total`, and
        `_links.self`, `_links.next`, and `_links.prev`. `page` is zero-based
        and defaults to 0; `size` defaults to 20 and must be between 1 and 100.
        `next` is omitted on the last page and `prev` on the first page.
        Filtering and free-text search from SPEC 11.2.10 remain planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of policies for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPolicy
      tags:
        - Policy
      summary: Create a policy draft.
      description: >
        The policy is always created in DRAFT. The policy number is generated by
        the expert when it is omitted. Premium and limit must be zero or greater
        with at most four fraction digits.

        When `Idempotency-Key` is supplied, the key is scoped to the tenant and
        a retry with the same key and an identical request returns the original
        policy with 200 and `Idempotent-Replayed: true` instead of creating a
        second policy. Reusing the key with a different request is 409
        `IDEMPOTENCY_CONFLICT`. The header is optional for backward
        compatibility, but SPEC 12.6 requires it on transaction submission and
        clients SHOULD send it.

        A duplicate policy number is 409 `DUPLICATE_POLICY_NUMBER`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created in DRAFT.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '200':
          description: >
            Idempotent replay: the same Idempotency-Key and an identical request
            returned the original policy; no new policy was created.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}:
    get:
      operationId: getPolicy
      tags:
        - Policy
      summary: Get a policy.
      description: >
        Returns the policy detail with a strong `ETag` derived from the
        aggregate version. Send the ETag back in `If-Match` on the next
        mutation.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy detail.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/policies/{policyId}/status:
    patch:
      operationId: updatePolicyStatus
      tags:
        - Policy
      summary: Advance a policy through its lifecycle.
      description: >
        Applies one transition from the SPEC 11.2.6 table. The status value is
        normalized to upper case; an unknown status is 400 `INVALID_STATUS`.

        Optimistic concurrency: send the strong ETag from the last read in
        `If-Match` (for example `"3"`, or `*`). A present `If-Match` takes
        precedence over the compatibility `expectedVersion` body field. A
        stale tag or version is 409 `CONCURRENT_MODIFICATION` with
        `meta.currentVersion`, `meta.expectedVersion`, and an `errors` entry
        whose code is `STALE_VERSION`. A malformed `If-Match` is 400
        `INVALID_IF_MATCH`. When neither `If-Match` nor `expectedVersion` is
        supplied, the domain service reads the current version and echoes it,
        which does not protect against a concurrent writer; supplying one of
        them is strongly recommended.

        An illegal lifecycle edge, including a no-op transition to the current
        status, is 409 `INVALID_STATUS_TRANSITION` (SPEC 6.11 CONFLICT), not a
        400 validation error.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyStatusRequest'
      responses:
        '200':
          description: Policy after the transition.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies:
    get:
      operationId: expertListPolicies
      tags:
        - Policy internal
      summary: List policies for a tenant (expert).
      description: >
        Returns the same page envelope as the public list. `_links` preserve
        the required `tenantId` query parameter and are relative to
        `/internal/v1/policies`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/PageParam'
        - $ref: './components.yaml#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: One page of policies for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreatePolicy
      tags:
        - Policy internal
      summary: Create a policy (expert).
      description: >
        `status` is optional and defaults to DRAFT. Any initial status other
        than DRAFT is rejected with 400 `INVALID_INITIAL_STATUS`.

        When `Idempotency-Key` is supplied, the expert stores
        `tenant + key + request hash` in the same transaction as the policy. A
        same-key replay returns the original policy with 200 and
        `Idempotent-Replayed: true`; a different request under the same key is
        409 `IDEMPOTENCY_CONFLICT` with `meta.existingPolicyId`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequestInternal'
      responses:
        '201':
          description: Policy created.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '200':
          description: Idempotent replay of an earlier create with the same key and request.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
            Idempotent-Replayed:
              $ref: './components.yaml#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}:
    get:
      operationId: expertGetPolicy
      tags:
        - Policy internal
      summary: Get a policy (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Policy detail.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/policies/{policyId}/status:
    patch:
      operationId: expertUpdatePolicyStatus
      tags:
        - Policy internal
      summary: Advance a policy through its lifecycle (expert).
      description: >
        The expert enforces the same transition table and optimistic
        concurrency as the public operation. `If-Match` takes precedence over
        the body `expectedVersion`. A stale version is 409
        `CONCURRENT_MODIFICATION`; an illegal edge is 409
        `INVALID_STATUS_TRANSITION`; a malformed header is 400
        `INVALID_IF_MATCH`.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyStatusRequestInternal'
      responses:
        '200':
          description: Policy after the transition.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Policy:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Policy projection. Detail, create, and status responses carry a strong
        ETag derived from `version`; the body itself does not carry `_links`
        yet.
      required:
        - id
        - tenantId
        - policyNumber
        - productCode
        - insuredPartyId
        - status
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          examples:
            - POL-2026-0000001
        productCode:
          type: string
          maxLength: 32
        insuredPartyId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PolicyStatus'
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
          description: On or after effectiveDate.
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    PolicyStatus:
      type: string
      description: Policy lifecycle status from SPEC 11.2.6.
      enum:
        - DRAFT
        - QUOTED
        - BOUND
        - ISSUED
        - IN_FORCE
        - ENDORSED
        - RENEWED
        - CANCELLED
        - EXPIRED
        - NON_RENEWED
        - REINSTATED
        - VOID
    PolicyPage:
      type: object
      description: >
        One page of the policy list: `items`, `page`, `size`, `total`, and
        `_links.self/next/prev`. The shared `Page` component carries the
        envelope; this schema narrows `items` to `Policy`.
      allOf:
        - $ref: './components.yaml#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Policy'
    CreatePolicyRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Money fields
        are decimal strings with at most four fraction digits and must be zero
        or greater.
      required:
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        policyNumber:
          type: string
          maxLength: 32
          description: Optional. Generated as POL-{YEAR}-{7 digits} when omitted.
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreatePolicyRequestInternal:
      type: object
      description: Internal create command accepted by the Policy expert.
      required:
        - tenantId
        - productCode
        - insuredPartyId
        - effectiveDate
        - expirationDate
        - premiumAmount
        - premiumCurrency
        - limitAmount
        - limitCurrency
      properties:
        tenantId:
          type: string
          format: uuid
        policyNumber:
          type: string
          maxLength: 32
        productCode:
          type: string
          maxLength: 32
          minLength: 1
        insuredPartyId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
          description: Optional. Only DRAFT is accepted at creation.
        effectiveDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        premiumAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        premiumCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        limitAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        limitCurrency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    UpdatePolicyStatusRequest:
      type: object
      description: >
        Public lifecycle transition command. Send `If-Match` with the ETag from
        the last read; `expectedVersion` is a compatibility fallback for
        clients that do not send the header.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: >
            Optional optimistic version. Ignored when `If-Match` is present.
            Recommended when the header is absent.
        reason:
          type: string
          maxLength: 200
    UpdatePolicyStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Policy expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PolicyStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: Ignored when `If-Match` is present.
        reason:
          type: string
          maxLength: 200
x-vertical: policy
