  /api/v1/policies/{policyId}/reinstate:
    post:
      operationId: reinstatePolicy
      tags:
        - Policy
      summary: Reinstate a cancelled policy.
      description: >
        The policy must be CANCELLED and have an ACTIVE cancellation record
        (409 `POLICY_NOT_CANCELLED` otherwise). Approval (`approvedBy`,
        `approvalRef`) and documented premium evidence are mandatory; the
        evidence currency must equal the policy currency. Reinstatement issues a
        REINSTATEMENT version, closes the active cancellation, and moves the
        policy to REINSTATED.

        Rejections: 409 for a policy that is not cancelled or a stale ETag; 422
        for `PREMIUM_EVIDENCE_REQUIRED`, `REINSTATEMENT_OUTSIDE_POLICY_TERM`,
        `REINSTATEMENT_BEFORE_CANCELLATION`, or `CURRENCY_MISMATCH`; 428
        `APPROVAL_REQUIRED` when the approval or approver is missing.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/IfMatch'
        - $ref: './components.yaml#/components/parameters/IdempotencyKey'
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstatePolicyRequest'
      responses:
        '201':
          description: Policy reinstated.
          headers:
            ETag:
              $ref: './components.yaml#/components/headers/ETag'
