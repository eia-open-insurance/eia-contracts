    - repos/eia-policy-expert/src/test/java/com/eia/policy/expert/PolicyControllerTest.java
  errorEnvelope: >
    Canonical RFC 9457 Problem with content type application/problem+json, from
    both the Policy domain and the Policy expert. The vertical keeps its legacy
    code strings rather than the EIA-XXX-NNNN scheme; see MISMATCHES.md M-02.
  notes: >
    Money fields remain flat string pairs. ETag is derived from the aggregate
    version and formatted as a quoted decimal. If-Match and Idempotency-Key are
    optional for backward compatibility even though SPEC 12.6 requires them.
    The list envelope is offset-based (page/size) rather than the SPEC 7.6
    cursor envelope; see MISMATCHES.md M-04.
x-compatibility:
  contractVersion: 2.0.0
  previousContractVersion: 1.0.0
  breaking:
    - List responses changed from a bare JSON array to the page envelope.
    - Error bodies changed from the vertical ApiError to RFC 9457 Problem.
    - Illegal transitions changed from 400 to 409 INVALID_STATUS_TRANSITION.
    - Duplicate policy numbers changed to 409 DUPLICATE_POLICY_NUMBER.
  compatible:
    - ETag, If-Match, Idempotency-Key, and Idempotent-Replayed are additive headers.
    - The 200 idempotent replay response is additive; a fresh create still returns 201.
  note: >
    The HTTP path remains /api/v1/policies because the only consumer, the
    Policy web remote, is updated in the same release. A future external
    consumer that needs the old array or error shape requires a /v2 surface.
