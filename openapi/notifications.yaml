  errorEnvelope: Canonical RFC 9457 Problem envelope with EIA-NTF-9xxx codes.
  notes: >
    The expert returns application/problem+json and the domain translates expert
    failures into the same envelope. Template, channel, and source-linkage rules
    are enforced in NotificationService; the expert normalizes and validates
    NotificationSourceType and owns the both-or-neither pair rule for both the
    create link and the list filter. The exact tenant-scoped `(sourceType,
    sourceId)` list match is the findAllBySource query in NotificationRepository.
    The expert also serves the template routes under
    `/internal/v1/notifications/templates` for direct internal callers; the
    domain uses the public path, so the internal alias is an implementation
    detail and is not documented as a separate public contract. The delivery
    history is served by the expert at
    `/internal/v1/notifications/{notificationId}/attempts` and proxied by the
    domain at `/api/v1/notifications/{notificationId}/attempts`; the expert
    checks that the notification belongs to the tenant before reading the
    tenant-scoped attempt rows, so an unknown or foreign-tenant notification is
    the same 404. The attempt row is written before the notification is marked
    SENT in the same transaction, and the sent event carries `deliveredAt` and
    `providerReference`. The only provider is the `SIMULATOR` implementation of
    `DeliveryProvider`, which always returns the deterministic
    `SIM-<notification uuid>` reference.
