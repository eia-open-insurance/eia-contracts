    NotificationChannel:
      type: string
      description: Delivery channel from SPEC 11.8.5.
      enum:
        - IN_APP
        - EMAIL
        - SMS
        - PUSH
        - WEBHOOK
        - TASK
        - DIGEST
    NotificationStatus:
      type: string
      description: Notification lifecycle status from SPEC 11.8.5.
      enum:
        - CREATED
        - QUEUED
        - SENT
        - DELIVERED
        - READ
        - ACKNOWLEDGED
        - ACTIONED
        - FAILED
        - SUPPRESSED
        - EXPIRED
        - CANCELLED
    NotificationTemplate:
      type: object
      description: >
        Tenant-scoped notification template registry entry. The projection is
        the template identity plus its lifecycle evidence; `tenantId` and the
        effective dates are deliberately not exposed. `approvedBy` and
        `approvedAt` are null until approval and stay as recorded after
        retirement.
      required:
        - id
        - code
        - version
        - channel
        - locale
        - bodyTemplate
        - status
        - approvedBy
        - approvedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
        version:
          type: integer
          minimum: 1
          description: >
            Template version, part of the tenant-local `(code, version, locale)`
            identity. It is not the event aggregate version.
        channel:
          description: >
            Optional delivery channel. Null means the template is
            channel-neutral and can serve any channel; a non-null value is one
            of `NotificationChannel`.
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
        locale:
          type: string
          maxLength: 16
        bodyTemplate:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/NotificationTemplateStatus'
        approvedBy:
          type: [string, 'null']
          format: uuid
        approvedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationTemplateStatus:
      type: string
      description: >
        Notification template lifecycle. A template is created DRAFT, becomes
        ACTIVE only through approval (NTF-14), and is retired when it must no
        longer issue notifications. ACTIVE and RETIRED templates cannot return
        to DRAFT, and RETIRED is terminal.
      enum:
        - DRAFT
        - ACTIVE
        - RETIRED
    CreateNotificationTemplateRequest:
      type: object
      description: >
        Public create command. The tenant comes from `X-EIA-Tenant`; the created
        template is always DRAFT and the lifecycle evidence fields are not
        accepted. The domain command also accepts `body` as an alias of
        `bodyTemplate`. A duplicate
        `(templateCode, templateVersion, locale)` for the tenant is 409
        `TEMPLATE_ALREADY_EXISTS`.
      required:
        - templateCode
        - templateVersion
        - locale
        - bodyTemplate
      properties:
        templateCode:
          type: string
          minLength: 1
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
        channel:
          description: >
            Optional delivery channel. Null or absent means channel-neutral; a
            non-null value is one of `NotificationChannel`.
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
        locale:
          type: string
          minLength: 1
          maxLength: 16
        bodyTemplate:
          type: string
          minLength: 1
    ApproveNotificationTemplateRequest:
      type: object
      description: >
        Approval command. The approver is required audit evidence and is copied
        to the template together with the server-assigned approval instant.
      required:
        - approvedBy
      properties:
        approvedBy:
          type: string
          format: uuid
    CreateNotificationRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Source
        linkage is optional. `sourceType` and `sourceId` are supplied together
        or not at all; a type without an id or an id without a type is 400
        `INVALID_SOURCE_LINKAGE` (`EIA-NTF-9410`). `sourceReference` is
        optional metadata of at most 64 characters and never replaces
        `sourceId`; a reference-only link is accepted. An unknown type is 400
        `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`) and an over-long reference is
        400 `INVALID_SOURCE_REFERENCE` (`EIA-NTF-9411`).
      required:
        - notificationType
        - channel
        - recipientPartyId
        - subject
        - body
      properties:
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientPartyId:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
        templateCode:
          type: string
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
          description: Requires templateCode. Defaults to 1.
        scheduledAt:
          type: string
          format: date-time
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/NotificationSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is supplied;
            null when there is no source link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference (for example
            `CLM-2026-0000001`). Optional metadata; never replaces `sourceId`.
      allOf:
        - description: A sourceType requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                type: string
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/NotificationSourceType'
    CreateNotificationRequestInternal:
      type: object
      description: >
        Internal create command accepted by the Notifications expert. Source
        linkage follows the public rule: `sourceType` and `sourceId` are
        supplied together or not at all, `sourceReference` is optional metadata
        of at most 64 characters, and the expert normalizes the type before
        validation.
      required:
        - tenantId
        - notificationType
        - channel
        - recipientPartyId
        - subject
        - body
      properties:
        tenantId:
          type: string
          format: uuid
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientPartyId:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
        templateCode:
          type: string
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
        scheduledAt:
          type: string
          format: date-time
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/NotificationSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is supplied;
            null when there is no source link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference. Optional metadata; never replaces
            `sourceId`.
      allOf:
        - description: A sourceType requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                type: string
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/NotificationSourceType'
