x-compatibility:
  contractVersion: 1.3.0
  previousContractVersion: 1.2.0
  breaking: []
  compatible:
    - Adds GET and POST /api/v1/notifications/templates for tenant-scoped template listing and DRAFT creation.
    - Adds POST /api/v1/notifications/templates/{id}/approve and POST /api/v1/notifications/templates/{id}/retire.
    - Adds the NotificationTemplate, NotificationTemplateStatus, CreateNotificationTemplateRequest, and ApproveNotificationTemplateRequest schemas.
    - Documents the notifications.template.created, notifications.template.approved, and notifications.template.retired events.
  note: >
    Template administration is additive over 1.2.0: four new operations, four
    new schemas, and three new event names. No existing path, request field,
    response field, or event changes, so a client that never calls the template
    routes is unaffected. The HTTP API version stays /api/v1. The three new
    facts bring the catalog to 215 published and 95 implemented names, with
    Notifications at 15 published and 5 implemented. The SPEC 11.8.10 admin
    path and publish command are replaced by the implemented short route and
    approve/retire commands, recorded in MISMATCHES.md M-49.
