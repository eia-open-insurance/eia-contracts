x-compatibility:
  contractVersion: 1.8.0
  previousContractVersion: 1.7.0
  breaking: []
  compatible:
    - Changes NotificationTemplate.approvedBy from format uuid to a nullable 1-128-character directory identifier.
    - Changes ApproveNotificationTemplateRequest.approvedBy from format uuid to a required 1-128-character directory identifier such as a-adjuster.
    - Documents that the approver is trimmed, must be non-blank and at most 128 characters, and that a rejected value is 400 EIA-NTF-9404 VALIDATION_FAILED with the template left DRAFT.
    - Documents the server-assigned approvedAt and the trimmed approver returned on the 200 projection and carried in data.approvedBy of notifications.template.approved.
  note: >
    The approver change is corrective over 1.7.0. The field was always a JSON
    string, but the contract typed it as a UUID while the implemented column and
    the web approval dialog use a stable directory identifier such as
    `a-adjuster`. The value set widens: a UUID string remains a valid 1-128
    character value, but a generated client that typed approvedBy as a UUID must
    be regenerated to accept directory ids, and a consumer that parses the
    response as a UUID must tolerate a non-UUID string. No path, request field,
    response field, or event name is added or removed, and the HTTP API stays
    /api/v1. asyncapi/notifications.yaml moves to 1.6.0 and keeps
    notifications.template.approved at eventVersion 1 because the payload field
    is still a nullable string. The event catalog stays at 1.39.0 and at 228
    published and 109 implemented names, with Notifications at 15 published and
    5 implemented, because no event name changes. MISMATCHES.md M-49 records the
    SPEC 11.8.7 `approved_by uuid` deviation and the VARCHAR(128)
    implementation.
