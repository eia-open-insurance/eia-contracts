openapi: 3.1.0
info:
  title: EIA Notifications API
  version: 1.8.0
  summary: Notification drafting, delivery, and template administration and the Notifications expert API.
  description: >
    This document describes the implemented public Notifications domain API and
    the internal Notifications expert API. The authoritative requirement is
    SPEC 11.8 and SPEC 12; the implemented surface is the first vertical slice
    plus notification template administration and delivery-attempt history.
    `NotificationType` is the closed
    SPEC 11.8.5 v1 list plus the implemented `DUNNING_NOTICE` dunning escalation
    type.

    The slice supports list, detail, create, send, the delivery-attempt history,
    and the template registry: list with `status`/`code` filters, create DRAFT,
    approve, and retire. Approval is the only path to ACTIVE (NTF-14); a
    template is created DRAFT and may be retired from DRAFT or ACTIVE. SPEC
    11.8.10 mounts template administration at
    `/api/v1/notifications/admin/templates` and names a publish command; the
    implemented short route `/api/v1/notifications/templates` and its
    approve/retire commands are documented here and recorded in MISMATCHES.md
    M-49. Inbox, read and acknowledge, actions, dismiss, unread count, the SSE
    stream, subscriptions, preferences, and the rule, admin-delivery, queue, and
    remaining admin surfaces from SPEC 11.8.10 are planned and listed under
    x-planned-operations.

    The tenant-scoped delivery history is
    `GET /api/v1/notifications/{notificationId}/attempts`, a bare
    `NotificationDeliveryAttempt` array ordered by `attemptNumber` ascending.
    An unknown notification and a notification owned by another tenant are both
    404 `EIA-NTF-9001`, indistinguishable from each other; a known, unsent
    notification returns an empty array. The only implemented provider is the
    local simulator (`SIMULATOR`, selected by
    `eia.notifications.provider=simulator` and also the default): it never
    contacts an external system, always confirms delivery, and returns the
    deterministic reference `SIM-<notification uuid>` as the NTF-11 provider
    idempotency key. A send records attempt 1 and copies the same evidence to
    `deliveredAt` and `providerReference` on the notification. A provider that
    reports failure aborts the send with 502 `DELIVERY_FAILED`
    (`EIA-NTF-9304`) before an attempt row is written. See MISMATCHES.md M-56
    for the difference from the SPEC 11.8.4 `notification_delivery` row and the
    SPEC 11.8.10 admin-delivery and retry routes.

    Notifications already emits the canonical RFC 9457 Problem envelope with
    stable EIA-NTF-9xxx codes and `application/problem+json`.

    A notification may also carry an optional flat source link identifying the
    business record that caused it: `sourceType` classifies the source,
    `sourceId` is its UUID, and `sourceReference` is a human-readable label.
    The type and id are supplied together or not at all, and `sourceReference`
    is optional metadata capped at 64 characters. The tenant-scoped list
    accepts an optional `sourceType` + `sourceId` query pair that returns only
    the notifications linked to one source; half a pair is 400
    `INVALID_SOURCE_FILTER` (`EIA-NTF-9412`), an unknown type is 400
    `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`), and a `sourceId` that is not a UUID
    is 400 `INVALID_ARGUMENT` (`EIA-NTF-9502`). See MISMATCHES.md M-53 for the
    difference from the SPEC 12.5.5 subject EntityRef.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://notifications-domain:8100
    description: Notifications domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Notifications
    description: Public domain API used by the Notifications web remote.
  - name: Notifications internal
    description: Internal expert API. Not exposed through the gateway; called only by the Notifications domain service.
paths:
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags:
        - Notifications
      summary: List notifications for the caller's tenant.
      description: >
        Returns a bare JSON array ordered by `createdAt` newest first, with `id`
        as the tie-break. The optional `sourceType` + `sourceId` pair restricts
        the list to the notifications linked to exactly that source; both must
        be supplied together, and a request that supplies only one is 400
        `INVALID_SOURCE_FILTER` (`EIA-NTF-9412`). `sourceType` is trimmed and
        matched case-insensitively against `NotificationSourceType`, so
        `direct_claim` selects `DIRECT_CLAIM`; an unknown value is 400
        `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`) and is reported before the
        pairing check. Request binding runs first: a `sourceId` that is not a
        UUID is 400 `INVALID_ARGUMENT` (`EIA-NTF-9502`) even when no type is
        supplied. A blank value is treated as absent; supplying neither value
        keeps the unfiltered list. Free-text search is served by
        `GET /api/v1/notifications/search`; inbox filtering is planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: sourceType
          in: query
          required: false
          description: >
            Optional notification-source filter. Must be supplied with
            `sourceId`; half a pair is 400 `INVALID_SOURCE_FILTER`
            (`EIA-NTF-9412`). The value is trimmed and upper-cased before
            validation, so a lower-case value is accepted. A value outside the
            ten-value enum is 400 `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`).
          schema:
            $ref: '#/components/schemas/NotificationSourceType'
        - name: sourceId
          in: query
          required: false
          description: >
            Optional UUID of the source record. Must be supplied with
            `sourceType`; half a pair is 400 `INVALID_SOURCE_FILTER`
            (`EIA-NTF-9412`). A value that is not a UUID is 400
            `INVALID_ARGUMENT` (`EIA-NTF-9502`).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notifications of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createNotification
      tags:
        - Notifications
      summary: Draft a notification.
      description: >
        Creates a notification in CREATED. When `templateCode` is supplied it
        must reference an approved template for the tenant and channel; a
        template version defaults to 1. The optional source link is a complete
        `sourceType` + `sourceId` pair, or neither: an unknown type is 400
        `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`), half a pair is 400
        `INVALID_SOURCE_LINKAGE` (`EIA-NTF-9410`), and a `sourceReference`
        longer than 64 characters is 400 `INVALID_SOURCE_REFERENCE`
        (`EIA-NTF-9411`). The type is trimmed and upper-cased before validation.
        `sourceReference` is optional metadata and never replaces `sourceId`;
        the expert accepts a reference-only link when no type or id is supplied.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/search:
    get:
      operationId: searchNotifications
      tags:
        - Notifications
      summary: Search notifications for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the notification
        links. Matching is a case-insensitive contains over
        `notificationNumber`, `subject`, and `recipientPartyId`; an absent or
        blank `q` returns the most recently updated notifications. The response
        is the shared `SearchResponse` envelope. A missing or malformed
        `X-EIA-Tenant` or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: NOTIFICATION
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching notifications, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/templates:
    get:
      operationId: listNotificationTemplates
      tags:
        - Notifications
      summary: List notification templates for the caller's tenant.
      description: >
        Returns a bare JSON array ordered by `createdAt` newest first, then
        `code` ascending, `version` descending, and `id`. `status` restricts the
        result to one lifecycle state and `code` to one exact template code;
        both are optional, are trimmed, and treat a blank value as absent. The
        tenant is always the `X-EIA-Tenant` header, never a query parameter.
        Templates are tenant-scoped: a row of another tenant is never returned.
        An unknown `status` is 400 `EIA-NTF-9408` `INVALID_TEMPLATE_STATUS`; a
        missing or malformed `X-EIA-Tenant` is 400 `EIA-NTF-9501` or
        `EIA-NTF-9502`. Every error body is `application/problem+json`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: status
          in: query
          required: false
          description: >
            Optional exact lifecycle filter. A value outside DRAFT, ACTIVE, and
            RETIRED is 400 `INVALID_TEMPLATE_STATUS`.
          schema:
            $ref: '#/components/schemas/NotificationTemplateStatus'
        - name: code
          in: query
          required: false
          description: Optional exact template code filter, at most 64 characters.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Templates of the tenant matching the filters.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createNotificationTemplate
      tags:
        - Notifications
      summary: Create a notification template in DRAFT.
      description: >
        Creates a template in DRAFT. `status`, `approvedBy`, and `approvedAt`
        are never accepted from the caller: activation is the separate approval
        command (NTF-14). The unique key is
        `(tenant, templateCode, templateVersion, locale)`; a duplicate is 409
        `TEMPLATE_ALREADY_EXISTS` (`EIA-NTF-9205`) with no row and no event.
        `templateVersion` must be at least 1 (400 `EIA-NTF-9405`
        `INVALID_TEMPLATE_VERSION`); a non-blank `channel` must be one of
        `NotificationChannel` (400 `EIA-NTF-9401` `INVALID_CHANNEL`).
        `templateCode`, `locale`, and `bodyTemplate` are required and trimmed,
        with `templateCode` at most 64 characters and `locale` at most 16. A
        rejected body is 400 `EIA-NTF-9404` `VALIDATION_FAILED` with per-field
        details. An accepted create returns 201 with the DRAFT template and
        writes `notifications.template.created` to the transactional outbox in
        the same transaction as the insert.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationTemplateRequest'
      responses:
        '201':
          description: DRAFT template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          description: >
            409. `TEMPLATE_ALREADY_EXISTS` (`EIA-NTF-9205`): a template with the
            same `templateCode`, `templateVersion`, and `locale` already exists
            for the tenant. The unique key is the authority, so a concurrent
            duplicate also maps here. No row and no event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/templates/{id}/approve:
    post:
      operationId: approveNotificationTemplate
      tags:
        - Notifications
      summary: Approve a DRAFT notification template.
      description: >
        Moves a DRAFT template to ACTIVE and records the approver and the
        server-assigned approval instant in `approvedBy` and `approvedAt`.
        `approvedBy` is required and is a stable directory identifier such as
        `a-adjuster`, not a UUID: the value is trimmed and must be 1-128
        characters, so an absent, blank, or over-long approver is 400
        `EIA-NTF-9404` `VALIDATION_FAILED` and the template stays DRAFT.
        Approval is the only path to ACTIVE (NTF-14). A template that is
        already ACTIVE is 409 `TEMPLATE_ALREADY_ACTIVE` (`EIA-NTF-9206`); any
        other non-DRAFT status is 409 `TEMPLATE_STATUS_CONFLICT`
        (`EIA-NTF-9207`); a concurrent change that loses the conditional update
        is the same 409 `TEMPLATE_STATUS_CONFLICT`. A template outside the
        caller's tenant is 404, indistinguishable from a missing template. An
        accepted approval returns 200 with the ACTIVE template, carrying the
        trimmed approver, and writes `notifications.template.approved` in the
        same transaction; a rejected command writes no status change and no
        event.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveNotificationTemplateRequest'
      responses:
        '200':
          description: Template after approval; status is ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `TEMPLATE_ALREADY_ACTIVE` (`EIA-NTF-9206`) when the template is
            already ACTIVE, or `TEMPLATE_STATUS_CONFLICT` (`EIA-NTF-9207`) when
            it is RETIRED or changed concurrently. No status change and no
            event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/templates/{id}/retire:
    post:
      operationId: retireNotificationTemplate
      tags:
        - Notifications
      summary: Retire a DRAFT or ACTIVE notification template.
      description: >
        Moves a DRAFT or ACTIVE template to RETIRED so it can no longer issue
        notifications (NTF-14). The command has no request body and does not
        clear `approvedBy` or `approvedAt`, so the approval evidence stays on
        the retired row. A template that is already RETIRED, or whose status is
        not DRAFT or ACTIVE, is 409 `TEMPLATE_STATUS_CONFLICT`
        (`EIA-NTF-9207`); a concurrent change that loses the conditional update
        is the same 409. A template outside the caller's tenant is 404,
        indistinguishable from a missing template. An accepted retirement
        returns 200 with the RETIRED template and writes
        `notifications.template.retired` in the same transaction; a rejected
        command writes no status change and no event.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template after retirement; status is RETIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplate'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          description: >
            409. `TEMPLATE_STATUS_CONFLICT` (`EIA-NTF-9207`): the template is
            already RETIRED or changed concurrently. No status change and no
            event is written.
          content:
            application/problem+json:
              schema:
                $ref: './components.yaml#/components/schemas/Problem'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/{notificationId}:
    get:
      operationId: getNotification
      tags:
        - Notifications
      summary: Get a notification.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/{notificationId}/attempts:
    get:
      operationId: listNotificationDeliveryAttempts
      tags:
        - Notifications
      summary: List the delivery attempts of a notification.
      description: >
        Returns a bare JSON array ordered by `attemptNumber` ascending. Each row
        is one provider delivery attempt on the notification's channel; the
        implemented slice records attempt 1 on a successful send and has no
        retry command, so the history is empty before the notification is sent
        and holds exactly one row afterwards. `attemptNumber` is unique per
        notification.

        The notification must exist in the caller's tenant. An unknown
        notification and a notification owned by another tenant are both 404
        `EIA-NTF-9001` `NOT_FOUND`, indistinguishable from each other; attempts
        of a foreign tenant are never returned. A known, unsent notification
        returns an empty array rather than 404. A missing `X-EIA-Tenant` is 400
        `EIA-NTF-9501`, a malformed tenant 400 `EIA-NTF-9502`, and a
        `notificationId` that is not a UUID 400 `EIA-NTF-9503`
        `INVALID_ARGUMENT`.

        The only implemented provider is the local simulator (`SIMULATOR`),
        selected by `eia.notifications.provider=simulator` and also the default
        when the property is absent. It never contacts an external system,
        always confirms delivery with attempt status `DELIVERED`, and returns
        the deterministic reference `SIM-<notification uuid>` on both the
        attempt and the notification. That reference is the NTF-11 provider
        idempotency key and is reused by a retry. A provider that reports
        failure aborts the send with 502 `DELIVERY_FAILED` (`EIA-NTF-9304`)
        before an attempt row is written, so the `FAILED` attempt status is
        admitted by the schema but is not produced by this slice. `attemptedAt`
        is the send instant, and the notification's `deliveredAt` is the same
        instant for a simulator delivery.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery attempts of the notification, ordered by attempt number.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDeliveryAttempt'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/notifications/{notificationId}/send:
    post:
      operationId: sendNotification
      tags:
        - Notifications
      summary: Send a drafted notification.
      description: >
        Only CREATED or QUEUED notifications can be sent. An approved template
        is required (NTF-01, NTF-14). The send instant must not precede
        `scheduledAt`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification after sending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/notifications:
    get:
      operationId: expertListNotifications
      tags:
        - Notifications internal
      summary: List notifications for a tenant (expert).
      description: >
        Returns a bare JSON array ordered by `createdAt` newest first, with `id`
        as the tie-break. `tenantId` is required. The optional `sourceType` +
        `sourceId` pair restricts the list to the notifications linked to
        exactly that source; both must be supplied together, and a request that
        supplies only one is 400 `INVALID_SOURCE_FILTER` (`EIA-NTF-9412`). The
        type is trimmed and upper-cased before validation, and an unknown value
        is 400 `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`). Request binding runs
        first: a `sourceId` that is not a UUID is 400 `INVALID_ARGUMENT`
        (`EIA-NTF-9502`) even when no type is supplied. A blank value is
        treated as absent; supplying neither value keeps the unfiltered list.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: sourceType
          in: query
          required: false
          description: >
            Optional notification-source filter. Must be supplied with
            `sourceId`; half a pair is 400 `INVALID_SOURCE_FILTER`
            (`EIA-NTF-9412`). The value is trimmed and upper-cased before
            validation. A value outside the ten-value enum is 400
            `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`).
          schema:
            $ref: '#/components/schemas/NotificationSourceType'
        - name: sourceId
          in: query
          required: false
          description: >
            Optional UUID of the source record. Must be supplied with
            `sourceType`; half a pair is 400 `INVALID_SOURCE_FILTER`
            (`EIA-NTF-9412`). A value that is not a UUID is 400
            `INVALID_ARGUMENT` (`EIA-NTF-9502`).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notifications of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreateNotification
      tags:
        - Notifications internal
      summary: Draft a notification (expert).
      description: >
        Drafts a notification for the tenant in the body. The optional source
        link follows the public rule: `sourceType` and `sourceId` are supplied
        together or not at all, and `sourceReference` is optional metadata of at
        most 64 characters. The expert normalizes the type, rejects an unknown
        value with 400 `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`), rejects half a
        pair with 400 `INVALID_SOURCE_LINKAGE` (`EIA-NTF-9410`), and rejects an
        over-long reference with 400 `INVALID_SOURCE_REFERENCE`
        (`EIA-NTF-9411`).
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequestInternal'
      responses:
        '201':
          description: Notification created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/notifications/{notificationId}:
    get:
      operationId: expertGetNotification
      tags:
        - Notifications internal
      summary: Get a notification (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/notifications/{notificationId}/attempts:
    get:
      operationId: expertListNotificationDeliveryAttempts
      tags:
        - Notifications internal
      summary: List the delivery attempts of a notification (expert).
      description: >
        Returns a bare JSON array ordered by `attemptNumber` ascending. The
        notification lookup is the tenant wall: an unknown notification and a
        notification owned by another tenant are both 404 `EIA-NTF-9001`
        `NOT_FOUND`, and no attempt row of another tenant is ever returned. A
        known, unsent notification returns an empty array. `tenantId` is
        required; a missing value is 400 `EIA-NTF-9501`, and a malformed
        `tenantId` or `notificationId` is 400 `EIA-NTF-9502`
        `INVALID_ARGUMENT`.

        The expert records one attempt per send with the configured provider.
        The default simulator (`SIMULATOR`) always confirms delivery with status
        `DELIVERED` and the deterministic reference `SIM-<notification uuid>`,
        which is the NTF-11 provider idempotency key. A provider failure is 502
        `DELIVERY_FAILED` (`EIA-NTF-9304`) and writes no attempt row.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Delivery attempts of the notification, ordered by attempt number.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationDeliveryAttempt'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/notifications/{notificationId}/send:
    post:
      operationId: expertSendNotification
      tags:
        - Notifications internal
      summary: Send a drafted notification (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification after sending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Notification:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Notification projection. The SPEC 12.5.5 representation carries
        category, severity, subject EntityRef, body, requiresAction, dueAt,
        actions[], and _links; those are planned. The implemented projection
        also carries an optional flat source link (`sourceType`, `sourceId`,
        `sourceReference`) to the business record that caused the notification;
        all three are null when there is no link. See MISMATCHES.md M-53. The
        provider delivery evidence `deliveredAt` and `providerReference` is
        recorded by the send; both are null until a send succeeds and stay null
        on rows that predate the delivery provider. See MISMATCHES.md M-56.
      required:
        - id
        - tenantId
        - notificationNumber
        - notificationType
        - channel
        - status
        - recipientPartyId
        - subject
        - body
        - templateCode
        - templateVersion
        - scheduledAt
        - sentAt
        - deliveredAt
        - providerReference
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        notificationNumber:
          type: string
          examples:
            - NTF-2026-0000001
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        status:
          $ref: '#/components/schemas/NotificationStatus'
        recipientPartyId:
          type: string
          format: uuid
        subject:
          type: string
          maxLength: 300
        body:
          type: string
        templateCode:
          type: [string, 'null']
          maxLength: 64
        templateVersion:
          type: [integer, 'null']
          minimum: 1
        scheduledAt:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
          description: >
            Provider-confirmed delivery instant recorded on the notification by
            the send that succeeded. For the `SIMULATOR` provider it equals
            `sentAt`; null before the first send and on rows that predate
            delivery evidence.
        providerReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Provider reference/idempotency key of the delivery, for example
            `SIM-<notification uuid>` for the `SIMULATOR` provider. The same
            value is returned on the matching `NotificationDeliveryAttempt` and
            reused by a retry (NTF-11). Null before the first send and on rows
            that predate delivery evidence.
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/NotificationSourceType'
            - type: 'null'
          description: >
            Source classification, or null when the notification has no source
            link.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source direct claim, assumed claim, policy, contract,
            payment, cession, retrocession, document, or party when `sourceType`
            is present; null when there is no link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference (for example `CLM-2026-0000001`).
            Optional metadata; it never replaces `sourceId` for a classified
            source.
    NotificationSourceType:
      type: string
      description: >
        Source record type for the optional notification source link. Every
        non-null type requires a `sourceId`; the whole link is optional, so a
        notification can exist with no source at all. `DIRECT_CLAIM`,
        `ASSUMED_CLAIM`, `POLICY`, `CONTRACT`, and `PAYMENT` classify the first
        five implemented sources; `CESSION`, `RETROCESSION`, `DOCUMENT`, and
        `PARTY` extend the set to the other implemented business records. The
        type is trimmed and upper-cased before validation, and an unknown value
        is 400 `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`). `OTHER` is the
        unclassified escape hatch and stays last, but it still requires a
        `sourceId` when it is supplied.
      enum:
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - POLICY
        - CONTRACT
        - PAYMENT
        - CESSION
        - RETROCESSION
        - DOCUMENT
        - PARTY
        - OTHER
    NotificationType:
      type: string
      description: >
        Notification type from the SPEC 11.8.5 v1 list, plus the implemented
        `DUNNING_NOTICE` escalation type, as enforced by the expert. The set is
        closed: an unknown value is 400 `EIA-NTF-9403`
        `INVALID_NOTIFICATION_TYPE`, and an added type is an additive minor
        change (SPEC 10.4).
      enum:
        - NEW_CLAIM_NOTICE
        - CLAIM_ASSIGNED
        - CLAIM_REASSIGNED
        - CLAIM_RESERVE_CHANGED
        - CLAIM_RESERVE_AUTHORITY_REQUEST
        - CLAIM_SETTLEMENT_AUTHORITY_REQUEST
        - CLAIM_COVERAGE_TENDER
        - CLAIM_LARGE_LOSS
        - CLAIM_SLA_BREACH
        - CLAIM_DIARY_DUE
        - CLAIM_SOL_ALERT
        - CLAIM_CLOSED
        - CLAIM_REOPENED
        - CLAIM_MEDICAL_CRITERIA_INCOMPLETE
        - CLAIM_PFS_MISSING
        - CLAIM_LIEN_DEADLINE
        - CLAIM_TRUST_BAR_DATE
        - CLAIM_MMSEA_REPORTING_DUE
        - POLICY_BOUND
        - POLICY_ISSUED
        - POLICY_ENDORSED
        - POLICY_CANCELLED
        - POLICY_REINSTATED
        - POLICY_RENEWAL_DUE
        - POLICY_EXPIRING
        - POLICY_NON_RENEWAL
        - POLICY_PREMIUM_AUDIT_DUE
        - POLICY_MASS_TORT_PROFILE_REVIEW
        - POLICY_AGGREGATE_THRESHOLD
        - CONTRACT_BOUND
        - CONTRACT_SIGNED
        - CONTRACT_EXPIRING
        - CONTRACT_ENDORSED
        - BORDEREAU_RECEIVED
        - BORDEREAU_POSTED
        - BORDEREAU_REJECTED
        - BORDEREAU_EXCEPTIONS
        - TECHNICAL_ACCOUNT_ISSUED
        - TECHNICAL_ACCOUNT_DISPUTED
        - CASH_CALL_ISSUED
        - SECURITY_EXPIRING
        - SECURITY_BREACH
        - COMMUTATION_REQUEST
        - COMMUTATION_APPROVED
        - LOSS_ADVICE_RECEIVED
        - LARGE_LOSS_NOTICE
        - CLAIMS_AUDIT_SCHEDULED
        - PAYMENT_AUTHORITY_REQUEST
        - PAYMENT_APPROVED
        - PAYMENT_REJECTED
        - PAYMENT_SUBMITTED
        - PAYMENT_PAID
        - PAYMENT_FAILED
        - PAYMENT_RETURNED
        - PAYMENT_DUPLICATE_SUSPECTED
        - RECONCILIATION_EXCEPTION
        - SAP_POSTING_FAILED
        - ESCHEATMENT_DUE
        - DUNNING_NOTICE
        - NEW_DOCUMENT_UPLOAD
        - DOCUMENT_ASSOCIATED
        - DOCUMENT_REQUEST
        - DOCUMENT_OVERDUE
        - DOCUMENT_LEGAL_HOLD
        - DOCUMENT_DISPOSITION
        - DOCUMENT_PROCESSING_FAILED
        - PARTY_CREATED
        - PARTY_MERGED
        - PARTY_SANCTIONS_HIT
        - PARTY_SCREENING_COMPLETE
        - PARTY_BANK_ACCOUNT_CHANGED
        - SANCTIONS_HIT
        - BREAK_GLASS_USED
        - ACCESS_REVIEW_DUE
        - DATA_QUALITY_ISSUE
        - AUDIT_CHAIN_FAILURE
        - APPROVAL_REQUEST
        - APPROVAL_DECIDED
        - TASK_ASSIGNED
        - MENTION
        - COMMENT_ADDED
        - INTEGRATION_OUTAGE
        - JOB_FAILED
        - SLA_BREACH
    NotificationChannel:
      type: string
      description: Delivery channel from SPEC 11.8.5.
      enum:
        - IN_APP
        - EMAIL
        - SMS
        - PUSH
        - WEBHOOK
        - TASK
        - DIGEST
    NotificationStatus:
      type: string
      description: Notification lifecycle status from SPEC 11.8.5.
      enum:
        - CREATED
        - QUEUED
        - SENT
        - DELIVERED
        - READ
        - ACKNOWLEDGED
        - ACTIONED
        - FAILED
        - SUPPRESSED
        - EXPIRED
        - CANCELLED
    NotificationDeliveryAttempt:
      type: object
      description: >
        One provider delivery attempt for a notification on one channel. Attempt
        numbers are sequential per notification and unique together with
        `notificationId`. The implemented slice records the single attempt made
        by a successful send; it has no retry command, so one sent notification
        has one attempt. `providerReference` is the provider idempotency key and
        is populated on a delivered attempt; `errorCode` and `errorMessage` are
        populated only for a failed attempt (SPEC 11.8.4, NTF-11). Delivery
        metadata is retained for 7 years (NTF-15). See MISMATCHES.md M-56 for
        the difference from the SPEC `notification_delivery` row.
      required:
        - id
        - tenantId
        - notificationId
        - attemptNumber
        - channel
        - provider
        - providerReference
        - status
        - errorCode
        - errorMessage
        - attemptedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        notificationId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
          minimum: 1
          description: >
            Sequential attempt number within the notification. The first
            implemented send records 1, and `(notificationId, attemptNumber)` is
            unique.
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        provider:
          type: string
          maxLength: 32
          examples:
            - SIMULATOR
          description: >
            Provider code persisted on the attempt. The implemented provider is
            the local `SIMULATOR`; a deployment can replace it through the
            delivery-provider abstraction.
        providerReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Provider reference and idempotency key, for example
            `SIM-<notification uuid>` for the `SIMULATOR`. It matches the
            notification's `providerReference` for the latest attempt and is
            reused by a retry (NTF-11); null when the provider returned no
            reference.
        status:
          $ref: '#/components/schemas/NotificationDeliveryAttemptStatus'
        errorCode:
          type: [string, 'null']
          maxLength: 64
          description: >
            Provider error code for a `FAILED` attempt; null for a delivered
            attempt.
        errorMessage:
          type: [string, 'null']
          maxLength: 500
          description: >
            Provider error text for a `FAILED` attempt; null for a delivered
            attempt.
        attemptedAt:
          type: string
          format: date-time
          description: >
            Instant the attempt was made. The send records the same instant as
            the notification's `sentAt`.
    NotificationDeliveryAttemptStatus:
      type: string
      description: >
        Outcome of one delivery attempt. `DELIVERED` means the provider
        confirmed delivery; `FAILED` means the provider rejected it and the
        attempt carries the error code and message. The implemented
        `SIMULATOR` always returns `DELIVERED`; a failing provider currently
        aborts the send with 502 `DELIVERY_FAILED` before an attempt row is
        written, so no `FAILED` attempt is produced by this slice.
      enum:
        - DELIVERED
        - FAILED
    NotificationTemplate:
      type: object
      description: >
        Tenant-scoped notification template registry entry. The projection is
        the template identity plus its lifecycle evidence; `tenantId` and the
        effective dates are deliberately not exposed. `approvedBy` is null
        until approval; when present it is the trimmed directory identifier of
        the approver (for example `a-adjuster`), not a UUID. `approvedBy` and
        `approvedAt` stay as recorded after retirement.
      required:
        - id
        - code
        - version
        - channel
        - locale
        - bodyTemplate
        - status
        - approvedBy
        - approvedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          maxLength: 64
        version:
          type: integer
          minimum: 1
          description: >
            Template version, part of the tenant-local `(code, version, locale)`
            identity. It is not the event aggregate version.
        channel:
          description: >
            Optional delivery channel. Null means the template is
            channel-neutral and can serve any channel; a non-null value is one
            of `NotificationChannel`.
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
        locale:
          type: string
          maxLength: 16
        bodyTemplate:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/NotificationTemplateStatus'
        approvedBy:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          description: >
            Trimmed directory identifier of the approver, for example
            `a-adjuster`; null until approval. It is not a UUID.
        approvedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationTemplateStatus:
      type: string
      description: >
        Notification template lifecycle. A template is created DRAFT, becomes
        ACTIVE only through approval (NTF-14), and is retired when it must no
        longer issue notifications. ACTIVE and RETIRED templates cannot return
        to DRAFT, and RETIRED is terminal.
      enum:
        - DRAFT
        - ACTIVE
        - RETIRED
    CreateNotificationTemplateRequest:
      type: object
      description: >
        Public create command. The tenant comes from `X-EIA-Tenant`; the created
        template is always DRAFT and the lifecycle evidence fields are not
        accepted. The domain command also accepts `body` as an alias of
        `bodyTemplate`. A duplicate
        `(templateCode, templateVersion, locale)` for the tenant is 409
        `TEMPLATE_ALREADY_EXISTS`.
      required:
        - templateCode
        - templateVersion
        - locale
        - bodyTemplate
      properties:
        templateCode:
          type: string
          minLength: 1
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
        channel:
          description: >
            Optional delivery channel. Null or absent means channel-neutral; a
            non-null value is one of `NotificationChannel`.
          oneOf:
            - $ref: '#/components/schemas/NotificationChannel'
            - type: 'null'
        locale:
          type: string
          minLength: 1
          maxLength: 16
        bodyTemplate:
          type: string
          minLength: 1
    ApproveNotificationTemplateRequest:
      type: object
      description: >
        Approval command. The approver is required audit evidence: a stable
        directory identifier such as `a-adjuster`, not a UUID, supplied as
        1-128 characters and recorded trimmed. It is copied to the template
        together with the server-assigned approval instant. The value is stored
        as supplied after trimming and is not resolved against a directory
        service.
      required:
        - approvedBy
      properties:
        approvedBy:
          type: string
          minLength: 1
          maxLength: 128
          description: >
            Stable directory identifier of the approver, for example
            `a-adjuster`; trimmed and required. It is not a UUID.
    CreateNotificationRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Source
        linkage is optional. `sourceType` and `sourceId` are supplied together
        or not at all; a type without an id or an id without a type is 400
        `INVALID_SOURCE_LINKAGE` (`EIA-NTF-9410`). `sourceReference` is
        optional metadata of at most 64 characters and never replaces
        `sourceId`; a reference-only link is accepted. An unknown type is 400
        `INVALID_SOURCE_TYPE` (`EIA-NTF-9409`) and an over-long reference is
        400 `INVALID_SOURCE_REFERENCE` (`EIA-NTF-9411`).
      required:
        - notificationType
        - channel
        - recipientPartyId
        - subject
        - body
      properties:
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientPartyId:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
        templateCode:
          type: string
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
          description: Requires templateCode. Defaults to 1.
        scheduledAt:
          type: string
          format: date-time
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/NotificationSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is supplied;
            null when there is no source link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference (for example
            `CLM-2026-0000001`). Optional metadata; never replaces `sourceId`.
      allOf:
        - description: A sourceType requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                type: string
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/NotificationSourceType'
    CreateNotificationRequestInternal:
      type: object
      description: >
        Internal create command accepted by the Notifications expert. Source
        linkage follows the public rule: `sourceType` and `sourceId` are
        supplied together or not at all, `sourceReference` is optional metadata
        of at most 64 characters, and the expert normalizes the type before
        validation.
      required:
        - tenantId
        - notificationType
        - channel
        - recipientPartyId
        - subject
        - body
      properties:
        tenantId:
          type: string
          format: uuid
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientPartyId:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 300
        body:
          type: string
          minLength: 1
        templateCode:
          type: string
          maxLength: 64
        templateVersion:
          type: integer
          minimum: 1
        scheduledAt:
          type: string
          format: date-time
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/NotificationSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is supplied;
            null when there is no source link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference. Optional metadata; never replaces
            `sourceId`.
      allOf:
        - description: A sourceType requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                type: string
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/NotificationSourceType'
