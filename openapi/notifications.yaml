x-compatibility:
  contractVersion: 1.5.0
  previousContractVersion: 1.4.0
  breaking: []
  compatible:
    - Adds optional sourceType and sourceId query filters to GET /api/v1/notifications and GET /internal/v1/notifications, with the both-or-neither 400 INVALID_SOURCE_FILTER (EIA-NTF-9412), the unknown-type 400 INVALID_SOURCE_TYPE (EIA-NTF-9409), and the malformed-sourceId 400 INVALID_ARGUMENT (EIA-NTF-9502) behaviour.
    - The 200 response stays a bare JSON array of the unchanged Notification projection; a caller that omits both parameters keeps the unfiltered list.
  note: >
    The list source filter is additive over 1.4.0: two optional query parameters
    on an existing operation, no new path, required field, response member, or
    event name. The HTTP API version stays /api/v1, asyncapi/notifications.yaml
    stays 1.3.0, and the event catalog stays at 218 published and 99 implemented
    names, with Notifications at 15 published and 5 implemented, because no
    event name changes. MISMATCHES.md M-53 records the flat source link, the
    exact-pair filter, and the malformed-sourceId code against the SPEC 12.5.5
    subject EntityRef.
