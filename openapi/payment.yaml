  errorEnvelope: >
    Vertical-specific ApiError {timestamp, status, code, message, path,
    details[{field, message}]}. Not the canonical Problem envelope yet.
  notes: >
    The public API exposes the generic PATCH /api/v1/payments/{paymentId}/status
    route in addition to the four named actions (submit, authorize, approve,
    and issue). Both surfaces forward to the expert's status command and keep
    its 400/404/409 problems; the expert owns the transition graph (including
    the SUBMITTED/ACCEPTED -> FAILED retries, PROCESSING -> PARTIALLY_PAID, and
    the CANCELLED/VOID escape edges), the approval gate, and the version check.
    The expert also trims and persists the optional status reason and returns
    it as the required-but-nullable Payment.statusReason; a status change
    without a reason clears it, and the named actions supply their own reason
    text. Amount is a decimal string but not yet the Money object.
    Source linkage is optional and denormalized: the payment stores a classified
    source type, its UUID, and a human reference instead of embedding the claim
    or policy. The tenant-scoped list forwards an optional sourceType + sourceId
    pair to the expert, which owns the closed-set and pairing validation, so the
    public route preserves the expert's 400 code and message. Allocations are
    append-only child rows owned by the expert: the domain forwards the tenant
    and normalizes the read model, the expert enforces the payment currency, the
    status gate (CANCELLED/REVERSED/FAILED are 409 PAYMENT_NOT_ALLOCATABLE), and
    the overallocation guard (409 ALLOCATION_EXCEEDS_PAYMENT). The expert also
    serves the same allocation path plus an /internal/v1 alias that the domain
    calls; the alias is an implementation detail and is not part of this public
    contract. See MISMATCHES.md M-12, M-24, M-35, and M-46.
x-compatibility:
  contractVersion: 1.6.0
  previousContractVersion: 1.5.0
  breaking: []
  compatible:
    - Adds the required-but-nullable 200-character Payment.statusReason.
    - Documents the latest status reason semantics, including the trim, replace, clear, and named-action behaviour.
  note: >
    Status reason is additive over 1.5.0: the Payment projection gains one
    always-present member, and no path, request field, event, or existing
    response field changes. A caller that ignores unknown response members is
    unaffected. The member is null for a payment that has never changed status
    and after a change without a reason.
