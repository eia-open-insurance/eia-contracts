    The public API exposes four named actions rather than the PATCH status route
    of the expert. Amount is a decimal string but not yet the Money object.
    Source linkage is optional and denormalized: the payment stores a classified
    source type, its UUID, and a human reference instead of embedding the claim
    or policy. The tenant-scoped list forwards an optional sourceType + sourceId
    pair to the expert, which owns the closed-set and pairing validation, so the
    public route preserves the expert's 400 code and message. See MISMATCHES.md
    M-12 and M-24.
