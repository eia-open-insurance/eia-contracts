openapi: 3.1.0
info:
  title: EIA Payment API
  version: 1.6.0
  summary: Payment instruction administration and the Payment expert API.
  description: >
    This document describes the implemented public Payment domain API and the
    internal Payment expert API. The authoritative requirement is SPEC 11.7
    and SPEC 12; the implemented surface is the first vertical slice.

    The public slice exposes create, read, the generic lifecycle transition at
    `PATCH /api/v1/payments/{paymentId}/status`, and four lifecycle actions:
    submit, authorize, approve, and issue. The internal route exposes the same
    general status transition. The approval gate from SPEC 11.7.7 is enforced:
    SUBMITTED and later execution states are unreachable before APPROVED. The
    status operation lists the implemented transition graph and its terminal
    statuses.

    Every payment returns the latest status reason as `statusReason`. It is the
    trimmed `reason` supplied with the most recent accepted status change,
    whether through the status PATCH or one of the named actions (which supply
    their own text). Each accepted change replaces the previous value, and a
    change without a reason clears it, so the member describes the current
    status only and is not a status history. A payment that has never changed
    status returns null.

    A payment may optionally link to the business record it disburses through
    `sourceType`/`sourceId`/`sourceReference`. `sourceType` is DIRECT_CLAIM,
    ASSUMED_CLAIM, POLICY, or OTHER. The three classified types require a
    `sourceId` (the UUID of the claim or policy); OTHER may carry only the
    human `sourceReference`. A `sourceId` is never accepted without a
    `sourceType`. The reference is denormalized on the payment so lists and
    record views can render and link the source without an N+1 lookup; the
    full SPEC 11.7.4 `claim_id`/`claim_number` projection remains planned
    (MISMATCHES.md M-12 and M-24).

    The tenant-scoped list accepts an optional `sourceType` + `sourceId` pair
    that returns only the payments linked to one source. The two values are
    required together: an unknown source type is 400 `INVALID_SOURCE_TYPE`, and
    half a pair is 400 `INVALID_SOURCE_FILTER`.

    A payment may be split across the claim or policy target and financial
    component it settles. The allocation routes list the split rows with the
    payment reconciliation totals and append a new split. An allocation is
    always in the payment's own currency, is append-only, and may not take the
    sum of a payment's allocations above the payment amount.

    Amounts are decimal strings (SPEC 10.3) on this vertical, but they are flat
    `amount`/`currency` fields rather than the canonical Money object; see
    MISMATCHES.md. The Payment domain and expert emit the vertical ApiError
    body rather than the canonical Problem envelope.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://gateway.eia-open-insurance.example
    description: Public gateway (`/api/v1`).
  - url: http://payment-domain:8098
    description: Payment domain service (platform network).
security:
  - sessionCookie: []
tags:
  - name: Payment
    description: Public domain API used by the Payment web remote and other domain services.
  - name: Payment internal
    description: Internal expert API. Not exposed through the gateway; called only by the Payment domain service.
paths:
  /api/v1/payments:
    get:
      operationId: listPayments
      tags:
        - Payment
      summary: List payments for the caller's tenant.
      description: >
        Returns a bare JSON array ordered by `createdAt` newest first, with
        `paymentNumber` as the tie-break. The optional `sourceType` +
        `sourceId` pair restricts the list to the payments linked to exactly
        that source; the two parameters must be supplied together, and a
        request that supplies only one is 400 `INVALID_SOURCE_FILTER`.
        `sourceType` is trimmed and matched case-insensitively against
        `PaymentSourceType`, so `direct_claim` selects `DIRECT_CLAIM`; an
        unknown value is 400 `INVALID_SOURCE_TYPE` and is reported before the
        pairing check. A `sourceId` that is not a UUID is 400
        `INVALID_PARAMETER`. The public route trims both values and treats a
        blank value as absent; supplying neither value keeps the unfiltered
        list. A missing or malformed `X-EIA-Tenant` is 400
        `MISSING_TENANT_HEADER` or `INVALID_PARAMETER`. Free-text search is
        served by `GET /api/v1/payments/search`; cursor pagination remains
        planned.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: sourceType
          in: query
          required: false
          description: >
            Optional payment-source filter. Must be supplied with `sourceId`;
            half a pair is 400 `INVALID_SOURCE_FILTER`. The value is trimmed
            and upper-cased before validation, so a lower-case value is
            accepted. A value outside the four-value enum is 400
            `INVALID_SOURCE_TYPE`. Because the pair is mandatory, `OTHER` is
            filterable only with a `sourceId`; a type-only `OTHER` query cannot
            list every OTHER payment.
          schema:
            $ref: '#/components/schemas/PaymentSourceType'
        - name: sourceId
          in: query
          required: false
          description: >
            Optional UUID of the source record. Must be supplied with
            `sourceType`; half a pair is 400 `INVALID_SOURCE_FILTER`. A value
            that is not a UUID is 400 `INVALID_PARAMETER`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payments of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPayment
      tags:
        - Payment
      summary: Create a payment from a request.
      description: >
        The payment is created in DRAFT (or PENDING_AUTHORITY when requested).
        The payment number is generated by the expert as PAY-{year}-{7 digits}.
        Amount must be greater than zero with at most four fraction digits.
        Source linkage is optional. DIRECT_CLAIM, ASSUMED_CLAIM, and POLICY
        require `sourceId`; `sourceId` requires `sourceType`; OTHER may carry
        only `sourceReference`. `sourceReference` is at most 64 characters.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Payment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/search:
    get:
      operationId: searchPayments
      tags:
        - Payment
      summary: Search payments for the caller's tenant.
      description: >
        Global-search projection used by the shell and by the payment pickers.
        Matching is a case-insensitive contains over `paymentNumber`,
        `paymentType`, `payeePartyId`, `sourceId`, and `sourceReference`; an
        absent or blank `q` returns the most recently updated payments. When a
        matched payment carries a `sourceReference`, that human reference is
        appended to the `secondary` line after the payment type or currency and
        the status, separated by ` · ` (for example
        `INDEMNITY · DRAFT · CLM-2026-0000001`). The source UUID is matched but
        is not rendered in `secondary`; `label` remains the payment number. This
        lets the shell show and link the source record without an extra lookup
        per row. The response is the shared `SearchResponse` envelope. A missing
        or malformed `X-EIA-Tenant` or a `limit` outside 1-25 is a 400
        `application/problem+json` Problem.
      x-search-type: PAYMENT
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - $ref: './components.yaml#/components/parameters/SearchQuery'
        - $ref: './components.yaml#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Matching payments, most recently updated first.
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SearchResponse'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}:
    get:
      operationId: getPayment
      tags:
        - Payment
      summary: Get a payment.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/submit:
    post:
      operationId: submitPayment
      tags:
        - Payment
      summary: Submit a draft payment for authority.
      description: DRAFT to PENDING_AUTHORITY.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/authorize:
    post:
      operationId: authorizePayment
      tags:
        - Payment
      summary: Authorize a submitted payment.
      description: PENDING_AUTHORITY to AUTHORIZED.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/approve:
    post:
      operationId: approvePayment
      tags:
        - Payment
      summary: Approve an authorized payment.
      description: AUTHORIZED to APPROVED. This is the approval gate for execution.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/issue:
    post:
      operationId: issuePayment
      tags:
        - Payment
      summary: Issue an approved payment to SAP or the bank.
      description: >
        APPROVED to SCHEDULED and then SUBMITTED. A payment in a
        pre-approval state returns 400 PAYMENT_NOT_APPROVED.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment after the transitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/status:
    patch:
      operationId: updatePaymentStatus
      tags:
        - Payment
      summary: Advance a payment through its lifecycle.
      description: >
        Applies one generic lifecycle transition and returns the payment after
        the change. The body is `{status, expectedVersion?, reason?}`. The
        named `/submit`, `/authorize`, `/approve`, and `/issue` actions remain
        available; this route is the generic command the Payment expert owns.

        The only allowed edges are `DRAFT` -> `PENDING_AUTHORITY`,
        `DRAFT` -> `CANCELLED`, `DRAFT` -> `VOID`,
        `PENDING_AUTHORITY` -> `AUTHORIZED`,
        `PENDING_AUTHORITY` -> `REJECTED`,
        `PENDING_AUTHORITY` -> `CANCELLED`,
        `PENDING_AUTHORITY` -> `VOID`,
        `AUTHORIZED` -> `APPROVED`, `AUTHORIZED` -> `CANCELLED`,
        `AUTHORIZED` -> `VOID`, `APPROVED` -> `SCHEDULED`,
        `APPROVED` -> `STOPPED`, `APPROVED` -> `VOID`,
        `SCHEDULED` -> `SUBMITTED`, `SCHEDULED` -> `CANCELLED`,
        `SCHEDULED` -> `VOID`, `SUBMITTED` -> `ACCEPTED`,
        `SUBMITTED` -> `FAILED`, `ACCEPTED` -> `PROCESSING`,
        `ACCEPTED` -> `FAILED`, `PROCESSING` -> `PAID`,
        `PROCESSING` -> `PARTIALLY_PAID`, `PROCESSING` -> `FAILED`,
        `PARTIALLY_PAID` -> `PAID`, `PARTIALLY_PAID` -> `RETURNED`,
        `PARTIALLY_PAID` -> `REVERSED`, `PAID` -> `RECONCILED`,
        `PAID` -> `RETURNED`, `PAID` -> `REVERSED`,
        `RETURNED` -> `SCHEDULED`, `RETURNED` -> `CANCELLED`,
        `FAILED` -> `SCHEDULED`, `FAILED` -> `CANCELLED`, and
        `RECONCILED` -> `ESCHEATED`.

        `CANCELLED`, `STOPPED`, `REJECTED`, `VOID`, `REVERSED`, and
        `ESCHEATED` are terminal: no outgoing edge exists, so any later
        command, including a replay of the same terminal status, is 400
        `INVALID_STATUS_TRANSITION`. `PARTIALLY_PAID` is not terminal and can
        still move to `PAID`, `RETURNED`, or `REVERSED`. Repeating the current
        status is likewise 400 `INVALID_STATUS_TRANSITION`.

        `status` is trimmed and upper-cased; an unknown value is 400
        `INVALID_STATUS`, and a missing or blank value is 400
        `VALIDATION_ERROR`. The approval gate is checked before the graph:
        `DRAFT`, `PENDING_AUTHORITY`, and `AUTHORIZED` may not jump directly to
        an execution status (`SUBMITTED`, `ACCEPTED`, `PROCESSING`, `PAID`,
        `PARTIALLY_PAID`, `RECONCILED`, or `ESCHEATED`), and such a request is
        400 `PAYMENT_NOT_APPROVED`; every other undeclared edge is 400
        `INVALID_STATUS_TRANSITION`.

        `expectedVersion` is optional. When supplied it is compared with the
        payment `version`; a stale value is 409 `CONCURRENT_MODIFICATION` with
        no row change and no event. When it is omitted the transition is not
        version-checked. `reason` is optional and at most 200 characters; it is
        trimmed and stored as the latest status reason, which the updated
        `Payment` returns as `statusReason`. An over-long reason is 400
        `VALIDATION_ERROR` before the transition and version checks; a blank
        reason is treated as absent and clears the stored reason. The named
        `/submit`, `/authorize`, `/approve`, and `/issue` actions also replace
        the stored reason with their own text. An accepted transition bumps the
        payment `version` and writes `payment.payment.updated` and
        `payment.payment.status-changed` in the same transaction. An unknown
        payment, including another tenant's payment, is 404
        `PAYMENT_NOT_FOUND`.

        `X-EIA-Tenant` is required; a missing header is 400
        `MISSING_TENANT_HEADER` and a malformed tenant or `paymentId` is 400
        `INVALID_PARAMETER`. The route is tenant-scoped and not book-scoped
        (M-08, M-12).
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequest'
      responses:
        '200':
          description: Payment after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        '502':
          $ref: './components.yaml#/components/responses/BadGateway'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /api/v1/payments/{paymentId}/allocations:
    get:
      operationId: listPaymentAllocations
      tags:
        - Payment
      summary: List a payment's allocations.
      description: >
        Returns the payment's allocation rows oldest first (`createdAt`
        ascending, with the allocation id as the tie-break) plus the
        reconciliation view of the payment amount. The summary carries `items`,
        `paymentAmount`, `totalAllocated`, `unallocated`, and `currency`;
        `unallocated` is `paymentAmount` minus `totalAllocated` and is never
        negative. Every money value is a decimal string (SPEC 10.3) in the
        payment's currency. A payment outside the caller's tenant is reported
        exactly like a missing payment, so the route never discloses another
        tenant's records: 404 `PAYMENT_NOT_FOUND`. A missing `X-EIA-Tenant` is
        400 `MISSING_TENANT_HEADER`; a malformed tenant or `paymentId` is 400
        `INVALID_PARAMETER`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allocations of the payment, oldest first, with the payment totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAllocationSummary'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: createPaymentAllocation
      tags:
        - Payment
      summary: Record an allocation of a payment.
      description: >
        Splits part of the payment across a target record and a financial
        component. `targetType` is `DIRECT_CLAIM`, `ASSUMED_CLAIM`, or `POLICY`
        and `targetId` is the UUID of that record. `component` is `INDEMNITY`,
        `DEFENSE_COST`, `ALAE`, `EXPENSE`, `COMMISSION`, or `OTHER`. `amount`
        must be greater than zero with at most four fraction digits. The
        currency is not accepted from the caller: an allocation always uses the
        payment's currency. Both vocabularies are trimmed and matched
        case-insensitively, so `direct_claim` and `indemnity` are accepted and
        normalized before they are stored.

        Allocations are append-only and their sum on one payment may not exceed
        the payment amount. The accumulated allocations plus `amount` is
        checked before the insert: an excess is 409 `ALLOCATION_EXCEEDS_PAYMENT`
        with no row and no event written. A payment in `CANCELLED`, `REVERSED`,
        or `FAILED` is 409 `PAYMENT_NOT_ALLOCATABLE` and likewise writes
        nothing. A successful create returns 201 with the allocation and writes
        `payment.allocation.created` to the transactional outbox in the same
        transaction. A missing or unknown member of the body is 400
        `VALIDATION_ERROR` with per-field details; a missing `X-EIA-Tenant` is
        400 `MISSING_TENANT_HEADER`; a payment outside the caller's tenant is
        404 `PAYMENT_NOT_FOUND`.
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantHeader'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentAllocationRequest'
      responses:
        '201':
          description: Allocation recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAllocation'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/payments:
    get:
      operationId: expertListPayments
      tags:
        - Payment internal
      summary: List payments for a tenant (expert).
      description: >
        Returns a bare JSON array ordered by `createdAt` newest first, with
        `paymentNumber` as the tie-break. The optional `sourceType` +
        `sourceId` pair restricts the list to the payments linked to exactly
        that source; both values must be supplied together. `sourceType` is
        trimmed and upper-cased against `PaymentSourceType`; an unknown value
        is 400 `INVALID_SOURCE_TYPE` and a partial pair is 400
        `INVALID_SOURCE_FILTER`. A `sourceId` that is not a UUID is 400
        `INVALID_PARAMETER`. The list is tenant-scoped by the required
        `tenantId` query parameter.
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: sourceType
          in: query
          required: false
          description: >
            Optional payment-source filter. Must be supplied with `sourceId`;
            half a pair is 400 `INVALID_SOURCE_FILTER`. The value is trimmed
            and upper-cased before validation; a value outside the four-value
            enum is 400 `INVALID_SOURCE_TYPE`.
          schema:
            $ref: '#/components/schemas/PaymentSourceType'
        - name: sourceId
          in: query
          required: false
          description: >
            Optional UUID of the source record. Must be supplied with
            `sourceType`; half a pair is 400 `INVALID_SOURCE_FILTER`. A value
            that is not a UUID is 400 `INVALID_PARAMETER`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payments of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        default:
          $ref: './components.yaml#/components/responses/Problem'
    post:
      operationId: expertCreatePayment
      tags:
        - Payment internal
      summary: Create a payment (expert).
      description: >
        The expert accepts an optional payment number and status. Only DRAFT and
        PENDING_AUTHORITY are valid initial statuses.
      security: []
      x-internal-api: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequestInternal'
      responses:
        '201':
          description: Payment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/payments/{paymentId}:
    get:
      operationId: expertGetPayment
      tags:
        - Payment internal
      summary: Get a payment (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        default:
          $ref: './components.yaml#/components/responses/Problem'
  /internal/v1/payments/{paymentId}/status:
    patch:
      operationId: expertUpdatePaymentStatus
      tags:
        - Payment internal
      summary: Advance a payment through its lifecycle (expert).
      security: []
      x-internal-api: true
      parameters:
        - $ref: './components.yaml#/components/parameters/TenantIdQuery'
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentStatusRequestInternal'
      responses:
        '200':
          description: Payment after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: './components.yaml#/components/responses/BadRequest'
        '404':
          $ref: './components.yaml#/components/responses/NotFound'
        '409':
          $ref: './components.yaml#/components/responses/Conflict'
        default:
          $ref: './components.yaml#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      $ref: './components.yaml#/components/securitySchemes/sessionCookie'
  schemas:
    Payment:
      allOf:
        - $ref: './components.yaml#/components/schemas/AuditFields'
      type: object
      description: >
        Payment projection. The SPEC 12.5.3 payment representation carries
        claim, payee, netAmount, method, dueDate, authority, SAP postings,
        allocations, and _links; those are planned. The implemented source
        link is a flat, optional reference to the business record being
        disbursed: `sourceType` classifies the source, `sourceId` is its UUID,
        and `sourceReference` is the human label (for example
        `CLM-2026-0000001`) that lists and record views render without an N+1
        lookup. A payment created before source linkage existed, or without a
        source, returns all three fields as null. See MISMATCHES.md M-12 and
        M-24.
      required:
        - id
        - tenantId
        - paymentNumber
        - paymentType
        - status
        - statusReason
        - amount
        - currency
        - payeePartyId
        - paymentDate
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        paymentNumber:
          type: string
          pattern: '^PAY-[0-9]{4}-[0-9]{7}$'
          examples:
            - PAY-2026-0000001
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        statusReason:
          type: [string, 'null']
          maxLength: 200
          description: >
            Latest status reason, always present and null when there is none.
            It is the trimmed `reason` supplied with the most recent accepted
            status change, whether through `PATCH
            /api/v1/payments/{paymentId}/status` or the named `/submit`,
            `/authorize`, `/approve`, and `/issue` actions (which supply their
            own text). Each accepted change replaces the previous value, and a
            change without a reason clears it, so the member describes the
            current status only and is not a status history. A payment that has
            never changed status, or whose latest change carried no reason,
            returns null. See MISMATCHES.md M-46.
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        payeePartyId:
          type: string
          format: uuid
        paymentDate:
          type: string
          format: date
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/PaymentSourceType'
            - type: 'null'
          description: >
            Source classification, or null when the payment has no source
            link.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source direct claim, assumed claim, or policy when
            `sourceType` is classified; null for an OTHER reference-only
            source or a payment without a source link.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference (for example
            `CLM-2026-0000001`). Optional metadata; it never replaces
            `sourceId` for a classified source.
    PaymentSourceType:
      type: string
      description: >
        Payment source classification. DIRECT_CLAIM, ASSUMED_CLAIM, and POLICY
        identify a UUID source; OTHER identifies a source by its human
        reference only.
      enum:
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - POLICY
        - OTHER
    PaymentType:
      type: string
      description: Payment type from SPEC 11.7.5.
      enum:
        - INDEMNITY
        - DEFENSE_COST
        - ALAE
        - EXPENSE
        - MEDICAL
        - STRUCTURED_SETTLEMENT
        - ANNUITY
        - LIEN_PAYMENT
        - TRUST_DEPOSIT
        - TRUST_DISTRIBUTION
        - SUBROGATION_RECOVERY
        - SALVAGE_RECOVERY
        - ASSUMED_RECOVERY
        - DEDUCTIBLE_REIMBURSEMENT
        - PREMIUM
        - COMMISSION
        - BROKERAGE
        - CASH_CALL
        - TECHNICAL_ACCOUNT_SETTLEMENT
        - SECURITY_COLLATERAL
        - REFUND
        - OFFSET
        - INTERCOMPANY
        - TAX
        - FEE
    PaymentStatus:
      type: string
      description: >
        Payment lifecycle status from SPEC 11.7.6. The implemented transition
        graph and the terminal statuses are documented on
        `PATCH /api/v1/payments/{paymentId}/status`. `CANCELLED`, `STOPPED`,
        `REJECTED`, `VOID`, `REVERSED`, and `ESCHEATED` are terminal.
      enum:
        - DRAFT
        - PENDING_AUTHORITY
        - AUTHORIZED
        - APPROVED
        - SCHEDULED
        - SUBMITTED
        - ACCEPTED
        - PROCESSING
        - PAID
        - PARTIALLY_PAID
        - FAILED
        - REJECTED
        - CANCELLED
        - STOPPED
        - RETURNED
        - REVERSED
        - RECONCILED
        - ESCHEATED
        - VOID
    PaymentAllocationTargetType:
      type: string
      description: >
        Business record a payment split targets. DIRECT_CLAIM and
        ASSUMED_CLAIM identify a claim in the corresponding book; POLICY
        identifies a policy.
      enum:
        - DIRECT_CLAIM
        - ASSUMED_CLAIM
        - POLICY
    PaymentAllocationComponent:
      type: string
      description: Financial component a payment split settles.
      enum:
        - INDEMNITY
        - DEFENSE_COST
        - ALAE
        - EXPENSE
        - COMMISSION
        - OTHER
    PaymentAllocation:
      type: object
      description: >
        One split of a payment amount to the claim or policy target and
        financial component it settles. The tenant is implied by the request
        context and is not part of the public projection. An allocation is
        append-only and its currency is always the parent payment's currency.
        Money is a decimal string (SPEC 10.3).
      required:
        - allocationId
        - paymentId
        - targetType
        - targetId
        - component
        - amount
        - currency
        - createdAt
      properties:
        allocationId:
          type: string
          format: uuid
        paymentId:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/PaymentAllocationTargetType'
        targetId:
          type: string
          format: uuid
        component:
          $ref: '#/components/schemas/PaymentAllocationComponent'
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        createdAt:
          type: string
          format: date-time
    PaymentAllocationSummary:
      type: object
      description: >
        A payment's allocations plus the reconciliation view of its amount: the
        payment total, the sum already allocated, and the amount still
        unallocated. `items` is oldest first. The expert owns the persisted
        totals and the overallocation guard; the domain proxies and normalizes
        the read model. All money values are decimal strings in the payment's
        currency.
      required:
        - items
        - paymentAmount
        - totalAllocated
        - unallocated
        - currency
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocation'
        paymentAmount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        totalAllocated:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        unallocated:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
    CreatePaymentAllocationRequest:
      type: object
      description: >
        Command that splits a payment across a claim or policy target and a
        financial component. The currency is always the payment currency and is
        deliberately not accepted from the caller. `targetType` and `component`
        are trimmed and matched case-insensitively before validation.
      required:
        - targetType
        - targetId
        - component
        - amount
      properties:
        targetType:
          $ref: '#/components/schemas/PaymentAllocationTargetType'
        targetId:
          type: string
          format: uuid
          description: UUID of the claim or policy the split targets.
        component:
          $ref: '#/components/schemas/PaymentAllocationComponent'
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
          description: Greater than zero with at most four fraction digits (SPEC 10.3).
    CreatePaymentRequest:
      type: object
      description: >
        Public create command. The tenant comes from X-EIA-Tenant. Source
        linkage is optional. A classified source (DIRECT_CLAIM, ASSUMED_CLAIM,
        or POLICY) requires `sourceId`; `sourceId` requires `sourceType`; OTHER
        may carry only `sourceReference`. A classified source is never
        identified by `sourceReference` alone. `sourceReference` is at most 64
        characters.
      required:
        - paymentType
        - amount
        - currency
        - payeePartyId
        - paymentDate
      properties:
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        status:
          type: string
          enum:
            - DRAFT
            - PENDING_AUTHORITY
          description: Optional initial status. Defaults to DRAFT.
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
          description: Greater than zero with at most four fraction digits.
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        payeePartyId:
          type: string
          format: uuid
        paymentDate:
          type: string
          format: date
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/PaymentSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is
            DIRECT_CLAIM, ASSUMED_CLAIM, or POLICY; optional for OTHER.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference (for example
            `CLM-2026-0000001`). Optional metadata; never replaces
            `sourceId` for a classified source.
      allOf:
        - description: A classified source requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                enum:
                  - DIRECT_CLAIM
                  - ASSUMED_CLAIM
                  - POLICY
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/PaymentSourceType'
    CreatePaymentRequestInternal:
      type: object
      description: >
        Internal create command accepted by the Payment expert. Source linkage
        follows the public rule: DIRECT_CLAIM, ASSUMED_CLAIM, and POLICY require
        `sourceId`; `sourceId` requires `sourceType`; OTHER may carry only
        `sourceReference`; `sourceReference` is at most 64 characters.
      required:
        - tenantId
        - paymentType
        - amount
        - currency
        - payeePartyId
        - paymentDate
      properties:
        tenantId:
          type: string
          format: uuid
        paymentNumber:
          type: string
          pattern: '^PAY-[0-9]{4}-[0-9]{7}$'
          description: Optional. Generated when omitted.
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        status:
          type: string
          enum:
            - DRAFT
            - PENDING_AUTHORITY
          description: Optional initial status. Defaults to DRAFT.
        amount:
          $ref: './components.yaml#/components/schemas/MoneyAmount'
        currency:
          $ref: './components.yaml#/components/schemas/CurrencyCode'
        payeePartyId:
          type: string
          format: uuid
        paymentDate:
          type: string
          format: date
        sourceType:
          oneOf:
            - $ref: '#/components/schemas/PaymentSourceType'
            - type: 'null'
          description: Optional source classification.
        sourceId:
          type: [string, 'null']
          format: uuid
          description: >
            UUID of the source record. Required when `sourceType` is
            DIRECT_CLAIM, ASSUMED_CLAIM, or POLICY; optional for OTHER.
        sourceReference:
          type: [string, 'null']
          maxLength: 64
          description: >
            Human-readable source reference. Optional metadata; never replaces
            `sourceId` for a classified source.
      allOf:
        - description: A classified source requires a sourceId.
          if:
            required:
              - sourceType
            properties:
              sourceType:
                enum:
                  - DIRECT_CLAIM
                  - ASSUMED_CLAIM
                  - POLICY
          then:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
                format: uuid
        - description: A sourceId requires a non-null sourceType.
          if:
            required:
              - sourceId
            properties:
              sourceId:
                type: string
          then:
            required:
              - sourceType
            properties:
              sourceType:
                $ref: '#/components/schemas/PaymentSourceType'
    UpdatePaymentStatusRequest:
      type: object
      description: >
        Lifecycle transition command used by the public Payment API. The expert
        owns the transition graph, the approval gate, and the optimistic
        concurrency check. `status` is trimmed and upper-cased; an unknown
        value is 400 `INVALID_STATUS`, a repeated or undeclared edge is 400
        `INVALID_STATUS_TRANSITION`, and a pre-approval state that requests an
        execution status is 400 `PAYMENT_NOT_APPROVED`. `expectedVersion` is
        optional and a stale value is 409 `CONCURRENT_MODIFICATION`; `reason`
        is optional, trimmed, and stored as the latest status reason, which the
        updated `Payment` returns as `statusReason`. A reason longer than 200
        characters is 400 `VALIDATION_ERROR`, and a blank reason clears the
        stored value.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        expectedVersion:
          type: integer
          minimum: 0
          description: >
            Optional payment version the caller observed. When supplied, a
            mismatch is 409 `CONCURRENT_MODIFICATION`; when omitted the
            transition is not version-checked.
        reason:
          type: string
          maxLength: 200
          description: >
            Optional status reason. It is trimmed and stored as the payment's
            latest status reason, returned as `Payment.statusReason`, and
            replaces any previous value. A blank value clears the stored
            reason. A value longer than 200 characters is 400
            `VALIDATION_ERROR`.
    UpdatePaymentStatusRequestInternal:
      type: object
      description: Internal lifecycle transition command accepted by the Payment expert.
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 200
          description: >
            Optional status reason. The expert trims it, stores it as the
            payment's latest status reason, and returns it as
            `Payment.statusReason`; a blank value clears the stored reason.
