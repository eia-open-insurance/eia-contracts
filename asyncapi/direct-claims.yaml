  DirectClaimReserveChanged:
    address: direct.claim.reserve-changed
    title: direct.claim.reserve-changed
    description: >
      Emitted for every append-only reserve component change. The payload
      carries the reserve entry identity, component, amount and currency,
      sequence, previous amount, delta, total current reserve, effective
      date, reason, and authority.
    x-event-type: direct.claim.reserve-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimTaskCreated:
    address: direct.claim.task-created
    title: direct.claim.task-created
    description: >
      Emitted when a diary task is opened, in the same transaction as the task
      row and the parent claim version bump. The payload carries the claim
      identity and `claimStatus`, the task identity and number, title,
      description, due date, priority, task status, assignee, task version,
      task timestamps, and `completedAt` when set. This name is new in this
      contract and has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22).
    x-event-type: direct.claim.task-created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimTaskCompleted:
    address: direct.claim.task-completed
    title: direct.claim.task-completed
    description: >
      Emitted when a task moves to COMPLETE. The payload carries the claim
      identity and `claimStatus`, the task fields after the change,
      `changedFields: [status]`, `from`, and `to`. This name is new in this
      contract and has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22).
    x-event-type: direct.claim.task-completed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimTaskUpdated:
    address: direct.claim.task-updated
    title: direct.claim.task-updated
    description: >
      Emitted when a task is cancelled or reopened. The payload is the same
      shape as `direct.claim.task-completed` and carries `changedFields:
      [status]`, `from`, and `to`; a transition to COMPLETE uses
      `direct.claim.task-completed` instead. This name is new in this contract
      and has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22).
    x-event-type: direct.claim.task-updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimNoteAdded:
    address: direct.claim.note-added
    title: direct.claim.note-added
    description: >
      Emitted when an append-only note is written in the same transaction as
      the note row and the parent claim version bump. The payload carries
      `noteId`, `noteNumber`, `noteType`, `body`, `author`, and `createdAt`
      plus the claim identity and version. This name is new in this contract
      and has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22).
    x-event-type: direct.claim.note-added
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimLitigationCreated:
    address: direct.claim.litigation-created
    title: direct.claim.litigation-created
    description: >
      Emitted when a litigation matter is recorded, in the same transaction as
      the matter insert and the parent claim version bump. The payload carries
      the claim identity (`claimId`, `claimNumber`) and `claimVersion` (the
      claim's post-write row version, serialized as `version`), the matter
      fields (`litigationId`, `matterType`, `jurisdiction`, `counselPartyId`,
      `filingDate`, `trialDate`, `litigationStatus`, `caseNumber`),
      `litigationVersion`, and the optional damages pair (`damagesSought`,
      `damagesCurrency`). `trialDate`, `caseNumber`, and both damages members
      are omitted when null, and the recorded damages pair is both-or-neither:
      `damagesSought` is a decimal string greater than zero and
      `damagesCurrency` is three uppercase letters. This name is new in this
      contract and has no SPEC 11.4.9 equivalent (MISMATCHES.md M-22, M-52).
    x-event-type: direct.claim.litigation-created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimLitigationUpdated:
    address: direct.claim.litigation-updated
    title: direct.claim.litigation-updated
    description: >
      Emitted when a litigation matter is changed, in the same transaction as
      the matter update and the parent claim version bump. The payload carries
      the claim identity (`claimId`, `claimNumber`) and `claimVersion` (the
      claim's post-write row version, serialized as `version`), the matter
      fields (`litigationId`, `matterType`, `jurisdiction`, `counselPartyId`,
      `filingDate`, `trialDate`, `litigationStatus`, `caseNumber`),
      `litigationVersion`, and the optional damages pair (`damagesSought`,
      `damagesCurrency`). `trialDate`, `caseNumber`, and both damages members
      are omitted when null, and the recorded damages pair is both-or-neither:
      `damagesSought` is a decimal string greater than zero and
      `damagesCurrency` is three uppercase letters. On a PATCH that omits both
      damages members the stored pair is carried unchanged in the payload. The
      name already exists in SPEC 11.4.9 and was planned before this contract
      (MISMATCHES.md M-52).
    x-event-type: direct.claim.litigation-updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimSettlementAuthorized:
    address: direct.claim.settlement-authorized
    title: direct.claim.settlement-authorized
    description: >
      Emitted when a settlement is authorized. The payload carries the
      settlement identity and number, amount and currency, status, version,
      structure, release scope, approval authority, and authorization
      evidence.
    x-event-type: direct.claim.settlement-authorized
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimSettlementExecuted:
    address: direct.claim.settlement-executed
    title: direct.claim.settlement-executed
    description: >
      Declared domain event for this vertical (SPEC 11.4.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: direct.claim.settlement-executed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.4.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimSettlementPaymentLinked:
    address: direct.claim.settlement-payment-linked
    title: direct.claim.settlement-payment-linked
    description: >
      Emitted when the Payment record linked to a settlement is set or cleared,
      in the same transaction as the settlement row update, the claim and
      settlement version bumps, and the outbox insert. Only an AUTHORIZED or
      EXECUTED settlement is linkable; a PROPOSED or REJECTED settlement is 409
      `SETTLEMENT_NOT_LINKABLE` and emits nothing, and repeating the current
      link is an idempotent no-op that also emits nothing. The payload carries
      the claim identity and version context plus `claimId`, `settlementId`,
      `settlementNumber`, `paymentId`, and `linkedAt`. `paymentId` and `linkedAt`
      are omitted on an unlink, which is still a recorded state change. This
      name is new in this contract and has no SPEC 11.4.9 equivalent
      (MISMATCHES.md M-22, M-45).
    x-event-type: direct.claim.settlement-payment-linked
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
