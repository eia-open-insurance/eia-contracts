asyncapi: 3.0.0
id: urn:eia:contracts:events:direct-claims
info:
  title: EIA Direct Claims events
  version: 1.6.0
  summary: Published domain event names for the Direct Claims vertical.
  description: >
    Event contract for the Direct Claims vertical. The authoritative event names are
    SPEC 11.4.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Direct Claims expert now publishes `direct.claim.registered`,
    `direct.claim.updated`, `direct.claim.assigned`,
    `direct.claim.coverage-assessed`, `direct.claim.reserve-changed`,
    `direct.claim.settlement-authorized`,
    `direct.claim.settlement-payment-linked`, `direct.claim.task-created`,
    `direct.claim.task-completed`, `direct.claim.task-updated`,
    `direct.claim.note-added`, `direct.claim.allocation-created`,
    `direct.claim.litigation-created`, `direct.claim.litigation-updated`, and
    `direct.claim.closed` through the transactional outbox; those channels and
    operations are marked `x-status: implemented`. The task, note, assignment,
    allocation-created, settlement-payment-linked, and litigation-created names
    are new in this contract and have no SPEC 11.4.9 equivalent
    (MISMATCHES.md M-22, M-45, M-52). The SPEC name
    `direct.claim.allocated` remains planned. Every other implemented name
    already exists in the SPEC.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  DirectClaimRegistered:
    address: direct.claim.registered
    title: direct.claim.registered
    description: >
      Emitted when a claim is registered, in the same transaction as the
      row. The payload carries the claim identity, policy and claimant,
      book, status, row version, loss and report dates, cause code, reserve
      amounts, and settlement authority.
    x-event-type: direct.claim.registered
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimUpdated:
    address: direct.claim.updated
    title: direct.claim.updated
    description: >
      Emitted on every accepted claim status change. The payload carries
      `changedFields: [status]`, `from`, `to`, and the claim identity,
      status, row version, and reserve context.
    x-event-type: direct.claim.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimAssigned:
    address: direct.claim.assigned
    title: direct.claim.assigned
    description: >
      Emitted when a claim is assigned or reassigned to a different adjuster or
      team, in the same transaction as the claim version bump and the assignment
      audit entry. The payload carries the claim identity and row version, the
      new `assignedAdjuster`, `assignedTeam`, and `assignedAt`, and the acting
      identity as `assignedBy` (the `X-EIA-Actor` header, defaulting to the
      assigned adjuster). A same-assignment retry at the current version is a
      no-op and emits nothing. This name is new in this contract and has no
      SPEC 11.4.9 equivalent (MISMATCHES.md M-22).
    x-event-type: direct.claim.assigned
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimAllocationCreated:
    address: direct.claim.allocation-created
    title: direct.claim.allocation-created
    description: >
      Emitted when a claim allocation is recorded, in the same transaction as
      the allocation row and the parent claim version bump. The payload carries
      the claim identity and number, the allocation's policy id, policy year,
      layer, allocation percentage and allocated amount, and the claim's new
      allocation totals. This name is new in this contract and has no SPEC
      11.4.9 equivalent; the SPEC `direct.claim.allocated` name remains planned
      (MISMATCHES.md M-22).
    x-event-type: direct.claim.allocation-created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DirectClaimCoverageAssessed:
    address: direct.claim.coverage-assessed
    title: direct.claim.coverage-assessed
    description: >
      Emitted when the coverage decision is recorded. The payload carries
      the coverage decision identity, position, status, basis, allocation
      method and percent, decision date, reviewer, and coverage version.
    x-event-type: direct.claim.coverage-assessed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.4.9
    x-implemented-by: repos/eia-direct-claims-expert/src/main/java/com/eia/directclaims/expert/ClaimEvents.java
    messages:
