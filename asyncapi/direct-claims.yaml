components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: direct
x-spec-section: SPEC 11.4.9
x-status: partial
x-implementation:
  publisher: eia-direct-claims-expert
  subscriber: none
  notes: >
    Fifteen Direct Claims events are written to the transactional outbox in the
    same transaction as the aggregate or child write: `registered`, `updated`,
    `assigned`, `coverage-assessed`, `reserve-changed`,
    `settlement-authorized`, `settlement-payment-linked`, `task-created`,
    `task-completed`, `task-updated`, `note-added`, `allocation-created`,
    `litigation-created`, `litigation-updated`, and `closed`. The SPEC name
    `direct.claim.allocated` and the other SPEC 11.4.9 names remain planned.
    There is no business subscriber or subscription registry yet.

x-consumed-events:
  - policy.policy.issued
  - policy.policy.endorsed
  - policy.policy.cancelled
  - policy.aggregate.eroded
  - payment.payment.paid
  - payment.payment.failed
  - payment.payment.reversed
  - party.party.merged
  - document.document.associated
  - contract.cession.recorded
