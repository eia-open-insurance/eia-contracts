components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    PartyIdentifierAddedData:
      name: PartyIdentifierAddedData
      title: party.party.identifier-added data
      summary: One appended party identifier and the Party row version.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - partyId
          - partyNumber
          - version
          - identifierId
          - identifierType
          - identifierValue
          - createdBy
          - createdAt
        properties:
          partyId:
            type: string
            format: uuid
          partyNumber:
            type: string
            description: Generated Party business key, format PTY-000000001.
          version:
            type: integer
            minimum: 0
            description: >
              Party row version after the child insert and version bump. The
              envelope `aggregateVersion` is this value plus one because Party
              rows start at version 0.
          identifierId:
            type: string
            format: uuid
          identifierType:
            type: string
            description: Normalized (trimmed and upper-cased) identifier type.
            enum:
              - TAX_ID
              - REGISTRATION
              - LICENSE
              - TIN
              - EIN
              - SSN
              - ITIN
              - DUNS
              - LEI
              - PASSPORT
              - DRIVER_LICENSE
              - STATE_ID
              - MEDICARE_ID
              - MEDICAID_ID
              - NPI
              - BAR_NUMBER
              - ACORD_PARTY_ID
              - ISO_PARTY_ID
              - TRUST_CLAIM_NUMBER
              - BANKRUPTCY_CASE_NUMBER
              - OTHER
          identifierValue:
            type: string
            minLength: 1
            maxLength: 128
            description: Trimmed identifier value as stored.
          issuingAuthority:
            type: string
            maxLength: 128
            description: >
              Optional issuing authority. The expert omits the member when it
              is null.
          effectiveDate:
            type: string
            format: date
            description: >
              Optional date from which the identifier is effective, as an ISO
              8601 calendar date. The expert omits the member when it is null.
          createdBy:
            type: string
            maxLength: 128
            description: Stored actor; `system` in the current slice.
          createdAt:
            type: string
            format: date-time
    PartyAddressAddedData:
      name: PartyAddressAddedData
      title: party.party.address-added data
      summary: One appended party address and the Party row version.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - partyId
          - partyNumber
          - version
          - addressId
          - addressType
          - line1
          - city
          - postalCode
          - country
          - createdBy
          - createdAt
        properties:
          partyId:
            type: string
            format: uuid
          partyNumber:
            type: string
            description: Generated Party business key, format PTY-000000001.
          version:
            type: integer
            minimum: 0
            description: >
              Party row version after the child insert and version bump. The
              envelope `aggregateVersion` is this value plus one because Party
              rows start at version 0.
          addressId:
            type: string
            format: uuid
          addressType:
            type: string
            description: Normalized (trimmed and upper-cased) address type.
            enum:
              - PRIMARY
              - LEGAL
              - PHYSICAL
              - MAILING
              - BILLING
              - CLAIM_SITE
              - EXPOSURE_SITE
              - EMPLOYER
              - PROVIDER
              - BANK
              - OTHER
          line1:
            type: string
            minLength: 1
            maxLength: 128
          line2:
            type: string
            maxLength: 128
            description: >
              Optional second line, trimmed. The expert omits the member when
              it is null.
          city:
            type: string
            minLength: 1
            maxLength: 64
          stateRegion:
            type: string
            maxLength: 64
            description: >
              Optional state, province, or region, trimmed but not upper-cased.
              The expert omits the member when it is null.
          postalCode:
            type: string
            minLength: 1
            maxLength: 16
          country:
            type: string
            pattern: '^[A-Z]{2}$'
            description: ISO 3166-1 alpha-2 country code, normalized to upper-case.
          effectiveDate:
            type: string
            format: date
            description: >
              Optional date from which the address is effective, as an ISO 8601
              calendar date. The expert omits the member when it is null.
          createdBy:
            type: string
            maxLength: 128
            description: Stored actor; `system` in the current slice.
          createdAt:
            type: string
            format: date-time
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: party
x-spec-section: SPEC 11.1.9
x-status: partial
x-implementation:
  publisher: eia-party-expert
  subscriber: none
  notes: >
    `party.party.created`, `party.party.updated`,
    `party.party.identifier-added`, and `party.party.address-added` are written
    to the transactional outbox in the same transaction as the party,
    identifier, or address write and dispatched by the platform outbox
    dispatcher when `eia.outbox.enabled=true`. Each reference-data fact is one
    outbox row per appended child, keyed by the Party aggregate at the bumped
    version, with the child id and normalized values in the payload. The two
    reference-data names have no SPEC 11.1.9 equivalent (M-22, M-54); the other
    SPEC 11.1.9 names remain planned. There is no subscriber, inbox, or
    subscription registry yet.

x-consumed-events:
  - policy.policy.issued
  - contract.contract.bound
  - direct.claim.registered
  - assumed.claim.registered
  - payment.payment.paid
  - document.document.registered
