asyncapi: 3.0.0
id: urn:eia:contracts:events:party
info:
  title: EIA Party events
  version: 1.2.0
  summary: Published domain event names for the Party vertical.
  description: >
    Event contract for the Party vertical. The authoritative event names are
    SPEC 11.1.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Party expert publishes `party.party.created`, `party.party.updated`,
    `party.party.identifier-added`, and `party.party.address-added` through the
    transactional outbox; those channels and operations are marked
    `x-status: implemented`. A status change is published as
    `party.party.updated` with `changedFields: [status]`. Adding one identifier
    or address bumps the Party row version and writes one child fact in the
    same transaction: the payload names the child id, the Party identity, and
    the Party row `version`, while the envelope `aggregateVersion` is that row
    version plus one. The two
    reference-data names are new: SPEC 11.1.9 publishes no identifier-added or
    address-added fact (MISMATCHES.md M-22, M-54), so they are additive under
    EV-05. `party.party.status-changed` and the other SPEC 11.1.9 names remain
    planned.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  PartyPartyCreated:
    address: party.party.created
    title: party.party.created
    description: >
      Emitted by the Party expert when a party is persisted, in the same
      transaction as the row. The payload carries the party identity, type,
      status, and an initial empty `roles` array.
    x-event-type: party.party.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.1.9
    x-implemented-by: repos/eia-party-expert/src/main/java/com/eia/party/expert/PartyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PartyPartyUpdated:
    address: party.party.updated
    title: party.party.updated
    description: >
      Emitted when a party status changes. The payload carries
      `changedFields: [status]`, `from`, `to`, the optional `reason`, and the
      row version.
    x-event-type: party.party.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.1.9
    x-implemented-by: repos/eia-party-expert/src/main/java/com/eia/party/expert/PartyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PartyPartyIdentifierAdded:
    address: party.party.identifier-added
    title: party.party.identifier-added
    description: >
      Emitted by the Party expert when one identifier is appended to a party, in
      the same transaction as the child insert and the Party row version bump.
      The payload is `PartyIdentifierAddedData`: the Party identity and row
      version, the identifier id and normalized type, the trimmed value, the
      optional authority and effective date, and the actor and instant. The
      identifier type and the Party version are the stored values; the envelope
      aggregate is the Party aggregate at the bumped version. The name has no
      SPEC 11.1.9 equivalent (MISMATCHES.md M-22, M-54).
    x-event-type: party.party.identifier-added
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.1.9
    x-implemented-by: repos/eia-party-expert/src/main/java/com/eia/party/expert/PartyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PartyIdentifierAddedData:
        $ref: '#/components/messages/PartyIdentifierAddedData'
  PartyPartyAddressAdded:
    address: party.party.address-added
    title: party.party.address-added
    description: >
      Emitted by the Party expert when one address is appended to a party, in
      the same transaction as the child insert and the Party row version bump.
      The payload is `PartyAddressAddedData`: the Party identity and row
      version, the address id and normalized type, the trimmed lines, city,
      region, postal code, the upper-case two-letter country, the optional
      effective date, and the actor and instant. The envelope aggregate is the
      Party aggregate at the bumped version. The name has no SPEC 11.1.9
      equivalent (MISMATCHES.md M-22, M-54).
    x-event-type: party.party.address-added
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.1.9
    x-implemented-by: repos/eia-party-expert/src/main/java/com/eia/party/expert/PartyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PartyAddressAddedData:
        $ref: '#/components/messages/PartyAddressAddedData'
  PartyPartyStatusChanged:
    address: party.party.status-changed
    title: party.party.status-changed
    description: >
      Declared domain event for this vertical (SPEC 11.1.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: party.party.status-changed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.1.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
