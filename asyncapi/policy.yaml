components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    PolicyPolicyCreatedData:
      name: PolicyPolicyCreatedData
      title: policy.policy.created data
      summary: Minimal schema for the envelope data object of a created policy.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          status:
            type: string
          version:
            type: integer
          productCode:
            type: string
          insuredPartyId:
            type: string
            format: uuid
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          premiumAmount:
            type: string
            description: Decimal string with up to four fraction digits (SPEC 10.3).
          premiumCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          limitAmount:
            type: string
          limitCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          createdAt:
            type: string
            format: date-time
    PolicyPolicyUpdatedData:
      name: PolicyPolicyUpdatedData
      title: policy.policy.updated data
      summary: Minimal schema for the envelope data object of a policy status change.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
          - changedFields
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          status:
            type: string
          version:
            type: integer
          changedFields:
            type: array
            items:
              type: string
          from:
            type: string
            description: Status before the accepted transition.
          to:
            type: string
            description: Status after the accepted transition.
          reason:
            type: string
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          premiumAmount:
            type: string
          premiumCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          limitAmount:
            type: string
          limitCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: policy
x-spec-section: SPEC 11.2.9
x-status: partial
x-implementation:
  publisher: eia-policy-expert
  subscriber: none
  notes: >
    Six Policy events are written to the transactional outbox in the same
    transaction as the aggregate write and dispatched by the platform outbox
    dispatcher when `eia.outbox.enabled=true`: `created`, `updated`,
    `version-issued`, `endorsed`, `cancelled`, and `reinstated`. The other
    SPEC 11.2.9 names remain planned. There is no business subscriber or
    subscription registry yet.

x-consumed-events:
  - direct.claim.registered
  - direct.claim.allocated
  - direct.claim.paid
  - direct.claim.recovery-recorded
  - contract.cession.recorded
  - payment.payment.paid
  - document.document.associated
  - party.party.merged
