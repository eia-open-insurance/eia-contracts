      name: PolicyCreditNoteData
      title: policy.credit-note.issued/applied/cancelled data
      summary: One accepted credit-note issue, application, or cancellation transition.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - creditNoteId
          - noteNumber
          - amount
          - currency
          - status
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          creditNoteId:
            type: string
            format: uuid
          noteNumber:
            type: string
            maxLength: 32
            description: Server-generated as `CN-{7 digits}` and unique per policy.
