      summary: One applied rating worksheet that replaced the policy premium.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - premiumAmount
          - currency
          - ratingMethod
          - calcHash
          - worksheetId
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
