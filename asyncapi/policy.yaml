components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    PolicyPolicyCreatedData:
      name: PolicyPolicyCreatedData
      title: policy.policy.created data
      summary: Minimal schema for the envelope data object of a created policy.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          status:
            type: string
          version:
            type: integer
          productCode:
            type: string
          insuredPartyId:
            type: string
            format: uuid
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          premiumAmount:
            type: string
            description: Decimal string with up to four fraction digits (SPEC 10.3).
          premiumCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          limitAmount:
            type: string
          limitCurrency:
