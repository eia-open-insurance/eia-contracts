x-vertical: policy
x-spec-section: SPEC 11.2.9
x-status: partial
x-implementation:
  publisher: eia-policy-expert
  subscriber: none
  notes: >
    Twenty-four Policy events are written to the transactional outbox in the same
    transaction as the aggregate write and dispatched by the platform outbox
    dispatcher when `eia.outbox.enabled=true`: `created`, `updated`,
    `version-issued`, `endorsed`, `cancelled`, `reinstated`, `renewed`,
    `premium-audited`, `rated`, `billing-plan.created`, `billing-plan.adjusted`,
    `installment.paid`, `installment.waived`,
    `dunning.sent`, `mass-tort-profile.updated`, the program facts
    `policy.program.created` and `policy.policy.program-assigned`, the
    credit-note facts `policy.credit-note.created`,
    `policy.credit-note.issued`, `policy.credit-note.applied`,
    `policy.credit-note.cancelled`, and `policy.credit-note.reversed`, and the
    legal-entity facts `policy.legal-entity.created` and
    `policy.policy.legal-entity-assigned`. The renewal
    event carries both policy identities and the lineage link; the billing plan
    event carries the complete schedule; the adjustment event carries the
    derived amount, the resulting gross plan total, the appended installment
    number and due date, and the reason; the installment events carry the
    settled row and its payment evidence; the dunning event carries the dunned
    installment, the escalation level and channel, the send instant, and the
    action status; the mass tort profile event carries the allocation context
    and the coverage block; and the program events carry the created catalog
    row and the policy membership delta with both sides of the link. The
    credit-note events carry the policy and note identity, the note number, the
    amount as a decimal string, the currency, and the new status; the `created`
    payload adds `createdAt` and the optional `cancellationId`/
    `cancellationNumber` of the cancellation a return-premium note refunds, the
    `applied` payload additionally carries the credited installment id and that
    installment's cumulative credited amount, and the `reversed` payload carries
    the note identity and number, the nullable released installment id, the
    amount, the required reversal reason, and status REVERSED. They are
    keyed by the policy aggregate because every command, including creation,
    bumps the policy version. The legal-entity created fact is keyed by the `LegalEntity`
    aggregate at version 1 and carries the catalog row; the assignment fact is
    keyed by the policy aggregate at the new version and carries the nullable
    new and previous entity ids and `changedFields`. The rating fact is keyed by
    the policy aggregate at the bumped version and is emitted only when the
    worksheet is applied; a calculation-only rating writes no event. It carries
    the worksheet identity and the canonical hash so a consumer can reproduce
    the applied premium. The other
    SPEC 11.2.9 and 11.2.13 names remain planned. There is no
    business subscriber or subscription registry yet.

x-consumed-events:
  - direct.claim.registered
  - direct.claim.allocated
  - direct.claim.paid
  - direct.claim.recovery-recorded
  - contract.cession.recorded
  - payment.payment.paid
  - document.document.associated
  - party.party.merged
