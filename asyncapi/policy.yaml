x-implementation:
  publisher: eia-policy-expert
  subscriber: none
  notes: >
    Ten Policy events are written to the transactional outbox in the same
    transaction as the aggregate write and dispatched by the platform outbox
    dispatcher when `eia.outbox.enabled=true`: `created`, `updated`,
    `version-issued`, `endorsed`, `cancelled`, `reinstated`, `renewed`,
    `billing-plan.created`, `installment.paid`, and `installment.waived`. The
    renewal event carries both policy identities and the lineage link; the
    billing plan event carries the complete schedule; the installment events
    carry the settled row and its payment evidence. The other SPEC 11.2.9 and
    11.2.13 names remain planned. There is no business subscriber or
    subscription registry yet.

