components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: policy
x-spec-section: SPEC 11.2.9
x-status: planned
x-implementation:
  publisher: none
  subscriber: none
  notes: >
    The current vertical slices emit no events; the outbox tables and the
    dispatcher described in SPEC 7.5 are not implemented. This document is the
    agreed event contract for the publisher that will be built.

x-consumed-events:
  - direct.claim.registered
  - direct.claim.allocated
  - direct.claim.paid
  - direct.claim.recovery-recorded
  - contract.cession.recorded
  - payment.payment.paid
  - document.document.associated
  - party.party.merged
