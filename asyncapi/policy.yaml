asyncapi: 3.0.0
id: urn:eia:contracts:events:policy
info:
  title: EIA Policy events
  version: 1.14.0
  summary: Published domain event names for the Policy vertical.
  description: >
    Event contract for the Policy vertical. The authoritative event names are
    SPEC 11.2.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Policy expert now publishes `policy.policy.created`,
    `policy.policy.updated`, `policy.policy.version-issued`,
    `policy.policy.endorsed`, `policy.policy.cancelled`,
    `policy.policy.reinstated`, `policy.policy.renewed`, `policy.policy.rated`,
    the billing facts
    `policy.billing-plan.created`, `policy.billing-plan.adjusted`,
    `policy.installment.paid`, `policy.installment.waived`, and
    `policy.dunning.sent`,
    `policy.mass-tort-profile.updated`, the program facts
    `policy.program.created` and `policy.policy.program-assigned`, and the
    credit-note facts `policy.credit-note.created`,
    `policy.credit-note.issued`, `policy.credit-note.applied`,
    `policy.credit-note.cancelled`, and `policy.credit-note.reversed` through
    the transactional outbox; those channels and operations are marked
    `x-status: implemented`. The `created` and `updated` names are additive: the
    catalog had no generic create or update fact. The billing plan name is
    `policy.billing-plan.created`; SPEC 11.2.13 calls the same fact
    `policy.billing.plan-created` and defines no installment paid or waived
    names, so the naming difference is recorded in MISMATCHES.md M-22 and M-27.
    The dunning fact is `policy.dunning.sent`; SPEC 11.2.13 publishes
    `policy.billing.dunning-changed` instead, so that naming difference is
    recorded in M-22 and M-38. The positive premium adjustment fact
    `policy.billing-plan.adjusted` is also new: SPEC 11.2.13 names no
    adjustment event, so the name and the derived-delta contract are recorded in
    M-22, M-27, and M-51. The renewal fact uses the SPEC 11.2.9 name and
    records the source-to-successor lineage. The mass tort fact also uses the
    SPEC 11.2.9 name and carries the allocation context Direct Claims consumes.
    The two program facts are new names with no SPEC 11.2.9 equivalent: a
    program is a catalog aggregate and the assignment is a policy command, so
    the names, the aggregate type, and the nullable membership fields are
    recorded in M-22 and M-39. The five credit-note facts are new names as
    well: SPEC 11.2.13 publishes only `policy.billing.credit-note-issued`, and
    the implemented lifecycle has no approval or SAP step, so the names and the
    narrower status model are recorded in M-22 and M-41. The two legal-entity
    facts `policy.legal-entity.created` and
    `policy.policy.legal-entity-assigned` are also new names: the catalog create
    and the policy assignment both have SPEC 10.11.2/11.2.16 models but no SPEC
    11.2.9 event, and SPEC 11.2.16 names no event at all. The names, the nullable
    assignment, and the narrow catalog vocabulary are recorded in M-22 and M-43.
    The credit-application slice widens only the `applied` payload: it adds
    `installmentId`, the billing installment the note was credited against, and
    `creditedAmount`, that installment's cumulative credited amount after the
    application. The `issued` and `cancelled` payloads stay unchanged, and the
    additions keep `eventVersion` 1. The APPLIED installment link, the CREDITED
    installment state, and the net receivable totals are recorded in M-27 and
    M-41.
    The credit-note reversal slice adds a dedicated `reversed` payload rather
    than widening the shared one: `PolicyCreditNoteReversedData` requires
    `creditNoteId`, `noteNumber`, `installmentId` (nullable for a legacy APPLIED
    note), `amount`, `reason`, and `status: REVERSED`. The new event name and the
    payload keep `eventVersion` 1, and the reversal extension is recorded in
    M-22 and M-41.
    The cancellation-linked credit-note slice adds
    `policy.credit-note.created`, the DRAFT creation fact. Its
    `PolicyCreditNoteCreatedData` payload requires the base note identity, money,
    and DRAFT status members plus `createdAt`, and carries the optional
    `cancellationId` and `cancellationNumber` when the note refunds a
    cancellation; an unlinked billing adjustment omits both. The event keeps
    `eventVersion` 1, and the link rules are recorded in M-22 and M-41.
    The premium-audit slice adds the implemented
    `policy.policy.premium-audited` fact. Its `PolicyPremiumAuditedData` payload
    requires the policy identity and number, the premium before and after the
    audit, the signed delta, the policy currency, the audit effective date, and
    the mandatory reason. The name differs from the SPEC 11.2.9
    `policy.premium.audited`, which stays planned, and the fact is emitted with
    `policy.policy.version-issued` in the same transaction as the
    `PREMIUM_AUDIT` endorsement, version, and premium replacement. The event
    keeps `eventVersion` 1, and the name difference and the missing
    `policy_premium_audit` worksheet are recorded in M-22 and M-50.
    The rating slice adds the implemented `policy.policy.rated` fact. Its
    `PolicyPolicyRatedData` payload requires the policy identity and number, the
    written `premiumAmount`, the `currency`, the `ratingMethod`, the canonical
    `calcHash`, and the `worksheetId`. It is emitted only when the rating is
    applied, in the same transaction as the premium replacement, the aggregate
    version bump, and the worksheet insert; a calculation-only request writes no
    event. The name is new: SPEC 11.2.9 publishes no rating fact and SPEC
    11.2.14 models rating under a submission, so the implemented policy-scoped
    fact is recorded as `policy.policy.rated` (M-22, M-57).
    The remaining SPEC
    11.2.9 and 11.2.13 names are planned.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  PolicyPolicyCreated:
    address: policy.policy.created
    title: policy.policy.created
    description: >
      Emitted when a policy is persisted, in the same transaction as the
      row. The payload carries the policy identity, status, row version,
      term dates, premium and limit amounts as decimal strings, product
      code, and insured party.
    x-event-type: policy.policy.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyPolicyCreatedData:
        $ref: '#/components/messages/PolicyPolicyCreatedData'
  PolicyPolicyUpdated:
    address: policy.policy.updated
    title: policy.policy.updated
    description: >
      Emitted on every accepted policy status change. The payload carries
      `changedFields: [status]`, `from`, `to`, the optional `reason`, and
      the policy identity and row version.
    x-event-type: policy.policy.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyPolicyUpdatedData:
        $ref: '#/components/messages/PolicyPolicyUpdatedData'
  PolicyPolicyQuoted:
    address: policy.policy.quoted
    title: policy.policy.quoted
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.quoted
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyBound:
    address: policy.policy.bound
    title: policy.policy.bound
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.bound
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyIssued:
    address: policy.policy.issued
    title: policy.policy.issued
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.issued
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyVersionIssued:
    address: policy.policy.version-issued
    title: policy.policy.version-issued
    description: >
      Emitted when a policy version is issued, including the version issued
      by an endorsement, cancellation, or reinstatement. The payload carries
      the policy version identity, number, change type, effective window,
      immutable hash, and premium delta.
    x-event-type: policy.policy.version-issued
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyEndorsed:
    address: policy.policy.endorsed
    title: policy.policy.endorsed
    description: >
      Emitted when an endorsement is posted; the same command also issues a
      policy version and emits `policy.policy.version-issued`. The payload
      carries the endorsement identity, type, effective date, premium delta,
      coverage impact, and the issued version.
    x-event-type: policy.policy.endorsed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyCancelled:
    address: policy.policy.cancelled
    title: policy.policy.cancelled
    description: >
      Emitted when a cancellation is accepted; the same command also issues
      a policy version and emits `policy.policy.version-issued`. The payload
      carries the cancellation identity, type, reason, effective date,
      notice and term days, pro-rata percent, earned and return premium.
    x-event-type: policy.policy.cancelled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyReinstated:
    address: policy.policy.reinstated
    title: policy.policy.reinstated
    description: >
      Emitted when a cancelled policy is reinstated; the same command also
      issues a policy version and emits `policy.policy.version-issued`. The
      payload carries the reinstatement identity, cancellation reference,
      effective date, reason, approval evidence, and the issued version.
    x-event-type: policy.policy.reinstated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyBillingPlanCreated:
    address: policy.billing-plan.created
    title: policy.billing-plan.created
    description: >
      Emitted when the single ACTIVE billing plan and its complete installment
      schedule are created, in the same transaction as the plan and schedule
      rows. The payload carries the policy and plan identity, the plan total
      premium as a decimal string, currency, installment count, frequency, first
      due date, status, and the full ordered installment array, so a consumer
      can open receivables without a follow-up read.
    x-event-type: policy.billing-plan.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyBillingPlanAdjusted:
    address: policy.billing-plan.adjusted
    title: policy.billing-plan.adjusted
    description: >
      Emitted when a positive premium adjustment appends one DUE installment to
      the ACTIVE billing plan, in the same transaction as the plan-total and
      count movement, the appended installment, and the policy-version bump. The
      payload carries the policy and plan identity, the derived
      `adjustmentAmount` (the policy written premium less the plan's net
      premium), the resulting gross `newTotalPremium`, the appended
      `installmentId` and `installmentNumber`, its `dueDate`, and the trimmed
      `reason`. A rejected adjustment (no plan, a non-ACTIVE plan, the
      24-installment ceiling, or a non-positive remainder) emits no event.
    x-event-type: policy.billing-plan.adjusted
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyBillingPlanAdjustedData:
        $ref: '#/components/messages/PolicyBillingPlanAdjustedData'
  PolicyInstallmentPaid:
    address: policy.installment.paid
    title: policy.installment.paid
    description: >
      Emitted when one billing installment is settled as PAID, in the same
      transaction as the row change and the policy version bump. The payload
      carries the policy and plan identity, the installment identity and number,
      due date, amount as a decimal string, currency, terminal status, `paidAt`,
      and the optional `paymentId`. Repeating PAID is a no-op and emits no
      second event.
    x-event-type: policy.installment.paid
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyInstallmentWaived:
    address: policy.installment.waived
    title: policy.installment.waived
    description: >
      Emitted when one billing installment is settled as WAIVED, in the same
      transaction as the row change and the policy version bump. The payload
      carries the policy and plan identity, the installment identity and number,
      due date, amount as a decimal string, currency, terminal status, and null
      payment evidence. Repeating WAIVED is a no-op and emits no second event.
    x-event-type: policy.installment.waived
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyDunningSent:
    address: policy.dunning.sent
    title: policy.dunning.sent
    description: >
      Emitted when a dunning action is recorded against a collectible billing
      installment, in the same transaction as the action row and the policy
      version bump. The payload carries the policy identity and number, the
      dunned installment id, the escalation level, the delivery channel, the
      send instant, and the action status. A rejected action (a PAID, WAIVED,
      or fully CREDITED installment, or a repeated level) emits no event.
    x-event-type: policy.dunning.sent
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyDunningSentData:
        $ref: '#/components/messages/PolicyDunningSentData'
  PolicyCreditNoteCreated:
    address: policy.credit-note.created
    title: policy.credit-note.created
    description: >
      Emitted when a DRAFT credit note is created, in the same transaction as the
      note row, the policy-version bump, and the outbox row. The payload carries
      the policy identity and number, the credit-note identity and number, the
      note amount as a decimal string, the currency, status DRAFT, and
      `createdAt`. A cancellation-linked return-premium note additionally carries
      `cancellationId` and `cancellationNumber`, the `CX-{7 digits}` reference of
      the cancellation it refunds; an unlinked billing adjustment omits both
      members. A rejected link writes neither the note nor the event.
    x-event-type: policy.credit-note.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyCreditNoteCreatedData:
        $ref: '#/components/messages/PolicyCreditNoteCreatedData'
  PolicyCreditNoteIssued:
    address: policy.credit-note.issued
    title: policy.credit-note.issued
    description: >
      Emitted when a DRAFT credit note is issued, in the same transaction as the
      note row, the policy-version bump, and the outbox row. The payload carries
      the policy identity and number, the credit-note identity and number, the
      note amount as a decimal string, the currency, and status ISSUED. Creation
      itself writes `policy.credit-note.created`.
    x-event-type: policy.credit-note.issued
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyCreditNoteData:
        $ref: '#/components/messages/PolicyCreditNoteData'
  PolicyCreditNoteApplied:
    address: policy.credit-note.applied
    title: policy.credit-note.applied
    description: >
      Emitted when an ISSUED credit note is applied to an open billing
      installment, in the same transaction as the note row, the installment's
      credited amount, the policy-version bump, and the outbox row. The payload
      carries the policy identity and number, the credit-note identity and
      number, the note amount as a decimal string, the currency, status APPLIED,
      and the two application members: `installmentId`, the credited
      installment, and `creditedAmount`, that installment's cumulative credited
      amount after the application. APPLIED is terminal. A partial credit
      leaves the installment open; a credit that covers its uncredited
      remainder also moves it to CREDITED.
    x-event-type: policy.credit-note.applied
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyCreditNoteData:
        $ref: '#/components/messages/PolicyCreditNoteData'
  PolicyCreditNoteCancelled:
    address: policy.credit-note.cancelled
    title: policy.credit-note.cancelled
    description: >
      Emitted when a DRAFT or ISSUED credit note is cancelled, in the same
      transaction as the note row, the policy-version bump, and the outbox row.
      The payload carries the policy identity and number, the credit-note
      identity and number, the note amount as a decimal string, the currency,
      and status CANCELLED. A cancelled note preserves an `issuedAt` stamped
      earlier and never stamps `appliedAt`. CANCELLED is terminal.
    x-event-type: policy.credit-note.cancelled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyCreditNoteData:
        $ref: '#/components/messages/PolicyCreditNoteData'
  PolicyCreditNoteReversed:
    address: policy.credit-note.reversed
    title: policy.credit-note.reversed
    description: >
      Emitted when an APPLIED credit note is reversed, in the same transaction as
      the note row, the released installment credit, the policy-version bump, and
      the outbox row. The payload carries the credit-note identity and number,
      the `installmentId` that received the original credit (explicitly null for
      a legacy APPLIED note that predates installment application), the note
      amount as a decimal string, the required `reason` for the reversal, and
      status REVERSED. Reversal releases the note amount from the installment and
      reopens a fully credited row as DUE or OVERDUE when it no longer covers its
      gross amount. REVERSED is terminal.
    x-event-type: policy.credit-note.reversed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.13
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyCreditNoteReversedData:
        $ref: '#/components/messages/PolicyCreditNoteReversedData'
  PolicyPolicyRenewed:
    address: policy.policy.renewed
    title: policy.policy.renewed
    description: >
      Emitted when a policy is renewed into a successor DRAFT term, in the same
      transaction as the successor policy, its copied coverages, limits,
      insureds, locations, and initial DRAFT version. The payload is the
      successor policy identity, status, row version, term dates, premium, and
      limit, plus `renewedFromPolicyId` and both sides of the lineage:
      `sourcePolicyId` / `sourcePolicyNumber` and `newPolicyId` /
      `newPolicyNumber`. The source policy is not mutated and the event is not
      emitted for a rejected renewal.
    x-event-type: policy.policy.renewed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PolicyPolicyRenewedData:
        $ref: '#/components/messages/PolicyPolicyRenewedData'
  PolicyPolicyExpired:
    address: policy.policy.expired
    title: policy.policy.expired
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.expired
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyNonRenewed:
    address: policy.policy.non-renewed
    title: policy.policy.non-renewed
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.non-renewed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyVoided:
    address: policy.policy.voided
    title: policy.policy.voided
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.policy.voided
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPremiumChanged:
    address: policy.premium.changed
    title: policy.premium.changed
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.premium.changed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPremiumAudited:
    address: policy.premium.audited
    title: policy.premium.audited
    description: >
      Declared domain event for this vertical (SPEC 11.2.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: policy.premium.audited
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.2.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PolicyPolicyPremiumAudited:
    address: policy.policy.premium-audited
    title: policy.policy.premium-audited
    description: >
      Emitted when a premium audit replaces the policy premium, in the same
      transaction as the PREMIUM_AUDIT endorsement, the immutable PREMIUM_AUDIT
      policy version, the policy row update, and the outbox row. The payload is
      the audit contract: the policy identity and number, the premium before and
      after the audit, the signed `delta`, the policy `currency`, the audit
      `effectiveDate`, and the mandatory `reason`. The event is keyed by the
      policy id at the bumped aggregate version; the same command also emits
      `policy.policy.version-issued`. The name differs from the SPEC 11.2.9
      `policy.premium.audited`, which remains planned (M-22, M-50).
    x-event-type: policy.policy.premium-audited
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.2.9
    x-implemented-by: repos/eia-policy-expert/src/main/java/com/eia/policy/expert/PolicyEvents.java
