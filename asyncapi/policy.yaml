      same transaction as the conditional premium replacement, the aggregate
      version bump, and the worksheet insert. The payload is the rating
      contract: the policy identity and number, the written premium, the
      policy currency, the method, the canonical calculation hash, and the
      worksheet that evidences the calculation. A calculation-only rating
      (`apply` false or absent) persists the worksheet and writes no event. The
      name is new: SPEC 11.2.14 models a submission-scoped rating worksheet and
      SPEC 11.2.9 publishes no rating fact (M-22, M-57).
