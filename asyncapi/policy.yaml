components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    PolicyPolicyCreatedData:
      name: PolicyPolicyCreatedData
      title: policy.policy.created data
      summary: Minimal schema for the envelope data object of a created policy.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          status:
            type: string
          version:
            type: integer
          productCode:
            type: string
          insuredPartyId:
            type: string
            format: uuid
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          premiumAmount:
            type: string
            description: Decimal string with up to four fraction digits (SPEC 10.3).
          premiumCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          limitAmount:
            type: string
          limitCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          createdAt:
            type: string
            format: date-time
    PolicyPolicyUpdatedData:
      name: PolicyPolicyUpdatedData
      title: policy.policy.updated data
      summary: Minimal schema for the envelope data object of a policy status change.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
          - changedFields
        properties:
          policyId:
            type: string
            format: uuid
          policyNumber:
            type: string
          status:
            type: string
          version:
            type: integer
          changedFields:
            type: array
            items:
              type: string
          from:
            type: string
            description: Status before the accepted transition.
          to:
            type: string
            description: Status after the accepted transition.
          reason:
            type: string
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          premiumAmount:
            type: string
          premiumCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
          limitAmount:
            type: string
          limitCurrency:
            type: string
            pattern: '^[A-Z]{3}$'
    PolicyPolicyRenewedData:
      name: PolicyPolicyRenewedData
      title: policy.policy.renewed data
      summary: Minimal schema for the envelope data object of a renewed policy.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - status
          - version
          - renewedFromPolicyId
          - sourcePolicyId
          - sourcePolicyNumber
          - newPolicyId
          - newPolicyNumber
        properties:
          policyId:
            type: string
            format: uuid
            description: Successor policy id; equals newPolicyId.
          policyNumber:
            type: string
            description: Successor policy number; equals newPolicyNumber.
          status:
            type: string
            description: Successor status, always DRAFT at renewal.
          version:
            type: integer
            description: Successor row version, 0 at creation.
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
