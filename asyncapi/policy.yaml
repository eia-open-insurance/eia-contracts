              scale (four fraction digits).
          auditedPremium:
            type: string
            description: >
              Decimal-string written premium after the audit, at policy money
              scale (four fraction digits).
          delta:
            type: string
            description: >
              Signed decimal-string movement (`auditedPremium - previousPremium`),
              at policy money scale. Negative on a return premium.
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          effectiveDate:
            type: string
            format: date
          reason:
            type: string
            maxLength: 500
    PolicyPolicyRatedData:
      name: PolicyPolicyRatedData
