    PolicyPremiumAuditedData:
      name: PolicyPremiumAuditedData
      title: policy.policy.premium-audited data
      summary: One premium audit that replaced the policy premium.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - policyId
          - policyNumber
          - previousPremium
          - auditedPremium
          - delta
          - currency
          - effectiveDate
          - reason
        properties:
          policyId:
            type: string
