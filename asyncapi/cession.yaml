asyncapi: 3.0.0
id: urn:eia:contracts:events:cession
info:
  title: EIA Cession events
  version: 1.1.0
  summary: Published domain event names for the Cession vertical.
  description: >
    Event contract for the Cession vertical. The authoritative event names are
    SPEC 11.9.6; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Cession expert now publishes `cession.cession.created`,
    `cession.cession.updated`, and `cession.cession.handed-off` through the
    transactional outbox in the same transaction as the cession write; those
    channels and operations are marked `x-status: implemented`. The
    SPEC 11.9.6 contract and hand-off names remain planned. There is still no
    subscriber or inbox. The catalog and cross-vertical subscriptions live in
    event-catalog.yaml.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  CessionCessionCreated:
    address: cession.cession.created
    title: cession.cession.created
    description: >
      Emitted by the Cession expert when a cession case is persisted, in the
      same transaction as the row. The payload carries the case identity, book,
      policy and cession-contract references, status, ceded premium and loss,
      currency, and the row version.
    x-event-type: cession.cession.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.9.6
    x-implemented-by: repos/eia-cession-expert/src/main/java/com/eia/cession/expert/CessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  CessionCessionUpdated:
    address: cession.cession.updated
    title: cession.cession.updated
    description: >
      Emitted when a cession status changes through the lifecycle endpoint. The
      payload carries `changedFields: [status]`, `from`, `to`, and the row
      version. `HANDOFF_PENDING` and `HANDED_OFF` are not reachable through the
      status endpoint and use the hand-off channels instead.
    x-event-type: cession.cession.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.9.6
    x-implemented-by: repos/eia-cession-expert/src/main/java/com/eia/cession/expert/CessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  CessionCessionHandedOff:
    address: cession.cession.handed-off
    title: cession.cession.handed-off
    description: >
      Emitted when the FS-RI acknowledgement is persisted and the case moves to
      HANDED_OFF. The payload adds `fsriHandoffId`, `fsriStatus`, and
      `fsriHandedOffAt`. The FS-RI call itself is still synchronous; the event
      records the durable hand-off fact, it is not a hand-off queue.
    x-event-type: cession.cession.handed-off
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.9.6
    x-implemented-by: repos/eia-cession-expert/src/main/java/com/eia/cession/expert/CessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  CessionContractCreated:
    address: cession.contract.created
    title: cession.contract.created
    description: >
      Declared domain event for this vertical (SPEC 11.9.6). No publisher is
      implemented yet, so the channel is planned and the payload contract is
