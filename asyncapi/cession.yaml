components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: cession
x-spec-section: SPEC 11.9.6
x-status: planned
x-implementation:
  publisher: none
  subscriber: none
  notes: >
    The current vertical slices emit no events; the outbox tables and the
    dispatcher described in SPEC 7.5 are not implemented. This document is the
    agreed event contract for the publisher that will be built.

x-consumed-events: []
x-consumed-events-note: >
  SPEC 11.9.6 lists published events only. Cession pulls policy and claim facts through the domain API, not through subscriptions.
