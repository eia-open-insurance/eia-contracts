components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    NotificationTemplateData:
      name: NotificationTemplateData
      title: notifications.template.* data
      summary: Minimal schema for the envelope data object of a notification template fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - templateId
          - code
          - version
          - locale
          - status
          - approvedBy
        properties:
          templateId:
            type: string
            format: uuid
            description: Template id, which is also the outbox aggregate id.
          code:
            type: string
            maxLength: 64
            description: Template code; with version and locale it is the tenant-local identity.
          version:
            type: integer
            minimum: 1
            description: >
              Template version from the `(code, version, locale)` identity. It
              is not the event envelope's `aggregateVersion`, which is 1 on
              create, 2 on approval, and 3 on retirement.
          locale:
            type: string
            maxLength: 16
          status:
            type: string
            enum:
              - DRAFT
              - ACTIVE
              - RETIRED
          approvedBy:
            type: [string, 'null']
            format: uuid
            description: >
              Approver recorded by the approval command; JSON null on a DRAFT
              create and on a retirement from DRAFT.
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: notifications
x-spec-section: SPEC 11.8.9
x-status: partial
x-implementation:
  publisher: eia-notifications-expert
  subscriber: none
  notes: >
    Five implemented event names are written to the transactional outbox in the
    same transaction as the notification or template write and dispatched by the
    platform outbox dispatcher when `eia.outbox.enabled=true`. Two are
    notification facts; three are the notification template lifecycle facts
    (created, approved, retired). The SPEC 11.8.9 notification names remain
    planned and the template facts have no SPEC name. There is no subscriber,
    inbox, or subscription registry yet.

x-consumed-events: []
x-consumed-events-note: >
  Consumed events are every domain event with a notification rule. The subscription registry, not this catalog, is the authoritative list (SPEC 11.8.9).
