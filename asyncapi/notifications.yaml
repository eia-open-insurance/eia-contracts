components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    NotificationCreatedData:
      name: NotificationCreatedData
      title: notifications.notification.created data
      summary: Minimal schema for the envelope data object of a created notification fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - notificationId
          - notificationNumber
          - notificationType
          - channel
          - status
          - recipientPartyId
          - version
        properties:
          notificationId:
            type: string
            format: uuid
            description: Notification id, which is also the outbox aggregate id.
          notificationNumber:
            type: string
            description: Tenant-local notification number, for example `NTF-2026-0000001`.
          notificationType:
            type: string
            description: >
              One of the closed `NotificationType` values (SPEC 11.8.5 v1 plus
              the implemented `DUNNING_NOTICE`).
          channel:
            type: string
            enum:
              - IN_APP
              - EMAIL
              - SMS
              - PUSH
              - WEBHOOK
              - TASK
              - DIGEST
          status:
            type: string
            description: Lifecycle status at draft time, normally `CREATED`.
          recipientPartyId:
            type: string
            format: uuid
          version:
            type: integer
            minimum: 0
            description: >
              Notification row version. The envelope aggregate version is this
              value plus one on create.
          templateCode:
            type: [string, 'null']
            maxLength: 64
            description: Template code when a template was resolved; omitted when null.
          templateVersion:
            type: [integer, 'null']
            minimum: 1
            description: Template version when a template was resolved; omitted when null.
          scheduledAt:
            type: [string, 'null']
            format: date-time
            description: Scheduled instant when the draft carries one; omitted when null.
          sourceType:
            oneOf:
              - type: string
                enum:
                  - DIRECT_CLAIM
                  - ASSUMED_CLAIM
                  - POLICY
                  - CONTRACT
                  - PAYMENT
                  - OTHER
              - type: 'null'
            description: >
              Optional source classification. Emitted together with `sourceId`
              when the notification is linked to a business record; omitted
              when the notification has no source link.
          sourceId:
            type: [string, 'null']
            format: uuid
            description: >
              UUID of the source record, emitted with `sourceType`; omitted when
              the notification has no source link.
          sourceReference:
            type: [string, 'null']
            maxLength: 64
            description: >
              Optional human-readable source reference (for example
              `CLM-2026-0000001`); omitted when null. It never replaces
              `sourceId`.
    NotificationSentData:
      name: NotificationSentData
      title: notifications.notification.sent data
      summary: Minimal schema for the envelope data object of a sent notification fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - notificationId
          - notificationNumber
          - notificationType
          - channel
          - status
          - recipientPartyId
          - version
          - from
          - to
        properties:
          notificationId:
            type: string
            format: uuid
            description: Notification id, which is also the outbox aggregate id.
          notificationNumber:
            type: string
            description: Tenant-local notification number, for example `NTF-2026-0000001`.
          notificationType:
            type: string
            description: >
              One of the closed `NotificationType` values (SPEC 11.8.5 v1 plus
              the implemented `DUNNING_NOTICE`).
          channel:
            type: string
            enum:
              - IN_APP
              - EMAIL
              - SMS
              - PUSH
              - WEBHOOK
              - TASK
              - DIGEST
          status:
            type: string
            description: Lifecycle status after the send, normally `SENT`.
          recipientPartyId:
            type: string
            format: uuid
          version:
            type: integer
            minimum: 0
            description: >
              Notification row version after the send. The envelope aggregate
              version is this value plus one.
          from:
            type: string
            description: Status before the send (`CREATED` or `QUEUED`).
          to:
            type: string
            description: Status after the send, normally `SENT`.
          sentAt:
            type: [string, 'null']
            format: date-time
            description: Instant the send was recorded; omitted when null.
          sourceType:
            oneOf:
              - type: string
                enum:
                  - DIRECT_CLAIM
                  - ASSUMED_CLAIM
                  - POLICY
                  - CONTRACT
                  - PAYMENT
                  - OTHER
              - type: 'null'
            description: >
              Optional source classification. Emitted together with `sourceId`
              when the notification is linked to a business record; omitted
              when the notification has no source link.
          sourceId:
            type: [string, 'null']
            format: uuid
            description: >
              UUID of the source record, emitted with `sourceType`; omitted when
              the notification has no source link.
          sourceReference:
            type: [string, 'null']
            maxLength: 64
            description: >
              Optional human-readable source reference (for example
              `CLM-2026-0000001`); omitted when null. It never replaces
              `sourceId`.
    NotificationTemplateData:
      name: NotificationTemplateData
      title: notifications.template.* data
      summary: Minimal schema for the envelope data object of a notification template fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - templateId
          - code
          - version
          - locale
          - status
          - approvedBy
        properties:
          templateId:
            type: string
            format: uuid
            description: Template id, which is also the outbox aggregate id.
          code:
            type: string
            maxLength: 64
            description: Template code; with version and locale it is the tenant-local identity.
          version:
            type: integer
            minimum: 1
            description: >
              Template version from the `(code, version, locale)` identity. It
              is not the event envelope's `aggregateVersion`, which is 1 on
              create, 2 on approval, and 3 on retirement.
          locale:
            type: string
            maxLength: 16
          status:
            type: string
            enum:
              - DRAFT
              - ACTIVE
              - RETIRED
          approvedBy:
            type: [string, 'null']
            format: uuid
            description: >
              Approver recorded by the approval command; JSON null on a DRAFT
              create and on a retirement from DRAFT.
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: notifications
x-spec-section: SPEC 11.8.9
x-status: partial
x-implementation:
  publisher: eia-notifications-expert
  subscriber: none
  notes: >
    Five implemented event names are written to the transactional outbox in the
    same transaction as the notification or template write and dispatched by the
    platform outbox dispatcher when `eia.outbox.enabled=true`. Two are
    notification facts; three are the notification template lifecycle facts
    (created, approved, retired). Both notification facts carry the optional
    flat source link (`sourceType`, `sourceId`, `sourceReference`) in their
    `data` object, emitted only for a linked notification, so `eventVersion`
    stays 1. The SPEC 11.8.9 notification names remain planned and the template
    facts have no SPEC name. There is no subscriber, inbox, or subscription
    registry yet.

x-consumed-events: []
x-consumed-events-note: >
  Consumed events are every domain event with a notification rule. The subscription registry, not this catalog, is the authoritative list (SPEC 11.8.9).
