asyncapi: 3.0.0
id: urn:eia:contracts:events:notifications
info:
  title: EIA Notifications events
  version: 1.3.0
  summary: Published domain event names for the Notifications vertical.
  description: >
    Event contract for the Notifications vertical. The authoritative event names
    are SPEC 11.8.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Notifications expert publishes `notifications.notification.created`,
    `notifications.notification.sent`, and the template-registry facts
    `notifications.template.created`, `.approved`, and `.retired` through the
    transactional outbox; those channels and operations are marked
    `x-status: implemented`. The SPEC 11.8.9 notification verbs (`issued`,
    `delivered`, and so on) remain planned, and the template facts have no SPEC
    name. The shared event library requires the vertical segment to be
    `notifications` (plural), which is why the implemented names use that
    prefix.

    The created and sent payloads also carry the optional flat source link
    (`sourceType`, `sourceId`, `sourceReference`) when the notification was
    drafted from a claim, policy, contract, payment, or other source record.
    `sourceType` and `sourceId` are emitted together; `sourceReference` is
    optional metadata of at most 64 characters. An unlinked notification omits
    all three members, so `eventVersion` stays 1.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  NotificationsNotificationCreated:
    address: notifications.notification.created
    title: notifications.notification.created
    description: >
      Emitted by the Notifications expert when a notification is drafted, in the
      same transaction as the row. The payload carries the notification
      identity, type, channel, status, recipient, optional template and schedule
      details, the row version, and the optional source link (`sourceType`,
      `sourceId`, `sourceReference`) identifying the business record that caused
      the notification. Each present source field is emitted; all three are
      omitted when the notification has no source link.
    x-event-type: notifications.notification.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      NotificationCreatedData:
        $ref: '#/components/messages/NotificationCreatedData'
  NotificationsNotificationSent:
    address: notifications.notification.sent
    title: notifications.notification.sent
    description: >
      Emitted when a CREATED or QUEUED notification is issued and `sentAt` is
      recorded, after the approved-template and schedule checks. The payload
      carries `from`, `to`, `status`, `sentAt`, the row version, and the
      optional source link (`sourceType`, `sourceId`, `sourceReference`)
      identifying the business record that caused the notification. Each present
      source field is emitted; all three are omitted when the notification has
      no source link.
    x-event-type: notifications.notification.sent
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      NotificationSentData:
        $ref: '#/components/messages/NotificationSentData'
  NotificationsTemplateCreated:
    address: notifications.template.created
    title: notifications.template.created
    description: >
      Emitted by the Notifications expert when a notification template is
      created DRAFT, in the same transaction as the row insert. The
      `NotificationTemplate` aggregate uses aggregate version 1 for the create.
      The payload carries the template identity, code, and template version, its
      locale, `DRAFT` status, and a null approver.
    x-event-type: notifications.template.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationTemplateEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      NotificationTemplateData:
        $ref: '#/components/messages/NotificationTemplateData'
  NotificationsTemplateApproved:
    address: notifications.template.approved
    title: notifications.template.approved
    description: >
      Emitted when a DRAFT template is approved into ACTIVE, in the same
      transaction as the status update that records `approvedBy` and
      `approvedAt`. The `NotificationTemplate` aggregate moves to version 2.
      The payload carries the template identity, code, and template version, its
      locale, `ACTIVE` status, and the approver.
    x-event-type: notifications.template.approved
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationTemplateEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      NotificationTemplateData:
        $ref: '#/components/messages/NotificationTemplateData'
  NotificationsTemplateRetired:
    address: notifications.template.retired
    title: notifications.template.retired
    description: >
      Emitted when a DRAFT or ACTIVE template is retired, in the same
      transaction as the status update, so it can no longer issue notifications
      (NTF-14). The `NotificationTemplate` aggregate moves to version 3. The
      payload carries the template identity, code, and template version, its
      locale, `RETIRED` status, and the approver (null when the template was
      retired from DRAFT).
    x-event-type: notifications.template.retired
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationTemplateEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      NotificationTemplateData:
        $ref: '#/components/messages/NotificationTemplateData'
  NotificationsNotificationIssued:
    address: notifications.notification.issued
    title: notifications.notification.issued
    description: >
      Declared domain event for this vertical (SPEC 11.8.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: notifications.notification.issued
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.8.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
