asyncapi: 3.0.0
id: urn:eia:contracts:events:notifications
info:
  title: EIA Notifications events
  version: 1.1.0
  summary: Published domain event names for the Notifications vertical.
  description: >
    Event contract for the Notifications vertical. The authoritative event names
    are SPEC 11.8.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Notifications expert now publishes `notifications.notification.created`
    and `notifications.notification.sent` through the transactional outbox;
    those channels and operations are marked `x-status: implemented`. The
    SPEC 11.8.9 verbs (`issued`, `delivered`, and so on) remain planned. The
    shared event library requires the vertical segment to be `notifications`
    (plural), which is why the implemented names use that prefix.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  NotificationsNotificationCreated:
    address: notifications.notification.created
    title: notifications.notification.created
    description: >
      Emitted by the Notifications expert when a notification is drafted, in the
      same transaction as the row. The payload carries the notification
      identity, type, channel, status, recipient, optional template and schedule
      details, and the row version.
    x-event-type: notifications.notification.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  NotificationsNotificationSent:
    address: notifications.notification.sent
    title: notifications.notification.sent
    description: >
      Emitted when a CREATED or QUEUED notification is issued and `sentAt` is
      recorded, after the approved-template and schedule checks. The payload
      carries `from`, `to`, `status`, `sentAt`, and the row version.
    x-event-type: notifications.notification.sent
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.8.9
    x-implemented-by: repos/eia-notifications-expert/src/main/java/com/eia/notifications/expert/NotificationEvents.java
