components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: notifications
x-spec-section: SPEC 11.8.9
x-status: partial
x-implementation:
  publisher: eia-notifications-expert
  subscriber: none
  notes: >
    Two implemented event names are written to the transactional outbox in the
    same transaction as the notification write and dispatched by the platform
    outbox dispatcher when `eia.outbox.enabled=true`. The SPEC 11.8.9 names
    remain planned. There is no subscriber, inbox, or subscription registry yet.

x-consumed-events: []
x-consumed-events-note: >
  Consumed events are every domain event with a notification rule. The subscription registry, not this catalog, is the authoritative list (SPEC 11.8.9).
