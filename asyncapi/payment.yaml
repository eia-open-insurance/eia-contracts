asyncapi: 3.0.0
id: urn:eia:contracts:events:payment
info:
  title: EIA Payment events
  version: 1.4.0
  summary: Published domain event names for the Payment vertical.
  description: >
    Event contract for the Payment vertical. The authoritative event names are
    SPEC 11.7.10; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Payment expert now publishes `payment.payment.created`,
    `payment.payment.updated`, `payment.payment.status-changed`,
    `payment.allocation.created`, and `payment.allocation.reversed` through the
    transactional outbox; those channels and operations are marked
    `x-status: implemented`. A status write emits `updated` and
    `status-changed` together at the same aggregate version.
    `payment.payment.created` carries the optional source link (`sourceType`,
    `sourceId`, `sourceReference`) in its data object; a classified source
    always carries `sourceId`, and `sourceReference` is the denormalized human
    label that lets a consumer link the payment to its claim or policy without
    an N+1 lookup. `payment.allocation.created` and
    `payment.allocation.reversed` are new child-aggregate names with no SPEC
    11.7.10 equivalent (MISMATCHES.md M-22 and M-35): the created payload
    carries the parent payment identity, the allocation fields, and the
    payment-level allocation totals at `PaymentAllocation` version 1, while the
    reversed payload carries the parent payment, the allocation, the released
    amount, the required reason, and the reversal instant at version 2. The
    remaining SPEC 11.7.10 names are planned. Payment is a shared financial
    service and the current API has no book input, so these events are stamped
    DIRECT.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  PaymentPaymentUpdated:
    address: payment.payment.updated
    title: payment.payment.updated
    description: >
      Coarse aggregate-change fact emitted with `status-changed` on a lifecycle
      write, at the same aggregate version. The payload carries
      `changedFields: [status]`, `from`, `to`, and the row version.
    x-event-type: payment.payment.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.7.10
    x-implemented-by: repos/eia-payment-expert/src/main/java/com/eia/payment/expert/PaymentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PaymentPaymentStatusChanged:
    address: payment.payment.status-changed
    title: payment.payment.status-changed
    description: >
      Emitted on every accepted payment status transition. The payload carries
      the new `status`, `version`, `from`, `to`, and the optional `reason`. It is
      published together with `payment.payment.updated` at the same aggregate
      version.
    x-event-type: payment.payment.status-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.7.10
    x-implemented-by: repos/eia-payment-expert/src/main/java/com/eia/payment/expert/PaymentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PaymentPaymentCreated:
    address: payment.payment.created
    title: payment.payment.created
    description: >
      Emitted by the Payment expert when a payment is persisted, in the same
      transaction as the row. The payload carries the payment identity, type,
      status, amount, currency, payee, optional payment date, the row version,
      and the optional source link (`sourceType`, `sourceId`,
      `sourceReference`). `sourceType` is DIRECT_CLAIM, ASSUMED_CLAIM, POLICY,
      or OTHER; the three classified types carry `sourceId`, while OTHER may
      carry only `sourceReference`. The source fields are optional so an
      unlinked payment stays a valid payload.
    x-event-type: payment.payment.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.7.10
    x-implemented-by: repos/eia-payment-expert/src/main/java/com/eia/payment/expert/PaymentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PaymentPaymentCreatedData:
        $ref: '#/components/messages/PaymentPaymentCreatedData'
  PaymentAllocationCreated:
    address: payment.allocation.created
    title: payment.allocation.created
    description: >
      Emitted by the Payment expert when an allocation is persisted, in the same
      transaction as the row. The payload carries the parent payment identity,
      the allocation target and component, the allocation amount and currency,
      and the payment-level `totalAllocated` and `paymentAmount` totals. An
      allocation always uses the payment currency and is append-only. Because an
      allocation never bumps the payment row version, the envelope uses the
      allocation id as its own `PaymentAllocation` aggregate at version 1; that
      keeps the outbox aggregate-version key unique when one payment receives
      several allocations.
    x-event-type: payment.allocation.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.7.10
    x-implemented-by: repos/eia-payment-expert/src/main/java/com/eia/payment/expert/PaymentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PaymentAllocationCreatedData:
        $ref: '#/components/messages/PaymentAllocationCreatedData'
  PaymentAllocationReversed:
    address: payment.allocation.reversed
    title: payment.allocation.reversed
    description: >
      Emitted by the Payment expert when an allocation is reversed, in the same
      transaction as the reversal stamp. The allocation row is preserved and
      only gains `reversedAt`/`reversalReason`; the payload carries the parent
      payment identity, the allocation fields, the released amount, the
      required reason, and the reversal instant. The reversal frees the amount
      for a later allocation and moves the `PaymentAllocation` child aggregate
      from version 1 (created) to version 2 (reversed).
    x-event-type: payment.allocation.reversed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.7.10
    x-implemented-by: repos/eia-payment-expert/src/main/java/com/eia/payment/expert/PaymentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      PaymentAllocationReversedData:
        $ref: '#/components/messages/PaymentAllocationReversedData'
  PaymentPaymentAuthorized:
    address: payment.payment.authorized
    title: payment.payment.authorized
    description: >
      Declared domain event for this vertical (SPEC 11.7.10). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: payment.payment.authorized
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.7.10
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  PaymentPaymentIssued:
    address: payment.payment.issued
    title: payment.payment.issued
    description: >
