    summary: Publish payment.payment.created
    description: >
      Publishes payment.payment.created through the transactional outbox in the
      same transaction as the payment insert (SPEC 7.5.1).
    x-event-type: payment.payment.created
    x-status: implemented
  publishPaymentPaymentUpdated:
    action: send
    channel:
      $ref: '#/channels/PaymentPaymentUpdated'
    summary: Publish payment.payment.updated
