  notes: >
    Five implemented event names are written to the transactional outbox in the
    same transaction as the aggregate write and dispatched by the platform
    outbox dispatcher when `eia.outbox.enabled=true`.
    `payment.payment.created` carries the optional source link; the source
    fields are absent or null on an unlinked payment.
    `payment.allocation.created` and `payment.allocation.reversed` are the
    child-aggregate facts for one append-only allocation: the create envelope
    uses the allocation id at version 1 and its payload carries the parent
    payment identity and the payment-level allocation totals; the reversal
    envelope uses the same allocation id at version 2 and its payload carries
    the parent payment, the allocation fields, the released amount, the required
    reason, and the reversal instant. The other SPEC 11.7.10 names remain
    planned. There is no subscriber, inbox, or subscription registry yet.

