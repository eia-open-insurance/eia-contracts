components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    PaymentPaymentCreatedData:
      name: PaymentPaymentCreatedData
      title: payment.payment.created data
      summary: Minimal schema for the envelope data object of a created payment.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - paymentId
          - paymentNumber
          - paymentType
          - status
          - amount
          - currency
          - payeePartyId
          - version
        properties:
          paymentId:
            type: string
            format: uuid
          paymentNumber:
            type: string
            pattern: '^PAY-[0-9]{4}-[0-9]{7}$'
          paymentType:
            type: string
            enum:
              - INDEMNITY
              - DEFENSE_COST
              - ALAE
              - EXPENSE
              - MEDICAL
              - STRUCTURED_SETTLEMENT
              - ANNUITY
              - LIEN_PAYMENT
              - TRUST_DEPOSIT
              - TRUST_DISTRIBUTION
              - SUBROGATION_RECOVERY
              - SALVAGE_RECOVERY
              - ASSUMED_RECOVERY
              - DEDUCTIBLE_REIMBURSEMENT
              - PREMIUM
              - COMMISSION
              - BROKERAGE
              - CASH_CALL
              - TECHNICAL_ACCOUNT_SETTLEMENT
              - SECURITY_COLLATERAL
              - REFUND
              - OFFSET
              - INTERCOMPANY
              - TAX
              - FEE
          status:
            type: string
          amount:
            type: string
            description: Decimal string with up to four fraction digits (SPEC 10.3).
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          payeePartyId:
            type: string
            format: uuid
          paymentDate:
            type: [string, 'null']
            format: date
          version:
            type: integer
            minimum: 0
          sourceType:
            oneOf:
              - type: string
                enum:
                  - DIRECT_CLAIM
                  - ASSUMED_CLAIM
                  - POLICY
                  - OTHER
              - type: 'null'
            description: >
              Optional source classification. Null when the payment has no
              source link.
          sourceId:
            type: [string, 'null']
            format: uuid
            description: >
              UUID of the source claim or policy. Set for a classified source;
              null for an OTHER reference-only source or an unlinked payment.
          sourceReference:
            type: [string, 'null']
            maxLength: 64
            description: >
              Human-readable source reference (for example
              `CLM-2026-0000001`) so consumers can link the source without an
              N+1 lookup. Never replaces `sourceId` for a classified source.
    PaymentAllocationCreatedData:
      name: PaymentAllocationCreatedData
      title: payment.allocation.created data
      summary: Minimal schema for the envelope data object of a created payment allocation.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - paymentId
          - paymentNumber
          - targetType
          - targetId
          - component
          - amount
          - currency
          - totalAllocated
          - paymentAmount
        properties:
          paymentId:
            type: string
            format: uuid
            description: Parent payment id, which is also the outbox partition key.
          paymentNumber:
            type: string
            pattern: '^PAY-[0-9]{4}-[0-9]{7}$'
          targetType:
            type: string
            enum:
              - DIRECT_CLAIM
              - ASSUMED_CLAIM
              - POLICY
          targetId:
            type: string
            format: uuid
          component:
            type: string
            enum:
              - INDEMNITY
              - DEFENSE_COST
              - ALAE
              - EXPENSE
              - COMMISSION
              - OTHER
          amount:
            type: string
            description: Decimal string with up to four fraction digits (SPEC 10.3).
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
            description: Always the parent payment currency.
          totalAllocated:
            type: string
            description: >
              Decimal string of the payment's total allocated amount after this
              allocation (SPEC 10.3).
          paymentAmount:
            type: string
            description: Decimal string of the parent payment amount (SPEC 10.3).
    PaymentAllocationReversedData:
      name: PaymentAllocationReversedData
      title: payment.allocation.reversed data
      summary: Minimal schema for the envelope data object of a reversed payment allocation.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - paymentId
          - allocationId
