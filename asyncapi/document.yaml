asyncapi: 3.0.0
id: urn:eia:contracts:events:document
info:
  title: EIA Document events
  version: 1.5.0
  summary: Published domain event names for the Document vertical.
  description: >
    Event contract for the Document vertical. The authoritative event names are
    SPEC 11.6.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Document expert now publishes `document.document.created`,
    `document.document.updated`, `document.document.status-changed`,
    `document.link.added`, `document.link.removed`,
    `document.content.uploaded`, `document.legal-hold.placed`,
    `document.legal-hold.released`, and `document.document.disposed` through
    the transactional outbox; those channels and operations are marked
    `x-status: implemented`. A status write emits `updated` and
    `status-changed` together at the same aggregate version. A link write emits
    one `added` or `removed` fact with the `DocumentLink` aggregate at version
    1. A content write emits one `uploaded` fact with the `DocumentContent`
    aggregate at the content revision, in the same transaction as the revision
    append. A hold write emits one `legal-hold.placed` or
    `legal-hold.released` fact, and a disposition emits one
    `document.document.disposed` fact, each with the `Document` aggregate at
    version + 1. The content payload carries the revision as `version`; it is
    also the aggregate version, and the fact keeps `eventVersion` 1 because
    adding a payload field is compatible (EV-05). The hold payload carries the
    reason and the resulting status; the release reason is the lifted hold
    reason. The disposed payload carries the disposition reason and DISPOSED.
    The SPEC 11.6.9 names remain planned, except `document.document.disposed`,
    which the hold/disposition slice implements. Document metadata is shared by
    both books and the current API has no book input, so these events are
    stamped DIRECT.

    The two link names and `document.content.uploaded` are new and have no
    SPEC 11.6.9 equivalent: the SPEC association fact is
    `document.document.associated`, and SPEC 11.6.9 defines no content-upload
    fact (MISMATCHES.md M-22, M-26, M-40). The two legal-hold names are also new:
    SPEC 11.6.9 publishes `document.document.held` and
    `document.document.hold-released`, which remain planned (M-22, M-44). The
    2026-10-21 content-version slice adds the `version` payload member but no
    event name or channel; the 2026-10-21 hold/disposition slice adds the two
    legal-hold names and implements `document.document.disposed`.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  DocumentDocumentCreated:
    address: document.document.created
    title: document.document.created
    description: >
      Emitted by the Document expert when document metadata is registered, in
      the same transaction as the row. The payload carries the document
      identity, title, type, classification, status, optional retention date,
      and the row version.
    x-event-type: document.document.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentDocumentUpdated:
    address: document.document.updated
    title: document.document.updated
    description: >
      Coarse aggregate-change fact emitted with `status-changed` on a lifecycle
      write, at the same aggregate version. The payload carries
      `changedFields: [status]`, `from`, `to`, and the row version.
    x-event-type: document.document.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentDocumentStatusChanged:
    address: document.document.status-changed
    title: document.document.status-changed
    description: >
      Emitted on every accepted document status transition. The payload carries
      the new `status`, `version`, `from`, and `to`. It is published together
      with `document.document.updated` at the same aggregate version.
    x-event-type: document.document.status-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentLinkAdded:
    address: document.link.added
    title: document.link.added
    description: >
      Emitted by the Document expert when a document association link is
      inserted, in the same transaction as the row. The payload carries the
      document identity and number, the link identity, `linkedType`, `linkedId`,
      and the optional `linkedReference`. The aggregate is `DocumentLink` with
      the link id and version 1. This name is new and has no SPEC 11.6.9
      equivalent (the SPEC association fact is `document.document.associated`);
      see MISMATCHES.md M-22 and M-26.
    x-event-type: document.link.added
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentLinkEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentLinkRemoved:
    address: document.link.removed
    title: document.link.removed
    description: >
      Emitted by the Document expert when a document association link is
      deleted, in the same transaction as the delete. The payload carries the
      document identity and number, the link identity, `linkedType`, `linkedId`,
      and the optional `linkedReference`. The aggregate is `DocumentLink` with
      the link id and version 1. SPEC 11.6.9 defines no association-removal
      event, so this name is new (MISMATCHES.md M-22 and M-26).
    x-event-type: document.link.removed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentLinkEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentContentUploaded:
    address: document.content.uploaded
    title: document.content.uploaded
    description: >
      Emitted by the Document expert when the current content of a document is
      stored or replaced, in the same transaction as the immutable revision
      row. The payload carries the document identity and number, the content
      revision as `version`, the stored display filename, the stored MIME type,
      the exact size in bytes, and the lowercase SHA-256 digest.
      `DocumentContent` is its own aggregate, keyed by the document id, and the
      aggregate version is the content revision, so replacing the content
      produces a new event. The fact is stamped DIRECT. The name is new and has
      no SPEC 11.6.9 equivalent (MISMATCHES.md M-22 and M-40).
    x-event-type: document.content.uploaded
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentContentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      DocumentContentUploadedData:
        $ref: '#/components/messages/DocumentContentUploadedData'
  DocumentLegalHoldPlaced:
    address: document.legal-hold.placed
    title: document.legal-hold.placed
    description: >
      Emitted by the Document expert when a legal hold is placed on one
      document, in the same transaction as the row update. The payload carries
      the document identity and number, the trimmed hold `reason`, and the
      resulting `status` ON_HOLD. The aggregate is `Document` with the document
      id, and the aggregate version is the row version + 1. The name is new and
      has no SPEC 11.6.9 equivalent; the SPEC fact is `document.document.held`,
      which remains planned (MISMATCHES.md M-22 and M-44).
    x-event-type: document.legal-hold.placed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      DocumentLifecycleData:
        $ref: '#/components/messages/DocumentLifecycleData'
  DocumentLegalHoldReleased:
    address: document.legal-hold.released
    title: document.legal-hold.released
    description: >
      Emitted by the Document expert when a legal hold is released, in the same
      transaction as the row update. The payload carries the document identity
      and number, the lifted hold `reason`, and the restored `status` (the
      status snapshotted when the hold was placed, or ARCHIVED when the
      snapshot is absent or unrecognised). The aggregate is `Document` with the
      document id, and the aggregate version is the row version + 1. The name is
      new and has no SPEC 11.6.9 equivalent; the SPEC fact is
      `document.document.hold-released`, which remains planned
      (MISMATCHES.md M-22 and M-44).
    x-event-type: document.legal-hold.released
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      DocumentLifecycleData:
        $ref: '#/components/messages/DocumentLifecycleData'
  DocumentDocumentRegistered:
    address: document.document.registered
    title: document.document.registered
    description: >
      Declared domain event for this vertical (SPEC 11.6.9). No publisher is
