components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    DocumentContentUploadedData:
      name: DocumentContentUploadedData
      title: document.content.uploaded data
      summary: The stored content row and its digest.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - documentId
          - documentNumber
          - version
          - fileName
          - contentType
          - sizeBytes
          - sha256
        properties:
          documentId:
            type: string
            format: uuid
          documentNumber:
            type: string
            description: Tenant-visible document number of the owning document.
          version:
            type: integer
            minimum: 1
            description: >
              Content revision number, starting at 1 and increasing by one per
              accepted upload. It is the aggregate version of the fact and the
              same value as `currentVersion` in the content metadata.
          fileName:
            type: string
            description: Stored display filename, with directory components removed.
          contentType:
            type: string
            description: Stored file MIME type without parameters.
          sizeBytes:
            type: integer
            minimum: 0
            maximum: 10485760
          sha256:
            type: string
            pattern: '^[a-f0-9]{64}$'
            description: Lowercase SHA-256 of the exact stored bytes.
    DocumentLifecycleData:
      name: DocumentLifecycleData
      title: Document hold and disposition lifecycle data
      summary: The document, the hold or disposition reason, and the resulting status.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - documentId
          - documentNumber
          - reason
          - status
        properties:
          documentId:
            type: string
            format: uuid
          documentNumber:
            type: string
            description: Tenant-visible document number of the affected document.
          reason:
            type: string
            maxLength: 500
            description: >
              Trimmed hold reason for a hold fact, the lifted hold reason for a
              release, or the disposition reason for a disposed fact. A
              disposition with no supplied reason records RETENTION_EXPIRED.
          status:
            type: string
            description: >
              Resulting document status: ON_HOLD for a placed hold, the restored
              status for a release, and DISPOSED for a disposition.
            enum:
              - PENDING_UPLOAD
              - RECEIVED
              - SCANNING
              - PROCESSING
              - CLASSIFIED
              - ACTIVE
              - SUPERSEDED
              - ON_HOLD
              - ARCHIVED
              - DISPOSED
              - REJECTED
              - FAILED
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
