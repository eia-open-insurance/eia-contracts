asyncapi: 3.0.0
id: urn:eia:contracts:events:document
info:
  title: EIA Document events
  version: 1.1.0
  summary: Published domain event names for the Document vertical.
  description: >
    Event contract for the Document vertical. The authoritative event names are
    SPEC 11.6.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Document expert now publishes `document.document.created`,
    `document.document.updated`, and `document.document.status-changed` through
    the transactional outbox; those channels and operations are marked
    `x-status: implemented`. A status write emits `updated` and
    `status-changed` together at the same aggregate version. The SPEC 11.6.9
    names remain planned. Document metadata is shared by both books and the
    current API has no book input, so these events are stamped DIRECT.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  DocumentDocumentCreated:
    address: document.document.created
    title: document.document.created
    description: >
      Emitted by the Document expert when document metadata is registered, in
      the same transaction as the row. The payload carries the document
      identity, title, type, classification, status, optional retention date,
      and the row version.
    x-event-type: document.document.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentDocumentUpdated:
    address: document.document.updated
    title: document.document.updated
    description: >
      Coarse aggregate-change fact emitted with `status-changed` on a lifecycle
      write, at the same aggregate version. The payload carries
      `changedFields: [status]`, `from`, `to`, and the row version.
    x-event-type: document.document.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentDocumentStatusChanged:
    address: document.document.status-changed
    title: document.document.status-changed
    description: >
      Emitted on every accepted document status transition. The payload carries
      the new `status`, `version`, `from`, and `to`. It is published together
      with `document.document.updated` at the same aggregate version.
    x-event-type: document.document.status-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.6.9
    x-implemented-by: repos/eia-document-expert/src/main/java/com/eia/document/expert/DocumentEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  DocumentDocumentRegistered:
    address: document.document.registered
    title: document.document.registered
    description: >
      Declared domain event for this vertical (SPEC 11.6.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: document.document.registered
