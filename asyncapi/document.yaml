x-implementation:
  publisher: eia-document-expert
  subscriber: none
  notes: >
    Nine implemented event names are written to the transactional outbox in the
    same transaction as the document, link, content, hold, or disposition write
    and dispatched by the platform outbox dispatcher when
    `eia.outbox.enabled=true`: the three document metadata facts and the three
    hold/disposition facts by DocumentEvents.java, the two link facts by
    DocumentLinkEvents.java, and the content fact by DocumentContentEvents.java.
    The remaining SPEC 11.6.9 names are planned, and the two link names, the
    content name, and the two legal-hold names have no SPEC equivalent (M-22,
    M-26, M-40, M-44). `document.document.disposed` is a SPEC name and is now
    implemented. There is no subscriber, inbox, or subscription registry yet.

