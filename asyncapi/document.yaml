components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: document
x-spec-section: SPEC 11.6.9
x-status: partial
x-implementation:
  publisher: eia-document-expert
  subscriber: none
  notes: >
    Three implemented event names are written to the transactional outbox in
    the same transaction as the document write and dispatched by the platform
    outbox dispatcher when `eia.outbox.enabled=true`. The SPEC 11.6.9 names
    remain planned. There is no subscriber, inbox, or subscription registry yet.

x-consumed-events:
  - policy.policy.issued
  - policy.policy.endorsed
  - policy.policy.cancelled
  - contract.contract.bound
  - contract.bordereau.received
  - contract.account.issued
  - direct.claim.registered
  - direct.claim.settlement-executed
  - assumed.claim.registered
  - assumed.claim.commuted
  - payment.payment.paid
  - party.party.merged
