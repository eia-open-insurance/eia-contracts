asyncapi: 3.0.0
id: urn:eia:contracts:events:assumed-claims
info:
  title: EIA Assumed Claims events
  version: 1.2.0
  summary: Published domain event names for the Assumed Claims vertical.
  description: >
    Event contract for the Assumed Claims vertical. The authoritative event names are
    SPEC 11.5.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Assumed Claims expert now publishes `assumed.claim.registered`,
    `assumed.claim.updated`, `assumed.claim.closed`, `assumed.claim.reopened`,
    `assumed.claim.loss-advice-posted`, `assumed.claim.reserve-changed`,
    `assumed.claim.cash-call-requested`, `assumed.claim.recovery-recorded`,
    `assumed.claim.commuted`, `assumed.claim.task-created`,
    `assumed.claim.task-completed`, `assumed.claim.task-updated`, and
    `assumed.claim.note-added` through the transactional outbox; those channels
    and operations are marked `x-status: implemented`. `assumed.claim.updated`
    is additive: the catalog had no generic update fact. The four task and note
    names are new in this slice and have no SPEC 11.5.9 equivalent
    (MISMATCHES.md M-22). The other SPEC 11.5.9 names are planned.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  AssumedClaimUpdated:
    address: assumed.claim.updated
    title: assumed.claim.updated
    description: >
      Emitted on an accepted assumed-claim status change that is neither
      `closed` nor `reopened`. The payload carries `changedFields:
      [status]`, `from`, `to`, and the assumed claim identity, status, and
      row version.
    x-event-type: assumed.claim.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      AssumedClaimUpdatedData:
        $ref: '#/components/messages/AssumedClaimUpdatedData'
  AssumedClaimRegistered:
    address: assumed.claim.registered
    title: assumed.claim.registered
    description: >
      Emitted when an assumed claim is created from a notice, in the same
      transaction as the row. The payload carries the assumed claim
      identity, cedent claim number, contract, book, status, row version,
      loss and report dates, and reserve.
    x-event-type: assumed.claim.registered
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  AssumedClaimLossAdviceReceived:
    address: assumed.claim.loss-advice-received
    title: assumed.claim.loss-advice-received
    description: >
      Declared domain event for this vertical (SPEC 11.5.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: assumed.claim.loss-advice-received
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.5.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  AssumedClaimLossAdvicePosted:
    address: assumed.claim.loss-advice-posted
    title: assumed.claim.loss-advice-posted
    description: >
      Emitted when a loss advice is posted and the reserve is updated. The
      payload carries the advice identity and number, type and dates,
      status, reported/paid/outstanding/expense/reserve/recovery amounts,
      cession percent and ceded amount, currency, layer-attachment flag,
      source, and posting time.
    x-event-type: assumed.claim.loss-advice-posted
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  AssumedClaimReserveEstablished:
    address: assumed.claim.reserve-established
    title: assumed.claim.reserve-established
    description: >
      Declared domain event for this vertical (SPEC 11.5.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: assumed.claim.reserve-established
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.5.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  AssumedClaimReserveChanged:
    address: assumed.claim.reserve-changed
    title: assumed.claim.reserve-changed
    description: >
      Emitted for every append-only assumed reserve change. The payload
      carries the reserve entry identity, component, sequence, amount,
      previous and current reserve, currency, effective date, reason,
      authority, and approval evidence.
    x-event-type: assumed.claim.reserve-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
