    x-event-type: assumed.claim.task-completed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
