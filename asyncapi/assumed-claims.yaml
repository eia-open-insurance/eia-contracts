    x-event-type: assumed.claim.cash-call-requested
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  AssumedClaimCommuted:
    address: assumed.claim.commuted
    title: assumed.claim.commuted
    description: >
      Emitted when an assumed claim commutation is executed. The payload
      carries the commutation identity and number, type,
      offer/accepted/savings amounts, released reserve, currency, effective
      and valuation dates, basis, release document, status, and approval
      evidence.
    x-event-type: assumed.claim.commuted
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.5.9
    x-implemented-by: repos/eia-assumed-claims-expert/src/main/java/com/eia/assumedclaims/expert/AssumedClaimEvents.java
    messages:
      DomainEvent:
