components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    AssumedClaimUpdatedData:
      name: AssumedClaimUpdatedData
      title: assumed.claim.updated data
      summary: Minimal schema for the envelope data object of an assumed claim status change.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - assumedClaimId
          - assumedClaimNumber
          - status
          - version
          - changedFields
        properties:
          assumedClaimId:
            type: string
            format: uuid
          assumedClaimNumber:
            type: string
          cedentClaimNumber:
            type: string
          contractId:
            type: string
            format: uuid
          businessBook:
            type: string
          status:
            type: string
          version:
            type: integer
          changedFields:
            type: array
            items:
              type: string
          from:
            type: string
          to:
            type: string
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: assumed
x-spec-section: SPEC 11.5.9
x-status: partial
x-implementation:
  publisher: eia-assumed-claims-expert
  subscriber: none
  notes: >
    Thirteen Assumed Claims events are written to the transactional outbox in
    the same transaction as the aggregate or child write: `registered`,
    `updated`, `closed`, `reopened`, `loss-advice-posted`, `reserve-changed`,
    `cash-call-requested`, `recovery-recorded`, `commuted`, `task-created`,
    `task-completed`, `task-updated`, and `note-added`. The other SPEC 11.5.9
    names remain planned. There is no business subscriber or subscription
    registry yet.

x-consumed-events:
  - contract.contract.bound
  - contract.contract.commuted
  - contract.cession.recorded
  - contract.security.recorded
  - payment.payment.paid
  - payment.payment.failed
  - document.document.associated
  - party.party.merged
