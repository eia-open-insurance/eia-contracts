x-event-rules:
  - id: EV-01
    rule: Names are {vertical}.{aggregate}.{past-tense-verb} in kebab case.
  - id: EV-02
    rule: Events are facts about the past, never commands or requests.
  - id: EV-03
    rule: Payloads carry identifiers and deltas, not entire object graphs.
  - id: EV-04
    rule: Payloads carry links for newly created relationships.
  - id: EV-05
    rule: Additive fields are compatible; removals or meaning changes need a new eventVersion with dual publication.
  - id: EV-06
    rule: Consumers ignore unknown fields and unknown event types.
  - id: EV-07
    rule: Payloads never contain PHI beyond the minimum necessary.
  - id: EV-08
    rule: aggregateVersion is monotonic per aggregate and is the ordering authority.
  - id: EV-09
    rule: Events are immutable and retained for the life of the record.
  - id: EV-10
    rule: A republished event keeps its original eventId; a corrected fact is a new event.
x-delivery:
  transport: https-outbox
  broker: none
  evidence:
    - SPEC 7.5.1 outbox and dispatcher
    - SPEC 7.5.2 inbox and gap detection
    - SPEC 7.5.3 subscriptions
x-implementation:
  publisher: eia-party-expert, eia-policy-expert, eia-contract-expert, eia-direct-claims-expert, eia-assumed-claims-expert, eia-cession-expert, eia-retrocession-expert, eia-document-expert, eia-payment-expert, eia-notifications-expert
  subscriber: eia-platform event-ingest inbox (no business subscriber)
  notes: >
    All ten experts write a subset of their catalog events to the transactional
    outbox in the same transaction as the aggregate write. The platform outbox
    dispatcher delivers them to the event-ingest inbox when
    `eia.outbox.enabled=true`; the inbox validates the canonical envelope,
    verifies the HMAC signature when configured, and deduplicates by event id.
    No vertical consumes another vertical's events, so every `consumed` list
    remains the planned SPEC subscription.
