asyncapi: 3.0.0
id: urn:eia:contracts:events:catalog
info:
  title: EIA canonical domain event catalog
  version: 1.34.0
  summary: The authoritative catalog of domain event names, publishers, and subscribers.
  description: >
    Cross-vertical event catalog. Every domain event name used by the platform
    appears here exactly once, grouped by the vertical that publishes it. The
    per-vertical documents in this directory define one channel per published
    event; this catalog is the authority for the names, the publisher, and the
    subscribers named in SPEC 11.

    Event names follow EV-01: `{vertical}.{aggregate}.{past-tense-verb}` in
    kebab case. The envelope is ../schemas/event-envelope.schema.json. There is
    no broker (ADR-0004); delivery is an authenticated HTTPS POST from the
    transactional outbox (SPEC 7.5.1).

    The transactional-outbox rollout now covers all ten publishing verticals.
    Each expert writes a subset of its events in the same transaction as the
    aggregate write. Each vertical entry lists that subset under `implemented`;
    `published` remains the full agreed contract, so an event is planned until
    it appears in both lists. The Direct Claims and Assumed Claims task, note,
    and assignment events and the Direct Claims allocation-created and
    litigation-created events are
    new names with no SPEC 11.4.9 or 11.5.9 equivalent, and the Document link
    and content events are new names with no SPEC 11.6.9 equivalent
    (MISMATCHES.md M-22).
    The three Policy billing facts are new names: SPEC 11.2.13 calls the plan
    fact `policy.billing.plan-created` and
    defines no installment paid or waived fact, so the implemented names are
    `policy.billing-plan.created`, `policy.installment.paid`, and
    `policy.installment.waived` (M-22, M-27). The five Contract
    technical-account facts `contract.technical-account.created`, `.issued`,
    `.settled`, `.line-added`, and `.line-removed` are new names with no SPEC
    11.3.9 equivalent (M-22, M-29, M-42). The Contract period-bordereau facts use
    `contract.bordereau.received` (already cataloged), plus the new terminal
    names `contract.bordereau.processed` and `contract.bordereau.failed`;
    SPEC 11.3.9 instead publishes `contract.bordereau.posted` and
    `contract.bordereau.rejected`, which remain planned (M-22, M-30). The
    Contract cash-call facts add `contract.cash-call.requested`, `.settled`,
    and `.cancelled` as new child-aggregate names alongside the
    already-published `contract.cash-call.issued`; the four move into the
    implemented subset (M-22, M-34). The Contract security/collateral fact
    `contract.security.recorded` is already published and moves into the
    Contract implemented subset. It is a child aggregate keyed by the security
    id at version 1 while the outbox partition key stays the contract id (M-37).
    Its implementation brings the platform implemented total to 72 names; the
    published total stays 193. The Payment allocation fact
    `payment.allocation.created` is also a new child-aggregate name with no
    SPEC 11.7.10 equivalent; it is published and implemented, bringing the
    platform total to 193 published names (M-22, M-35). The Policy mass tort
    fact `policy.mass-tort-profile.updated` moves from planned to implemented;
    its SPEC 11.2.9 name was already published, so it adds no published name
    and the Policy implemented subset grows to 11 of its 23 names. The Policy
    dunning fact `policy.dunning.sent` is a new name: SPEC 11.2.13 publishes
    `policy.billing.dunning-changed` instead, so it adds one published and one
    implemented name, bringing the platform totals to 194 published and 73
    implemented; Policy becomes 24 published and 12 implemented (M-22, M-38).
    The two Policy program facts `policy.program.created` and
    `policy.policy.program-assigned` are new names with no SPEC 11.2.9
    equivalent: a program is a catalog aggregate and the assignment is a policy
    command. They add two published and two implemented names, bringing the
    platform totals to 196 published and 75 implemented; Policy becomes 26
    published and 14 implemented (M-22, M-39). The Document content fact
    `document.content.uploaded` is a new name with no SPEC 11.6.9 equivalent: a
    content upload is an upsert of the current content row, and SPEC defines no
    content-upload fact. It adds one published and one implemented name,
    bringing the platform totals to 197 published and 76 implemented; Document
    becomes 21 published and 6 implemented (M-22, M-40). The Contract security
    status fact `contract.security.status-changed` is a new name with no SPEC
    11.3.9 equivalent: SPEC publishes `contract.security.recorded` and
    `contract.security.breached` but no security status-change fact. It adds
    one published and one implemented name, bringing the platform totals to
    198 published and 77 implemented; Contract becomes 30 published and 17
    implemented (M-22, M-37). The three Policy credit-note facts
    `policy.credit-note.issued`, `.applied`, and `.cancelled` are new names with
    no SPEC 11.2.13 equivalent other than the single
    `policy.billing.credit-note-issued`; they add three published and three
    implemented names, bringing the platform totals to 201 published and 80
    implemented; Policy becomes 29 published and 17 implemented (M-22, M-41).
    The 2026-10-21 Document content-version slice adds no event name and no
    channel: it only adds the required `version` member to the
    `document.content.uploaded` payload, keeping `eventVersion` 1. The totals
    therefore stay 201 published and 80 implemented, with Document at 21
    published and 6 implemented (M-40).
    The two Contract technical-account line facts
    `contract.technical-account.line-added` and `.line-removed` are new
    grandchild-aggregate names with no SPEC 11.3.9 equivalent: each uses the
    line id and aggregate version 1 while the outbox partition key stays the
    contract id, and the events are emitted only while the account is DRAFT.
    They add two published and two implemented names, bringing the platform
    totals to 203 published and 82 implemented; Contract becomes 32 published
    and 19 implemented (M-22, M-42).
    The two Policy legal-entity facts `policy.legal-entity.created` and
    `policy.policy.legal-entity-assigned` are new names with no SPEC 11.2.9
    equivalent: SPEC 10.11.2/11.2.16 define the legal entity model and the
    issuing-entity link, but SPEC 11.2.9 names no catalog-create or assignment
    event. They add two published and two implemented names, bringing the
    platform totals to 205 published and 84 implemented; Policy becomes 31
    published and 19 implemented (M-22, M-43).
    The two Document legal-hold facts `document.legal-hold.placed` and
    `.released` are new names with no SPEC 11.6.9 equivalent: SPEC publishes
    `document.document.held` and `document.document.hold-released`, which remain
    planned. The same slice moves the already-published
    `document.document.disposed` name into the Document implemented subset; it
    adds no new published name. The two legal-hold names add two published and
    two implemented names, so the platform totals become 207 published and 87
    implemented, and Document becomes 23 published and 9 implemented (M-22,
    M-44).
    The 2026-10-21 Policy credit-note reversal slice adds one Policy name,
    `policy.credit-note.reversed`, with no SPEC 11.2.13 equivalent. It adds one
    published and one implemented name, bringing the platform totals to 208
    published and 88 implemented; Policy becomes 32 published and 20 implemented
    (M-22, M-41).
    The 2026-10-21 Policy cancellation-linked credit-note slice adds one Policy
    name, `policy.credit-note.created`, with no SPEC 11.2.13 equivalent: SPEC
    publishes only the issued fact and creation was previously unobservable. It
    adds one published and one implemented name, bringing the platform totals to
    209 published and 89 implemented; Policy becomes 33 published and 21
    implemented (M-22, M-41).
    The 2026-10-21 Direct Claims settlement-payment-link slice adds one Direct
    Claims name, `direct.claim.settlement-payment-linked`, with no SPEC 11.4.9
    equivalent: linking the Payment record that pays a settlement is a Direct
    Claims state change and SPEC names no link fact. It adds one published and
    one implemented name, bringing the platform totals to 210 published and 90
    implemented; Direct Claims becomes 27 published and 13 implemented (M-22,
    M-45).
    The 2026-10-22 Document content-tombstone slice adds one Document name,
    `document.content.deleted`, with no SPEC 11.6.9 equivalent: SPEC 11.6.8
    deletes content only as a step of the approved disposition job. It is
    emitted by the standalone tombstone command and, since the 2026-10-22
    disposition-content slice, by a disposition of a document with live
    content. It adds one published and one implemented name, bringing the
    platform totals to 211 published and 91 implemented; Document becomes 24
    published and 10 implemented (M-22, M-47).
    The 2026-10-22 Document disposition-content slice adds no event name and no
    channel: it makes a successful disposition emit the already-published
    `document.content.deleted` in the same transaction as
    `document.document.disposed` when the document still has live content. A
    document without content or with already-tombstoned content emits only
    `document.document.disposed`. The totals therefore stay 211 published and
    91 implemented, with Document at 24 published and 10 implemented (M-44,
    M-47).
    The 2026-10-22 Payment allocation reversal slice adds one Payment name,
    `payment.allocation.reversed`, with no SPEC 11.7.10 equivalent: SPEC
    publishes no allocation event at all. It is a child-aggregate fact that
    stamps an existing allocation reversed instead of deleting it. It adds one
    published and one implemented name, bringing the platform totals to 212
    published and 92 implemented; Payment becomes 20 published and 5 implemented
    (M-22, M-35).
    The 2026-10-22 Notifications template-administration slice adds three
    Notifications names, `notifications.template.created`, `.approved`, and
    `.retired`, with no SPEC 11.8.9 equivalent: SPEC defines notification
    lifecycle facts and a template registry, but publishes no template event.
    They are `NotificationTemplate` aggregate facts at versions 1, 2, and 3.
    They add three published and three implemented names, bringing the platform
    totals to 215 published and 95 implemented; Notifications becomes 15
    published and 5 implemented (M-22, M-49).
    The 2026-10-22 Policy premium-audit slice adds one Policy name,
    `policy.policy.premium-audited`, with no matching SPEC 11.2.9 name: SPEC
    publishes `policy.premium.audited` instead, which stays planned. The
    implemented fact is keyed by the policy id at the bumped aggregate version
    and is emitted with `policy.policy.version-issued` in the same transaction
    as the PREMIUM_AUDIT endorsement, version, and premium replacement. It adds
    one published and one implemented name, bringing the platform totals to 216
    published and 96 implemented; Policy becomes 34 published and 22 implemented
    (M-22, M-50).
    The 2026-10-22 Policy billing-adjustment slice adds one Policy name,
    `policy.billing-plan.adjusted`, with no SPEC 11.2.13 equivalent: SPEC
    publishes the plan-created fact and no positive premium adjustment fact. The
    event appends one DUE installment for the positive premium remainder, moves
    the plan total and count, and is keyed by the policy id at the bumped
    aggregate version. It adds one published and one implemented name, bringing
    the platform totals to 217 published and 97 implemented; Policy becomes 35
    published and 23 implemented (M-22, M-27, M-51).
    The 2026-10-22 Direct Claims litigation-damages slice adds one Direct
    Claims name, `direct.claim.litigation-created`, with no SPEC 11.4.9
    equivalent: SPEC publishes only the matter-updated fact and defines no
    matter-creation fact. The already-published
    `direct.claim.litigation-updated` moves into the implemented subset in the
    same slice; both facts carry the optional `damagesSought` /
    `damagesCurrency` pair. The new name adds one published and one implemented
    name, and the moved name adds one implemented name, bringing the platform
    totals to 218 published and 99 implemented; Direct Claims becomes 28
    published and 15 implemented (M-22, M-52).
    The platform
    event-ingest service
    is the inbox:
    it validates the canonical envelope, verifies the HMAC signature when
    configured, and stores each event idempotently. There is still no business
    subscriber, subscription registry, or gap detection, and no vertical
    consumes another vertical's events. Changing an existing name is a breaking
    change and requires a new event and a dual-publish window; adding an event
    is a compatible change.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  domainEventStream:
    address: eia.domain-events
    title: Domain event stream
    description: >
      Logical stream behind the transactional outbox. The concrete routing key
      of a message is its eventType, not this address.
    x-status: planned
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
operations:
  deliverDomainEvent:
    action: send
    channel:
      $ref: '#/channels/domainEventStream'
    summary: Deliver one domain event to a subscribed consumer.
    description: >
      The dispatcher groups by partition key, preserves per-aggregate order,
      signs the body, and retries with the SPEC 7.5.1 backoff. A permanent
      consumer rejection marks the event DEAD; a 5xx keeps it PENDING.
    x-status: planned
components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-status: partial
