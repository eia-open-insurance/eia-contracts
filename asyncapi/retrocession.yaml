asyncapi: 3.0.0
id: urn:eia:contracts:events:retrocession
info:
  title: EIA Retrocession events
  version: 1.1.0
  summary: Published domain event names for the Retrocession vertical.
  description: >
    Event contract for the Retrocession vertical. The authoritative event names are
    SPEC 11.10.6; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Retrocession expert now publishes `retrocession.retrocession.created`,
    `retrocession.retrocession.updated`, and
    `retrocession.retrocession.handed-off` through the transactional outbox in
    the same transaction as the case write; those channels and operations are
    marked `x-status: implemented`. The SPEC 11.10.6 contract and hand-off names
    remain planned. There is still no subscriber or inbox.
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  RetrocessionRetrocessionCreated:
    address: retrocession.retrocession.created
    title: retrocession.retrocession.created
    description: >
      Emitted by the Retrocession expert when a retrocession case is persisted,
      in the same transaction as the row. The payload carries the case identity,
      book, contract and retro-contract references, status, ceded premium and
      loss, currency, and the row version.
    x-event-type: retrocession.retrocession.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.10.6
    x-implemented-by: repos/eia-retrocession-expert/src/main/java/com/eia/retrocession/expert/RetrocessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  RetrocessionRetrocessionUpdated:
    address: retrocession.retrocession.updated
    title: retrocession.retrocession.updated
    description: >
      Emitted when a retrocession status changes through the lifecycle
      endpoint. The payload carries `changedFields: [status]`, `from`, `to`,
      and the row version.
    x-event-type: retrocession.retrocession.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.10.6
    x-implemented-by: repos/eia-retrocession-expert/src/main/java/com/eia/retrocession/expert/RetrocessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  RetrocessionRetrocessionHandedOff:
    address: retrocession.retrocession.handed-off
    title: retrocession.retrocession.handed-off
    description: >
      Emitted when the FS-RI acknowledgement is persisted and the case moves to
      HANDED_OFF. The payload adds `fsriHandoffId`, `fsriStatus`, and
      `fsriHandedOffAt`. The FS-RI call itself is still synchronous; the event
      records the durable hand-off fact, it is not a hand-off queue.
    x-event-type: retrocession.retrocession.handed-off
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.10.6
    x-implemented-by: repos/eia-retrocession-expert/src/main/java/com/eia/retrocession/expert/RetrocessionEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
