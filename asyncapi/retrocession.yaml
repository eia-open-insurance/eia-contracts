components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: retrocession
x-spec-section: SPEC 11.10.6
x-status: partial
x-implementation:
  publisher: eia-retrocession-expert
  subscriber: none
  notes: >
    Three implemented event names are written to the transactional outbox in
    the same transaction as the case write and dispatched by the platform outbox
    dispatcher when `eia.outbox.enabled=true`. The SPEC 11.10.6 contract and
    hand-off names remain planned. There is no subscriber, inbox, or
    subscription registry yet.

x-consumed-events: []
x-consumed-events-note: >
  SPEC 11.10.6 lists published events only. Retrocession pulls contract and assumed claim facts through the domain API, not through subscriptions.
