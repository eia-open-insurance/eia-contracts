components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    ContractContractUpdatedData:
      name: ContractContractUpdatedData
      title: contract.contract.updated data
      summary: Minimal schema for the envelope data object of a contract status change.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - contractNumber
          - status
          - version
          - changedFields
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          contractType:
            type: string
          cedentPartyId:
            type: string
            format: uuid
          reinsurerPartyId:
            type: string
            format: uuid
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          status:
            type: string
          version:
            type: integer
          changedFields:
            type: array
            items:
              type: string
          from:
            type: string
          to:
            type: string
    ContractTechnicalAccountData:
      name: ContractTechnicalAccountData
      title: contract.technical-account.* data
      summary: >
        Minimal schema for the envelope data object of a contract technical
        account fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - accountId
          - accountNumber
          - periodStart
          - periodEnd
          - currency
          - balance
          - status
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          accountId:
            type: string
            format: uuid
          accountNumber:
            type: string
            maxLength: 32
          periodStart:
            type: string
            format: date
          periodEnd:
            type: string
            format: date
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          balance:
            type: string
            pattern: '^-?(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,4})?$'
          status:
            type: string
            enum:
              - DRAFT
              - ISSUED
              - SETTLED
    ContractTechnicalAccountLineData:
      name: ContractTechnicalAccountLineData
      title: contract.technical-account.line-* data
      summary: >
        Minimal schema for the envelope data object of a technical-account line
        fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - accountId
          - lineId
          - lineType
          - amount
        properties:
          contractId:
            type: string
            format: uuid
          accountId:
            type: string
            format: uuid
          lineId:
            type: string
            format: uuid
          lineType:
            type: string
            description: >
              The 13 SPEC 11.3.4 detail types; each rolls into one of the four
              reconciliation buckets. The retired aggregate `LOSS` is not
              emitted.
            enum:
              - PREMIUM
              - COMMISSION
              - BROKERAGE
              - PAID_LOSS
              - OUTSTANDING_LOSS
              - IBNR
              - ALAE
              - REINSTATEMENT
              - CASH_CALL
              - FUNDS_WITHHELD
              - TAX
              - ADJUSTMENT
              - OTHER
          amount:
            type: string
            pattern: '^-?(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,4})?$'
    ContractBordereauData:
      name: ContractBordereauData
      title: contract.bordereau.* data
      summary: >
        Minimal schema for the envelope data object of a period-bordereau fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - bordereauId
          - bordereauNumber
          - periodStart
          - periodEnd
          - currency
          - status
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          bordereauId:
            type: string
            format: uuid
          bordereauNumber:
            type: string
            maxLength: 32
          period:
            type: object
            additionalProperties: true
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
          periodStart:
            type: string
            format: date
          periodEnd:
            type: string
            format: date
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          status:
            type: string
            enum:
              - RECEIVED
              - PROCESSED
              - FAILED
          technicalAccountId:
            type: [string, 'null']
            format: uuid
          premiumAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          lossAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          commissionAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          otherChargesAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          lineCount:
            type: integer
            minimum: 0
    ContractSecurityData:
      name: ContractSecurityData
      title: contract.security.recorded data
      summary: >
        Minimal schema for the envelope data object of a contract
        security/collateral fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - securityId
          - securityType
          - requiredAmount
          - heldAmount
          - currency
          - status
        properties:
          contractId:
            type: string
            format: uuid
          securityId:
            type: string
            format: uuid
          securityType:
            type: string
            enum:
              - LETTER_OF_CREDIT
              - TRUST_FUND
              - FUNDS_WITHHELD
              - CASH_ADVANCE
              - PARENT_GUARANTEE
              - BANK_GUARANTEE
              - SECURITIES
          requiredAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          heldAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          status:
            type: string
            enum:
              - ACTIVE
              - REQUIRED
              - OUTSTANDING
              - PARTIAL
              - RELEASED
              - EXPIRED
              - BREACH
    ContractSecurityStatusChangedData:
      name: ContractSecurityStatusChangedData
      title: contract.security.status-changed data
      summary: >
        Minimal schema for the envelope data object of a contract security
        status fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - securityId
          - securityType
          - previousStatus
          - status
        properties:
          contractId:
            type: string
            format: uuid
          securityId:
            type: string
            format: uuid
          securityType:
            type: string
            enum:
              - LETTER_OF_CREDIT
              - TRUST_FUND
              - FUNDS_WITHHELD
              - CASH_ADVANCE
              - PARENT_GUARANTEE
              - BANK_GUARANTEE
              - SECURITIES
          previousStatus:
            type: string
            enum:
              - ACTIVE
              - OUTSTANDING
              - PARTIAL
              - REQUIRED
              - EXPIRED
          status:
            type: string
            enum:
              - RELEASED
              - EXPIRED
    ContractCashCallData:
      name: ContractCashCallData
      title: contract.cash-call.* data
      summary: >
        Minimal schema for the envelope data object of a contract cash-call fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - cashCallId
          - callNumber
          - periodStart
          - periodEnd
          - amount
          - currency
          - dueDate
          - status
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          cashCallId:
            type: string
            format: uuid
          callNumber:
            type: string
            maxLength: 32
          period:
            type: object
            additionalProperties: true
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
          periodStart:
            type: string
            format: date
          periodEnd:
            type: string
            format: date
          amount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          dueDate:
            type: string
            format: date
          status:
            type: string
            enum:
              - REQUESTED
              - ISSUED
              - SETTLED
              - CANCELLED
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: contract
x-spec-section: SPEC 11.3.9
x-status: partial
x-implementation:
  publisher: eia-contract-expert
  subscriber: none
  notes: >
    Nineteen Contract events are written to the transactional outbox in the
    same transaction as the aggregate write: `created`, `updated`, `bound`,
    `commuted`, `cession.recorded`, `technical-account.created`,
    `technical-account.issued`, `technical-account.settled`,
    `technical-account.line-added`, `technical-account.line-removed`,
    `bordereau.received`, `bordereau.processed`, `bordereau.failed`,
    `cash-call.requested`, `cash-call.issued`, `cash-call.settled`,
    `cash-call.cancelled`, `security.recorded`, and
    `security.status-changed`. The three technical-account lifecycle
    facts are child-aggregate events that use the account id and its lifecycle
    version while the outbox partition key stays the contract id. The two line
    facts are grandchild events that use the line id and aggregate version 1
    while the partition key stays the contract id; their payload carries the
    contract, account, and line identity, the line type, and the amount, and
    they are emitted only while the account is DRAFT. The three
    bordereau facts are child-aggregate events that use the bordereau id and
    version 1 (received) or 2 (processed or failed) while the partition key
    stays the contract id. The four cash-call facts use the cash-call id and
    aggregate version 1 (requested), 2 (issued or cancelled), or 3 (settled)
    while the partition key stays the contract id. The security fact uses the
    security id and aggregate version 1 while the partition key stays the
    contract id; its payload carries the derived status of the public create or
    a bind-slice status recorded through the internal expert surface. The
    security status fact uses the security id and aggregate version 2, or 3 for
    the release of an expired record, while the partition key stays the
    contract id; its payload carries the previous and new status. A status
    write that targets a catalog lifecycle state can additionally emit the
    cataloged `signed`, `endorsed`, `expired`, or `cancelled` name; those names
    remain published and are not part of the implemented subset recorded here.
    The remaining SPEC 11.3.9 names are planned. There is no business
    subscriber or subscription registry yet.

x-consumed-events:
  - policy.policy.issued
  - policy.policy.endorsed
  - policy.policy.cancelled
  - policy.premium.changed
  - direct.claim.registered
  - direct.claim.paid
  - assumed.claim.registered
  - assumed.claim.reserve-changed
  - assumed.claim.paid
  - assumed.claim.commuted
  - payment.payment.paid
  - document.document.registered
