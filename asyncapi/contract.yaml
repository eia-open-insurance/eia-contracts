components:
  messages:
    DomainEvent:
      name: DomainEvent
      title: EIA domain event envelope
      summary: One immutable fact published by a vertical.
      contentType: application/json
      headers:
        type: object
        additionalProperties: true
        properties:
          X-EIA-Event-Id:
            type: string
            format: uuid
          X-EIA-Event-Type:
            type: string
          X-EIA-Event-Version:
            type: integer
          X-EIA-Aggregate-Version:
            type: integer
          Idempotency-Key:
            type: string
          X-EIA-Signature:
            type: string
      payload:
        $ref: '../schemas/event-envelope.schema.json'
    ContractContractUpdatedData:
      name: ContractContractUpdatedData
      title: contract.contract.updated data
      summary: Minimal schema for the envelope data object of a contract status change.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - contractNumber
          - status
          - version
          - changedFields
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          contractType:
            type: string
          cedentPartyId:
            type: string
            format: uuid
          reinsurerPartyId:
            type: string
            format: uuid
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          effectiveDate:
            type: string
            format: date
          expirationDate:
            type: string
            format: date
          status:
            type: string
          version:
            type: integer
          changedFields:
            type: array
            items:
              type: string
          from:
            type: string
          to:
            type: string
    ContractTechnicalAccountData:
      name: ContractTechnicalAccountData
      title: contract.technical-account.* data
      summary: >
        Minimal schema for the envelope data object of a contract technical
        account fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - accountId
          - accountNumber
          - periodStart
          - periodEnd
          - currency
          - balance
          - status
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          accountId:
            type: string
            format: uuid
          accountNumber:
            type: string
            maxLength: 32
          periodStart:
            type: string
            format: date
          periodEnd:
            type: string
            format: date
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          balance:
            type: string
            pattern: '^-?(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,4})?$'
          status:
            type: string
            enum:
              - DRAFT
              - ISSUED
              - SETTLED
    ContractBordereauData:
      name: ContractBordereauData
      title: contract.bordereau.* data
      summary: >
        Minimal schema for the envelope data object of a period-bordereau fact.
      contentType: application/json
      payload:
        type: object
        additionalProperties: true
        required:
          - contractId
          - bordereauId
          - bordereauNumber
          - periodStart
          - periodEnd
          - currency
          - status
        properties:
          contractId:
            type: string
            format: uuid
          contractNumber:
            type: string
          bordereauId:
            type: string
            format: uuid
          bordereauNumber:
            type: string
            maxLength: 32
          period:
            type: object
            additionalProperties: true
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
          periodStart:
            type: string
            format: date
          periodEnd:
            type: string
            format: date
          currency:
            type: string
            pattern: '^[A-Z]{3}$'
          status:
            type: string
            enum:
              - RECEIVED
              - PROCESSED
              - FAILED
          technicalAccountId:
            type: [string, 'null']
            format: uuid
          premiumAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          lossAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          commissionAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          otherChargesAmount:
            type: string
            pattern: '^[0-9]{1,15}(?:\.[0-9]{1,4})?$'
          lineCount:
            type: integer
            minimum: 0
  securitySchemes:
    outboxSignature:
      type: httpApiKey
      name: X-EIA-Signature
      in: header
      description: >
        HMAC-SHA256 over the timestamp and the exact request body, in the form
        t=<unix>,v1=<hex> (SPEC 7.5.1).
x-vertical: contract
x-spec-section: SPEC 11.3.9
x-status: partial
x-implementation:
  publisher: eia-contract-expert
  subscriber: none
  notes: >
    Eleven Contract events are written to the transactional outbox in the same
    transaction as the aggregate write: `created`, `updated`, `bound`,
    `commuted`, `cession.recorded`, `technical-account.created`,
    `technical-account.issued`, `technical-account.settled`,
    `bordereau.received`, `bordereau.processed`, and `bordereau.failed`. The
    three technical-account facts are child-aggregate events that use the
    account id and its lifecycle version while the outbox partition key stays
    the contract id. The three bordereau facts are child-aggregate events that
    use the bordereau id and version 1 (received) or 2 (processed or failed)
    while the partition key stays the contract id. A status write that targets
    a catalog lifecycle state can additionally emit the cataloged `signed`,
    `endorsed`, `expired`, or `cancelled` name; those names remain published
    and are not part of the implemented subset recorded here. The remaining
    SPEC 11.3.9 names are planned. There is no business subscriber or
    subscription registry yet.

