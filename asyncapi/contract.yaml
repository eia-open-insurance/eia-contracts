        $ref: '#/components/messages/DomainEvent'
  ContractContractCommuted:
    address: contract.contract.commuted
    title: contract.contract.commuted
    description: >
      Emitted when an approved commutation is executed; the same transaction
      also emits `contract.contract.updated`. The payload carries the
      commutation identity, type, basis, amounts, effective and valuation
      dates, release document, `contractClosed`, and `releasedSecurities`.
    x-event-type: contract.contract.commuted
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractCessionRecorded:
    address: contract.cession.recorded
    title: contract.cession.recorded
    description: >
      Emitted when a cession is recorded against a bound or in-force
      contract. The cession is a child aggregate: the envelope uses the
      cession id and version while the outbox partition key remains the
      contract id. The payload carries the contract and cession identities
      and the ceded amounts and percentages.
    x-event-type: contract.cession.recorded
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractTechnicalAccountCreated:
    address: contract.technical-account.created
    title: contract.technical-account.created
    description: >
      Emitted when a technical account is produced for a contract period, in
      the same transaction as the account row. The account is a child
      aggregate: the envelope uses the account id and aggregate version 1
      while the outbox partition key remains the contract id. The payload
      carries the contract and account identities, the period, currency, the
      derived balance, and the initial DRAFT status.
    x-event-type: contract.technical-account.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractTechnicalAccountIssued:
    address: contract.technical-account.issued
    title: contract.technical-account.issued
    description: >
      Emitted when a DRAFT technical account is issued. The account aggregate
      version is 2 and the payload carries the issued status with the same
      contract identity, period, currency, and balance. The row update and the
      event share one transaction.
    x-event-type: contract.technical-account.issued
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractTechnicalAccountSettled:
    address: contract.technical-account.settled
    title: contract.technical-account.settled
    description: >
      Emitted when an ISSUED technical account is settled. The account
      aggregate version is 3 and the payload carries the SETTLED status, the
      period, currency, and the derived balance. The row update and the event
      share one transaction.
    x-event-type: contract.technical-account.settled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
