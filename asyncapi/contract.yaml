      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractBordereauReceived:
    address: contract.bordereau.received
    title: contract.bordereau.received
    description: >
      Emitted when a period bordereau is recorded, in the same transaction as
      the row. The bordereau is a child aggregate: the envelope uses the
      bordereau id and aggregate version 1 while the outbox partition key
      remains the contract id. The payload carries the contract and bordereau
      identities, the period, the currency, the RECEIVED status, and the four
      declared amounts.
    x-event-type: contract.bordereau.received
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractBordereauData:
        $ref: '#/components/messages/ContractBordereauData'
  ContractBordereauProcessed:
    address: contract.bordereau.processed
    title: contract.bordereau.processed
    description: >
      Emitted when a RECEIVED period bordereau is processed. The technical
      account for the same contract period is created or reused and linked
      through `technicalAccountId`; the account fact and this bordereau fact
      share the transaction. The bordereau aggregate version is 2.
    x-event-type: contract.bordereau.processed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
