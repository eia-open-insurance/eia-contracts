    x-event-type: contract.reinstatement.applied
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractPremiumAdjusted:
    address: contract.premium.adjusted
    title: contract.premium.adjusted
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.premium.adjusted
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractLossAggregateUpdated:
    address: contract.loss-aggregate.updated
    title: contract.loss-aggregate.updated
    description: >
