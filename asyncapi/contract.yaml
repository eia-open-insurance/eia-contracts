asyncapi: 3.0.0
id: urn:eia:contracts:events:contract
info:
  title: EIA Contract events
  version: 1.8.0
  summary: Published domain event names for the Contract vertical.
  description: >
    Event contract for the Contract vertical. The authoritative event names are
    SPEC 11.3.9; the canonical envelope is
    ../schemas/event-envelope.schema.json.

    There is no message broker (ADR-0004). The platform outbox delivers events
    over authenticated HTTPS to each subscriber endpoint, with an HMAC-SHA256
    signature (SPEC 7.5.1). A channel address is the logical routing key and
    equals the event name; it is not a broker topic.

    The Contract expert now publishes `contract.contract.created`,
    `contract.contract.updated`, `contract.contract.bound`,
    `contract.contract.commuted`, `contract.cession.recorded`, the five
    technical-account facts `contract.technical-account.created`, `.issued`,
    `.settled`, `.line-added`, and `.line-removed` (whose payload `lineType`
    enum carries the 13 SPEC 11.3.4 detail types and excludes the retired
    aggregate `LOSS`), the three period-bordereau
    facts `contract.bordereau.received`, `.processed`, and `.failed`, and the
    four cash-call facts `contract.cash-call.requested`, `.issued`, `.settled`,
    and `.cancelled` through the transactional outbox; those channels and
    operations are marked `x-status: implemented`. The security/collateral
    fact `contract.security.recorded` is also implemented: it is a child
    aggregate keyed by the security id at version 1, while the outbox
    partition key stays the contract id. The security status action adds
    `contract.security.status-changed`, also implemented: it is a new child
    fact with no SPEC 11.3.9 name, keyed by the security id at aggregate
    version 2, or version 3 when an expired record is released, while the
    partition key stays the contract id (M-22, M-37). `contract.contract.updated`
    is additive: the catalog had no generic update fact. A status write that
    targets a catalog lifecycle state can also emit the already-cataloged
    `signed`, `endorsed`, `expired`, or `cancelled` name; those names remain
    published and are not part of the implemented subset recorded here. The
    remaining SPEC 11.3.9 names are planned. The technical-account names,
    including the two line facts, are new child- and grandchild-aggregate facts
    with no SPEC 11.3.9 equivalent (M-22, M-29, M-42). The bordereau `processed`
    and `failed` names are new terminal facts; SPEC 11.3.9
    publishes `contract.bordereau.posted` and `contract.bordereau.rejected`
    instead, so both spellings are published and only the implemented ones are
    recorded (M-22, M-30). SPEC 11.3.9 publishes only
    `contract.cash-call.issued`; the `requested`, `settled`, and `cancelled`
    child facts are new names (M-22, M-34). The security name matches SPEC
    11.3.9; its payload carries the derived ACTIVE/EXPIRED status of the public
    create and can also carry a legacy bind-slice status when the internal
    expert surface records it (M-37).
  contact:
    name: EIA Architecture
    url: https://github.com/eia-open-insurance
  license:
    name: Apache-2.0
    identifier: Apache-2.0
defaultContentType: application/json
servers:
  subscriberEndpoint:
    host: subscriber-defined
    protocol: https
    description: >
      Each subscriber registers an HTTPS endpoint and signing key. The outbox
      posts one event per request and requires a 2xx acknowledgement.
channels:
  ContractContractUpdated:
    address: contract.contract.updated
    title: contract.contract.updated
    description: >
      Emitted on every accepted contract status write, including bind and
      commutation execution, at the same aggregate version as the lifecycle
      event. The payload carries `changedFields: [status]`, `from`, `to`,
      and the contract identity and row version.
    x-event-type: contract.contract.updated
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractContractUpdatedData:
        $ref: '#/components/messages/ContractContractUpdatedData'
  ContractContractCreated:
    address: contract.contract.created
    title: contract.contract.created
    description: >
      Emitted when a contract is persisted, in the same transaction as the
      row. The payload carries the contract identity, type, cedent and
      reinsurer, currency, term dates, status, and row version.
    x-event-type: contract.contract.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractBound:
    address: contract.contract.bound
    title: contract.contract.bound
    description: >
      Emitted by the bind command after the tower, share, term, security,
      and approval preconditions pass. The payload carries the contract
      identity, row version, `boundAt`, `boundBy`, `limitAmount`, and the
      status change.
    x-event-type: contract.contract.bound
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractSigned:
    address: contract.contract.signed
    title: contract.contract.signed
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.contract.signed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractEndorsed:
    address: contract.contract.endorsed
    title: contract.contract.endorsed
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.contract.endorsed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractRenewed:
    address: contract.contract.renewed
    title: contract.contract.renewed
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.contract.renewed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractExpired:
    address: contract.contract.expired
    title: contract.contract.expired
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.contract.expired
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractCancelled:
    address: contract.contract.cancelled
    title: contract.contract.cancelled
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.contract.cancelled
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractContractCommuted:
    address: contract.contract.commuted
    title: contract.contract.commuted
    description: >
      Emitted when an approved commutation is executed; the same transaction
      also emits `contract.contract.updated`. The payload carries the
      commutation identity, type, basis, amounts, effective and valuation
      dates, release document, `contractClosed`, and `releasedSecurities`.
    x-event-type: contract.contract.commuted
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractCessionRecorded:
    address: contract.cession.recorded
    title: contract.cession.recorded
    description: >
      Emitted when a cession is recorded against a bound or in-force
      contract. The cession is a child aggregate: the envelope uses the
      cession id and version while the outbox partition key remains the
      contract id. The payload carries the contract and cession identities
      and the ceded amounts and percentages.
    x-event-type: contract.cession.recorded
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractTechnicalAccountCreated:
    address: contract.technical-account.created
    title: contract.technical-account.created
    description: >
      Emitted when a technical account is produced for a contract period, in
      the same transaction as the account row. The account is a child
      aggregate: the envelope uses the account id and aggregate version 1
      while the outbox partition key remains the contract id. The payload
      carries the contract and account identities, the period, currency, the
      derived balance, and the initial DRAFT status.
    x-event-type: contract.technical-account.created
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractTechnicalAccountIssued:
    address: contract.technical-account.issued
    title: contract.technical-account.issued
    description: >
      Emitted when a DRAFT technical account is issued. The account aggregate
      version is 2 and the payload carries the issued status with the same
      contract identity, period, currency, and balance. The row update and the
      event share one transaction.
    x-event-type: contract.technical-account.issued
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractTechnicalAccountSettled:
    address: contract.technical-account.settled
    title: contract.technical-account.settled
    description: >
      Emitted when an ISSUED technical account is settled. The account
      aggregate version is 3 and the payload carries the SETTLED status, the
      period, currency, and the derived balance. The row update and the event
      share one transaction.
    x-event-type: contract.technical-account.settled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountData:
        $ref: '#/components/messages/ContractTechnicalAccountData'
  ContractTechnicalAccountLineAdded:
    address: contract.technical-account.line-added
    title: contract.technical-account.line-added
    description: >
      Emitted when a financial line is added to a DRAFT technical account, in
      the same transaction as the line insert. The line is a grandchild fact of
      the contract: the envelope uses the line id and aggregate version 1 while
      the outbox partition key remains the contract id. The payload carries the
      contract, account, and line identity, the line type, and the amount as a
      decimal string. The account header amounts are not changed by the line;
      they are reconciled when the account is issued. The name is new and has
      no SPEC 11.3.9 equivalent (M-22, M-42).
    x-event-type: contract.technical-account.line-added
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountLineData:
        $ref: '#/components/messages/ContractTechnicalAccountLineData'
  ContractTechnicalAccountLineRemoved:
    address: contract.technical-account.line-removed
    title: contract.technical-account.line-removed
    description: >
      Emitted when a financial line is removed from a DRAFT technical account,
      in the same transaction as the line delete. The envelope uses the removed
      line id and aggregate version 1 while the outbox partition key remains the
      contract id. The payload carries the same contract, account, and line
      identity, line type, and amount as the add fact. Removing a line is
      possible only while the account is DRAFT; once ISSUED the line detail is
      immutable. The name is new and has no SPEC 11.3.9 equivalent (M-22, M-42).
    x-event-type: contract.technical-account.line-removed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractTechnicalAccountLineData:
        $ref: '#/components/messages/ContractTechnicalAccountLineData'
  ContractBordereauReceived:
    address: contract.bordereau.received
    title: contract.bordereau.received
    description: >
      Emitted when a period bordereau is recorded, in the same transaction as
      the row. The bordereau is a child aggregate: the envelope uses the
      bordereau id and aggregate version 1 while the outbox partition key
      remains the contract id. The payload carries the contract and bordereau
      identities, the period, the currency, the RECEIVED status, and the four
      declared amounts.
    x-event-type: contract.bordereau.received
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractBordereauData:
        $ref: '#/components/messages/ContractBordereauData'
  ContractBordereauProcessed:
    address: contract.bordereau.processed
    title: contract.bordereau.processed
    description: >
      Emitted when a RECEIVED period bordereau is processed. The technical
      account for the same contract period is created or reused and linked
      through `technicalAccountId`; the account fact and this bordereau fact
      share the transaction. The bordereau aggregate version is 2.
    x-event-type: contract.bordereau.processed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractBordereauData:
        $ref: '#/components/messages/ContractBordereauData'
  ContractBordereauFailed:
    address: contract.bordereau.failed
    title: contract.bordereau.failed
    description: >
      Emitted when a RECEIVED period bordereau is failed. No technical account
      is created or linked. The bordereau aggregate version is 2, and both
      terminal states are immutable.
    x-event-type: contract.bordereau.failed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractBordereauData:
        $ref: '#/components/messages/ContractBordereauData'
  ContractBordereauPosted:
    address: contract.bordereau.posted
    title: contract.bordereau.posted
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope. The implemented terminal facts are
      `contract.bordereau.processed` and `.failed` (M-30).
    x-event-type: contract.bordereau.posted
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractBordereauRejected:
    address: contract.bordereau.rejected
    title: contract.bordereau.rejected
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope. The implemented terminal facts are
      `contract.bordereau.processed` and `.failed` (M-30).
    x-event-type: contract.bordereau.rejected
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractAccountIssued:
    address: contract.account.issued
    title: contract.account.issued
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.account.issued
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractAccountAgreed:
    address: contract.account.agreed
    title: contract.account.agreed
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.account.agreed
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractCashCallRequested:
    address: contract.cash-call.requested
    title: contract.cash-call.requested
    description: >
      Emitted when a cash call is requested, in the same transaction as the
      row. The cash call is a child aggregate: the envelope uses the cash-call
      id and aggregate version 1 while the outbox partition key remains the
      contract id. The payload carries the contract and cash-call identities,
      the period, the requested amount as a decimal string, the currency, the
      due date, and the REQUESTED status.
    x-event-type: contract.cash-call.requested
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractCashCallData:
        $ref: '#/components/messages/ContractCashCallData'
  ContractCashCallIssued:
    address: contract.cash-call.issued
    title: contract.cash-call.issued
    description: >
      Emitted when a REQUESTED cash call is issued (SPEC 11.3.9). The
      cash-call aggregate version is 2 and the payload carries the cash-call
      identity, period, amount, currency, due date, and ISSUED status. The row
      update and the event share one transaction.
    x-event-type: contract.cash-call.issued
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractCashCallData:
        $ref: '#/components/messages/ContractCashCallData'
  ContractCashCallSettled:
    address: contract.cash-call.settled
    title: contract.cash-call.settled
    description: >
      Emitted when an ISSUED cash call is settled. The cash-call aggregate
      version is 3 and the payload carries the SETTLED status with the same
      contract identity, period, amount, currency, and due date. Settlement is
      terminal and the row update shares the transaction with the event.
    x-event-type: contract.cash-call.settled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractCashCallData:
        $ref: '#/components/messages/ContractCashCallData'
  ContractCashCallCancelled:
    address: contract.cash-call.cancelled
    title: contract.cash-call.cancelled
    description: >
      Emitted when a REQUESTED cash call is cancelled before issuance. The
      cash-call aggregate version is 2, the same version as issuance, because
      cancellation and issuance are alternatives. Both terminal states are
      immutable and the status row update shares the transaction with the
      event.
    x-event-type: contract.cash-call.cancelled
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractCashCallData:
        $ref: '#/components/messages/ContractCashCallData'
  ContractSecurityRecorded:
    address: contract.security.recorded
    title: contract.security.recorded
    description: >
      Emitted by the security/collateral create in the same transaction as the
      `contract_security` row. The public domain route and the internal expert
      route both reach this factory. The event is a child aggregate: it uses
      the security id and aggregate version 1 while the outbox partition key
      remains the contract id. The payload carries exactly the contract and
      security identity, the security type, the required and held amounts as
      decimal strings, the currency, and the derived status. The public create
      derives ACTIVE, or EXPIRED when the expiry date is already past; the
      internal expert surface can also record the bind-slice statuses
      (REQUIRED, OUTSTANDING, PARTIAL, RELEASED, BREACH). The payload does not
      carry the provider, approval reference, expiry date, or contract number.
    x-event-type: contract.security.recorded
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractSecurityData:
        $ref: '#/components/messages/ContractSecurityData'
  ContractSecurityStatusChanged:
    address: contract.security.status-changed
    title: contract.security.status-changed
    description: >
      Emitted by the security status action in the same transaction as the
      `contract_security` status and `updated_at` row update. The event is a
      child aggregate: it uses the security id, aggregate version 2 for the
      first status change and version 3 when an `EXPIRED` record is released,
      while the outbox partition key stays the contract id. The payload carries
      the contract and security identity, the security type, and the previous
      and new status. `RELEASED` is terminal, so it is never a previous status;
      a `BREACH` record and every released record reject the action. The name
      is new: SPEC 11.3.9 publishes only `contract.security.recorded` and
      `contract.security.breached` (M-22, M-37).
    x-event-type: contract.security.status-changed
    x-event-version: 1
    x-status: implemented
    x-spec-section: SPEC 11.3.9
    x-implemented-by: repos/eia-contract-expert/src/main/java/com/eia/contract/expert/ContractEvents.java
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
      ContractSecurityStatusChangedData:
        $ref: '#/components/messages/ContractSecurityStatusChangedData'
  ContractSecurityBreached:
    address: contract.security.breached
    title: contract.security.breached
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
      the shared event envelope.
    x-event-type: contract.security.breached
    x-event-version: 1
    x-status: planned
    x-spec-section: SPEC 11.3.9
    messages:
      DomainEvent:
        $ref: '#/components/messages/DomainEvent'
  ContractReinstatementApplied:
    address: contract.reinstatement.applied
    title: contract.reinstatement.applied
    description: >
      Declared domain event for this vertical (SPEC 11.3.9). No publisher is
      implemented yet, so the channel is planned and the payload contract is
